name: C254 torus filtration (isolated Lean companion)
'on':
  pull_request:
    paths:
      - 'companions/torus_filtration_20261011/**'
      - '.github/workflows/torus-filtration.yml'
      - 'formal/lakefile.toml'
      - 'formal/lake-manifest.json'
      - 'formal/lean-toolchain'
  push:
    branches: [main]
    paths:
      - 'companions/torus_filtration_20261011/**'
      - '.github/workflows/torus-filtration.yml'
      - 'formal/lakefile.toml'
      - 'formal/lake-manifest.json'
      - 'formal/lean-toolchain'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  torus-filtration:
    runs-on: ubuntu-latest
    # Provisional until one hosted dry run records the duration in the companion README: twelve `lean`
    # invocations each load the full Mathlib .olean set, plus `leanchecker` on the companion modules
    # (the whole-closure leanchecker re-check does not fit a hosted job; see replay.sh and the README).
    timeout-minutes: 45
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Lean and retrieve dependency cache
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: formal
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Replay the torus-filtration companion with exact negative controls
        shell: bash
        run: bash companions/torus_filtration_20261011/replay.sh
      - name: Preserve original execution evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: torus-filtration-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lake/torus-filtration-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
