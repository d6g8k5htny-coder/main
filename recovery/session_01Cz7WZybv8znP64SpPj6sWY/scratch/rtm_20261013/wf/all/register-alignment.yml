name: Register alignment checks

'on':
  pull_request:
    paths:
      - 'reviews/register_alignment_20260930/**'
      - '.github/workflows/register-alignment.yml'
      - 'frontiers/three_fronts_20260924/LIFETIME_REMAINDER.md'
      - 'frontiers/three_fronts_20260924/RN_COUNT_INTERFACE.md'
      - 'coefficients/side24_v1/PROOF.md'
      - 'frontiers/remote_window_20260924/PROOF.md'
      - 'frontiers/rn_thin_tube_20260925/FIXED_ANNULUS_CANDIDATE.md'
      - 'frontiers/full_price_20260924/PROOF.md'
      - 'imports/lifetime_parent_20260925/UNIFORM_MATRIX_CAP_AND_LIFETIME.md'
      - 'reviews/pr22_fixed_annulus_nonauthor_20260925/**'
      - 'reviews/p15_full_price_nonauthor_20260926/**'
      - 'reviews/side24_v1_coefficient_claude_20260929/**'
      - 'frontiers/rn_thin_tube_20260925/TWO_SCALE_ADDENDUM.md'
      - 'reviews/replacement_20260925_pr19_pr21/TWO_SCALE_REVIEW.md'
      - 'frontiers/three_fronts_20260924/P15_REALIZED_COVERS.md'
      - 'frontiers/downstream_gate_20260925/GRAPH.json'
      - 'frontiers/downstream_gate_20260925/hard_gate.py'
      - 'PROOF_INDEX.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Verify sources, replay both modes (baseline or installed register), reject mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path('reviews/register_alignment_20260930').resolve()
          manifest = json.loads((root / 'SOURCE_FILES.json').read_text())['files']
          present = sorted(p.name for p in root.iterdir())
          expected_names = sorted([e['path'] for e in manifest] + ['SOURCE_FILES.json'])
          if present != expected_names:
              raise ValueError('packet tree differs from manifest: ' + repr(present))
          for entry in manifest:
              path = root / entry['path']
              if pathlib.PurePosixPath(entry['path']).name != entry['path'] or path.is_symlink():
                  raise ValueError('flat regular source required: ' + entry['path'])
              data = path.read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('source identity mismatch: ' + entry['path'])
          script = str(root / 'alignment_check.py')
          mutants = ['allow-symlink', 'no-hash', 'stale-fingerprint', 'drop-review-source', 'controlling-true', 'executed-flag', 'skip-interface-premise', 'holder-reversed', 'baseline-drift', 'duplicate-drift', 'region-unlinked', 'review-metadata-only', 'installed-drift', 'partial-install', 'text-preinstalled']
          for flags in (['-B', '-S'], ['-B', '-O', '-S']):
              out = subprocess.run([sys.executable, *flags, script],
                                   check=True, capture_output=True, timeout=300).stdout
              state = json.loads(out).get('register_state')
              if state not in ('baseline', 'installed'):
                  raise RuntimeError('checker reports register_state ' + repr(state))
              pinned = 'RESULTS.json' if state == 'baseline' else 'RESULTS_INSTALLED.json'
              if out != (root / pinned).read_bytes():
                  raise RuntimeError('output differs from ' + pinned + ' under ' + ' '.join(flags))
              for m in mutants:
                  rc = subprocess.run([sys.executable, *flags, script, '--mutant', m],
                                      capture_output=True, timeout=300).returncode
                  if rc != 1:
                      raise RuntimeError('mutant ' + m + ' not rejected')
          print(json.dumps({'scientific_effect': 'NONE', 'mathematical_acceptance': False}))
          PY
          git diff --exit-code
