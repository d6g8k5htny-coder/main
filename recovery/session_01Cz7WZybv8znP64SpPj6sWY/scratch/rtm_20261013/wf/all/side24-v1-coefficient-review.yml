name: SIDE24 v1 coefficient nonauthor review checks

'on':
  pull_request:
    paths:
      - 'reviews/side24_v1_coefficient_claude_20260929/**'
      - '.github/workflows/side24-v1-coefficient-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Verify sources, replay both modes, reject mutants, replay the reviewed package
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path('reviews/side24_v1_coefficient_claude_20260929').resolve()
          manifest = json.loads((root / 'SOURCE_FILES.json').read_text())
          present = sorted(p.name for p in root.iterdir())
          expected_names = sorted([e['path'] for e in manifest['files']] + ['SOURCE_FILES.json'])
          if present != expected_names:
              raise ValueError('packet tree differs from manifest: ' + repr(present))
          for entry in manifest['files']:
              path = root / entry['path']
              if pathlib.PurePosixPath(entry['path']).name != entry['path'] or path.is_symlink():
                  raise ValueError('flat regular source required: ' + entry['path'])
              data = path.read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('source identity mismatch: ' + entry['path'])
          # the reviewed package must be the bytes the verdict binds to
          for entry in manifest['reviewed_object']['paths']:
              data = pathlib.Path(entry['path']).read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('reviewed object drifted: ' + entry['path'])
          script = str(root / 'coefficient_review_check.py')
          expected = (root / 'RESULTS.json').read_bytes()
          mutants = ['M1', 'M2', 'M3']
          for flags in (['-B', '-S'], ['-B', '-O', '-S']):
              out = subprocess.run([sys.executable, *flags, script],
                                   check=True, capture_output=True, timeout=300).stdout
              if out != expected:
                  raise RuntimeError('output differs from RESULTS.json under ' + ' '.join(flags))
              for m in mutants:
                  rc = subprocess.run([sys.executable, *flags, script, '--mutant', m],
                                      capture_output=True, timeout=300).returncode
                  if rc != 1:
                      raise RuntimeError('mutant ' + m + ' not rejected')
              # reproduction claimed in REVIEW.md item 7: package stdout == ENCLOSURE.json
              pkg = subprocess.run([sys.executable, *flags, 'coefficients/side24_v1/coefficient.py'],
                                   check=True, capture_output=True, timeout=300).stdout
              if pkg != pathlib.Path('coefficients/side24_v1/ENCLOSURE.json').read_bytes():
                  raise RuntimeError('coefficient.py output differs from ENCLOSURE.json under ' + ' '.join(flags))
          print(json.dumps({'scientific_effect': 'NONE', 'mathematical_acceptance': False}))
          PY
          git diff --exit-code
