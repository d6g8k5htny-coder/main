name: Local pairing exact controls

'on':
  pull_request:
    paths:
      - 'frontiers/local_pairing_20260930/**'
      - '.github/workflows/local-pairing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Verify sources, replay both modes, reject mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path('frontiers/local_pairing_20260930').resolve()
          manifest = json.loads((root / 'SOURCES.json').read_text())
          names = [entry['path'] for entry in manifest['files']]
          if len(names) != len(set(names)) or 'SOURCES.json' in names:
              raise ValueError('invalid packet inventory')
          for name in names:
              p = pathlib.PurePosixPath(name)
              if p.is_absolute() or str(p) != name or '..' in p.parts:
                  raise ValueError('unsafe packet path: ' + name)
          present = list(root.rglob('*'))
          if any(p.is_symlink() for p in present):
              raise ValueError('symlink in packet inventory')
          actual = {p.relative_to(root).as_posix() for p in present if p.is_file()}
          if actual != set(names) | {'SOURCES.json'}:
              raise ValueError('packet inventory drift')
          for entry in manifest['files']:
              path = root / entry['path']
              if path.is_symlink():
                  raise ValueError('symlink: ' + entry['path'])
              data = path.read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('packet file identity mismatch: ' + entry['path'])
          for entry in manifest['consumed'] + manifest['cited_only']:
              data = pathlib.Path(entry['path']).read_bytes()
              framed = b'blob ' + str(len(data)).encode() + b'\0' + data
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256'] or hashlib.sha1(framed).hexdigest() != entry['git_blob']:
                  raise ValueError('merged source drifted: ' + entry['path'])
          script = str(root / 'pairing_check.py')
          expected = (root / 'RESULTS.json').read_bytes()
          for flags in (['-B', '-S'], ['-B', '-O', '-S']):
              out = subprocess.run([sys.executable, *flags, script], check=True, capture_output=True, timeout=600).stdout
              if out != expected:
                  raise RuntimeError('output differs from RESULTS.json under ' + ' '.join(flags))
              for m in ('M1', 'M2', 'M3', 'M4'):
                  rc = subprocess.run([sys.executable, *flags, script, '--mutant', m], capture_output=True, timeout=600).returncode
                  if rc != 1:
                      raise RuntimeError('mutant ' + m + ' not rejected')
              rc = subprocess.run([sys.executable, *flags, script, '--mutant', 'M9'], capture_output=True, timeout=600).returncode
              if rc != 2:
                  raise RuntimeError('unknown mutant label not rejected with exit 2')
          print(json.dumps({'scientific_effect': 'NONE', 'mathematical_acceptance': False}))
          PY
          git diff --exit-code
