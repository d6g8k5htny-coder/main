name: Pin microdisk covariance exact checks

'on':
  pull_request:
    paths:
      - 'reviews/pin_micro_covariance_20260926/**'
      - '.github/workflows/pin-micro-covariance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Run exact rational check in both modes
        run: |
          set -euo pipefail
          python -B -S reviews/pin_micro_covariance_20260926/exact_check.py
          python -B -O -S reviews/pin_micro_covariance_20260926/exact_check.py
          git diff --exit-code
