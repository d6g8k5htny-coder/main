name: C6 cluster coefficient numerics (replay)

'on':
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/test_direct_replay_import_triggers.py'
      - 'frontiers/c6_cluster_coefficients_numerics_20260930/**'
      - '.github/workflows/c6-cluster-coefficients-numerics.yml'
      - 'tools/c6_coefficient_numerics_replay.py'
      - 'tests/test_c6_coefficient_numerics_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-controls-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Check direct-helper import trigger coverage
        run: |
          python -B -S tests/test_direct_replay_import_triggers.py
          python -B -O -S tests/test_direct_replay_import_triggers.py
      - name: Verify full-shell output contracts in both Python modes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S -m unittest discover -s tests -p test_c6_coefficient_numerics_workflow.py -v
          python -B -O -S -m unittest discover -s tests -p test_c6_coefficient_numerics_workflow.py -v
      - name: Verify manifest and main-resident pins, replay exact controls and GH40, reject mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path('frontiers/c6_cluster_coefficients_numerics_20260930').resolve()
          manifest = json.loads((root / 'SOURCE_FILES.json').read_text())['files']
          present = sorted(p.name for p in root.iterdir())
          if present != sorted([e['path'] for e in manifest] + ['SOURCE_FILES.json']):
              raise ValueError('packet tree differs from manifest: ' + repr(present))
          for entry in manifest:
              path = root / entry['path']
              if pathlib.PurePosixPath(entry['path']).name != entry['path'] or path.is_symlink():
                  raise ValueError('flat regular source required: ' + entry['path'])
              data = path.read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('source identity mismatch: ' + entry['path'])
          pins = json.loads((root / 'SOURCE_MAP.json').read_text())
          for entry in pins['sources']:
              if not entry['current_required']:
                  continue
              data = pathlib.Path(entry['path']).read_bytes()
              blob = hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256'] or blob != entry['git_blob']:
                  raise ValueError('consumed source identity mismatch on this tree: ' + entry['path'])
          sys.path.insert(0, str(pathlib.Path('tools').resolve()))
          from c6_coefficient_numerics_replay import replay
          replay(root)
          print(json.dumps({'scientific_effect': 'NONE', 'certified': False}))
          PY
          git diff --exit-code
