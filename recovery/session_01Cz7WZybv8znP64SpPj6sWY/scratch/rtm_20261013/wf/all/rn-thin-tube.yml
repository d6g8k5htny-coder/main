name: D5 annulus algebra (not analytic acceptance)
'on':
  pull_request:
    paths:
      - 'frontiers/rn_thin_tube_20260925/**'
      - '.github/workflows/rn-thin-tube.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Replay finite-pin and two-scale identities with mutations
        env:
          OUT: ${{ runner.temp }}/thin-tube-results
        run: |
          set -euo pipefail
          python -B -S frontiers/rn_thin_tube_20260925/replay_two_scale.py --output "$OUT"
          git rev-parse HEAD > "$OUT/checkout-commit.txt"
          git diff --exit-code
      - name: Preserve actual replay evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rn-thin-tube-${{ github.run_id }}
          path: ${{ runner.temp }}/thin-tube-results
          if-no-files-found: error
          retention-days: 30
