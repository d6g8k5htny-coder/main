name: C6 marked Fourier controls

'on':
  pull_request:
    paths:
      - 'frontiers/c6_marked_fourier_20260929/**'
      - '.github/workflows/c6-marked-fourier.yml'
      - 'frontiers/c6_fourier_cutoff_20260929/PROOF.md'
      - 'frontiers/c6_palm_route_20260929/PROOF.md'
      - 'frontiers/c6_palm_route_20260929/SOURCE_MAP.json'
      - 'frontiers/d5_dimension_lift_20260929/PROOF.md'
      - 'frontiers/elder_dimension_lift_20260928/PROOF.md'
      - 'frontiers/c6_rare_cluster_laws_20260929/PROOF.md'
  push:
    branches: [main]
    paths:
      - 'frontiers/c6_marked_fourier_20260929/**'
      - '.github/workflows/c6-marked-fourier.yml'
      - 'frontiers/c6_fourier_cutoff_20260929/PROOF.md'
      - 'frontiers/c6_palm_route_20260929/PROOF.md'
      - 'frontiers/c6_palm_route_20260929/SOURCE_MAP.json'
      - 'frontiers/d5_dimension_lift_20260929/PROOF.md'
      - 'frontiers/elder_dimension_lift_20260928/PROOF.md'
      - 'frontiers/c6_rare_cluster_laws_20260929/PROOF.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-marked:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Both-mode controls and exact upstream custody
        run: |
          set -euo pipefail
          packet=frontiers/c6_marked_fourier_20260929
          python -B -S "$packet/verify.py" --output "${RUNNER_TEMP}/marked-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -B -S -m unittest discover -s "$packet" -p test_sources.py -v
          python -B -O -S -m unittest discover -s "$packet" -p test_sources.py -v
          python -B -S "$packet/source_check.py" --repo "${GITHUB_WORKSPACE}"
          git diff --exit-code
