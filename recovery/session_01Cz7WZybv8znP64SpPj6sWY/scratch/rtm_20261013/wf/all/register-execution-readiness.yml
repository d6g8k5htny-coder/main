name: Register execution readiness

'on':
  pull_request:
    paths:
      - 'reviews/register_execution_readiness_20260930/**'
      - '.github/workflows/register-execution-readiness.yml'
      - 'reviews/register_alignment_20260930/**'
      - 'reviews/c6_witness_collision_reconciliation_20260929/**'
      - 'reviews/c6_residual_closure_20260930/**'
      - 'frontiers/downstream_gate_20260925/GRAPH.json'
      - 'frontiers/downstream_gate_20260925/SELECTOR_REGION.json'
      - 'frontiers/downstream_gate_20260925/hard_gate.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Compose the three proposals on a scratch copy; run the three checkers and their mutants in the installed state
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S -m unittest discover -s reviews/register_execution_readiness_20260930 -p 'test_*.py' -v
          python -B -O -S -m unittest discover -s reviews/register_execution_readiness_20260930 -p 'test_*.py' -v
          python -B -S reviews/register_execution_readiness_20260930/execution_dryrun.py --mutants
          python -B -S reviews/register_execution_readiness_20260930/execution_dryrun.py --skip-old-node-move
          python -B -S reviews/register_execution_readiness_20260930/execution_dryrun.py --selector-node-only
          git diff --exit-code
