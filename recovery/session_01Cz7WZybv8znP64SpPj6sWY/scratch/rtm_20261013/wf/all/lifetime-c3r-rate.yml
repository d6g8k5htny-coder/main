name: Lifetime note C3-R replay

'on':
  pull_request:
    paths:
      - 'frontiers/lifetime_c3r_rate_20261013/**'
      - 'tests/test_lifetime_c3r_replay.py'
      - '.github/workflows/lifetime-c3r-rate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: ['-B -S', '-B -O -S']
    name: replay (python ${{ matrix.mode }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Verify protocol, stored identities, the pinned controls, both replays and the negative controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qs-replay-evidence"
          mkdir -p "$out/logs"
          python ${{ matrix.mode }} -m unittest discover -s tests -p test_lifetime_c3r_replay.py -v 2>&1 | tee "$out/logs/protocol.txt"
          QS_REPLAY_EVIDENCE_DIR="$out/children" python ${{ matrix.mode }} frontiers/lifetime_c3r_rate_20261013/replay.py 2>&1 | tee "$out/logs/replay.txt"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Preserve exact public sources and available execution logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/qs-replay-evidence"
          mkdir -p "$out"
          cp -a frontiers/lifetime_c3r_rate_20261013 "$out/packet"
          cp tests/test_lifetime_c3r_replay.py "$out/"
          cp .github/workflows/lifetime-c3r-rate.yml "$out/"
          git rev-parse HEAD > "$out/tested_commit.txt"
          printf '%s\n' '${{ matrix.mode }}' > "$out/mode.txt"
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > "$out/run.txt"
      - name: Retain evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qs-replay-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qs-replay-evidence/
          if-no-files-found: error
