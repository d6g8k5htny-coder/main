name: P15 transformed-price budget
'on':
  push:
    branches: [chatgpt/navigation-price-20260924]
  pull_request:
    paths: ['frontiers/price_budget_20260924/**', 'README.md', 'frontiers/README.md', '.github/workflows/price-budget.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: New exact sources and deliberate mutations
        run: python -B -S frontiers/price_budget_20260924/run_validation.py --output "${{ runner.temp }}/price-results"
      - name: Existing mathematical regressions
        run: |
          python -B -S -m unittest discover -s coefficients/side24_v1 -p 'test_*.py' -v
          python -B -O -S -m unittest discover -s coefficients/side24_v1 -p 'test_*.py' -v
          python -B -S -m unittest discover -s frontiers/three_fronts_20260924 -p 'test_*.py' -v
          python -B -O -S -m unittest discover -s frontiers/three_fronts_20260924 -p 'test_*.py' -v
      - name: Retain exact execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: price-budget-${{ github.run_id }}
          path: ${{ runner.temp }}/price-results
          if-no-files-found: error
          retention-days: 30
