name: Hardening proof custody

'on':
  pull_request:
    paths:
      - 'imports/hardening_ebedb780/**'
      - '.gitattributes'
      - '.github/workflows/hardening-proof-custody.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Verify exact imported bytes
        run: python -B -S imports/hardening_ebedb780/verify.py
