name: C8 torus vanishing remainder (certified replay)

'on':
  pull_request:
    paths:
      - 'frontiers/c8_torus_vanishing_remainder_20261001/**'
      - '.github/workflows/c8-torus-vanishing-remainder.yml'
      - 'imports/lifetime_parent_20260925/UNIFORM_MATRIX_CAP_AND_LIFETIME.md'
      - 'imports/lifetime_parent_20260925/MARKED_CYLINDER_CAP_PROOF.md'
      - 'imports/lifetime_parent_20260925/ERRATUM_CONGRUENCE.md'
      - 'reviews/d1_section9_borel_repair_20260925/REPAIR.md'
      - 'reviews/d1_chain_reconciliation_20260928/RECONCILIATION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certified-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        flags: ['-B -S', '-B -O -S']
    name: certified-replay (${{ matrix.flags }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Verify manifest, main-resident pin and packet copies; replay the certificate; reject the mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          FLAGS: ${{ matrix.flags }}
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path('frontiers/c8_torus_vanishing_remainder_20261001').resolve()
          manifest = json.loads((root / 'SOURCE_FILES.json').read_text())['files']
          present = sorted(p.name for p in root.iterdir())
          if present != sorted([e['path'] for e in manifest] + ['SOURCE_FILES.json']):
              raise ValueError('packet tree differs from manifest: ' + repr(present))
          def blob(data):
              return hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest()
          for entry in manifest:
              path = root / entry['path']
              if pathlib.PurePosixPath(entry['path']).name != entry['path'] or path.is_symlink():
                  raise ValueError('flat regular source required: ' + entry['path'])
              data = path.read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256'] or blob(data) != entry['git_blob']:
                  raise ValueError('source identity mismatch: ' + entry['path'])
          pins = json.loads((root / 'SOURCE_MAP.json').read_text())
          for entry in pins['sources']:
              if entry.get('current_required'):
                  data = pathlib.Path(entry['path']).read_bytes()
              elif entry.get('packet_copy'):
                  data = (root / entry['packet_copy']).read_bytes()
              else:
                  continue
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256'] or blob(data) != entry['git_blob']:
                  raise ValueError('pinned source identity mismatch: ' + entry['path'])
          flags = os.environ['FLAGS'].split()
          script = str(root / 'theorem_v.py')
          out = subprocess.run([sys.executable, *flags, script, '--check'], cwd=root, capture_output=True, timeout=3600)
          if out.returncode != 0:
              raise RuntimeError('--check failed: ' + out.stdout.decode()[-400:] + out.stderr.decode()[-400:])
          print(flags, out.stdout.decode().strip())
          muts = ('torus-const-only', 'exp-radius', 'no-lin', 'no-om-term', 'coupling-half')
          procs = [subprocess.Popen([sys.executable, *flags, script, '--mutant', m], cwd=root,
                                    stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL) for m in muts]
          for m, p in zip(muts, procs):
              if p.wait(timeout=3600) != 1:
                  raise RuntimeError('mutant ' + m + ' not rejected')
          print(json.dumps({'scientific_effect': 'NONE', 'mutants_rejected': len(muts)}))
          PY
          git diff --exit-code
