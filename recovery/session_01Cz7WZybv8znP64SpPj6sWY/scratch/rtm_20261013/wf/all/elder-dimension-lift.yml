name: Elder dimension-lift exact controls

'on':
  pull_request:
    paths:
      - 'frontiers/elder_dimension_lift_20260928/**'
      - '.github/workflows/elder-dimension-lift.yml'
  push:
    branches: [main]
    paths:
      - 'frontiers/elder_dimension_lift_20260928/**'
      - '.github/workflows/elder-dimension-lift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-dimension-lift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Exact sources, both modes and intended semantic failures
        run: |
          set -euo pipefail
          python -B -S frontiers/elder_dimension_lift_20260928/verify.py --output "${RUNNER_TEMP}/dimension-lift-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git diff --exit-code
