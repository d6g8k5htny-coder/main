name: D1 line transfer exact controls

'on':
  pull_request:
    paths:
      - 'frontiers/d1_line_20261004/**'
      - '.github/workflows/d1-line.yml'
      # bound merged sources (consumed and cited_only in SOURCES.json)
      - 'frontiers/d1_third_order_law_20261001/PROOF.md'
      - 'frontiers/d1_sharp_remainder_20261001/PROOF.md'
      - 'imports/lifetime_parent_20260925/UNIFORM_MATRIX_CAP_AND_LIFETIME.md'
      - 'reviews/d1_section9_borel_repair_20260925/REPAIR.md'
      - 'reviews/literature_classical_neighbors_20261001/ADDENDUM.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Verify sources, replay both modes, reject mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, sys, urllib.parse, urllib.request
          root = pathlib.Path('frontiers/d1_line_20261004').resolve()
          manifest = json.loads((root / 'SOURCES.json').read_text())
          present = sorted(p.name for p in root.iterdir())
          expected_names = sorted([e['path'] for e in manifest['files']] + ['SOURCES.json'])
          if present != expected_names:
              raise ValueError('packet tree differs from manifest: ' + repr(present))
          for entry in manifest['files']:
              path = root / entry['path']
              if path.is_symlink():
                  raise ValueError('symlink: ' + entry['path'])
              data = path.read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('packet file identity mismatch: ' + entry['path'])
          def same(data, entry):
              framed = b'blob ' + str(len(data)).encode() + b'\0' + data
              return len(data) == entry['bytes'] and hashlib.sha256(data).hexdigest() == entry['sha256'] and hashlib.sha1(framed).hexdigest() == entry['git_blob']
          def tree_bytes(entry):
              # a source read from the checkout must be a regular file whose tree blob is the recorded one
              out = subprocess.run(['git', 'ls-tree', '-z', 'HEAD', '--', entry['path']], check=True, capture_output=True).stdout
              if not out:
                  return None
              meta, name = out.rstrip(b'\0').split(b'\t', 1)
              if name.decode() != entry['path']:
                  raise ValueError('unexpected tree entry for ' + entry['path'])
              mode, kind, sha = meta.decode().split()
              if mode != '100644' or kind != 'blob' or sha != entry['git_blob']:
                  raise ValueError('tree entry is not the recorded regular-file blob (mode/type/blob ' + ' '.join((mode, kind, sha)) + '): ' + entry['path'])
              path = pathlib.Path(entry['path'])
              if path.is_symlink() or not path.is_file():
                  raise ValueError('checkout path is not a regular file: ' + entry['path'])
              return path.read_bytes()
          for entry in manifest['consumed'] + manifest['cited_only']:
              data = tree_bytes(entry)
              if data is None or not same(data, entry):
                  raise ValueError('merged source drifted or absent: ' + entry['path'])
          if manifest.get('consumed_unmerged'):
              raise ValueError('this packet declares no unmerged consumed dependency')
          # the cited unmerged source (comparison only) is bound to its recorded commit, path and blob through the
          # repository API: the head must resolve, the path in that head's tree must be a file with the recorded blob id
          # and size, and the blob bytes must have the recorded sha256
          api = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY']
          def get_json(url):
              req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                                                         'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return json.load(resp)
          for entry in manifest.get('cited_unmerged', []):
              commit = get_json(api + '/commits/' + entry['head'])
              if commit.get('sha') != entry['head']:
                  raise ValueError('recorded head does not resolve: ' + entry['head'])
              node = get_json(api + '/contents/' + urllib.parse.quote(entry['path']) + '?ref=' + entry['head'])
              if (node.get('type') != 'file' or node.get('path') != entry['path'] or node.get('sha') != entry['git_blob']
                      or node.get('size') != entry['bytes']):
                  raise ValueError('recorded head/path does not map to the recorded blob: ' + entry['path'])
              blob = get_json(api + '/git/blobs/' + entry['git_blob'])
              if blob.get('encoding') != 'base64' or not same(base64.b64decode(blob['content']), entry):
                  raise ValueError('cited_unmerged source differs from its pinned blob: ' + entry['path'])
              print(json.dumps({'cited_unmerged_bound': entry['path'], 'git_blob': entry['git_blob'], 'head': entry['head']}))
          script = str(root / 'line_check.py')
          expected = (root / 'RESULTS.json').read_bytes()
          for flags in (['-B', '-S'], ['-B', '-O', '-S']):
              out = subprocess.run([sys.executable, *flags, script], check=True, capture_output=True, timeout=600).stdout
              if out != expected:
                  raise RuntimeError('output differs from RESULTS.json under ' + ' '.join(flags))
              # each mutant must exit 1 and fail in its own control (the 'failed' message starts with the control label)
              for m, control in sorted(manifest['mutants'].items()):
                  proc = subprocess.run([sys.executable, *flags, script, '--mutant', m], capture_output=True, timeout=600)
                  if proc.returncode != 1:
                      raise RuntimeError('mutant ' + m + ' not rejected')
                  failed = json.loads(proc.stderr.decode().strip().splitlines()[-1])['failed']
                  if not failed.startswith(control + ' '):
                      raise RuntimeError('mutant ' + m + ' failed outside ' + control + ': ' + failed)
              for bad in (['--mutant', 'M99'], ['--mutant'], ['--unknown']):
                  rc = subprocess.run([sys.executable, *flags, script, *bad], capture_output=True, timeout=600).returncode
                  if rc != 2:
                      raise RuntimeError('bad argument ' + repr(bad) + ' not rejected with exit 2')
          print(json.dumps({'scientific_effect': 'NONE', 'mathematical_acceptance': False}))
          PY
          git diff --exit-code
