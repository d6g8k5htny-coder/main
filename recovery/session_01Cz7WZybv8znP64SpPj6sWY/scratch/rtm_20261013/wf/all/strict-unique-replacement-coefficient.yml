name: Strict unique replacement coefficient controls
'on':
  pull_request:
    paths:
      - 'frontiers/strict_unique_replacement_coefficient_20261003/**'
      - '.github/workflows/strict-unique-replacement-coefficient.yml'
  push:
    branches: [main]
    paths:
      - 'frontiers/strict_unique_replacement_coefficient_20261003/**'
      - '.github/workflows/strict-unique-replacement-coefficient.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: strict-unique-replacement-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: strict-unique-replacement-controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Exact finite controls in both Python modes
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/strict-replacement"
          python -B -S frontiers/strict_unique_replacement_coefficient_20261003/check.py > "$RUNNER_TEMP/strict-replacement/normal.json"
          python -B -O -S frontiers/strict_unique_replacement_coefficient_20261003/check.py > "$RUNNER_TEMP/strict-replacement/optimized.json"
          cmp "$RUNNER_TEMP/strict-replacement/normal.json" "$RUNNER_TEMP/strict-replacement/optimized.json"
          git rev-parse HEAD > "$RUNNER_TEMP/strict-replacement/tested-commit.txt"
      - name: Retain finite-control outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: strict-replacement-${{ github.run_id }}
          path: ${{ runner.temp }}/strict-replacement
          if-no-files-found: error
          retention-days: 30
