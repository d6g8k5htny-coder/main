name: Remote mixed inverse-power finite controls

'on':
  pull_request:
    paths:
      - 'frontiers/remote_mixed_inverse_20260929/**'
      - '.github/workflows/remote-mixed-inverse.yml'
      - 'frontiers/remote_window_20260924/PROOF.md'
      - 'frontiers/remote_collision_20260928/PROOF.md'
      - 'frontiers/window_multiplicity_laws_20260928/REMOTE_PAIR_LAW.md'
      - 'frontiers/remote_inverse_separation_20260928/PROOF.md'
  push:
    branches: [main]
    paths:
      - 'frontiers/remote_mixed_inverse_20260929/**'
      - '.github/workflows/remote-mixed-inverse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-mixed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Exact packet, both modes and upstream source bytes
        run: |
          set -euo pipefail
          python -B -S frontiers/remote_mixed_inverse_20260929/verify.py --output "${RUNNER_TEMP}/mixed-inverse-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python -B -S - <<'PY'
          import hashlib, json, pathlib
          repo = pathlib.Path.cwd().resolve()
          source_map = json.loads((repo / 'frontiers/remote_mixed_inverse_20260929/SOURCE_MAP.json').read_text())
          for item in source_map['sources']:
              rel = pathlib.PurePosixPath(item['path'])
              if rel.is_absolute() or '..' in rel.parts:
                  raise ValueError('source path escapes repository')
              path = repo.joinpath(*rel.parts)
              if any(repo.joinpath(*rel.parts[:i]).is_symlink() for i in range(1, len(rel.parts)+1)):
                  raise ValueError('source symlink forbidden')
              data = path.read_bytes()
              actual = (len(data), hashlib.sha256(data).hexdigest(), hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest())
              if actual != (item['bytes'], item['sha256'], item['git_blob']):
                  raise ValueError('upstream identity differs: ' + item['id'])
          print('Four upstream byte identities verified; not analytic acceptance.')
          PY
          git diff --exit-code
