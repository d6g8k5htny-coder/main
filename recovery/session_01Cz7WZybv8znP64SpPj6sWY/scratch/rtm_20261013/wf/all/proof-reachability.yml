name: Proof reachability table

'on':
  pull_request:
    paths:
      - 'docs/integration/2026-10-02-proof-reachability.md'
      - 'tools/check_proof_reachability.py'
      - 'tests/test_proof_reachability.py'
      - '.github/workflows/proof-reachability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Re-derive every row from git at the pinned cut, in both interpreter modes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S tools/check_proof_reachability.py
          python -B -O -S tools/check_proof_reachability.py
          python -B -S -m unittest -v tests.test_proof_reachability
          python -B -O -S -m unittest -v tests.test_proof_reachability
          git diff --exit-code
