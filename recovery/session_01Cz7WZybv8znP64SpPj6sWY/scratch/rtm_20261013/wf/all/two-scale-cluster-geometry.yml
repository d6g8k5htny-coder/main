name: Two-scale cluster geometry checks

'on':
  push:
    branches: ['main']
    paths:
      - 'frontiers/two_scale_cluster_geometry_20260929/**'
      - '.github/workflows/two-scale-cluster-geometry.yml'
  pull_request:
    paths:
      - 'frontiers/two_scale_cluster_geometry_20260929/**'
      - '.github/workflows/two-scale-cluster-geometry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Fetch immutable non-base source objects
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 7a44130b41b827577424a73c4feac4cde20b5568
          git fetch --no-tags --depth=1 origin bfcc67dc8957b3ed1fbb789e5a0305e98d7359c8
      - name: Verify all sources, exact controls and both Python modes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S frontiers/two_scale_cluster_geometry_20260929/verify.py
          git diff --exit-code
