name: D2 remainder full-depth nonauthor review checks

'on':
  pull_request:
    paths:
      - 'reviews/d2_remainder_full_depth_claude_20260930/**'
      - '.github/workflows/d2-remainder-fulldepth-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Verify record tree, reviewed source identities, replay both modes, reject mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path('reviews/d2_remainder_full_depth_claude_20260930').resolve()
          manifest = json.loads((root / 'SOURCE_FILES.json').read_text())
          present = sorted(p.name for p in root.iterdir())
          expected_names = sorted([e['path'] for e in manifest['files']] + ['SOURCE_FILES.json'])
          if present != expected_names:
              raise ValueError('record tree differs from manifest: ' + repr(present))
          for entry in manifest['files']:
              path = root / entry['path']
              if pathlib.PurePosixPath(entry['path']).name != entry['path'] or path.is_symlink():
                  raise ValueError('flat regular file required: ' + entry['path'])
              data = path.read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('record file identity mismatch: ' + entry['path'])
          for entry in manifest['reviewed_sources']:
              data = pathlib.Path(entry['path']).read_bytes()
              framed = b'blob ' + str(len(data)).encode() + b'\0' + data
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256'] or hashlib.sha1(framed).hexdigest() != entry['blob']:
                  raise ValueError('reviewed source drifted: ' + entry['path'])
          script = str(root / 'remainder_review_check.py')
          expected = (root / 'RESULTS.json').read_bytes()
          for flags in (['-B', '-S'], ['-B', '-O', '-S']):
              out = subprocess.run([sys.executable, *flags, script], check=True, capture_output=True, timeout=300).stdout
              if out != expected:
                  raise RuntimeError('output differs from RESULTS.json under ' + ' '.join(flags))
              for m in manifest['mutants']:
                  rc = subprocess.run([sys.executable, *flags, script, '--mutant', m], capture_output=True, timeout=300).returncode
                  if rc != 1:
                      raise RuntimeError('mutant ' + m + ' not rejected')
              rc = subprocess.run([sys.executable, *flags, script, '--mutant', 'M9'], capture_output=True, timeout=300).returncode
              if rc != 2:
                  raise RuntimeError('unknown mutant label not rejected with exit 2')
          print(json.dumps({'scientific_effect': 'NONE', 'mathematical_acceptance': False}))
          PY
          git diff --exit-code
