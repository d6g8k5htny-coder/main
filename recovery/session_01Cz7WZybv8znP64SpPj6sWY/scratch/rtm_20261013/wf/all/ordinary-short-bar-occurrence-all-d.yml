name: Ordinary short-bar occurrence (all d) exact controls
on:
  pull_request:
    paths:
      - 'frontiers/ordinary_short_bar_occurrence_all_d_20261001/**'
      - 'frontiers/three_fronts_20260924/LIFETIME_REMAINDER.md'
      - 'frontiers/short_bar_endpoint_law_20261001/PROOF.md'
      - 'frontiers/ordinary_short_bar_occurrence_20261001/FOLD_ISOLATION.md'
      - 'frontiers/ordinary_short_bar_occurrence_20261001/PROOF.md'
      - 'imports/lifetime_parent_20260925/**'
      - 'reviews/d1_section9_borel_repair_20260925/REPAIR.md'
      - 'reviews/d1_chain_reconciliation_20260928/RECONCILIATION.md'
      - '.github/workflows/ordinary-short-bar-occurrence-all-d.yml'
  push:
    branches: [main]
    paths:
      - 'frontiers/ordinary_short_bar_occurrence_all_d_20261001/**'
      - 'frontiers/three_fronts_20260924/LIFETIME_REMAINDER.md'
      - 'frontiers/short_bar_endpoint_law_20261001/PROOF.md'
      - 'frontiers/ordinary_short_bar_occurrence_20261001/FOLD_ISOLATION.md'
      - 'frontiers/ordinary_short_bar_occurrence_20261001/PROOF.md'
      - 'imports/lifetime_parent_20260925/**'
      - 'reviews/d1_section9_borel_repair_20260925/REPAIR.md'
      - 'reviews/d1_chain_reconciliation_20260928/RECONCILIATION.md'
      - '.github/workflows/ordinary-short-bar-occurrence-all-d.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ordinary-short-bar-occurrence-all-d-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Verify sources and run exact controls
        env:
          PYTHON_MODE: ${{ matrix.mode }}
        run: |
          D=frontiers/ordinary_short_bar_occurrence_all_d_20261001
          if [ "$PYTHON_MODE" = optimized ]; then F="-B -O -S"; else F="-B -S"; fi
          python3 $F $D/verify_sources.py
          python3 $F $D/check.py
          python3 $F $D/test_check.py -v
      - name: Reject implementation mutants in both Python modes
        if: matrix.mode == 'normal'
        run: python3 -B -S frontiers/ordinary_short_bar_occurrence_all_d_20261001/test_check.py --mutants
