name: Equal-height mass controls

'on':
  pull_request:
    paths:
      - 'frontiers/equal_height_mass_value_20261001/**'
      - '.github/workflows/equal-height-mass.yml'
      - 'tests/test_equal_height_workflow.py'
      # bound merged sources (consumed and cited_only in SOURCES.json)
      - 'frontiers/c7_zero_gap_limit_20260929/PROOF.md'
      - 'frontiers/three_fronts_20260924/LIFETIME_REMAINDER.md'
      - 'frontiers/c7_total_bounded_20260929/PROOF.md'
      - 'imports/lifetime_parent_20260925/UNIFORM_MATRIX_CAP_AND_LIFETIME.md'
      - 'coefficients/side24_v1/PROOF.md'
      - 'frontiers/remainder_vanishing_20260930/PROOF.md'
      - 'frontiers/cusp_second_order_20261001/PROOF.md'
      - 'frontiers/candidate_third_order_20261001/PROOF.md'
      - 'frontiers/third_order_rate_20261001/PROOF.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Exercise complete output contracts in both modes
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S -m unittest discover -s tests -p test_equal_height_workflow.py -v
          python -B -O -S -m unittest discover -s tests -p test_equal_height_workflow.py -v
      - name: Verify sources, replay both modes, reject mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path('frontiers/equal_height_mass_value_20261001').resolve()
          manifest = json.loads((root / 'SOURCES.json').read_text())
          present = sorted(p.name for p in root.iterdir())
          expected_names = sorted([e['path'] for e in manifest['files']] + ['SOURCES.json'])
          if present != expected_names:
              raise ValueError('packet tree differs from manifest: ' + repr(present))
          for entry in manifest['files']:
              path = root / entry['path']
              if path.is_symlink():
                  raise ValueError('symlink: ' + entry['path'])
              data = path.read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('packet file identity mismatch: ' + entry['path'])
          for entry in manifest['consumed'] + manifest['cited_only']:
              data = pathlib.Path(entry['path']).read_bytes()
              framed = b'blob ' + str(len(data)).encode() + b'\0' + data
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256'] or hashlib.sha1(framed).hexdigest() != entry['git_blob']:
                  raise ValueError('merged source drifted: ' + entry['path'])
          if manifest.get('consumed_unmerged'):
              raise ValueError('this packet declares no unmerged dependency')
          mutants = manifest.get('mutants')
          if type(mutants) is not list or mutants != ['M1', 'M2', 'M3']:
              raise RuntimeError('complete ordered M1-M3 inventory required')
          # Fixed full reports measured from unchanged checker 92ba3cde in both modes.
          # Byte identity is intentional; changed diagnostics need a reviewed rebind.
          contracts = {
              'M1': (933, 'b6f95f60a211e6abf9c5595fcc26ebd74ea5d3c6c5ade551e94ac1ce4e98952f'),
              'M2': (938, '4cd2c6f39ed2c920d0fc69fb3a1826b9cec35465c3013d00996b4b26ce788c49'),
              'M3': (935, 'ac69c631970c2b5f6b1cba6c9457b5601148d0ca7ea087cc012e2772ffd9fa09'),
          }
          script = str(root / 'equal_height_mass.py')
          expected = (root / 'RESULTS.json').read_bytes()
          for flags in (['-B', '-S'], ['-B', '-O', '-S']):
              result = subprocess.run([sys.executable, *flags, script], capture_output=True, timeout=600)
              if result.returncode != 0 or result.stdout != expected or result.stderr != b'':
                  raise RuntimeError('baseline exit/stdout/stderr differs under ' + ' '.join(flags))
              for m in mutants:
                  result = subprocess.run([sys.executable, *flags, script, '--mutant', m], capture_output=True, timeout=600)
                  size, digest = contracts[m]
                  if (result.returncode != 1 or result.stderr != b'' or len(result.stdout) != size
                          or hashlib.sha256(result.stdout).hexdigest() != digest):
                      raise RuntimeError('mutant ' + m + ' differs from its complete fixed rejection report')
              result = subprocess.run([sys.executable, *flags, script, '--mutant', 'M9'], capture_output=True, timeout=600)
              if result.returncode != 2 or result.stdout != b'' or result.stderr != b'unknown mutant label\n':
                  raise RuntimeError('unknown mutant label differs from fixed exit/stdout/stderr')
          print(json.dumps({'scientific_effect': 'NONE', 'mathematical_acceptance': False}))
          PY
          git diff --exit-code
