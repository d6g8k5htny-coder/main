name: C6 witness-collision reconciliation checks

'on':
  pull_request:
    paths:
      - 'reviews/c6_witness_collision_reconciliation_20260929/**'
      - '.github/workflows/c6-witness-collision-reconciliation.yml'
      - 'frontiers/c6_*/**'
      - 'frontiers/d5_dimension_lift_20260929/**'
      - 'frontiers/elder_dimension_lift_20260928/**'
      - 'frontiers/remote_collision_20260928/**'
      - 'frontiers/remote_window_20260924/**'
      - 'frontiers/downstream_gate_20260925/GRAPH.json'
      - 'frontiers/downstream_gate_20260925/SELECTOR_REGION.json'
      - 'imports/lifetime_parent_20260925/**'
      - 'reviews/d5_reconciliation_20260929/**'
      - 'reviews/c6_fourier_completion_20260929/**'
      - 'reviews/elder_dimension_lift_claude_20260928/**'
      - 'reviews/d5_remote_collision_grok_20260928/**'
      - 'reviews/d5_offpin_second_moment_20260928/**'
      - 'PROOF_INDEX.md'
      - 'reviews/candidates_pending_20260928/CANDIDATES.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Verify sources, replay both modes (baseline or installed register), reject mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path('reviews/c6_witness_collision_reconciliation_20260929').resolve()
          manifest = json.loads((root / 'SOURCE_FILES.json').read_text())['files']
          present = sorted(p.name for p in root.iterdir())
          expected_names = sorted([e['path'] for e in manifest] + ['SOURCE_FILES.json'])
          if present != expected_names:
              raise ValueError('packet tree differs from manifest: ' + repr(present))
          for entry in manifest:
              path = root / entry['path']
              if pathlib.PurePosixPath(entry['path']).name != entry['path'] or path.is_symlink():
                  raise ValueError('flat regular source required: ' + entry['path'])
              data = path.read_bytes()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise ValueError('source identity mismatch: ' + entry['path'])
          script = str(root / 'reconciliation_check.py')
          mutants = ['allow-symlink', 'no-hash', 'drop-edge', 'stale-fingerprint', 'executed-flag', 'close-residual', 'drop-lower-bound', 'regional-strict', 'clone-live-node', 'open-cell-left', 'installed-drift', 'partial-install', 'selector-ahead', 'witness-edges-partial']
          for flags in (['-B', '-S'], ['-B', '-O', '-S']):
              out = subprocess.run([sys.executable, *flags, script],
                                   check=True, capture_output=True, timeout=300).stdout
              state = json.loads(out).get('register_state')
              if state not in ('baseline', 'installed'):
                  raise RuntimeError('checker reports register_state ' + repr(state))
              pinned = 'RESULTS.json' if state == 'baseline' else 'RESULTS_INSTALLED.json'
              if out != (root / pinned).read_bytes():
                  raise RuntimeError('output differs from ' + pinned + ' under ' + ' '.join(flags))
              for m in mutants:
                  rc = subprocess.run([sys.executable, *flags, script, '--mutant', m],
                                      capture_output=True, timeout=300).returncode
                  if rc != 1:
                      raise RuntimeError('mutant ' + m + ' not rejected')
          print(json.dumps({'scientific_effect': 'NONE', 'mathematical_acceptance': False}))
          PY
          git diff --exit-code
