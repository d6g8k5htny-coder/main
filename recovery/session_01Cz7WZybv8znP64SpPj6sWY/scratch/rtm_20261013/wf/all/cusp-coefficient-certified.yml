name: Cusp coefficient c1 (certified replay)

'on':
  pull_request:
    paths:
      - 'frontiers/cusp_coefficient_certified_20261001/**'
      - '.github/workflows/cusp-coefficient-certified.yml'
      - 'coefficients/side24_v1/PROOF.md'
      - 'coefficients/side24_v1/ENCLOSURE.json'
      - 'imports/lifetime_parent_20260925/UNIFORM_MATRIX_CAP_AND_LIFETIME.md'
      - 'frontiers/cusp_second_order_20261001/PROOF.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certified-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        flags: ['-B -S', '-B -O -S']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Verify manifest and main-resident pins
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B -S - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('frontiers/cusp_coefficient_certified_20261001').resolve()
          manifest = json.loads((root / 'SOURCE_FILES.json').read_text())['files']
          present = sorted(p.name for p in root.iterdir())
          if present != sorted([e['path'] for e in manifest] + ['SOURCE_FILES.json']):
              raise ValueError('packet tree differs from manifest: ' + repr(present))
          for entry in manifest:
              path = root / entry['path']
              if pathlib.PurePosixPath(entry['path']).name != entry['path'] or path.is_symlink():
                  raise ValueError('flat regular source required: ' + entry['path'])
              data = path.read_bytes()
              blob = hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256'] or blob != entry['git_blob']:
                  raise ValueError('source identity mismatch: ' + entry['path'])
          pins = json.loads((root / 'SOURCE_MAP.json').read_text())
          for entry in pins['sources']:
              if not entry['current_required']:
                  continue
              data = pathlib.Path(entry['path']).read_bytes()
              blob = hashlib.sha1(b'blob %d\0' % len(data) + data).hexdigest()
              if len(data) != entry['bytes'] or hashlib.sha256(data).hexdigest() != entry['sha256'] or blob != entry['git_blob']:
                  raise ValueError('consumed source identity mismatch on this tree: ' + entry['path'])
          print('manifest and pins verified')
          PY
      - name: Self-test, full replay against RESULTS.json, mutants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          FLAGS: ${{ matrix.flags }}
        run: |
          set -euo pipefail
          cd frontiers/cusp_coefficient_certified_20261001
          python $FLAGS certificate.py --check --procs "$(nproc)"
          for m in kernel-A gl-weight bound-scale phase-sign tail-drop image-order6; do
            set +e
            python $FLAGS certificate.py --mutant "$m" > /dev/null
            rc=$?
            set -e
            if [ "$rc" -ne 1 ]; then echo "mutant $m not rejected (rc=$rc)"; exit 1; fi
            echo "mutant $m rejected"
          done
          cd "$GITHUB_WORKSPACE"
          git diff --exit-code
          test -z "$(git status --porcelain)"
