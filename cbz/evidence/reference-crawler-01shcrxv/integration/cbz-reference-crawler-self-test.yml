# Proposed for .github/workflows/ by #721; Root decides whether to bind it (B-003).
name: CBZ reference crawler self-test
'on':
  pull_request:
    paths:
      - 'tools/cbz/reference_crawler.py'
      - 'tools/cbz/reference_crawler_mutation_check.py'
      - 'tests/test_cbz_reference_crawler.py'
      - '.github/workflows/cbz-reference-crawler-self-test.yml'
  push:
    branches: [main]
    paths:
      - 'tools/cbz/reference_crawler.py'
      - 'tools/cbz/reference_crawler_mutation_check.py'
      - 'tests/test_cbz_reference_crawler.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self-test:
    name: reference-crawler-self-test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Tests in both interpreter modes, then the mutation check (G6, B-011)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          for flag in "" "-O"; do
            python -B -S $flag -m unittest -v tests.test_cbz_reference_crawler 2>&1 | tee -a "$RUNNER_TEMP/tests.log"
          done
          grep -Ec '^Ran [1-9][0-9]* tests? in ' "$RUNNER_TEMP/tests.log" | grep -qx 2
          python -B -S tools/cbz/reference_crawler_mutation_check.py 2>&1 | tee "$RUNNER_TEMP/mutation.log"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reference-crawler-self-test
          path: ${{ runner.temp }}/*.log
          if-no-files-found: warn
