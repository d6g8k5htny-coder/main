name: D2 actual-law moment bridge (isolated Lean companion)
'on':
  pull_request:
    paths:
      - 'companions/d2_moment_bridge_20261006/**'
      - '.github/workflows/d2-moment-bridge.yml'
      - 'formal/**'
  push:
    branches: [main]
    paths:
      - 'companions/d2_moment_bridge_20261006/**'
      - '.github/workflows/d2-moment-bridge.yml'
      - 'formal/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d2-moment-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LEAN_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Lean and retrieve dependency cache
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: formal
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Replay core and actual-law companion with exact negative controls
        shell: bash
        run: bash companions/d2_moment_bridge_20261006/replay.sh
      - name: Preserve original execution evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: d2-moment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lake/d2-moment-evidence/
            formal/.lake/formal-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
