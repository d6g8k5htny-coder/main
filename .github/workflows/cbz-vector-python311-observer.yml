name: CBZ Workspace 3.11 vector origin observation
on:
  push:
    branches: [codex/cbz-architecture-observation-20261110]
    paths: [.github/workflows/cbz-vector-python311-observer.yml]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: d6g8k5htny-coder/Universal-Law-Workspace
          ref: 0e4162c8f0fc9c61d13ed75c3ef91407c22c236d
          path: workspace-candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Observe actual traceback positions
        run: python3 -B -S cbz/evidence/workspace-vector-python311-20261110/observer.py workspace-candidate "$RUNNER_TEMP/vector-origin-observation"
      - name: Retain original observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cbz-workspace-vector-python311-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vector-origin-observation
          include-hidden-files: true
          if-no-files-found: error
