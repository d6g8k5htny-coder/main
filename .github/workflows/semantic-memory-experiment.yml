name: Semantic memory Task1 fixture controls
'on':
  push:
    branches: [codex/semantic-memory-task1-20261016]
  pull_request:
    paths:
      - 'experiments/semantic_memory/**'
      - 'tests/test_semantic_memory_benchmark.py'
      - 'tools/semantic_memory_experiment.py'
      - '.github/workflows/semantic-memory-experiment.yml'
permissions:
  contents: read
concurrency:
  group: semantic-memory-task1-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  fixture-controls:
    runs-on: ubuntu-24.04
    # 19-minute preparation + 6-minute controls + fourteen 1-minute stages = 39.
    # One additional minute covers runner/action transition overhead.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Capture native context and complete public Task1 source inventory
        id: task1_native
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 -I -B -S - "$RUNNER_TEMP" "$GITHUB_WORKSPACE" <<'PY'
          import hashlib, json, os, pathlib, re, stat, subprocess, sys
          def require(value, message):
              if not value:
                  raise ValueError(message)
          def git(*args):
              return subprocess.run(['git', *args], check=True, stdout=subprocess.PIPE).stdout
          def write(path, raw):
              path.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o444)
              with os.fdopen(fd, 'wb') as stream:
                  stream.write(raw)
          def document(value):
              return (json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=True) + '\n').encode('ascii')
          temporary, workspace = map(pathlib.Path, sys.argv[1:])
          run, attempt = os.environ['GITHUB_RUN_ID'], os.environ['GITHUB_RUN_ATTEMPT']
          require(re.fullmatch(r'[1-9][0-9]*', run) and re.fullmatch(r'[1-9][0-9]*', attempt), 'native run/attempt')
          root = temporary / ('semantic-memory-task1-' + run + '-' + attempt)
          root.mkdir(mode=0o700, exist_ok=False)
          publish = root / 'publish'
          publish.mkdir(mode=0o700)
          commit = git('rev-parse', 'HEAD').decode('ascii').strip()
          tree = git('rev-parse', 'HEAD^{tree}').decode('ascii').strip()
          parents = git('rev-list', '--parents', '-n', '1', 'HEAD').decode('ascii').split()
          native = {
              'schema_version': 1, 'kind': 'NATIVE_FIXTURE_EXECUTION_CONTEXT',
              'repository': os.environ['GITHUB_REPOSITORY'], 'checked_commit': commit,
              'checked_tree': tree, 'ordered_parents': parents[1:],
              'github_sha': os.environ['GITHUB_SHA'], 'run_id': run, 'run_attempt': attempt,
              'event_name': os.environ['GITHUB_EVENT_NAME'], 'ref': os.environ['GITHUB_REF'],
              'scientific_effect': 'NONE', 'scientific_status_authority': False,
              'scope': 'Task1 synthetic fixture controls only; not semantic retrieval or installation'}
          write(publish / 'native-context.json', document(native))
          write(publish / 'checked-commit-object.txt', git('cat-file', 'commit', 'HEAD'))
          require(commit == os.environ['GITHUB_SHA'] and parents[0] == commit, 'checked native commit mismatch')
          prefixes = ['experiments/semantic_memory', 'tests/test_semantic_memory_benchmark.py',
                      'tools/semantic_memory_experiment.py', '.github/workflows/semantic-memory-experiment.yml']
          listing = git('ls-tree', '-r', '-z', 'HEAD', '--', *prefixes)
          write(publish / 'selected-source-tree.z', listing)
          records, total = [], 0
          for entry in listing.split(b'\0'):
              if not entry:
                  continue
              metadata, encoded_name = entry.split(b'\t', 1)
              mode, kind, blob = metadata.decode('ascii').split()
              name = encoded_name.decode('ascii')
              require(mode == '100644' and kind == 'blob'
                      and re.fullmatch(r'[A-Za-z0-9_./-]+', name)
                      and all(part not in ('', '.', '..') for part in name.split('/')), 'closed public source path/type')
              require(len(records) < 256, 'bounded complete source inventory')
              source = workspace / name
              for parent in source.parents:
                  require(stat.S_ISDIR(parent.lstat().st_mode), 'source parent must not be a link')
                  if parent == workspace:
                      break
              fd = os.open(source, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  before = os.fstat(fd)
                  require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_size <= 4 * 2**20,
                          'bounded original source file')
                  raw = b''
                  while len(raw) <= 4 * 2**20:
                      block = os.read(fd, min(65536, 4 * 2**20 + 1 - len(raw)))
                      if not block:
                          break
                      raw += block
                  after = os.fstat(fd)
                  require((before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns)
                          == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns)
                          and len(raw) == before.st_size, 'source stable during capture')
              finally:
                  os.close(fd)
              total += len(raw)
              require(total <= 16 * 2**20, 'bounded original source aggregate')
              require(hashlib.sha1(b'blob ' + str(len(raw)).encode('ascii') + b'\0' + raw).hexdigest() == blob,
                      'source bytes must equal native Git blob')
              records.append({'path': name, 'mode': mode, 'git_blob': blob, 'bytes': len(raw),
                              'sha256': hashlib.sha256(raw).hexdigest()})
              write(publish / 'source' / name, raw)
          names = {record['path'] for record in records}
          require('tests/test_semantic_memory_benchmark.py' in names
                  and '.github/workflows/semantic-memory-experiment.yml' in names
                  and any(name.startswith('experiments/semantic_memory/') for name in names),
                  'complete Task1 fixture/test/workflow source required')
          write(publish / 'source-inventory.json', document({
              'schema_version': 1, 'native_context': native, 'files': records, 'total_bytes': total,
              'product_cli_present': 'tools/semantic_memory_experiment.py' in names}))
          PY
          ruby -rpsych -e 'Psych.safe_load(File.read(ARGV.fetch(0)), aliases: false)' .github/workflows/semantic-memory-experiment.yml
      - name: Extract whole-pinned qualified preparation sources
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 -I -B -S - "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import hashlib, json, os, pathlib, stat, sys
          def require(value, message):
              if not value:
                  raise ValueError(message)
          def original(path, size, digest):
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  before = os.fstat(descriptor)
                  require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_size == size,
                          'qualified whole-source size/type mismatch')
                  raw = b''
                  while len(raw) <= size:
                      part = os.read(descriptor, min(65536, size + 1 - len(raw)))
                      if not part:
                          break
                      raw += part
                  after = os.fstat(descriptor)
                  require((before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns)
                          == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns)
                          and len(raw) == size and hashlib.sha256(raw).hexdigest() == digest,
                          'qualified whole-source changed or pin mismatch')
                  return raw
              finally:
                  os.close(descriptor)
          temporary, workspace = map(pathlib.Path, sys.argv[1:3])
          run_id, attempt = sys.argv[3:5]
          require(run_id.isdecimal() and attempt.isdecimal(), 'native preparation path context')
          workflow = original(workspace / '.github/workflows/architecture-runtime-acquisition.yml', 95714,
              '9b33eee757bae53966a151150bc62bc6aec13f9aa8226b4398dfa3362597de65')
          original(workspace / 'docs/plans/2026-10-09-public-runtime-acquisition.md', 22516,
              '72bdcf2b2374216f415fb6d86b84c2db25e7855caf0699bdfe2473336fb64bb7')
          destination = temporary / ('architecture-preparation-source-' + run_id + '-' + attempt)
          destination.mkdir(mode=0o700, exist_ok=False)
          lines = workflow.decode('ascii').splitlines()
          selection = (
              ('write-sources.sh', 'Write fixed trusted preparation sources'),
              ('run-preparation.sh', 'Parse the standalone source and run the preparation once'),
              ('seal.sh', 'Seal available originals on every conclusion'),
              ('cleanup.sh', 'Remove only owned preparation client and control files'))
          for filename, name in selection:
              starts = [index for index, line in enumerate(lines) if line == '      - name: ' + name]
              require(len(starts) == 1, 'ambiguous qualified step marker')
              start = starts[0]
              end = next((index for index in range(start + 1, len(lines))
                          if lines[index].startswith('      - ')), len(lines))
              block = lines[start:end]
              markers = [index for index, line in enumerate(block) if line == '        run: |']
              require(len(markers) == 1, 'ambiguous qualified literal run source')
              body = block[markers[0] + 1:]
              require(body and all(line.startswith('          ') for line in body),
                      'qualified literal script indentation')
              raw = ('\n'.join(line[10:] for line in body) + '\n').encode('ascii')
              descriptor = os.open(destination / filename, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o444)
              with os.fdopen(descriptor, 'wb') as stream:
                  stream.write(raw)
          print(json.dumps({'qualified_sources': 'PIN_MATCH', 'literal_scripts': len(selection)}))
          PY
          bash "$RUNNER_TEMP/architecture-preparation-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/write-sources.sh"
      - name: Qualify canonical acquisition and restore daemon before tests
        id: preparation
        timeout-minutes: 19
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/architecture-preparation-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/run-preparation.sh"
      - name: Seal separate preparation originals on every conclusion
        id: preparation_seal
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/architecture-preparation-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/seal.sh"
      - name: Retain separate bounded preparation originals
        id: preparation_retained
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: architecture-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-runtime-${{ github.run_id }}-${{ github.run_attempt }}/publish/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Remove only owned preparation and extraction files
        id: preparation_cleanup
        if: always()
        timeout-minutes: 1
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/architecture-preparation-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          bash "$directory/cleanup.sh"
          python3 -I -B -S - "$directory" <<'PY'
          import os, pathlib, stat, sys
          directory = pathlib.Path(sys.argv[1])
          info = directory.lstat()
          if not stat.S_ISDIR(info.st_mode) or info.st_uid != os.getuid() or stat.S_IMODE(info.st_mode) != 0o700:
              raise ValueError('owned extraction directory identity')
          names = {'write-sources.sh', 'run-preparation.sh', 'seal.sh', 'cleanup.sh'}
          if {path.name for path in directory.iterdir()} != names:
              raise ValueError('closed owned extraction inventory')
          for name in sorted(names):
              path = directory / name
              info = path.lstat()
              if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_uid != os.getuid() or info.st_size > 1024 * 1024:
                  raise ValueError('owned extraction file identity/bound')
              path.unlink()
          directory.rmdir()
          PY
      - name: Require complete current-run preparation before architecture
        timeout-minutes: 1
        env:
          PREPARATION_ARTIFACT_ID: ${{ steps.preparation_retained.outputs.artifact-id }}
          PREPARATION_ARTIFACT_DIGEST: ${{ steps.preparation_retained.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python3 -I -B -S - "$RUNNER_TEMP/public-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/publish" <<'PY'
          import hashlib, json, os, pathlib, re, stat, sys
          MIB = 2**20
          def require(value, message):
              if not value:
                  raise ValueError(message)
          def read(path, limit):
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  before = os.fstat(descriptor)
                  require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_size <= limit,
                          'sealed preparation regular-file admission')
                  raw = b''
                  while len(raw) <= limit:
                      part = os.read(descriptor, min(65536, limit + 1 - len(raw)))
                      if not part:
                          break
                      raw += part
                  after = os.fstat(descriptor)
                  require((before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns)
                          == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns)
                          and len(raw) == before.st_size <= limit, 'sealed preparation changed during read')
                  return raw
              finally:
                  os.close(descriptor)
          root = pathlib.Path(sys.argv[1])
          info = root.lstat()
          require(stat.S_ISDIR(info.st_mode) and info.st_uid == os.getuid()
                  and stat.S_IMODE(info.st_mode) == 0o700, 'owned sealed preparation directory')
          native = {key: os.environ[name] for key, name in (
              ('repository', 'GITHUB_REPOSITORY'), ('checked_commit', 'GITHUB_SHA'),
              ('run_id', 'GITHUB_RUN_ID'), ('run_attempt', 'GITHUB_RUN_ATTEMPT'))}
          require(re.fullmatch(r'[1-9][0-9]*', os.environ['PREPARATION_ARTIFACT_ID'])
                  and re.fullmatch(r'(?:sha256:)?[0-9a-f]{64}', os.environ['PREPARATION_ARTIFACT_DIGEST']),
                  'native preparation upload identity unavailable')
          manifest = {}
          manifest_raw = read(root / 'ARTIFACT_SHA256SUMS', MIB)
          for line in manifest_raw.decode('ascii').splitlines():
              match = re.fullmatch(r'([0-9a-f]{64})  ([A-Za-z0-9_.-]+)', line)
              require(match is not None and match[2] not in manifest, 'closed preparation hash manifest')
              manifest[match[2]] = match[1]
          require(0 < len(manifest) <= 256
                  and {path.name for path in root.iterdir()} == set(manifest) | {'ARTIFACT_SHA256SUMS'},
                  'exact sealed preparation inventory')
          bodies, records, total = {}, {}, len(manifest_raw)
          for name, digest in manifest.items():
              limit = 4 * MIB if name in ('pull.stdout', 'pull.stderr') else MIB
              raw = read(root / name, limit)
              total += len(raw)
              require(total <= 36 * MIB and hashlib.sha256(raw).hexdigest() == digest,
                      'sealed preparation original hash/aggregate bound')
              bodies[name] = raw
              records[name] = {'bytes': len(raw), 'sha256': digest}
          receipt = json.loads(bodies['receipt.json'])
          collection = json.loads(bodies['collection.json'])
          result = json.loads(bodies['preparation-result.json'])
          observation = json.loads(bodies['preparation-observations.json'])
          semantic = json.loads(bodies['semantic-controls.json'])
          for record in (receipt, collection):
              require(record['status'] == 'ACCEPTED_PREPARATION' and record['native_context'] == native,
                      'current-run sealed preparation acceptance required')
          require(result['status'] == 'ACCEPTED_PREPARATION' and result['context'] == native
                  and observation['context'] == native and observation['head'] == native['checked_commit']
                  and collection['missing'] == [] and collection['refused'] == []
                  and result['preparation_error'] is None and result['recovery_error'] is None
                  and result['refused_originals'] == [], 'complete current-run preparation required')
          rows = receipt['originals']
          joined = {row['path']: {'bytes': row['bytes'], 'sha256': row['sha256']} for row in rows}
          require(len(joined) == len(rows) == receipt['original_count']
                  and set(joined) == set(records) - {'receipt.json'}
                  and all(records[name] == record for name, record in joined.items())
                  and receipt['original_bytes'] == sum(record['bytes'] for record in joined.values()),
                  'receipt original copies/subtotal join')
          copied = collection['copied']
          copies = {row['path']: {'bytes': row['bytes'], 'sha256': row['sha256']} for row in copied}
          require(len(copies) == len(copied) and set(copies) == set(joined) - {'collection.json'}
                  and all(records[name] == record for name, record in copies.items())
                  and set(copies) == set(result['available_originals']) | {'preparation-result.json'}
                  and all(copies[name] == record for name, record in result['available_originals'].items()),
                  'collection/controller original copies join')
          require(records['checked-workflow.yml'] == {'bytes': 95714, 'sha256':
                  '9b33eee757bae53966a151150bc62bc6aec13f9aa8226b4398dfa3362597de65'}
                  and records['contract.md'] == {'bytes': 22516, 'sha256':
                  '72bdcf2b2374216f415fb6d86b84c2db25e7855caf0699bdfe2473336fb64bb7'}
                  and observation['source_before'] == observation['source_after'],
                  'qualified preparation whole sources stable')
          negative_ids = (
              'RP01_stale_run', 'RP01_changed_source', 'RP02_existing_container', 'RP02_cached_image',
              'RP03_missing_actual_mirror', 'RP03_changed_preserved_setting', 'RP04_manifest_substitution',
              'RP04_config_substitution', 'RP05_pull_nonzero', 'RP05_pull_incomplete',
              'RP06_mirror_prefixed_digest', 'RP06_extra_digest', 'RP06_wrong_image_platform',
              'RP07_native_root', 'RP07_missing_OO', 'RP08_wrong_sqlite_all_modes', 'RP08_wrong_OO_flag',
              'RP08_empty_binary_all_modes', 'RP09_wrong_CPU_all_modes', 'RP10_disposal_unconfirmed',
              'RP11_restored_mirror_wrong', 'RP11_restored_bytes_wrong', 'RP12_missing_original',
              'RP03_nested_synthetic_credential', 'RP09_oversized_overlay_lowerdir')
          expected = [{'id': 'RP_positive_actual_copy', 'status': 'PASS'}]
          expected += [{'id': name, 'status': 'REFUSED'} for name in negative_ids]
          require(result['controls'] == semantic['controls'] == expected
                  and semantic['origin'] == 'TEST_SEMANTIC_MUTATIONS_OF_COPIED_ACTUAL_OBSERVATIONS',
                  'all qualified actual-copy controls required')
          require(observation['recovery_complete'] is True
                  and observation['containers_recovery_empty'] is True
                  and observation['containers_restored_empty'] is True
                  and observation['restored_mirrors'] == observation['original_mirrors']
                  and set(observation['probes']) == {'0', '1', '2'}
                  and all(item['disposed'] is True for item in observation['probes'].values())
                  and result['disposal_confirmed'] == {'0': True, '1': True, '2': True},
                  'owned probe disposal and daemon recovery before architecture')
          print(json.dumps({'status': 'ACCEPTED_PREPARATION', 'current_run': native['run_id'],
                            'positive': 'PASS', 'negative_refusals': len(negative_ids)}))
          PY
      - name: Prepare bounded Task1 output and record the admitted image
        id: task1_output
        timeout-minutes: 1
        env:
          IMAGE: python:3.11.14-slim-bookworm@sha256:83f339c1be6340ae1096010fdccf6552ac932d8f410d45d206014916bdf37e48
          PREPARATION_ARTIFACT_ID: ${{ steps.preparation_retained.outputs.artifact-id }}
          PREPARATION_ARTIFACT_DIGEST: ${{ steps.preparation_retained.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          task1_root="$RUNNER_TEMP/semantic-memory-task1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$task1_root/output"
          truncate -s 64M "$task1_root/output.img"
          mkfs.ext4 -F "$task1_root/output.img"
          sudo mount -o loop,nodev,nosuid,noexec "$task1_root/output.img" "$task1_root/output"
          sudo mkdir "$task1_root/output/container" "$task1_root/output/host"
          sudo chmod 0777 "$task1_root/output/container"
          sudo chown "$(id -u):$(id -g)" "$task1_root/output/host"
          chmod 0700 "$task1_root/output/host"
          docker image inspect "$IMAGE" > "$task1_root/publish/runtime-image.json"
          python3 -I -B -S - "$task1_root/publish/preparation-binding.json" <<'PY'
          import json, os, pathlib, sys
          record = {'schema_version': 1, 'kind': 'NATIVE_PREPARATION_ARTIFACT_BINDING',
                    'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'artifact_id': os.environ['PREPARATION_ARTIFACT_ID'],
                    'artifact_digest': os.environ['PREPARATION_ARTIFACT_DIGEST']}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(record, sort_keys=True) + '\n', encoding='ascii')
          PY
      - name: Run all three fixture methods in both interpreter modes
        id: task1_controls
        timeout-minutes: 6
        env:
          IMAGE: python:3.11.14-slim-bookworm@sha256:83f339c1be6340ae1096010fdccf6552ac932d8f410d45d206014916bdf37e48
        run: |
          set -euo pipefail
          task1_root="$RUNNER_TEMP/semantic-memory-task1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          task1_container="semantic-memory-task1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          set +e
          timeout --signal=TERM --kill-after=10s 300s docker run --pull=never --rm --log-driver none --name "$task1_container" \
            --network none --read-only --user 65532:65532 --cpus 2 --memory 1g --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/source,readonly \
            --mount type=bind,source="$task1_root/output/container",target=/output \
            --workdir /source "$IMAGE" sh -c '
              SEMANTIC_MEMORY_CHILD_MODE_LOG=/output/child-modes-normal.jsonl \
                python -B -S -m unittest discover -s tests -p test_semantic_memory_benchmark.py -v > /output/tests-normal.log 2>&1
              normal=$?
              printf "%s\n" "$normal" > /output/mode-exit-normal.txt
              SEMANTIC_MEMORY_CHILD_MODE_LOG=/output/child-modes-optimized.jsonl \
                python -B -O -S -m unittest discover -s tests -p test_semantic_memory_benchmark.py -v > /output/tests-optimized.log 2>&1
              optimized=$?
              printf "%s\n" "$optimized" > /output/mode-exit-optimized.txt
              if [ "$normal" -ne 0 ] || [ "$optimized" -ne 0 ]; then exit 1; fi
            ' > "$task1_root/output/host/console.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$task1_root/publish/container-exit-status.txt"
          exit "$status"
      - name: Dispose only the exact Task1 container before collection
        id: task1_disposal
        if: ${{ always() && (steps.task1_output.outcome == 'success' || steps.task1_output.outcome == 'failure' || steps.task1_output.outcome == 'cancelled') }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          task1_container="semantic-memory-task1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          present="$(docker ps -aq --filter "name=^/$task1_container$")"
          if [ -n "$present" ]; then docker rm --force "$task1_container"; fi
          remaining="$(docker ps -aq --filter "name=^/$task1_container$")"
          test -z "$remaining"
      - name: Collect bounded originals only after confirmed container absence
        id: task1_collection
        if: ${{ always() && steps.task1_native.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          task1_container="semantic-memory-task1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remaining="$(docker ps -aq --filter "name=^/$task1_container$")"
          test -z "$remaining"
          sudo python3 -I -B -S - "$RUNNER_TEMP/semantic-memory-task1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" <<'PY'
          import hashlib, json, os, pathlib, stat, sys
          root = pathlib.Path(sys.argv[1])
          publish = root / 'publish'
          copied, missing, refused = [], [], []
          limits = {'tests-normal.log': 8 * 2**20, 'tests-optimized.log': 8 * 2**20,
                    'mode-exit-normal.txt': 64, 'mode-exit-optimized.txt': 64,
                    'child-modes-normal.jsonl': 2**20, 'child-modes-optimized.jsonl': 2**20}
          def copy_file(directory, name, limit):
              try:
                  fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=directory)
              except FileNotFoundError:
                  missing.append(name)
                  return
              try:
                  before = os.fstat(fd)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size > limit:
                      raise ValueError('original type/link/size')
                  raw = b''
                  while len(raw) <= limit:
                      block = os.read(fd, min(65536, limit + 1 - len(raw)))
                      if not block:
                          break
                      raw += block
                  after = os.fstat(fd)
                  if ((before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns)
                      != (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns)
                      or len(raw) != before.st_size):
                      raise ValueError('original changed during collection')
              finally:
                  os.close(fd)
              target = os.open(publish / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o444)
              with os.fdopen(target, 'wb') as stream:
                  stream.write(raw)
              copied.append({'path': name, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest(),
                             'original_uid': before.st_uid, 'original_gid': before.st_gid,
                             'original_mode': stat.S_IMODE(before.st_mode)})
          source = root / 'output' / 'container'
          if source.exists():
              directory = os.open(source, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  unknown = set(os.listdir(directory)) - set(limits)
                  for name in sorted(unknown):
                      refused.append({'name_sha256': hashlib.sha256(os.fsencode(name)).hexdigest(),
                                      'reason': 'unregistered output entry'})
                  for name, limit in limits.items():
                      try:
                          copy_file(directory, name, limit)
                      except Exception as error:
                          refused.append({'path': name, 'reason': type(error).__name__})
              finally:
                  os.close(directory)
          else:
              missing.extend(limits)
          host = root / 'output' / 'host'
          if host.exists():
              directory = os.open(host, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  copy_file(directory, 'console.log', 4 * 2**20)
              finally:
                  os.close(directory)
          record = {'schema_version': 1, 'kind': 'ORIGINAL_COLLECTION_OBSERVATION',
                    'exact_container_absence_confirmed': True, 'copied': copied, 'missing': missing,
                    'refused': refused, 'scientific_effect': 'NONE', 'scientific_status_authority': False}
          raw = (json.dumps(record, sort_keys=True, separators=(',', ':')) + '\n').encode('ascii')
          fd = os.open(publish / 'collection.json', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o444)
          with os.fdopen(fd, 'wb') as stream:
              stream.write(raw)
          if refused:
              raise ValueError('unregistered or refused original output; retained observation')
          PY
      - name: Observe exact fixture inventories without inventing product acceptance
        id: task1_observation
        if: ${{ always() && steps.task1_native.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 -I -B -S - "$RUNNER_TEMP/semantic-memory-task1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/publish" "$GITHUB_WORKSPACE" <<'PY'
          import hashlib, json, os, pathlib, re, stat, sys
          publish, workspace = map(pathlib.Path, sys.argv[1:])
          methods = ('test_frozen_case_inventory_and_hashes', 'test_gold_never_enters_index_or_prompt',
                     'test_deep_and_confusable_spans_are_real')
          expected = sorted('test_semantic_memory_benchmark.SemanticMemoryFixtureContract.' + name for name in methods)
          issues, modes = [], {}
          source = json.loads((publish / 'source-inventory.json').read_bytes())
          for record in source['files']:
              path = workspace / record['path']
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  info = os.fstat(fd)
                  if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_size != record['bytes']:
                      raise ValueError('source geometry changed')
                  raw = os.read(fd, record['bytes'] + 1)
                  if len(raw) != record['bytes'] or hashlib.sha256(raw).hexdigest() != record['sha256']:
                      raise ValueError('source bytes changed')
              finally:
                  os.close(fd)
          collection = json.loads((publish / 'collection.json').read_bytes()) if (publish / 'collection.json').is_file() else None
          if collection is None or collection['refused']:
              issues.append('original collection unavailable or refused')
          elif set(collection['missing']) & {'tests-normal.log', 'tests-optimized.log', 'mode-exit-normal.txt',
                                             'mode-exit-optimized.txt', 'console.log'}:
              issues.append('required original output missing')
          for mode, optimize in (('normal', 0), ('optimized', 1)):
              path = publish / ('tests-' + mode + '.log')
              result = {'expected_ids': expected, 'results': [], 'footers': [], 'complete_three_pass': False,
                        'child_mode_diagnostic': 'NOT_PRESENT'}
              if path.is_file():
                  raw = path.read_bytes()
                  try:
                      text = raw.decode('utf-8')
                      if '\r' in text or '\0' in text:
                          raise ValueError('non-LF log')
                      lines = text.splitlines()
                      for line in lines:
                          match = re.fullmatch(r'([A-Za-z_][A-Za-z0-9_]*) \(([^()\s]+)\) \.\.\. (ok|FAIL|ERROR|skipped.*)', line)
                          if match:
                              result['results'].append({'id': match[2], 'short_name': match[1], 'result': match[3]})
                          elif re.match(r'\s*test[A-Za-z0-9_]*\s*\(', line):
                              issues.append(mode + ': malformed result-looking line')
                          footer = re.fullmatch(r'Ran ([1-9][0-9]*) tests? in ([0-9]+(?:\.[0-9]+)?)s', line)
                          if footer:
                              result['footers'].append({'count': int(footer[1]), 'duration_text': footer[2]})
                      rows = result['results']
                      terminal = [line for line in lines if line]
                      result['complete_three_pass'] = (
                          len(rows) == 3 and sorted(row['id'] for row in rows) == expected
                          and all(row['result'] == 'ok' and row['short_name'] == row['id'].split('.')[-1] for row in rows)
                          and len(result['footers']) == 1 and result['footers'][0]['count'] == 3
                          and terminal[-1:] == ['OK'] and lines.count('OK') == 1)
                  except (UnicodeError, ValueError) as error:
                      issues.append(mode + ': ' + type(error).__name__)
              else:
                  issues.append(mode + ': raw test log missing')
              exit_path = publish / ('mode-exit-' + mode + '.txt')
              mode_exit = exit_path.read_text('ascii').strip() if exit_path.is_file() else None
              result['untrusted_mode_exit_status'] = mode_exit
              if mode_exit != '0':
                  issues.append(mode + ': original mode exit was nonzero or unavailable')
              diagnostic = publish / ('child-modes-' + mode + '.jsonl')
              if diagnostic.is_file():
                  try:
                      raw = diagnostic.read_bytes()
                      if not raw or not raw.endswith(b'\n') or b'\r' in raw:
                          raise ValueError('diagnostic line framing')
                      def unique(pairs):
                          obj = {}
                          for key, value in pairs:
                              if key in obj:
                                  raise ValueError('duplicate diagnostic key')
                              obj[key] = value
                          return obj
                      rows = [json.loads(line, object_pairs_hook=unique) for line in raw.splitlines()]
                      if not all(type(row) is dict and set(row) == {'schema_version', 'optimize'}
                                 and type(row['schema_version']) is int and row['schema_version'] == 1
                                 and type(row['optimize']) is int and row['optimize'] == optimize for row in rows):
                          raise ValueError('diagnostic closed schema or mode')
                      result['child_mode_diagnostic'] = {'records': len(rows), 'optimize': optimize}
                      if not source['product_cli_present']:
                          issues.append(mode + ': child diagnostic exists while CLI was absent')
                  except (UnicodeError, ValueError) as error:
                      issues.append(mode + ': invalid child diagnostic ' + type(error).__name__)
              elif source['product_cli_present']:
                  issues.append(mode + ': required child diagnostic missing while CLI was present')
              modes[mode] = result
              if not result['complete_three_pass']:
                  issues.append(mode + ': complete expected three-method PASS not observed')
          status_path = publish / 'container-exit-status.txt'
          status = status_path.read_text('ascii').strip() if status_path.is_file() else None
          if status != '0':
              issues.append('trusted container command did not complete with zero status')
          observation = {
              'schema_version': 1, 'kind': 'FIXTURE_CONTROL_OBSERVATION', 'native_context': source['native_context'],
              'product_cli_present': source['product_cli_present'], 'modes': modes, 'container_exit_status': status,
              'issues': issues, 'complete_fixture_controls_passed': not issues,
              'qualification_scope': 'Three synthetic Task1 fixture methods only. No semantic retrieval, encoder, tokenizer, vector DB, installation or scientific acceptance.',
              'scientific_effect': 'NONE', 'scientific_status_authority': False}
          fd = os.open(publish / 'fixture-control-observation.json',
                       os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o444)
          with os.fdopen(fd, 'w', encoding='ascii') as stream:
              json.dump(observation, stream, sort_keys=True, separators=(',', ':'))
              stream.write('\n')
          if issues:
              raise ValueError('fixture controls failed or incomplete; inspect retained originals')
          PY
      - name: Seal every available original on success or failure
        id: task1_seal
        if: ${{ always() && steps.task1_native.outcome != 'skipped' }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python3 -I -B -S - "$RUNNER_TEMP/semantic-memory-task1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/publish" <<'PY'
          import hashlib, os, pathlib, stat, sys
          root = pathlib.Path(sys.argv[1])
          rows, total = [], 0
          for path in sorted(root.rglob('*')):
              info = path.lstat()
              if stat.S_ISDIR(info.st_mode):
                  continue
              if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1:
                  raise ValueError('refusing nonregular or linked publication member')
              name = path.relative_to(root).as_posix()
              if name == 'ARTIFACT_SHA256SUMS':
                  raise ValueError('manifest already exists')
              raw = path.read_bytes()
              total += len(raw)
              if len(rows) >= 512 or total > 48 * 2**20:
                  raise ValueError('publication original count/aggregate bound exceeded')
              rows.append(hashlib.sha256(raw).hexdigest() + '  ' + name + '\n')
          fd = os.open(root / 'ARTIFACT_SHA256SUMS', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o444)
          with os.fdopen(fd, 'w', encoding='ascii') as stream:
              stream.writelines(rows)
          PY
      - name: Retain original fixture results and native context
        if: ${{ always() && steps.task1_native.outcome != 'skipped' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: semantic-memory-task1-originals-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semantic-memory-task1-${{ github.run_id }}-${{ github.run_attempt }}/publish/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Release only the owned bounded Task1 output filesystem
        if: ${{ always() && steps.task1_native.outcome != 'skipped' }}
        timeout-minutes: 1
        run: |
          set -euo pipefail
          task1_root="$RUNNER_TEMP/semantic-memory-task1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          task1_container="semantic-memory-task1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remaining="$(docker ps -aq --filter "name=^/$task1_container$")"
          test -z "$remaining"
          mounted="$(python3 -I -B -S - "$task1_root/output" <<'PY'
          import pathlib, sys
          target = sys.argv[1]
          rows = [line.split()[4] for line in pathlib.Path('/proc/self/mountinfo').read_text().splitlines()]
          count = rows.count(target)
          if count not in (0, 1):
              raise ValueError('ambiguous owned mount')
          print('mounted' if count else 'absent')
          PY
          )"
          if [ "$mounted" = mounted ]; then sudo umount "$task1_root/output"; fi

