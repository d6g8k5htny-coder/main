name: ST contract pilot
'on':
  pull_request:
    branches: [main]
    paths:
      - 'experiments/st_contract_pilot/**'
      - 'tests/test_st_contract_pilot.py'
      - '.github/workflows/st-contract-pilot.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/st_contract_pilot/**'
      - 'tests/test_st_contract_pilot.py'
      - '.github/workflows/st-contract-pilot.yml'
permissions:
  contents: read
jobs:
  pilot:
    name: st-contract-pilot (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Bind checked source and interpreter
        id: identity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/st-contract-pilot"
          git rev-parse HEAD > "$RUNNER_TEMP/st-contract-pilot/checked-commit.txt"
          test "$(cat "$RUNNER_TEMP/st-contract-pilot/checked-commit.txt")" = "$GITHUB_SHA"
          python -VV > "$RUNNER_TEMP/st-contract-pilot/python.txt" 2>&1
      - name: Run the frozen adapter with an exact positive count
        id: verify
        env:
          ST_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          case "$ST_MODE" in
            normal) flags=() ;;
            optimized) flags=(-O) ;;
            *) echo 'Unknown ST mode' >&2; exit 2 ;;
          esac
          log="$RUNNER_TEMP/st-contract-pilot/adapter.log"
          python -I -B -S "${flags[@]}" tests/test_st_contract_pilot.py 2>&1 | tee "$log"
          python -I -B -S - "$log" <<'PY'
          from pathlib import Path
          import re
          import sys
          text = Path(sys.argv[1]).read_text(encoding='utf-8')
          if not re.search(r'\nRan 4 tests in [^\n]+\n\nOK\n\Z', text):
              raise SystemExit('ST adapter must finish with exactly four tests, no skips, and OK')
          PY
      - name: Retain source identity and actual results, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: st-contract-pilot-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/st-contract-pilot
          if-no-files-found: error
          retention-days: 14
