          status=$?
          printf '%s\n' "$status" > "$publish/client-attach-exit-status.txt"
          set -e
          docker inspect semantic-client > "$publish/client-container-after.json"
          if [ "$status" = 0 ]; then
            test "$(docker inspect --format '{{.State.Status}}' semantic-client)" = exited
            status="$(docker inspect --format '{{.State.ExitCode}}' semantic-client)"
          fi
          printf '%s\n' "$status" > "$publish/compatibility-exit-status.txt"
          docker inspect semantic-server > "$publish/server-container-after.json"
          docker stop --time 10 semantic-server > "$publish/server-stop.txt"
          docker inspect semantic-server > "$publish/server-container-stopped.json"
          set +e
          wait "$server_process"
          server_status=$?
          printf '%s\n' "$server_status" > "$publish/server-attach-exit-status.txt"
          set -e
          exit "$status"
