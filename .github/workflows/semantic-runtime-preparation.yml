          require(len((root / 'original-model-config.json').read_bytes()) == 265
                  and hashlib.sha256((root / 'original-model-config.json').read_bytes()).hexdigest()
                  == '0a3d61b01340ca9dceb4a661e21b3dfe1418ed5206d91291ab933a3762f8bb89', 'retained encoder config drift')
          require(len((root / 'upstream-encoder-LICENSE.txt').read_bytes()) == 11343
                  and hashlib.sha256((root / 'upstream-encoder-LICENSE.txt').read_bytes()).hexdigest()
                  == '832dd9e00a68dd83b3c3fb9f5588dad7dcf337a0db50f7d9483f310cd292e92e', 'retained upstream encoder license drift')
          inventory = []
          for path in sorted(root.iterdir()):
              require(path.is_file() and not path.is_symlink(), 'unexpected trusted publication member')
              raw = path.read_bytes()
              inventory.append({'path': path.name, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
          receipt = {'schema_version': 1, 'scope': 'semantic-runtime-tiny-public-compatibility',
                     'candidate': 'ADAPT_DEDICATED_ENCODER', 'encoder_model': 'qwen3-embedding:8b',
                     'encoder_manifest_sha256': '64b933495768fbd3b87c20583d379728a07471e0c66733a9df87cd1901b3c44b',
                     'generator_installed_model': 'NOT_TOUCHED', 'encoder_tokenizer_parity': 'NOT_RUN',
                     'collector_copy_limit_bytes': 48 * 2**20, 'configured_publication_filesystem_capacity_bytes': 64 * 2**20,
                     'publication_mount_observed': collection['publication_mount_observed'],
                     'actual_publication_filesystem': collection['actual_publication_filesystem'],
                     'collector_subtotal_is_not_whole_publication_bytes': True,
                     'repository': os.environ['GITHUB_REPOSITORY'], 'checked_commit': os.environ['GITHUB_SHA'],
                     'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'actual_private_inputs': False, 'installed_entrypoints': 'NOT_TOUCHED', 'full_weights': 'NOT_ARCHIVED', 'full_image_layers': 'NOT_ARCHIVED',
                     'runtime_images': {label: {'reference': image_refs[label], 'image_id': images[label]['Id']} for label in sorted(images)},
                     'feature_red_green': 'NOT_RUN', 'tokenizer_parity': 'NOT_RUN', 'retrieval_quality': 'NOT_RUN',
                     'scientific_effect': 'NONE', 'scientific_status_authority': False, 'custody': 'unknown',
                     'final_disposition': 'REQUIRES_NATIVE_JOB_SUCCESS_AND_ORIGINAL_ARCHIVE_READBACK', 'members': inventory}
          (root / 'preparation-receipt.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          PY
      - name: Hash retained original members even after a failed attempt
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/semantic-publish/payload"
          find . -type f ! -name ARTIFACT_SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > ARTIFACT_SHA256SUMS
      - name: Retain original compatibility inputs and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semantic-runtime-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semantic-publish/payload/
          if-no-files-found: error
          retention-days: 90
      - name: Release every mounted bounded filesystem strictly
        if: always()
        run: |
          set -euo pipefail
          status=0
          for label in models work control publish; do
            directory="$RUNNER_TEMP/semantic-$label"
            if mountpoint -q "$directory"; then
              if ! sudo umount "$directory"; then status=1; fi
            fi
          done
          exit "$status"
