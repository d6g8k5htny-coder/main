            --env OLLAMA_NUM_PARALLEL=1 --env OLLAMA_MAX_LOADED_MODELS=1 --env OLLAMA_MAX_QUEUE=1 \
            --env OLLAMA_CONTEXT_LENGTH=4096 --env OLLAMA_LOAD_TIMEOUT=300s --env OLLAMA_VULKAN=false \
