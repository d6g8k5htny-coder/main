              oracle = []
              for identifier, vector in enumerate(rounded, start=1):
                  norm = math.sqrt(math.fsum(value * value for value in vector))
                  distance = 1 - math.fsum(a * b for a, b in zip(rounded[0], vector)) / (norm_query * norm)
