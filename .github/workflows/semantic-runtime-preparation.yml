              db.close()
              committed_database = database_identity()
              with connect() as db:
                  reopened_native = stored_native_identity(db)
                  require(reopened_native == committed_native, 'native vector identities changed after reopen')
                  rows = db.execute('select rowid,distance from native where embedding match ? and k=2 order by distance', (blobs[0],)).fetchall()
