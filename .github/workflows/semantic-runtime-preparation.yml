name: Semantic runtime preparation
'on':
  pull_request:
    paths:
      - .github/workflows/semantic-runtime-preparation.yml
      - docs/plans/2026-10-08-semantic-runtime-preparation.md
      - docs/plans/2026-10-08-semantic-memory-experiment.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: semantic-runtime-preparation-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  preparation:
    name: semantic-runtime-preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      OLLAMA_IMAGE: ollama/ollama:0.35.1@sha256:17e945f1aa6e505707eeb621e3f36847d0a4a063d4778f7007645acccfb8bd4f
      PYTHON_IMAGE: python:3.11.14-slim-bookworm@sha256:83f339c1be6340ae1096010fdccf6552ac932d8f410d45d206014916bdf37e48
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Admit actual capacity and create bounded disposable filesystems
        run: |
          set -euo pipefail
          publish="$RUNNER_TEMP/semantic-publish/payload"
          mkdir -p "$publish"
          chmod 0700 "$publish"
          git rev-parse HEAD > "$publish/checked-commit.txt"
          printf '%s\n' "$GITHUB_REPOSITORY" > "$publish/repository.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$publish/run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$publish/run-attempt.txt"
          ruby -rpsych -e 'Psych.safe_load(File.read(ARGV.fetch(0)), aliases: false)' .github/workflows/semantic-runtime-preparation.yml
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I -B -S - <<'PY'
          import json, os, pathlib, shutil
          memory = dict(line.split(':', 1) for line in pathlib.Path('/proc/meminfo').read_text().splitlines())
          ram = int(memory['MemTotal'].split()[0]) * 1024
          free = shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          observed = {'schema_version': 1, 'ram_bytes': ram, 'free_disk_bytes': free,
                      'minimum_ram_bytes': 14 * 2**30, 'minimum_free_disk_bytes': 32 * 2**30,
                      'scientific_effect': 'NONE', 'scientific_status_authority': False}
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'semantic-publish/payload/capacity.json'
          path.write_text(json.dumps(observed, sort_keys=True, indent=2) + '\n')
          if ram < observed['minimum_ram_bytes'] or free < observed['minimum_free_disk_bytes']:
              raise ValueError('actual hosted capacity is below preparation admission')
          PY
          # Evidence is bounded too; preserve the capacity/native records across its mount.
          mv "$publish" "$RUNNER_TEMP/semantic-initial-evidence"
          for specification in models:10240 work:512 control:64 publish:64; do
            label="${specification%:*}"
            size="${specification#*:}"
            directory="$RUNNER_TEMP/semantic-$label"
            mkdir -p "$directory"
            truncate -s "${size}M" "$RUNNER_TEMP/semantic-$label.img"
            mkfs.ext4 -F "$RUNNER_TEMP/semantic-$label.img" > "$RUNNER_TEMP/semantic-initial-evidence/filesystem-$label.log" 2>&1
            options=loop,nodev,nosuid,noexec
            if [ "$label" = control ]; then options=loop,nodev,nosuid; fi
            sudo mount -o "$options" "$RUNNER_TEMP/semantic-$label.img" "$directory"
            # Keep ext4 root metadata and lost+found untouched; only this new payload belongs to the runner.
            sudo mkdir "$directory/payload"
            sudo chmod 0755 "$directory/payload"
            sudo chown "$(id -u):$(id -g)" "$directory/payload"
          done
          cp "$RUNNER_TEMP/semantic-initial-evidence/"* "$publish/"
          chmod 0700 "$publish" "$RUNNER_TEMP/semantic-work/payload"
          sudo chown 65532:65532 "$RUNNER_TEMP/semantic-work/payload"
          mkdir -p "$RUNNER_TEMP/semantic-models/payload/blobs" "$RUNNER_TEMP/semantic-models/payload/manifests/registry.ollama.ai/library/qwen3-embedding" "$RUNNER_TEMP/semantic-control/payload/downloads"
          cp .github/workflows/semantic-runtime-preparation.yml "$publish/checked-workflow.yml"
          cp docs/plans/2026-10-08-semantic-runtime-preparation.md "$publish/checked-plan.md"
          cp docs/plans/2026-10-08-semantic-memory-experiment.md "$publish/checked-experiment.md"
      - name: Acquire only fixed public inputs and verify every byte pin
        run: |
          set -euo pipefail
          publish="$RUNNER_TEMP/semantic-publish/payload"
          trap 'status=$?; printf "%s\n" "$status" > "$publish/provision-exit-status.txt"' EXIT
          models="$RUNNER_TEMP/semantic-models/payload"
          control="$RUNNER_TEMP/semantic-control/payload"
          fetch() {
            # Fixed public-input HTTPS delivery redirects are permitted; bytes are never trusted by URL alone.
            curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --proto-redir '=https' \
              --tlsv1.2 --connect-timeout 10 --max-time "$4" --max-filesize "$3" "$1" -o "$2"
          }
          fetch https://registry.ollama.ai/v2/library/qwen3-embedding/manifests/8b "$models/manifests/registry.ollama.ai/library/qwen3-embedding/8b" 531 60
          test "$(sha256sum "$models/manifests/registry.ollama.ai/library/qwen3-embedding/8b" | cut -d ' ' -f 1)" = 64b933495768fbd3b87c20583d379728a07471e0c66733a9df87cd1901b3c44b
          for pin in \
            0a3d61b01340ca9dceb4a661e21b3dfe1418ed5206d91291ab933a3762f8bb89:265 \
            3fcd3febec8b3fd64435204db75bf0dd73b91e8d0661e0331acfe7e7c3120b85:4676804928; do
            digest="${pin%:*}"
            size="${pin#*:}"
            duration=60
            if [ "$size" = 4676804928 ]; then duration=900; fi
            fetch "https://registry.ollama.ai/v2/library/qwen3-embedding/blobs/sha256:$digest" "$models/blobs/sha256-$digest" "$size" "$duration"
          done
          # This immutable upstream license is separate public source metadata, not an encoder registry layer.
          fetch https://huggingface.co/Qwen/Qwen3-Embedding-8B/raw/1d8ad4ca9b3dd8059ad90a75d4983776a23d44af/LICENSE "$control/downloads/upstream-encoder-LICENSE.txt" 11343 60
          fetch https://files.pythonhosted.org/packages/6f/ad/6afd073b0f817b3e03f9e37ad626ae341805891f23c74b5292818f49ac63/sqlite_vec-0.1.9-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.manylinux1_x86_64.whl "$control/downloads/sqlite-vec-0.1.9-linux-x64.whl" 163388 60
          python3 -I -B -S - <<'PY'
          import email.parser, hashlib, json, os, pathlib, stat, zipfile
          base = pathlib.Path(os.environ['RUNNER_TEMP'])
          models, control, publish = (base / ('semantic-' + name) / 'payload' for name in ('models', 'control', 'publish'))
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, 'duplicate primary manifest key')
                  result[key] = value
              return result
          def identity(path, expected_size, expected_hash):
              info = path.lstat()
              require(stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size <= expected_size, 'unsafe public input')
              digest, length = hashlib.sha256(), 0
              with path.open('rb') as stream:
                  while part := stream.read(1048576):
                      length += len(part)
                      require(length <= expected_size, 'public input grew')
                      digest.update(part)
              row = {'path': path.relative_to(models).as_posix(), 'bytes': length, 'sha256': digest.hexdigest(),
                     'expected_bytes': expected_size, 'expected_sha256': expected_hash,
                     'archive_policy': 'ARCHIVE_ORIGINAL_SMALL_INPUT' if expected_size < 1048576 else 'NOT_ARCHIVED_FULL_WEIGHTS'}
              require(length == expected_size and row['sha256'] == expected_hash, 'fixed public input pin mismatch')
              return row
          manifest_path = models / 'manifests/registry.ollama.ai/library/qwen3-embedding/8b'
          raw = manifest_path.read_bytes()
          require(len(raw) == 531 and hashlib.sha256(raw).hexdigest() == '64b933495768fbd3b87c20583d379728a07471e0c66733a9df87cd1901b3c44b', 'encoder manifest pin mismatch')
          manifest = json.loads(raw, object_pairs_hook=unique)
          pins = [('config', '0a3d61b01340ca9dceb4a661e21b3dfe1418ed5206d91291ab933a3762f8bb89', 265),
                  ('model', '3fcd3febec8b3fd64435204db75bf0dd73b91e8d0661e0331acfe7e7c3120b85', 4676804928)]
          require(set(manifest) == {'schemaVersion', 'mediaType', 'config', 'layers'} and manifest['schemaVersion'] == 2
                  and manifest['mediaType'] == 'application/vnd.docker.distribution.manifest.v2+json'
                  and type(manifest['layers']) is list and len(manifest['layers']) == 1, 'unexpected fixed encoder manifest topology')
          actual = [manifest['config'], *manifest['layers']]
          rows = [{'path': manifest_path.relative_to(models).as_posix(), 'bytes': len(raw),
                   'sha256': hashlib.sha256(raw).hexdigest(), 'expected_bytes': 531,
                   'expected_sha256': '64b933495768fbd3b87c20583d379728a07471e0c66733a9df87cd1901b3c44b', 'archive_policy': 'ARCHIVE_ORIGINAL_SMALL_INPUT'}]
          for item, (kind, digest, size) in zip(actual, pins):
              require(item['digest'] == 'sha256:' + digest and type(item['size']) is int and item['size'] == size, 'model layer identity drift')
              require(item['mediaType'] == ('application/vnd.docker.container.image.v1+json' if kind == 'config'
                                           else 'application/vnd.ollama.image.model'), 'encoder layer type drift')
              row = identity(models / ('blobs/sha256-' + digest), size, digest)
              row['kind'] = kind
              rows.append(row)
          require(len(rows) == 3, 'encoder cache must contain manifest, config and model identities only')
          config = json.loads((models / ('blobs/sha256-' + pins[0][1])).read_bytes(), object_pairs_hook=unique)
          require(config == {'model_format': 'gguf', 'model_family': 'qwen3', 'model_families': ['qwen3'], 'model_type': '7.6B',
                             'file_type': 'Q4_K_M', 'architecture': 'amd64', 'os': 'linux',
                             'rootfs': {'type': 'layers', 'diff_ids': ['sha256:' + pins[1][1]]}}, 'encoder config drift')
          (publish / 'model-binding-before.json').write_text(json.dumps(rows, sort_keys=True, indent=2) + '\n')
          wheel = control / 'downloads/sqlite-vec-0.1.9-linux-x64.whl'
          wheel_raw = wheel.read_bytes()
          require(len(wheel_raw) == 163388 and hashlib.sha256(wheel_raw).hexdigest() == '1515727990b49e79bcaf75fdee2ffc7d461f8b66905013231251f1c8938e7786', 'Linux wheel pin mismatch')
          with zipfile.ZipFile(wheel) as archive:
              expected = {'sqlite_vec/__init__.py', 'sqlite_vec/vec0.so', 'sqlite_vec-0.1.9.dist-info/METADATA',
                          'sqlite_vec-0.1.9.dist-info/WHEEL', 'sqlite_vec-0.1.9.dist-info/top_level.txt', 'sqlite_vec-0.1.9.dist-info/RECORD'}
              require(len(archive.infolist()) == 6 and set(archive.namelist()) == expected
                      and sum(item.file_size for item in archive.infolist()) <= 1048576, 'unexpected pinned wheel membership')
              library = archive.read('sqlite_vec/vec0.so')
              require(hashlib.sha256(library).hexdigest() == '5923730861b86c707cca5602b5f91092f9e52a46706dbc6e269fd4bb9c4498e8', 'Linux extension binary pin mismatch')
              metadata_raw = archive.read('sqlite_vec-0.1.9.dist-info/METADATA')
              metadata = email.parser.BytesParser().parsebytes(metadata_raw)
              require(metadata['Name'] == 'sqlite-vec' and metadata['Version'] == '0.1.9', 'wheel metadata identity mismatch')
              (control / 'vec0.so').write_bytes(library)
              (control / 'sqlite-vec-METADATA.txt').write_bytes(metadata_raw)
          license_raw = (control / 'downloads/upstream-encoder-LICENSE.txt').read_bytes()
          require(len(license_raw) == 11343 and hashlib.sha256(license_raw).hexdigest() == '832dd9e00a68dd83b3c3fb9f5588dad7dcf337a0db50f7d9483f310cd292e92e', 'immutable upstream encoder license drift')
          declared = {'schema_version': 1, 'model_declared_license': 'Apache-2.0',
                      'model_upstream_source': 'https://huggingface.co/Qwen/Qwen3-Embedding-8B/tree/1d8ad4ca9b3dd8059ad90a75d4983776a23d44af',
                      'model_upstream_license_url': 'https://huggingface.co/Qwen/Qwen3-Embedding-8B/raw/1d8ad4ca9b3dd8059ad90a75d4983776a23d44af/LICENSE',
                      'model_upstream_license_bytes': len(license_raw), 'model_upstream_license_sha256': hashlib.sha256(license_raw).hexdigest(),
                      'model_registry_license_layer': 'ABSENT', 'model_registry_template_layer': 'ABSENT', 'model_registry_params_layer': 'ABSENT',
                      'gguf_conversion_lineage': 'NOT_INDEPENDENTLY_VERIFIED', 'sqlite_vec_declared_license': metadata['License'],
                      'wheel_license_file': 'ABSENT', 'legal_approval': 'NOT_ASSESSED', 'scientific_effect': 'NONE',
                      'ollama_image_component_license_inventory': 'NOT_ASSESSED', 'python_image_component_license_inventory': 'NOT_ASSESSED',
                      'scientific_status_authority': False, 'wheel_bytes': len(wheel_raw), 'wheel_sha256': hashlib.sha256(wheel_raw).hexdigest()}
          (publish / 'declared-licenses.json').write_text(json.dumps(declared, sort_keys=True, indent=2) + '\n')
          PY
          for pair in "$OLLAMA_IMAGE:ollama" "$PYTHON_IMAGE:python"; do
            image="${pair%:*}"
            label="${pair##*:}"
            (ulimit -f 2048; timeout --signal=TERM --kill-after=10s 600s docker pull --platform linux/amd64 "$image") > "$publish/$label-image-pull.log" 2>&1
            docker image inspect "$image" > "$publish/$label-image.json"
          done
          chmod -R a-w "$models"
      - name: Write fixed public compatibility controls
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/semantic-control/payload/compatibility.py" <<'PY'
          import hashlib, json, math, os, pathlib, platform, sqlite3, stat, struct, sys, time, urllib.error, urllib.request
          root = pathlib.Path('/work/evidence')
          root.mkdir()
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          def save(name, value):
              raw = (json.dumps(value, ensure_ascii=True, allow_nan=False, sort_keys=True, indent=2) + '\n').encode()
              require(len(raw) <= 16777216, 'compatibility evidence byte limit')
              with (root / name).open('xb') as output:
                  output.write(raw)
          def unique(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, 'duplicate native response key')
                  result[key] = value
              return result
          def invalid_number(value):
              raise ValueError('nonfinite native JSON number')
          require(sys.version_info[:3] == (3, 11, 14) and platform.system() == 'Linux' and platform.machine() == 'x86_64', 'actual client runtime drift')
          extension = pathlib.Path('/control/vec0.so')
          require(hashlib.sha256(extension.read_bytes()).hexdigest() == '5923730861b86c707cca5602b5f91092f9e52a46706dbc6e269fd4bb9c4498e8', 'loaded Linux extension pin mismatch')
          database = root / 'compatibility.sqlite'
          def connect():
              db = sqlite3.connect(database)
              db.enable_load_extension(True)
              try:
                  db.load_extension(str(extension))
              finally:
                  db.enable_load_extension(False)
              require(db.execute('select vec_version()').fetchone()[0] in ('v0.1.9', '0.1.9'), 'actual loaded extension version drift')
              db.execute('pragma journal_mode=DELETE')
              db.execute('pragma synchronous=FULL')
              return db
          query = struct.pack('<3f', 1.0, 0.0, 0.0)
          with connect() as db:
              version = db.execute('select vec_version()').fetchone()[0]
              compile_options = [row[0] for row in db.execute('pragma compile_options')]
              db.execute('create virtual table tiny using vec0(embedding float[3] distance_metric=cosine)')
              db.executemany('insert into tiny(rowid, embedding) values (?, ?)', [(1, query), (2, struct.pack('<3f', 0.0, 1.0, 0.0))])
          db.close()
          with connect() as db:
              tiny_rows = db.execute('select rowid, distance from tiny where embedding match ? and k=2 order by distance', (query,)).fetchall()
              tiny_rows.sort(key=lambda item: (item[1], item[0]))
              require(len(tiny_rows) == 2 and [row[0] for row in tiny_rows] == [1, 2]
                      and abs(tiny_rows[0][1]) <= 1e-6 and abs(tiny_rows[1][1] - 1) <= 1e-6, 'reopened tiny cosine query mismatch')
          db.close()
          save('extension-result.json', {'schema_version': 1, 'python': platform.python_version(), 'platform': platform.platform(),
               'sqlite_version': sqlite3.sqlite_version, 'sqlite_compile_options': compile_options, 'vec_version': version,
               'tiny_cosine_rows': tiny_rows, 'actual_loaded_extension': True, 'reopened': True,
               'scientific_effect': 'NONE', 'scientific_status_authority': False})
          # No proxy handler, redirect handler or endpoint input is admitted to this loopback-only client.
          class DenyRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, url):
                  raise ValueError('loopback API redirect refused')
          client = urllib.request.build_opener(urllib.request.ProxyHandler({}), DenyRedirect())
          def api(path, label, payload=None, timeout=30):
              require(path in ('/api/version', '/api/tags', '/api/show', '/api/embed', '/api/ps'), 'unadmitted API path')
              data = None if payload is None else json.dumps(payload, allow_nan=False, separators=(',', ':')).encode()
              if data is not None:
                  save(label + '-request.json', payload)
              request = urllib.request.Request('http://127.0.0.1:11434' + path, data=data, headers={'Content-Type': 'application/json'})
              try:
                  response = client.open(request, timeout=timeout)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  raw = response.read(16777217)
                  require(len(raw) <= 16777216, 'native API response byte limit')
                  with (root / (label + '-response.json')).open('xb') as output:
                      output.write(raw)
                  save(label + '-http.json', {'status': response.status, 'response_bytes': len(raw), 'path': path})
                  require(response.status == 200, 'native API rejected compatibility request')
              return json.loads(raw, object_pairs_hook=unique, parse_constant=invalid_number)
          # Readiness waits precede the one embedding attempt; they cannot substitute a different model or endpoint.
          readiness = []
          for attempt in range(30):
              try:
                  version_raw = client.open('http://127.0.0.1:11434/api/version', timeout=2)
                  with version_raw:
                      raw = version_raw.read(16385)
                      require(version_raw.status == 200 and len(raw) <= 16384, 'invalid readiness response')
                  ready_version = json.loads(raw, object_pairs_hook=unique, parse_constant=invalid_number)
                  require(ready_version == {'version': '0.35.1'}, 'actual Ollama version drift')
                  readiness.append({'attempt': attempt + 1, 'outcome': 'ready'})
                  break
              except urllib.error.URLError as error:
                  readiness.append({'attempt': attempt + 1, 'outcome': type(error).__name__})
                  time.sleep(1)
          else:
              save('readiness.json', readiness)
              raise ValueError('bounded Ollama startup did not become ready')
          save('readiness.json', readiness)
          # A distinct encoder candidate follows the retained generator HTTP501; this is not a retry of that candidate.
          model = 'qwen3-embedding:8b'
          manifest_digest = '64b933495768fbd3b87c20583d379728a07471e0c66733a9df87cd1901b3c44b'
          def model_identity(label):
              require(api('/api/version', label + '-version') == {'version': '0.35.1'}, 'native version drift')
              tags = api('/api/tags', label + '-tags')
              require(type(tags) is dict and type(tags.get('models')) is list and len(tags['models']) == 1
                      and tags['models'][0]['name'] == model and tags['models'][0]['digest'] == manifest_digest, 'actual served model manifest drift')
              show = api('/api/show', label + '-show', {'model': model, 'verbose': True})
              require(type(show) is dict and type(show.get('model_info')) is dict and type(show.get('template')) is str, 'native show identity unavailable')
              require(type(show.get('details')) is dict and show['details'].get('format') == 'gguf'
                      and show['details'].get('family') == 'qwen3' and show['details'].get('quantization_level') == 'Q4_K_M', 'encoder details drift')
              require(type(show.get('capabilities')) is list and 'embedding' in show['capabilities'], 'encoder embedding capability metadata absent')
              info = show['model_info']
              require(info.get('general.architecture') == 'qwen3', 'encoder architecture drift')
              for key, expected in (('qwen3.embedding_length', 4096), ('qwen3.context_length', 40960),
                                    ('tokenizer.ggml.eos_token_id', 151643), ('tokenizer.ggml.eot_token_id', 151645)):
                  require(type(info.get(key)) is int and info[key] == expected, 'encoder metadata integer drift: ' + key)
              require(info.get('tokenizer.ggml.add_bos_token') is False and info.get('tokenizer.ggml.add_eos_token') is True,
                      'encoder special-token flag drift')
              require(type(info.get('tokenizer.ggml.tokens')) is list and len(info['tokenizer.ggml.tokens']) == 151665,
                      'encoder vocabulary cardinality drift')
              # No generator-template hash or unverified numeric pooling enum is applied to this encoder.
              # The complete original show/template/pooling fields are retained and compared before/after.
              return show
          before = model_identity('before')
          try:
              request = {'model': model, 'input': ['TEST preparation: water boils.', 'TEST preparation: a square has four sides.'],
                         'truncate': False, 'keep_alive': '60s', 'options': {'num_ctx': 4096, 'num_thread': 4, 'num_gpu': 0}}
              embeddings = api('/api/embed', 'embedding', request, timeout=600)
              require(type(embeddings) is dict and embeddings.get('model') == model
                      and type(embeddings.get('embeddings')) is list and len(embeddings['embeddings']) == 2, 'actual embedding cardinality/model mismatch')
              vectors = embeddings['embeddings']
              norms = []
              for vector in vectors:
                  require(type(vector) is list and len(vector) == 4096
                          and all(type(value) in (int, float) and math.isfinite(value) for value in vector), 'invalid actual embedding dimensions or values')
                  norm = math.sqrt(math.fsum(value * value for value in vector))
                  require(math.isfinite(norm) and norm > 0 and abs(norm - 1) <= 1e-3, 'actual embedding norm mismatch')
                  norms.append(norm)
              for name in ('total_duration', 'load_duration', 'prompt_eval_count'):
                  require(type(embeddings.get(name)) is int and embeddings[name] >= 0, 'missing actual embedding statistics')
              require(embeddings['prompt_eval_count'] > 0, 'actual embedding input count absent')
              blobs = [struct.pack('<4096f', *vector) for vector in vectors]
              rounded = [struct.unpack('<4096f', blob) for blob in blobs]
              native_schema_sql = 'CREATE VIRTUAL TABLE native USING vec0(embedding float[4096] distance_metric=cosine, chunk_size=16)'
              def stored_native_identity(db):
                  schema = db.execute("select sql from sqlite_schema where type='table' and name='native'").fetchall()
                  require(schema == [(native_schema_sql,)], 'stored native vector schema drift')
                  stored = db.execute('select rowid, embedding from native order by rowid').fetchall()
                  require(len(stored) == 2 and all(type(row[0]) is int for row in stored)
                          and [row[0] for row in stored] == [1, 2]
                          and all(type(row[1]) is bytes and row[1] == expected for row, expected in zip(stored, blobs)),
                          'stored native float32 vector identity drift')
                  return {'schema_sql': schema[0][0], 'stored_vectors': [
                      {'rowid': row[0], 'bytes': len(row[1]), 'sha256': hashlib.sha256(row[1]).hexdigest()} for row in stored]}
              def database_identity():
                  descriptor = os.open(database, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                  with os.fdopen(descriptor, 'rb') as stream:
                      before = os.fstat(stream.fileno())
                      require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1
                              and 0 < before.st_size <= 4194304, 'native database is not a bounded regular file')
                      digest, length = hashlib.sha256(), 0
                      while part := stream.read(65536):
