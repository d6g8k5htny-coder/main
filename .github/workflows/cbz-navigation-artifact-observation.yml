name: CBZ bounded navigation artifact observation
on:
  push:
    branches: [codex/cbz-architecture-observation-20261110]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Inspect actual navigation skip outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/navigation-artifact.zip"
          ulimit -f 8192
          curl --fail --silent --show-error --location --max-time 60 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' 'https://api.github.com/repos/d6g8k5htny-coder/main/actions/artifacts/13733993008/zip' --output "$archive"
          python3 -I -B -S - "$archive" <<'PY'
          import hashlib, json, pathlib, re, sys, zipfile
          path = pathlib.Path(sys.argv[1])
          if path.stat().st_size > 2 * 1024 * 1024: raise ValueError('archive bound')
          raw = path.read_bytes(); digest = hashlib.sha256(raw).hexdigest()
          if digest != '0e7d59f9e976f3da5f21415be6a691df8d853e2430f94dd7663d656b72eeac7b': raise ValueError('archive digest')
          with zipfile.ZipFile(path) as archive:
              entries = archive.infolist(); names = [x.filename for x in entries]
              if len(entries) > 1000 or len(names) != len(set(names)) or sum(x.file_size for x in entries) > 64 * 1024 * 1024: raise ValueError('archive population or size')
              if any(n.startswith('/') or '..' in n.split('/') or '\\' in n for n in names): raise ValueError('unsafe archive name')
              if archive.testzip() is not None: raise ValueError('archive CRC')
              def get(name):
                  found = [x for x in entries if x.filename == name or x.filename.endswith('/' + name)]
                  if len(found) != 1 or found[0].file_size > 32 * 1024 * 1024: raise ValueError('missing or ambiguous bounded member: ' + name)
                  return archive.read(found[0]).decode('utf-8')
              commit = get('commit.txt').strip()
              if commit != '8943bd095d8e99c27318b71c317957cccad700b6': raise ValueError('tested merge mismatch')
              log = get('tests-normal.log')
              summaries = re.findall(r'(?m)^Ran [0-9]+ tests? in [0-9.]+s$', log)
              footers = re.findall(r'(?m)^(?:OK|FAILED)(?: \([^\n]*\))?$', log)
              skipped = [line for line in log.splitlines() if ' ... skipped ' in line]
              if len(summaries) != 1 or len(footers) != 1: raise ValueError('ambiguous test summary')
              print(json.dumps({'run_id': 42751061652, 'artifact_id': 13733993008, 'sha256': digest, 'members': len(entries), 'crc': 'PASS', 'tested_merge': commit, 'summary': summaries[0], 'footer': footers[0], 'explicit_skip_lines': skipped}, sort_keys=True))
          PY
