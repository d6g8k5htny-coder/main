# Source-prepared controlled runtime acquisition; whole-workflow review required.
# Accepted contract341L/22030B SHA256819c2706b5e2c84e690bd4cbdde12e59283ca81ba29a3395a377da2f64dcc5d9.
# Unchanged reader contract883L SHA256bc93683536fb6e35724f6c54d4cac71c77910c9d9852a4434d7e09c082428795.
# Source-accepted consumer4258L/284394B SHA2560f2b24acfb4d3fdd1ffd6babbc332b5ee0bdb26f448db35c1bdffd5539f25acc.
# Consumer source accepted at307/6111811550; producer/consumer whole-join review pending.
# Rejected producer2011L/163034B SHA2565aabccfde05be36759a3aeeab43d6a041489fd016ccd98dd67aaba553a99b104 retained as inert history.
# Actual acquisition/probes/cleanup/custody NOT_RUN at this source freeze.
# TEST / public synthetic / source-exposed / organizational independence0.
# Scientific effect NONE; scientific-status authority false; custody UNKNOWN.
# An acquisition, syntax, import, sandbox or disposal failure is SETUP_BLOCKED.
# This producer earns no reader product or scientific acceptance.
name: Interface reader runtime preparation
'on':
  pull_request:
    paths:
      - .github/workflows/interface-reader-runtime-preparation.yml
      - docs/plans/2026-10-09-reader-runtime-preparation.md
      - docs/plans/2026-10-09-interface-reader-contract.md
      - tools/interface_browser_check.py
      - interface/package.json
      - interface/package-lock.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reader-runtime-preparation-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  preparation:
    name: interface-reader-runtime-preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      READER_PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Write fixed reviewed public preparation controllers and fixtures
        id: controllers
        env:
          READER_TRUSTED_CONTROL: ${{ runner.temp }}/reader-preparation-trusted-control
        run: |
          set -euo pipefail
          umask 077
          control="$READER_TRUSTED_CONTROL"
          mkdir -m 0700 "$control"
          mkdir -m 0700 "$control/fixture" "$control/fixture/src" "$control/fixture/src/pages"
          cat > "$control/bootstrap.py" <<'READER_OUTER_PY'
          #!/usr/bin/env python3
          """Fixed public outer launcher; syntax/setup failures are never behavioral RED."""
          import ast, base64, copy, datetime, hashlib, json, os, pathlib, re, selectors, signal, stat
          import subprocess, sys, time
          META={"schema_version":1,"scientific_effect":"NONE","scientific_status_authority":False}
          def controlled_signal(signum,frame):
              raise InterruptedError("NATIVE_CONTROLLER_SIGNAL")
          signal.signal(signal.SIGTERM,controlled_signal)
          signal.signal(signal.SIGINT,controlled_signal)
          PUBLIC=("RUNNER_TEMP","GITHUB_WORKSPACE","GITHUB_REPOSITORY","GITHUB_SHA",
                  "GITHUB_RUN_ID","GITHUB_RUN_ATTEMPT","GITHUB_OUTPUT","READER_TRUSTED_CONTROL","READER_PR_HEAD")
          env={"PATH":"/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin","LC_ALL":"C.UTF-8"}
          for name in PUBLIC:
              if name in os.environ:env[name]=os.environ[name]
          control=pathlib.Path(env["READER_TRUSTED_CONTROL"])
          fallback=pathlib.Path(env["RUNNER_TEMP"])/"reader-preparation-setup-originals"
          fallback.mkdir(mode=0o700);(fallback/"native").mkdir();(fallback/"sources").mkdir()
          admitted={};refused_writes=[]
          def sha(raw):return hashlib.sha256(raw).hexdigest()
          def enc(value):return (json.dumps(value,sort_keys=True,separators=(",",":"),allow_nan=False)+"\n").encode()
          def need(value,code):
              if not value:raise ValueError(code)
          def original(path,cap=2**20):
              path=pathlib.Path(path);need(path.is_absolute(),"OUTER_ABSOLUTE_ANCHOR")
              components=path.parts[1:];need(components and all(p not in ("",".","..") for p in components),"OUTER_COMPONENT")
              root=os.open("/",os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW);fd=None
              try:
                  for part in components[:-1]:
                      nxt=os.open(part,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW,dir_fd=root)
                      os.close(root);root=nxt
                  fd=os.open(components[-1],os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK,dir_fd=root)
                  before=os.fstat(fd);need(stat.S_ISREG(before.st_mode) and before.st_nlink==1 and before.st_size<=cap,"OUTER_REGULAR_SOURCE")
                  data=bytearray()
                  while len(data)<=cap:
                      part=os.read(fd,min(65536,cap+1-len(data)))
                      if not part:break
                      data.extend(part)
                  after=os.fstat(fd)
                  fields=("st_dev","st_ino","st_mode","st_nlink","st_size","st_mtime_ns","st_ctime_ns")
                  need(all(getattr(before,k)==getattr(after,k) for k in fields) and len(data)==before.st_size,"OUTER_SOURCE_DRIFT")
                  return bytes(data)
              finally:
                  if fd is not None:os.close(fd)
                  os.close(root)
          def put(name,raw):
              need(len(raw)<=4*2**20 and not name.startswith("/") and all(p not in ("",".","..") for p in name.split("/")),"OUTER_MEMBER")
              path=fallback/name
              try:
                  path.parent.mkdir(parents=True,exist_ok=True,mode=0o700)
                  fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
                  with os.fdopen(fd,"wb") as stream:stream.write(raw);stream.flush();os.fsync(stream.fileno())
                  need(original(path,4*2**20)==raw,"OUTER_READBACK")
              except BaseException:
                  refused_writes.append({"path":name,"status":"WRITE_OR_READBACK_REFUSED"});raise
              row={"path":name,"bytes":len(raw),"sha256":sha(raw)};admitted[name]=row;return row
          def capture_command(argv,env,seconds,capture_cap,stdin=None,on_stdout=None):
              """Bounded native capture: every spawned session gets a terminal observation."""
              started=time.monotonic_ns();deadline=time.monotonic()+seconds
              p=None;sel=selectors.DefaultSelector();out=bytearray();err=bytearray()
              timed=False;overflow=False;term=None;kill=None;reaped=False;problem=None
              term_at=None;kill_at=None;group_absent=True;pending=memoryview(stdin or b"")
              def absent():
                  if p is None:return True
                  try:os.killpg(p.pid,0);return False
                  except ProcessLookupError:return True
                  except OSError:return False
              def send(signum):
                  try:os.killpg(p.pid,signum);return 0
                  except ProcessLookupError:return 0
                  except OSError as exc:return -(exc.errno or 1)
              def drain(wait):
                  nonlocal pending,overflow,problem
                  for key,_ in sel.select(wait):
                      if key.data is None:
                          try:
                              size=os.write(key.fileobj.fileno(),pending[:65536]);pending=pending[size:]
                              if not pending:sel.unregister(key.fileobj);key.fileobj.close()
                          except OSError:
                              problem=problem or "STDIN_WRITE_REFUSED";sel.unregister(key.fileobj);key.fileobj.close()
                          continue
                      remaining=capture_cap-len(out)-len(err)
                      if remaining<=0:overflow=True;continue
                      try:raw=os.read(key.fileobj.fileno(),min(65536,remaining))
                      except OSError:
                          problem=problem or "STREAM_READ_REFUSED";sel.unregister(key.fileobj);continue
                      if not raw:sel.unregister(key.fileobj);continue
                      key.data.extend(raw)
                      if len(out)+len(err)==capture_cap:overflow=True
                      if on_stdout is not None and key.data is out:on_stdout(bytes(out))
              try:
                  p=subprocess.Popen(argv,env=env,stdin=subprocess.PIPE if stdin is not None else subprocess.DEVNULL,
                    stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True)
                  for stream,bucket in ((p.stdout,out),(p.stderr,err)):
                      os.set_blocking(stream.fileno(),False);sel.register(stream,selectors.EVENT_READ,bucket)
                  if stdin is not None:
                      os.set_blocking(p.stdin.fileno(),False)
                      if pending:sel.register(p.stdin,selectors.EVENT_WRITE,None)
                      else:p.stdin.close()
                  while sel.get_map() or p.poll() is None or not absent():
                      now=time.monotonic()
                      if (now>=deadline or overflow or problem is not None) and term_at is None:
                          timed=now>=deadline;term=send(signal.SIGTERM);term_at=now+10
                      if term_at is not None and now>=term_at and kill_at is None:
                          kill=send(signal.SIGKILL);kill_at=now+10
                      if kill_at is not None and now>=kill_at:break
                      drain(.05)
              except BaseException:
                  problem=problem or "COMMAND_CAPTURE_EXCEPTION"
              finally:
                  # An exception, signal failure, held pipe or deadline never bypasses the
                  # bounded final termination/reap attempt. Existing observed bytes remain.
                  if p is not None:
                      if p.poll() is None or not absent():
                          if term_at is None:term=send(signal.SIGTERM);term_at=time.monotonic()+10
                          final_deadline=kill_at if kill_at is not None else term_at+10
                          while time.monotonic()<final_deadline and (p.poll() is None or not absent()):
                              if time.monotonic()>=term_at and kill_at is None:
                                  kill=send(signal.SIGKILL);kill_at=time.monotonic()+10
                              try:drain(.05)
                              except BaseException:problem=problem or "FINAL_STREAM_CAPTURE_REFUSED"
                              if kill_at is not None and time.monotonic()>=kill_at:break
                      try:p.wait(timeout=1);reaped=True
                      except BaseException:problem=problem or "FINAL_REAP_UNCONFIRMED"
                      group_absent=absent()
                  for key in list(sel.get_map().values()):
                      try:sel.unregister(key.fileobj)
                      except BaseException:problem=problem or "SELECTOR_CLOSE_REFUSED"
                  try:sel.close()
                  except BaseException:problem=problem or "SELECTOR_CLOSE_REFUSED"
                  if p is not None:
                      for stream in (p.stdin,p.stdout,p.stderr):
                          if stream is not None:
                              try:stream.close()
                              except BaseException:problem=problem or "STREAM_CLOSE_REFUSED"
              uncertain=p is not None and (not reaped or not group_absent or (term is not None and term<0) or (kill is not None and kill<0))
              result={"exit_status":p.returncode if p is not None and reaped else None,
                "duration_ns":time.monotonic_ns()-started,"timed_out":timed,"overflow":overflow,
                "term_status":term,"kill_status":kill,"reaped":reaped and group_absent}
              return bytes(out),bytes(err),result,uncertain,problem
          events=[];count=0;writer_uncertain=False;journal_uncertain=False
          event_path=fallback/"native/outer-command-originals.jsonl"
          event_fd=os.open(event_path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          event_bytes=0
          def event(value):
              global event_bytes,journal_uncertain
              raw=enc(value);need(event_bytes+len(raw)<=4*2**20,"OUTER_RESERVED_JOURNAL_BOUND")
              try:
                  view=memoryview(raw)
                  while view:
                      size=os.write(event_fd,view);need(size>0,"OUTER_JOURNAL_SHORT_WRITE");view=view[size:]
                  os.fsync(event_fd);event_bytes+=len(raw);events.append(value)
              except BaseException:journal_uncertain=True;raise
          def command(argv,seconds):
              global count,writer_uncertain
              need(not writer_uncertain and not journal_uncertain,"OUTER_PREVIOUS_UNCERTAINTY")
              count+=1;ticket="outer/%04d"%count
              start={"event":"START","ticket":ticket,"argv":argv,"seconds":seconds,"stream_cap":1048576,
                     "started_at":datetime.datetime.now(datetime.timezone.utc).isoformat()}
              capture_cap=524288;reserve=8192+4*((capture_cap+2)//3)
              need(event_bytes+len(enc(start))+reserve<=4*2**20,"OUTER_JOURNAL_PREFLIGHT_REFUSED")
              event(start)
              out,err,result,uncertain,problem=capture_command(argv,env,seconds,capture_cap)
              # A disrupted privileged host may own separately enrolled child sessions.
              # Parent-session reap alone cannot certify those detached writers absent.
              writer_uncertain=writer_uncertain or uncertain or (host_started and
                  (result["timed_out"] or result["overflow"] or problem is not None))
              terminal={"event":"END","ticket":ticket,**result}
              for name,raw in (("stdout",out),("stderr",err)):
                  terminal[name+"_base64"]=base64.b64encode(raw).decode("ascii")
                  terminal[name+"_bytes"]=len(raw);terminal[name+"_sha256"]=sha(raw)
              event(terminal)
              if writer_uncertain:
                  path=pathlib.Path(env["RUNNER_TEMP"])/"reader-preparation-outer-uncertainty.json"
                  fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
                  with os.fdopen(fd,"wb") as stream:
                      stream.write(enc({**META,"ticket":ticket,"status":"SETUP_BLOCKED",
                                        "cleanup_collection_publication":"REFUSED"}));stream.flush();os.fsync(stream.fileno())
              return result["reaped"] and not result["timed_out"] and not result["overflow"] and not writer_uncertain and problem is None and result["exit_status"]==0
          def closed_inventory(root):
              root=pathlib.Path(root);fd=os.open("/",os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW)
              try:
                  for part in root.parts[1:]:
                      newer=os.open(part,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW,dir_fd=fd);os.close(fd);fd=newer
                  anchored=os.fstat(fd)
              finally:os.close(fd)
              need(stat.S_ISDIR(anchored.st_mode),"OUTER_SEAL_ROOT")
              files=[]
              def walk(directory,prefix=""):
                  for entry in sorted(os.scandir(directory),key=lambda x:x.name):
                      name=prefix+entry.name;st=entry.stat(follow_symlinks=False)
                      need(all(p not in ("",".","..") for p in name.split("/")),"OUTER_SEAL_COMPONENT")
                      if stat.S_ISDIR(st.st_mode):walk(entry.path,name+"/")
                      else:
                          raw=original(entry.path,256*2**20)
                          files.append({"path":name,"bytes":len(raw),"sha256":sha(raw)})
                          need(len(files)<=1024 and sum(r["bytes"] for r in files)<=512*2**20,"OUTER_SEAL_BOUND")
              walk(root)
              need((os.lstat(root).st_dev,os.lstat(root).st_ino)==(anchored.st_dev,anchored.st_ino),"OUTER_SEAL_ROOT_DRIFT")
              return sorted(files,key=lambda r:r["path"])
          def sealed_host_payload():
              global known_seal
              need(not writer_uncertain and not journal_uncertain and not refused_writes,"OUTER_WRITER_OR_JOURNAL_UNCERTAIN")
              root=pathlib.Path(env["RUNNER_TEMP"])/"reader-preparation"
              parent=os.lstat(root)
              need(stat.S_ISDIR(parent.st_mode) and parent.st_uid==0 and parent.st_gid==os.getgid()
                   and parent.st_mode&0o777==0o750,"NATIVE_SEALED_PARENT_READ_PERMISSION")
              seal_path=root/"publication-seal.json";st=os.lstat(seal_path)
              need(stat.S_ISREG(st.st_mode) and st.st_nlink==1 and st.st_uid==0 and st.st_mode&0o777==0o640,"NATIVE_ROOT_SEAL")
              seal_original=original(seal_path,2**20);seal=json.loads(seal_original)
              need(enc(seal)==seal_original,"CANONICAL_ROOT_SEAL_ORIGINAL")
              need(set(seal)==set(META)|{"status","publication","files","manifest_sha256","success","writer_uncertain"}
                   and all(seal[k]==v for k,v in META.items()) and seal["status"]=="SEALED"
                   and seal["writer_uncertain"] is False and type(seal["success"]) is bool,"CLOSED_HOST_SEAL")
              payload=pathlib.Path(seal["publication"])
              need(payload in (root/"initial",root/"publication"),"FIXED_SEALED_PUBLICATION")
              actual=closed_inventory(payload);manifest=original(payload/"ARTIFACT_SHA256SUMS",2**20)
              sealed_inventory(actual,seal["files"],manifest,seal["manifest_sha256"])
              known_seal=seal_original
              failure=None if seal["success"] else failed_host_collection(payload,parent,actual,seal["files"],manifest,seal["manifest_sha256"])
              return payload,seal["success"],seal["files"],seal_original,failure
          def literal_original(raw,row):
              need(len(raw)==row["bytes"] and sha(raw)==row["sha256"],"FAILED_ORIGINAL_LITERAL_JOIN")
          def sealed_inventory(actual,declared,manifest,digest):
              need(actual==declared,"OUTER_COMPLETE_SEAL_READBACK")
              need(sha(manifest)==digest and manifest==
                   b"".join((r["sha256"]+"  "+r["path"]+"\n").encode("ascii")
                            for r in actual if r["path"]!="ARTIFACT_SHA256SUMS"),"OUTER_SEAL_MANIFEST")
          FAILURE_JOURNALS=("native/command-originals.jsonl","native/admission-command-originals.jsonl")
          def failed_collection_admission(raw,journal,journal_origin,starts,ends,source_raw,source_row,actual,declared,manifest,digest):
              # The fixed predicates consume observed originals; control IDs select no predicate.
              literal_original(source_raw,source_row);sealed_inventory(actual,declared,manifest,digest)
              need(len(raw)<=16384,"CLOSED_HOST_FAILURE_DIAGNOSTIC");value=json.loads(raw)
              need(enc(value)==raw and set(value)==set(META)|{"status","diagnostic_kind","original_member",
                   "phase","reason_code","exception_class","command"} and all(value[k]==v for k,v in META.items())
                   and value["status"]=="SETUP_BLOCKED" and value["diagnostic_kind"]=="BOUNDED_PRIMARY_HOST_FAILURE"
                   and value["original_member"]=="native/host-failure.json","CLOSED_HOST_FAILURE_DIAGNOSTIC")
              need(value["phase"] in ("INITIALIZE","EXECUTE","DISPOSAL","POLICY_RECOVERY","COLLECTION",
                   "AFTER_IDENTITY","OBSERVATION_ADMISSION","FINAL_DISPOSAL","FINAL_STATUS",
                   "FINAL_ORIGINAL_SEAL","PUBLICATION_PERMISSION")
                   and re.fullmatch("[A-Z][A-Z0-9_]{0,95}",value["reason_code"])
                   and re.fullmatch("[A-Za-z_][A-Za-z0-9_]{0,63}",value["exception_class"]),"FAILURE_REASON_SCHEMA")
              need(len(starts)==1,"ACTUAL_HOST_COMMAND_SINGLETON")
              need(len(ends)==1 and ends[0]["reaped"] is True and ends[0]["timed_out"] is False
                   and ends[0]["overflow"] is False and type(ends[0]["exit_status"]) is int
                   and ends[0]["exit_status"]!=0,"ACTUAL_FAILED_HOST_TERMINAL")
              captured=base64.b64decode(ends[0]["stdout_base64"],validate=True)
              need(len(captured)==ends[0]["stdout_bytes"] and sha(captured)==ends[0]["stdout_sha256"]
                   and captured.splitlines(keepends=True).count(raw)==1,"ACTUAL_OUTER_FAILURE_CAPTURE_JOIN")
              command=value["command"]
              if command is None:need(journal_origin==FAILURE_JOURNALS[0] and journal==b"","FAILURE_WITHOUT_NATIVE_COMMAND")
              else:
                  need(set(command)=={"ticket","original_path","start","end","result","stdout","stderr"}
                       and journal_origin in FAILURE_JOURNALS and command["original_path"]==journal_origin,"FAILURE_COMMAND_SCHEMA")
                  pairs=[]
                  for line in journal.splitlines(keepends=True):
                      item=json.loads(line)
                      if item["ticket"]==command["ticket"]:pairs.append((item,line))
                  need(len(pairs)==2 and [r[0]["event"] for r in pairs]==["START","END"],"ACTUAL_FAILURE_COMMAND_PAIR")
                  for name,(_,line) in zip(("start","end"),pairs):
                      need(command[name]=={"bytes":len(line),"sha256":sha(line)},"FAILURE_EVENT_ORIGINAL_JOIN")
                  terminal=pairs[1][0]
                  need(terminal["stdout"]==journal_origin and terminal["stderr"]==journal_origin,"FAILURE_ACTUAL_JOURNAL_JOIN")
                  keys=("exit_status","duration_ns","timed_out","overflow","term_status","kill_status","reaped")
                  need(command["result"]=={k:terminal[k] for k in keys},"FAILURE_ACTUAL_RESULT_JOIN")
                  for name in ("stdout","stderr"):
                      stream=base64.b64decode(terminal[name+"_base64"],validate=True);prefix=stream[:1024]
                      need(len(stream)==terminal[name+"_bytes"] and sha(stream)==terminal[name+"_sha256"]
                           and command[name]=={"full_bytes":len(stream),"full_sha256":sha(stream),
                             "prefix_bytes":len(prefix),"prefix_base64":base64.b64encode(prefix).decode("ascii"),
                             "omitted_bytes":len(stream)-len(prefix)},"FAILURE_BOUNDED_PREFIX_JOIN")
              return value
          def failed_host_collection(payload,parent,actual,declared,manifest,digest):
              raw=original(payload/"native/host-failure.json",16384)
              selection=json.loads(raw);need(type(selection) is dict,"FAILURE_COMMAND_SCHEMA")
              selected=selection.get("command")
              need(selected is None or type(selected) is dict,"FAILURE_COMMAND_SCHEMA")
              journal_origin=FAILURE_JOURNALS[0] if selected is None else selected.get("original_path")
              need(journal_origin in FAILURE_JOURNALS,"FAILURE_COMMAND_SCHEMA")
              journal=original(payload/journal_origin,4*2**20)
              starts=[r for r in events if r["event"]=="START" and r["argv"][-2:]==[str(control/"host.py"),"--host"]]
              need(len(starts)==1,"ACTUAL_HOST_COMMAND_SINGLETON")
              ends=[r for r in events if r["event"]=="END" and r["ticket"]==starts[0]["ticket"]]
              source_name="sources/"+sources[0];source_row=admitted[source_name]
              source_raw=original(fallback/source_name,2**20)
              base={"raw":raw,"journal":journal,"journal_origin":journal_origin,"starts":starts,"ends":ends,"source_raw":source_raw,
                "source_row":source_row,"actual":actual,"declared":declared,"manifest":manifest,"digest":digest}
              value=failed_collection_admission(**base)
              # Calibrate on the unchanged actual failed seal before the five copied-data controls.
              positive={**META,"control_id":"FC01_actual_failed_seal_collection","status":"FAILED_ORIGINALS_READ_BACK",
                "preparation_status":"SETUP_BLOCKED","diagnostic":{"path":"native/host-failure.json","bytes":len(raw),"sha256":sha(raw)},
                "parent_uid":parent.st_uid,"parent_gid":parent.st_gid,"parent_mode":parent.st_mode&0o777,
                "ordinary_reader_uid":os.getuid(),"ordinary_reader_gid":os.getgid(),
                "outer_ticket":starts[0]["ticket"],"native_ticket":None if value["command"] is None else value["command"]["ticket"],
                "journal_origin":journal_origin,
                "runtime_ready":False,"control_credit":"NONE","custody":"UNKNOWN"}
              if value["command"] is None:
                  # Preserve a safe pre-command failure without inventing a native pair or control result.
                  skipped=[{"control_id":identifier,"status":"NOT_RUN","expected_reason":expected,
                    "observed_reason":"NO_NATIVE_COMMAND_ORIGINAL","changed_originals":[]} for identifier,expected in
                    (("FC02_changed_bounded_diagnostic","ACTUAL_OUTER_FAILURE_CAPTURE_JOIN"),
                     ("FC03_changed_event_original","FAILURE_EVENT_ORIGINAL_JOIN"),
                     ("FC04_changed_bounded_prefix","FAILURE_BOUNDED_PREFIX_JOIN"),
                     ("FC05_changed_source_original","FAILED_ORIGINAL_LITERAL_JOIN"),
                     ("FC06_changed_manifest_original","OUTER_SEAL_MANIFEST"))]
                  return positive,skipped,{}
              trials=[]
              trial=copy.deepcopy(base);changed=copy.deepcopy(value)
              changed["reason_code"]="CONTROL_CHANGED_REASON";trial["raw"]=enc(changed)
              trials.append(("FC02_changed_bounded_diagnostic","ACTUAL_OUTER_FAILURE_CAPTURE_JOIN",trial,{"raw":trial["raw"]}))
              trial=copy.deepcopy(base);lines=journal.splitlines(keepends=True)
              position=[i for i,line in enumerate(lines) if json.loads(line)["ticket"]==value["command"]["ticket"]
                        and json.loads(line)["event"]=="END"]
              need(len(position)==1,"ACTUAL_CONTROL_END_SINGLETON");item=json.loads(lines[position[0]])
