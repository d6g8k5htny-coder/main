                'full_image_layers': 'NOT_ARCHIVED', 'production_keys': 'NOT_ACCESSED', 'scientific_effect': 'NONE',
                'scientific_status_authority': False}, sort_keys=True, indent=2) + '\n').encode())
          if refused:
              raise ValueError('strict original evidence collection refused members')
          PY
