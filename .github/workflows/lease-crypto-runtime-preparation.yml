          write('collection.json', (json.dumps({'schema_version': 1, 'collector_copied_bytes': copied_bytes,
                'collector_copy_limit_bytes': 48 * 2**20, 'configured_publication_filesystem_capacity_bytes': 64 * 2**20,
                'publication_mount_observed': publication_mounted, 'actual_publication_filesystem': publication_identity,
                'copy_subtotal_excludes': ['preexisting_publication_members', 'installed-after.json', 'collection.json',
                                          'preparation_receipt', 'artifact_hash_list'], 'missing': sorted(set(missing)),
                'refused': sorted(set(refused)), 'installed_dependency_bytes':
