      - name: Collect bounded originals and independently bind installed bytes
        if: always()
        run: |
          set -euo pipefail
          docker() { command docker --config "$RUNNER_TEMP/lease-crypto-docker-config" "$@"; }
          for name in lease-crypto-installer lease-crypto-checker; do
