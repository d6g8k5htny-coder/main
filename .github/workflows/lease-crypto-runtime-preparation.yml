              except (OSError, ValueError):
                  refused.append(name)
          try:
              retain(work, 'installer-rejection.json', 'installer-rejection.json', 65536)
          except FileNotFoundError:
              pass
          except (OSError, ValueError):
              refused.append('installer-rejection.json')
          installed_archived = False
          try:
              before = json.loads((destination / 'installed-before.json').read_bytes())
              expected = json.loads((destination / 'wheel-inventory.json').read_bytes())
              rows = before['files']
              require(type(rows) is list and 0 < len(rows) <= 256 and len({row['path'] for row in rows}) == len(rows), 'installed inventory bounds')
              generated = {wheel['package'] + '-' + wheel['version'] + '.dist-info/' + name
                           for wheel in expected['wheels'] for name in ('INSTALLER', 'REQUESTED', 'direct_url.json')}
              require(set(expected['console_wrappers']) == {'bin/cffi-gen-src'}
                      and set(expected['wheel_files']) | set(expected['console_wrappers']) <= {row['path'] for row in rows}
                      and {row['path'] for row in rows} <= set(expected['wheel_files']) | generated | set(expected['console_wrappers']),
                      'unadmitted installed inventory paths')
              observed = []
              for row in rows:
                  require(type(row['bytes']) is int and 0 <= row['bytes'] <= 16 * 2**20, 'installed member size bounds')
                  with os.fdopen(anchored(deps, row['path']), 'rb') as stream:
                      info = os.fstat(stream.fileno())
                      require(stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size == row['bytes'], 'final installed member unsafe')
                      raw = stream.read(row['bytes'] + 1)
                  require(len(raw) == row['bytes'] and hashlib.sha256(raw).hexdigest() == row['sha256'], 'final installed bytes changed')
                  if row['path'] in expected['console_wrappers']:
                      require(raw == bytes.fromhex(expected['console_wrappers'][row['path']]['hex']), 'final exact cffi wrapper bytes drift')
                  observed.append(row)
              archive_rows = []
              with tarfile.open(destination / 'installed-deps.tar', 'r:') as archive:
                  for member in archive:
                      require(member.isfile() and member.name in {row['path'] for row in rows} and 0 <= member.size <= 16 * 2**20
                              and len(archive_rows) < 256, 'unadmitted installed archive member')
                      with archive.extractfile(member) as stream:
                          raw = stream.read(member.size + 1)
                      require(len(raw) == member.size, 'installed archive member size drift')
                      archive_rows.append({'path': member.name, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
