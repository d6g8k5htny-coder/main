          expected += ['envelope_canonical_bytes', 'envelope_signature_size', 'envelope_base64url', 'envelope_roundtrip', 'envelope_verify',
                       'envelope_changed_payload', 'envelope_wrong_domain', 'envelope_missing_domain', 'envelope_wrong_key', 'envelope_changed_signature']
          expected += ['signature_length_' + str(length) for length in (0, 1, 63, 65)] + ['signature_invalid_scalar']
          expected += [kind + '_key_length_' + str(length) for length in (31, 33) for kind in ('private', 'public')]
          children = json.loads((root / 'child-exits.json').read_bytes())
          require([row['mode'] for row in children] == ['normal', 'optimized'] and all(row['exit_code'] == 0 for row in children), 'actual normal/optimized child failure')
          installed = json.loads((root / 'installed-before.json').read_bytes())
          require(installed['installer_runtime'] == installer_runtime and installed['console_wrappers_executed'] is False
                  and installed['console_wrappers'] == json.loads((root / 'wheel-inventory.json').read_bytes())['console_wrappers'],
                  'retained installer runtime/wrapper expectation drift')
          before = installed['files']
          require(before == json.loads((root / 'installed-after.json').read_bytes())['files'], 'installed dependency identity drift')
          results = []
          for mode, optimization in (('normal', 0), ('optimized', 1)):
              result = json.loads((root / (mode + '-result.json')).read_bytes())
              runtime = json.loads((root / (mode + '-runtime.json')).read_bytes())
              progress = [json.loads(line) for line in (root / (mode + '-controls.jsonl')).read_text().splitlines()]
              require(result['mode'] == mode and result['optimize'] == optimization and result['controls'] == expected
                      and progress == [{'id': identifier, 'outcome': 'PASS'} for identifier in expected]
                      and result['installed_files'] == before and result['public_rfc_fixture_keys_only'] is True
                      and result['lease_protocol'] == 'NOT_IMPLEMENTED', 'actual exact compatibility inventory incomplete')
              require(runtime['mode'] == mode and runtime['optimize'] == optimization and runtime['ed25519_supported'] is True
                      and runtime['python'] == '3.11.14' and runtime['cryptography'] == '50.0.2' and runtime['cffi'] == '2.1.1'
                      and runtime['pycparser'] == '3.01' and runtime['distribution_versions'] == {'cryptography': '50.0.2', 'cffi': '2.1.1', 'pycparser': '3.1'}
                      and type(runtime['crypto_openssl_text']) is str and runtime['crypto_openssl_text']
                      and type(runtime['crypto_openssl_number']) is int and runtime['crypto_openssl_number'] > 0
                      and all(runtime[name] == result[name] for name in ('native_libraries', 'crypto_openssl_text', 'crypto_openssl_number',
                              'package_paths', 'distribution_versions', 'sqlite_version')), 'actual backend identity incomplete or changed')
              results.append(result)
          require(all(results[0][name] == results[1][name] for name in ('canonical_hex', 'domain_message_hex', 'envelope', 'envelope_wire_hex',
                  'native_libraries', 'crypto_openssl_text', 'crypto_openssl_number', 'package_paths', 'sqlite_version')), 'normal/optimized native or signing-byte drift')
          members = []
          for path in sorted(root.iterdir()):
              require(path.is_file() and not path.is_symlink(), 'unexpected publication member')
              raw = path.read_bytes()
              members.append({'path': path.name, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
          receipt = {'schema_version': 1, 'scope': 'public-ed25519-runtime-prerequisite', 'repository': os.environ['GITHUB_REPOSITORY'],
                     'checked_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'image_reference': reference, 'image_id': image['Id'], 'controls_per_mode': len(expected), 'modes': ['normal', 'optimized'],
                     'production_key_access': False, 'lease_protocol': 'NOT_IMPLEMENTED', 'lease_tests': 'NOT_RUN',
                     'installed_entrypoints': 'NOT_TOUCHED', 'full_image_layers': 'NOT_ARCHIVED', 'custody': 'unknown',
                     'scientific_effect': 'NONE', 'scientific_status_authority': False,
                     'final_disposition': 'REQUIRES_NATIVE_JOB_SUCCESS_AND_ORIGINAL_ARCHIVE_READBACK', 'members': members}
          (root / 'preparation-receipt.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          PY
      - name: Hash retained originals even after failure
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/lease-crypto-publish/payload"
          find . -type f ! -name ARTIFACT_SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > ARTIFACT_SHA256SUMS
      - name: Retain one original preparation or failure artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lease-crypto-runtime-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lease-crypto-publish/payload/
          if-no-files-found: error
          retention-days: 90
      - name: Release original bounded mount roots strictly after upload
        if: always()
        run: |
          set -euo pipefail
          status=0
          for label in deps control work publish; do
            directory="$RUNNER_TEMP/lease-crypto-$label"
            if mountpoint -q "$directory"; then
              if ! sudo umount "$directory"; then status=1; fi
            fi
          done
          exit "$status"
