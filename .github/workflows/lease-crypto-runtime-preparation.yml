              write('installed-after.json', (json.dumps({'schema_version': 1, 'files': observed}, sort_keys=True, indent=2) + '\n').encode())
              installed_archived = True
          except FileNotFoundError:
              missing.append('installed-after.json')
          except (OSError, ValueError, TypeError, KeyError, tarfile.TarError):
              refused.append('installed-after.json')
          publication_root = base / 'lease-crypto-publish'
          publication_mounted = os.path.ismount(publication_root)
          publication_identity = None
          if publication_mounted:
              mount_info = os.stat(publication_root, follow_symlinks=False)
              capacity = os.statvfs(publication_root)
              require(stat.S_ISDIR(mount_info.st_mode), 'publication mount root is not a directory')
              publication_identity = {'host_device': mount_info.st_dev,
