              members.append((control, 'wheels/' + filename, filename, 8 * 2**20))
          for name in ('installer-pip-version.txt', 'installer-runtime.json', 'pip-install-report.json', 'installed-before.json', 'child-exits.json', 'normal-runtime.json', 'optimized-runtime.json',
                       'normal-controls.jsonl', 'optimized-controls.jsonl', 'normal-result.json', 'optimized-result.json', 'installed-deps.tar'):
              members.append((work, name, name, 32 * 2**20 if name.endswith('.tar') else 2 * 2**20))
          for root, source, name, limit in members:
              try:
                  retain(root, source, name, limit)
              except FileNotFoundError:
