name: Lease crypto runtime preparation
'on':
  pull_request:
    paths:
      - .github/workflows/lease-crypto-runtime-preparation.yml
      - docs/plans/2026-10-08-lease-crypto-runtime-preparation.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lease-crypto-runtime-preparation-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  preparation:
    name: lease-crypto-runtime-preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: python:3.11.14-slim-bookworm@sha256:83f339c1be6340ae1096010fdccf6552ac932d8f410d45d206014916bdf37e48
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare only bounded disposable payload directories
        run: |
          set -euo pipefail
          publish="$RUNNER_TEMP/lease-crypto-publish/payload"
          mkdir -p "$publish" "$RUNNER_TEMP/lease-crypto-docker-config"
          chmod 0700 "$publish" "$RUNNER_TEMP/lease-crypto-docker-config"
          git rev-parse HEAD > "$publish/checked-commit.txt"
          printf '%s\n' "$GITHUB_REPOSITORY" > "$publish/repository.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$publish/run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$publish/run-attempt.txt"
          ruby -rpsych -e 'Psych.safe_load(File.read(ARGV.fetch(0)), aliases: false)' .github/workflows/lease-crypto-runtime-preparation.yml
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mv "$publish" "$RUNNER_TEMP/lease-crypto-initial-evidence"
          for label in deps control work publish; do
            directory="$RUNNER_TEMP/lease-crypto-$label"
            mkdir -p "$directory"
            truncate -s 64M "$RUNNER_TEMP/lease-crypto-$label.img"
            mkfs.ext4 -F "$RUNNER_TEMP/lease-crypto-$label.img" > "$RUNNER_TEMP/lease-crypto-initial-evidence/filesystem-$label.log" 2>&1
            options=loop,nodev,nosuid,noexec
            if [ "$label" = deps ]; then options=loop,nodev,nosuid; fi
            sudo mount -o "$options" "$RUNNER_TEMP/lease-crypto-$label.img" "$directory"
            # Leave root-owned ext4 metadata/lost+found untouched.
            sudo mkdir "$directory/payload"
            sudo chmod 0755 "$directory/payload"
            sudo chown "$(id -u):$(id -g)" "$directory/payload"
          done
          cp "$RUNNER_TEMP/lease-crypto-initial-evidence/"* "$publish/"
          chmod 0700 "$publish" "$RUNNER_TEMP/lease-crypto-work/payload"
          sudo chown 65532:65532 "$RUNNER_TEMP/lease-crypto-deps/payload" "$RUNNER_TEMP/lease-crypto-work/payload"
          mkdir "$RUNNER_TEMP/lease-crypto-control/payload/wheels"
          cp .github/workflows/lease-crypto-runtime-preparation.yml "$publish/checked-workflow.yml"
          cp docs/plans/2026-10-08-lease-crypto-runtime-preparation.md "$publish/checked-plan.md"
      - name: Acquire and verify exactly three public wheels without importing them
        run: |
          set -euo pipefail
          publish="$RUNNER_TEMP/lease-crypto-publish/payload"
          trap 'status=$?; printf "%s\n" "$status" > "$publish/acquisition-exit-status.txt"' EXIT
          wheels="$RUNNER_TEMP/lease-crypto-control/payload/wheels"
          fetch() {
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 120 --max-filesize "$3" "$1" -o "$wheels/$2"
          }
          fetch https://files.pythonhosted.org/packages/21/69/64cef1f702bf6657e0cc186ed1a2891d50d29fb41586b254e1c07adea261/cryptography-50.0.2-cp311-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl cryptography-50.0.2-cp311-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl 4719841
          fetch https://files.pythonhosted.org/packages/f7/a4/4399daaf8f7dfee9d7c3327fdb0426ee041cc63edc358b93911ceb2bfc7a/cffi-2.1.1-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.whl cffi-2.1.1-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.whl 217807
          fetch https://files.pythonhosted.org/packages/99/ce/b3ae9ee0324d991c860187be2a6ee436d27a3d02397eaddbb101ec901f3d/pycparser-3.1-py3-none-any.whl pycparser-3.1-py3-none-any.whl 48709
          python3 -I -B -S - <<'PY'
          import email.parser, hashlib, json, os, pathlib, stat, zipfile
          base = pathlib.Path(os.environ['RUNNER_TEMP'])
          control, publish = (base / ('lease-crypto-' + name) / 'payload' for name in ('control', 'publish'))
          pins = [('cryptography', '50.0.2', 'cryptography-50.0.2-cp311-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl', 4719841, '630ebfea3bf689d075f82316324ff7433dc447fe6bc1bfc76524b74b4a9567d2'),
                  ('cffi', '2.1.1', 'cffi-2.1.1-cp311-cp311-manylinux2014_x86_64.manylinux_2_17_x86_64.whl', 217807, '34e261f78cb6ceaaa36f42f2613f4380d94d9c759a9c73c769ee6e0247364632'),
                  ('pycparser', '3.1', 'pycparser-3.1-py3-none-any.whl', 48709, 'f09d358c840bd147b79e55f2bc494f18ea869dc897f5852a8f5766b74f787882')]
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          rows, licenses, installed = [], [], {}
          for package, version, filename, size, digest in pins:
              path = control / 'wheels' / filename
              info, raw = path.lstat(), path.read_bytes()
              require(stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and len(raw) == size
                      and hashlib.sha256(raw).hexdigest() == digest, 'fixed wheel byte pin mismatch')
              rows.append({'package': package, 'version': version, 'filename': filename, 'bytes': size, 'sha256': digest})
              dist = package + '-' + version + '.dist-info'
              with zipfile.ZipFile(path) as archive:
                  entries = archive.infolist()
                  require(len(entries) <= 256 and len({item.filename for item in entries}) == len(entries)
                          and sum(item.file_size for item in entries) <= 32 * 2**20, 'wheel member bounds')
                  for item in entries:
                      parts = pathlib.PurePosixPath(item.filename).parts
                      require(parts and all(part not in ('', '.', '..') for part in parts)
                              and not item.filename.startswith('/') and '\\' not in item.filename
                              and item.filename.isascii() and not stat.S_ISLNK(item.external_attr >> 16), 'unsafe pinned wheel member')
                      if item.is_dir():
                          continue
                      require(item.filename not in installed and item.file_size <= 16 * 2**20, 'wheel path collision or oversized member')
                      member = archive.read(item)
                      installed[item.filename] = {'bytes': len(member), 'sha256': hashlib.sha256(member).hexdigest()}
                  metadata = email.parser.BytesParser().parsebytes(archive.read(dist + '/METADATA'))
                  require(metadata['Name'] == package and metadata['Version'] == version, 'wheel metadata drift')
                  if package == 'cffi':
                      require(archive.read(dist + '/entry_points.txt') ==
                              b'[console_scripts]\ncffi-gen-src = cffi._cffi_gen_src:run\n\n[distutils.setup_keywords]\ncffi_modules = cffi.setuptools_ext:cffi_modules\n',
                              'fixed cffi entry point declaration drift')
                  else:
                      require(dist + '/entry_points.txt' not in installed, 'unexpected pinned wheel entry points')
                  license_files = metadata.get_all('License-File', [])
                  require(license_files and all('/' not in name and name not in ('', '.', '..') for name in license_files), 'missing bounded package licenses')
                  licenses.append({'package': package, 'version': version, 'expression': metadata.get('License-Expression'),
                                   'requires_dist': metadata.get_all('Requires-Dist', []),
                                   'members': [{'path': dist + '/licenses/' + name, **installed[dist + '/licenses/' + name]} for name in license_files]})
          # Exact pip24.0 vendored distlib template for the single pinned cffi console entry point.
          wrapper = (b'#!/usr/local/bin/python3\n'
                     b'# -*- coding: utf-8 -*-\nimport re\nimport sys\nfrom cffi._cffi_gen_src import run\n'
                     b"if __name__ == '__main__':\n"
                     b"    sys.argv[0] = re.sub(r'(-script\\.pyw|\\.exe)?$', '', sys.argv[0])\n"
                     b'    sys.exit(run())\n')
          console_wrappers = {'bin/cffi-gen-src': {'entry_point': 'cffi._cffi_gen_src:run', 'hex': wrapper.hex(),
                              'bytes': len(wrapper), 'sha256': hashlib.sha256(wrapper).hexdigest()}}
          inventory = {'schema_version': 1, 'wheels': rows, 'wheel_files': installed, 'console_wrappers': console_wrappers,
                       'wrapper_generator': {'pip_version': '24.0', 'python_executable': '/usr/local/bin/python3'},
                       'legal_approval': 'NOT_ASSESSED', 'image_component_licenses': 'NOT_ASSESSED',
                       'licenses': licenses, 'scientific_effect': 'NONE', 'scientific_status_authority': False}
          (control / 'wheel-inventory.json').write_text(json.dumps(inventory, sort_keys=True, indent=2) + '\n')
          (publish / 'wheel-inventory.json').write_text(json.dumps(inventory, sort_keys=True, indent=2) + '\n')
          (control / 'requirements.txt').write_text(''.join(package + '==' + version + ' --hash=sha256:' + digest + '\n' for package, version, _, _, digest in pins))
          PY
          (ulimit -f 2048; timeout --signal=TERM --kill-after=10s 180s docker --config "$RUNNER_TEMP/lease-crypto-docker-config" pull --platform linux/amd64 "$IMAGE") > "$publish/image-pull.log" 2>&1
          docker --config "$RUNNER_TEMP/lease-crypto-docker-config" image inspect "$IMAGE" > "$publish/runtime-image.json"
      - name: Write fixed offline installation and public compatibility controls
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/lease-crypto-control/payload"
          cat > "$control/install.py" <<'PY'
          import hashlib, json, pathlib, platform, stat, subprocess, sys, tarfile
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          require(sys.version_info[:3] == (3, 11, 14) and platform.system() == 'Linux' and platform.machine() == 'x86_64', 'installer runtime drift')
          version_command = [sys.executable, '-I', '-B', '-m', 'pip', '--isolated', '--disable-pip-version-check', '--version']
          version_path = pathlib.Path('/work/installer-pip-version.txt')
          with version_path.open('wb') as stream:
              subprocess.run(version_command, stdout=stream, stderr=subprocess.STDOUT, check=True, timeout=15)
          require(version_path.stat().st_size <= 4096, 'pip identity output bounds')
          version_text = version_path.read_text(encoding='ascii')
          identity = {'schema_version': 1, 'pip_version_command': version_command, 'pip_version_output': version_text,
                      'pip_version': version_text.split(' ', 2)[1] if version_text.startswith('pip ') else None,
                      'python_executable': sys.executable, 'python_executable_resolved': str(pathlib.Path(sys.executable).resolve()),
                      'python': platform.python_version(), 'system': platform.system(), 'machine': platform.machine(),
                      'scientific_effect': 'NONE', 'scientific_status_authority': False}
          pathlib.Path('/work/installer-runtime.json').write_text(json.dumps(identity, sort_keys=True, indent=2) + '\n')
          require(version_text == 'pip 24.0 from /usr/local/lib/python3.11/site-packages/pip (python 3.11)\n', 'actual pinned-image pip identity drift')
          require(sys.executable == '/usr/local/bin/python3' and identity['python_executable_resolved'] == '/usr/local/bin/python3.11'
                  and sys.executable.isascii() and ' ' not in sys.executable and len(sys.executable.encode('ascii')) + 3 <= 127,
                  'actual installer executable/simple Linux shebang drift')
          root = pathlib.Path('/deps')
          require(list(root.iterdir()) == [], 'dependency payload must start empty')
          command = [sys.executable, '-I', '-B', '-m', 'pip', '--isolated', '--disable-pip-version-check', 'install',
                     '--no-index', '--find-links=/wheels', '--only-binary=:all:', '--require-hashes', '--no-compile',
                     '--no-cache-dir', '--target=/deps', '--report=/work/pip-install-report.json', '-r', '/control/requirements.txt']
          subprocess.run(command, check=True, timeout=240)
          expected = json.loads(pathlib.Path('/control/wheel-inventory.json').read_bytes())
          require(expected['wrapper_generator'] == {'pip_version': identity['pip_version'], 'python_executable': sys.executable}
                  and set(expected['console_wrappers']) == {'bin/cffi-gen-src'}, 'fixed wrapper generator/declaration drift')
          generated = {package + '-' + version + '.dist-info/' + name
                       for package, version in (('cryptography', '50.0.2'), ('cffi', '2.1.1'), ('pycparser', '3.1'))
                       for name in ('INSTALLER', 'REQUESTED', 'direct_url.json')}
          allowed = set(expected['wheel_files']) | generated | set(expected['console_wrappers'])
          def member_require(condition, relative, predicate, info=None):
              if not condition:
                  detail = {'schema_version': 1, 'path': relative, 'predicate': predicate,
                            'mode': stat.S_IFMT(info.st_mode) if info is not None else None,
                            'links': info.st_nlink if info is not None else None,
                            'bytes': info.st_size if info is not None else None}
                  diagnostic = json.dumps(detail, ensure_ascii=True, sort_keys=True) + '\n'
                  require(len(diagnostic.encode('ascii')) <= 65536, 'installer rejection diagnostic bounds')
                  pathlib.Path('/work/installer-rejection.json').write_text(diagnostic, encoding='ascii')
                  raise ValueError('installed member refused: ' + diagnostic.rstrip('\n'))
          rows, total = [], 0
          for path in sorted(root.rglob('*')):
              info = path.lstat()
              relative = path.relative_to(root).as_posix()
              member_require(not stat.S_ISLNK(info.st_mode), relative, 'no-symlink', info)
              if stat.S_ISDIR(info.st_mode):
                  continue
              member_require(stat.S_ISREG(info.st_mode), relative, 'regular-file', info)
              member_require(info.st_nlink == 1, relative, 'single-link', info)
              member_require(info.st_size <= 16 * 2**20, relative, 'member-size-at-most-16MiB', info)
              member_require(relative in allowed, relative, 'closed-admitted-path-set', info)
              raw = path.read_bytes()
              row = {'path': relative, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
              total += len(raw)
              member_require(total <= 32 * 2**20 and len(rows) < 256, relative, 'total-at-most-32MiB-and-256-members', info)
              if relative in expected['wheel_files'] and not relative.endswith('.dist-info/RECORD'):
                  member_require({key: row[key] for key in ('bytes', 'sha256')} == expected['wheel_files'][relative],
                                 relative, 'original-wheel-member-bytes-sha256', info)
              if relative in expected['console_wrappers']:
                  wrapper = expected['console_wrappers'][relative]
                  member_require(raw == bytes.fromhex(wrapper['hex'])
                                 and {key: row[key] for key in ('bytes', 'sha256')} == {key: wrapper[key] for key in ('bytes', 'sha256')},
                                 relative, 'exact-pip24-cffi-wrapper-bytes', info)
              if relative in generated and relative.endswith('/INSTALLER'):
                  member_require(raw == b'pip\n', relative, 'exact-pip-INSTALLER-metadata', info)
              if relative in generated and relative.endswith('/REQUESTED'):
                  member_require(raw == b'', relative, 'empty-pip-REQUESTED-metadata', info)
              if relative.endswith('/direct_url.json'):
                  direct = json.loads(raw)
                  member_require(direct.get('url') in {'file:///wheels/' + wheel['filename'] for wheel in expected['wheels']},
                                 relative, 'admitted-installed-direct-URL', info)
              rows.append(row)
          member_require(set(expected['wheel_files']) | set(expected['console_wrappers']) <= {row['path'] for row in rows},
                         '<inventory>', 'all-original-wheel-files-and-exact-wrapper-present')
          result = {'schema_version': 1, 'files': rows, 'bytes': total, 'pip_command': command,
                    'installer_runtime': identity, 'console_wrappers': expected['console_wrappers'], 'console_wrappers_executed': False,
                    'public_dependencies_only': True, 'scientific_effect': 'NONE', 'scientific_status_authority': False}
          pathlib.Path('/work/installed-before.json').write_text(json.dumps(result, sort_keys=True, indent=2) + '\n')
          with tarfile.open('/work/installed-deps.tar', 'w', format=tarfile.PAX_FORMAT) as archive:
              for row in rows:
                  archive.add(root / row['path'], arcname=row['path'], recursive=False)
          PY
          cat > "$control/compatibility.py" <<'PY'
          import base64, hashlib, json, pathlib, platform, re, sqlite3, ssl, stat, sys
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          mode = sys.argv[1]
          require(mode in ('normal', 'optimized') and sys.flags.optimize == (0 if mode == 'normal' else 1)
                  and sys.flags.isolated == 1 and sys.flags.no_site == 1 and sys.dont_write_bytecode, 'actual child interpreter flags drift')
          require(sys.version_info[:3] == (3, 11, 14) and platform.system() == 'Linux' and platform.machine() == 'x86_64', 'compatibility runtime drift')
          # -I/-S ignore working-directory and environment package injection; only this frozen readonly tree is admitted.
          sys.path.insert(0, '/deps')
          import cryptography, cffi, pycparser, _cffi_backend, importlib.metadata
          from cryptography.exceptions import InvalidSignature
          from cryptography.hazmat.backends.openssl.backend import backend
          from cryptography.hazmat.bindings import _rust
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey, Ed25519PublicKey
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat
          # The fixed pycparser3.1 wheel exposes module.__version__ == '3.01'; record both exact identities.
          for module, version in ((cryptography, '50.0.2'), (cffi, '2.1.1'), (pycparser, '3.01')):
              require(module.__version__ == version and pathlib.Path(module.__file__).resolve().is_relative_to('/deps'), 'actual package version/path drift')
          distribution_versions = {distribution.metadata['Name']: distribution.version for distribution in importlib.metadata.distributions(path=['/deps'])}
          require(distribution_versions == {'cryptography': '50.0.2', 'cffi': '2.1.1', 'pycparser': '3.1'}, 'actual distribution set/version drift')
          ed25519_supported = backend.ed25519_supported()
          libraries = []
          for module, digest in ((_rust, 'a9d379995757480a31a7eebbfb2228af93becdedd205e3af0f60ba9648650404'),
                                 (_cffi_backend, '192828af4429c83d5cd92c40275ffd3c71459c3dc7a58e43cf4b5c346d78dc8e')):
              path = pathlib.Path(module.__file__).resolve()
              require(path.is_relative_to('/deps') and hashlib.sha256(path.read_bytes()).hexdigest() == digest, 'actual native library drift')
              libraries.append({'path': str(path), 'bytes': path.stat().st_size, 'sha256': digest})
          installed = json.loads(pathlib.Path('/work/installed-before.json').read_bytes())
          observed = []
          for path in sorted(pathlib.Path('/deps').rglob('*')):
              info = path.lstat()
              require(not stat.S_ISLNK(info.st_mode), 'runtime installed symlink')
              if stat.S_ISDIR(info.st_mode):
                  continue
              require(stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size <= 16 * 2**20, 'runtime installed member bounds')
              raw = path.read_bytes()
              observed.append({'path': path.relative_to('/deps').as_posix(), 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
          require(observed == installed['files'], 'actual readonly installed tree changed')
          root = pathlib.Path('/work')
          runtime = {'schema_version': 1, 'mode': mode, 'optimize': sys.flags.optimize, 'python': platform.python_version(),
                     'sqlite_version': sqlite3.sqlite_version, 'cryptography': cryptography.__version__, 'cffi': cffi.__version__,
                     'pycparser': pycparser.__version__, 'distribution_versions': distribution_versions,
                     'package_paths': {module.__name__: str(pathlib.Path(module.__file__).resolve()) for module in (cryptography, cffi, pycparser)},
                     'crypto_openssl_text': backend.openssl_version_text(), 'crypto_openssl_number': backend.openssl_version_number(),
                     'stdlib_ssl_openssl_text': ssl.OPENSSL_VERSION, 'native_libraries': libraries, 'ed25519_supported': ed25519_supported,
                     'scientific_effect': 'NONE', 'scientific_status_authority': False}
          (root / (mode + '-runtime.json')).write_text(json.dumps(runtime, sort_keys=True, indent=2) + '\n')
          require(ed25519_supported, 'actual backend does not support ordinary Ed25519')
          progress = root / (mode + '-controls.jsonl')
          completed = []
          def run(identifier, operation):
              try:
                  operation()
              except BaseException as error:
                  with progress.open('a') as stream:
                      stream.write(json.dumps({'id': identifier, 'outcome': 'FAIL', 'error_type': type(error).__name__}) + '\n')
                  raise
              completed.append(identifier)
              with progress.open('a') as stream:
                  stream.write(json.dumps({'id': identifier, 'outcome': 'PASS'}) + '\n')
          def equal(actual, expected):
              require(actual == expected, 'public expected-value mismatch')
          def rejects(error_type, operation):
              try:
                  operation()
              except error_type:
                  return
              raise ValueError('expected rejection did not occur')
          # RFC8032 section7.1 TEST1/2/3: these private seeds are PUBLIC NONPRODUCTION FIXTURES.
          vectors = [
              ('empty', '9d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60', 'd75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a', '',
               'e5564300c360ac729086e2cc806e828a84877f1eb8e5d974d873e065224901555fb8821590a33bacc61e39701cf9b46bd25bf5f0595bbe24655141438e7a100b'),
              ('one_byte', '4ccd089b28ff96da9db6c346ec114e0f5b8a319f35aba624da8cf6ed4fb8a6fb', '3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c', '72',
               '92a009a9f0d4cab8720e820b5f642540a2b27b5416503f8fb3762223ebdb69da085ac1e43e15996e458f3613d0f11d8c387b2eaeb4302aeeb00d291612bb0c00'),
              ('two_bytes', 'c5aa8df43f9f837bedb7442f31dcb7b166d38535076f094b85ce3a2e0b4458f7', 'fc51cd8e6218a1a38da47ed00230f0580816ed13ba3303ac5deb911548908025', 'af82',
               '6291d657deec24024827e69c3abe01a30ce548a284743a445e3680d7db5ac3ac18ff9b538d16f290ae67f760984dc6594a7c15e9716ed28dc027beceea1ec40a')]
          for name, seed, public, message, signature in vectors:
              private = Ed25519PrivateKey.from_private_bytes(bytes.fromhex(seed))
              key = Ed25519PublicKey.from_public_bytes(bytes.fromhex(public))
              data, signed = bytes.fromhex(message), bytes.fromhex(signature)
              run('rfc_' + name + '_public', lambda: equal(private.public_key().public_bytes(Encoding.Raw, PublicFormat.Raw), bytes.fromhex(public)))
              run('rfc_' + name + '_sign', lambda: equal(private.sign(data), signed))
              run('rfc_' + name + '_verify', lambda: equal(key.verify(signed, data), None))
              run('rfc_' + name + '_tampered_message', lambda: rejects(InvalidSignature, lambda: key.verify(signed, data + b'\x00')))
              damaged = bytes([signed[0] ^ 1]) + signed[1:]
              run('rfc_' + name + '_tampered_signature', lambda: rejects(InvalidSignature, lambda: key.verify(damaged, data)))
              other = Ed25519PublicKey.from_public_bytes(bytes.fromhex(vectors[1 if name == 'empty' else 0][2]))
              run('rfc_' + name + '_wrong_key', lambda: rejects(InvalidSignature, lambda: other.verify(signed, data)))
          # This preparation demonstration payload is NOT GrantPayload and has no lease authority.
          payload = {'schema_version': 1, 'key_id': 'TEST-RFC8032-1', 'purpose': 'TEST-crypto-runtime-preparation',
                     'scientific_effect': 'NONE', 'scientific_status_authority': False}
          canonical = json.dumps(payload, ensure_ascii=True, allow_nan=False, sort_keys=True, separators=(',', ':')).encode('ascii')
          expected = b'{"key_id":"TEST-RFC8032-1","purpose":"TEST-crypto-runtime-preparation","schema_version":1,"scientific_effect":"NONE","scientific_status_authority":false}'
          run('envelope_canonical_bytes', lambda: equal(canonical, expected))
          prefix = b'research-lease/v1\x00'
          private = Ed25519PrivateKey.from_private_bytes(bytes.fromhex(vectors[0][1]))
          key = Ed25519PublicKey.from_public_bytes(bytes.fromhex(vectors[0][2]))
          signature = private.sign(prefix + canonical)
          encoded = base64.urlsafe_b64encode(signature).rstrip(b'=').decode('ascii')
          run('envelope_signature_size', lambda: equal(len(signature), 64))
          run('envelope_base64url', lambda: require(len(encoded) == 86 and re.fullmatch('[A-Za-z0-9_-]{86}', encoded) is not None
              and base64.b64decode(encoded + '==', altchars=b'-_', validate=True) == signature, 'noncanonical fixture encoding'))
          envelope = {'payload': payload, 'signature_base64url': encoded}
          wire = json.dumps(envelope, ensure_ascii=True, allow_nan=False, sort_keys=True, separators=(',', ':')).encode('ascii')
          run('envelope_roundtrip', lambda: equal(json.loads(wire), envelope))
          run('envelope_verify', lambda: equal(key.verify(signature, prefix + canonical), None))
          run('envelope_changed_payload', lambda: rejects(InvalidSignature, lambda: key.verify(signature, prefix + canonical.replace(b'preparation', b'changed'))))
          run('envelope_wrong_domain', lambda: rejects(InvalidSignature, lambda: key.verify(signature, b'research-lease/v2\x00' + canonical)))
          run('envelope_missing_domain', lambda: rejects(InvalidSignature, lambda: key.verify(signature, canonical)))
          other = Ed25519PublicKey.from_public_bytes(bytes.fromhex(vectors[1][2]))
          run('envelope_wrong_key', lambda: rejects(InvalidSignature, lambda: other.verify(signature, prefix + canonical)))
          run('envelope_changed_signature', lambda: rejects(InvalidSignature, lambda: key.verify(bytes([signature[0] ^ 1]) + signature[1:], prefix + canonical)))
          for length in (0, 1, 63, 65):
              run('signature_length_' + str(length), lambda: rejects(InvalidSignature, lambda: key.verify(b'\x00' * length, prefix + canonical)))
          run('signature_invalid_scalar', lambda: rejects(InvalidSignature, lambda: key.verify(signature[:32] + b'\xff' * 32, prefix + canonical)))
          for length in (31, 33):
              run('private_key_length_' + str(length), lambda: rejects(ValueError, lambda: Ed25519PrivateKey.from_private_bytes(b'\x00' * length)))
              run('public_key_length_' + str(length), lambda: rejects(ValueError, lambda: Ed25519PublicKey.from_public_bytes(b'\x00' * length)))
          mapped = []
          paths = {line.split()[-1] for line in pathlib.Path('/proc/self/maps').read_text().splitlines()
                   if line.split() and line.split()[-1].startswith('/') and '.so' in line.split()[-1]}
          for name in sorted(paths):
              path = pathlib.Path(name).resolve()
              require(any(path.is_relative_to(directory) for directory in ('/deps', '/usr/lib', '/usr/local/lib'))
                      and path.is_file() and path.stat().st_size <= 64 * 2**20, 'unexpected loaded shared library path/size')
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  while chunk := stream.read(1048576):
                      digest.update(chunk)
              mapped.append({'path': str(path), 'bytes': path.stat().st_size, 'sha256': digest.hexdigest()})
          result = {'schema_version': 1, 'mode': mode, 'optimize': sys.flags.optimize, 'python': platform.python_version(),
                    'python_executable': str(pathlib.Path(sys.executable).resolve()), 'python_executable_sha256': hashlib.sha256(pathlib.Path(sys.executable).read_bytes()).hexdigest(),
                    'sqlite_version': sqlite3.sqlite_version, 'sqlite_compile_options': [row[0] for row in sqlite3.connect(':memory:').execute('pragma compile_options')],
                    'cryptography': cryptography.__version__, 'cffi': cffi.__version__, 'pycparser': pycparser.__version__,
                    'distribution_versions': distribution_versions,
                    'package_paths': {module.__name__: str(pathlib.Path(module.__file__).resolve()) for module in (cryptography, cffi, pycparser)},
                    'crypto_openssl_text': backend.openssl_version_text(), 'crypto_openssl_number': backend.openssl_version_number(),
                    'stdlib_ssl_openssl_text': ssl.OPENSSL_VERSION, 'native_libraries': libraries, 'mapped_shared_libraries': mapped,
                    'installed_files': observed, 'controls': completed, 'canonical_hex': canonical.hex(), 'domain_message_hex': (prefix + canonical).hex(),
                    'envelope': envelope, 'envelope_wire_hex': wire.hex(), 'public_rfc_fixture_keys_only': True,
                    'lease_protocol': 'NOT_IMPLEMENTED', 'scientific_effect': 'NONE', 'scientific_status_authority': False}
          (root / (mode + '-result.json')).write_text(json.dumps(result, sort_keys=True, indent=2) + '\n')
          PY
          cat > "$control/launch.py" <<'PY'
          import json, pathlib, subprocess, sys
          rows = []
          for mode in ('normal', 'optimized'):
              command = [sys.executable, '-I', '-B', '-S'] + (['-O'] if mode == 'optimized' else []) + ['/control/compatibility.py', mode]
              try:
                  status = subprocess.run(command, timeout=120).returncode
              except subprocess.TimeoutExpired:
                  status = 124
              rows.append({'mode': mode, 'command': command, 'exit_code': status})
              pathlib.Path('/work/child-exits.json').write_text(json.dumps(rows, sort_keys=True, indent=2) + '\n')
          if any(row['exit_code'] != 0 for row in rows):
              raise SystemExit(1)
          PY
          chmod -R a-w "$control"
