          sudo python3 -I -B -S - "$RUNNER_TEMP" "$(id -u)" "$(id -g)" <<'PY'
          import hashlib, json, os, pathlib, stat, sys, tarfile
          base = pathlib.Path(sys.argv[1])
          destination = base / 'lease-crypto-publish/payload'
          uid, gid = map(int, sys.argv[2:])
          copied_bytes, missing, refused = 0, [], []
          def require(condition, message):
              if not condition:
                  raise ValueError(message)
          require(0 <= uid < 2147483648 and 0 <= gid < 2147483648, 'collector owner bounds')
          def anchored(root, relative):
              descriptor = os.open(root, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  parts = relative.split('/')
                  require(all(part not in ('', '.', '..') for part in parts), 'unsafe source path')
                  for part in parts[:-1]:
                      child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=descriptor)
                      os.close(descriptor)
                      descriptor = child
                  return os.open(parts[-1], os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=descriptor)
              finally:
                  os.close(descriptor)
          def write(name, raw):
              require('/' not in name and name not in ('', '.', '..'), 'unsafe destination')
              directory = os.open(destination, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  file = os.open(name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600, dir_fd=directory)
                  try:
                      os.fchown(file, uid, gid)
                      with os.fdopen(file, 'wb', closefd=False) as stream:
                          stream.write(raw)
                  finally:
                      os.close(file)
              finally:
                  os.close(directory)
          def retain(root, source, name, limit):
              global copied_bytes
              file = anchored(root, source)
              with os.fdopen(file, 'rb') as stream:
                  info = os.fstat(stream.fileno())
                  require(stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size <= limit, 'unsafe original member')
                  raw = stream.read(limit + 1)
              copied_bytes += len(raw)
              require(len(raw) <= limit and copied_bytes <= 48 * 2**20, 'collector copy subtotal bounds')
              write(name, raw)
          initial = base / 'lease-crypto-initial-evidence'
          for name in ('checked-commit.txt', 'repository.txt', 'run-id.txt', 'run-attempt.txt',
                       'filesystem-deps.log', 'filesystem-control.log', 'filesystem-work.log', 'filesystem-publish.log'):
              if not (destination / name).exists():
                  try:
                      retain(initial, name, name, 65536)
                  except FileNotFoundError:
                      missing.append(name)
                  except (OSError, ValueError):
                      refused.append(name)
          control, work, deps = (base / ('lease-crypto-' + name) / 'payload' for name in ('control', 'work', 'deps'))
          members = [(control, name, 'control-' + name, 65536) for name in ('requirements.txt', 'wheel-inventory.json', 'install.py', 'compatibility.py', 'launch.py')]
          for filename in ('cryptography-50.0.2-cp311-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl',
