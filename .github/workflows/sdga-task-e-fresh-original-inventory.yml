# Read the one retained original artifact only; no E test, mutation or Lean replay.
name: Inventory retained fresh SDGA E original evidence

'on':
  push:
    branches: [codex/cbz-sdga-e-fresh-original-inventory-20261110]

permissions:
  contents: read
  actions: read

jobs:
  original-e-inventory:
    name: Inventory the fixed retained SDGA E artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify original API and ZIP custody and print bounded inventory
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I -B -S tools/cbz/sdga_task_e_fresh_original_inventory_20261110.py
      - name: Retain unchanged original archive and full reader observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdga-e-fresh-original-inventory-42827932735-1
          path: ${{ runner.temp }}/sdga-e-fresh-original-inventory-42827932735-1/
          if-no-files-found: error
          retention-days: 30
