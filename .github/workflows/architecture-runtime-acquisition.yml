          def validate_mounts(probe, host):
              text = probe['mountinfo']
              require(type(text) is str and 0 < len(text.encode('utf-8')) <= 65536,
                      'RP09 complete raw mountinfo')
              def path(value):
                  return re.sub(r'\\([0-7]{3})', lambda match: chr(int(match.group(1), 8)), value)
              def super_option(value, destination, filesystem):
                  if destination == '/' and filesystem == 'overlay' and value.startswith('lowerdir='):
                      lower_paths = value[len('lowerdir='):].split(':')
                      return len(value) <= 4096 and all(
                          lower.startswith('/') and '\x00' not in lower for lower in lower_paths)
                  return 0 < len(value) <= 256
              records = []
              for line in text.splitlines():
                  left, right = line.split(' - ', 1)
                  fields, backing = left.split(), right.split()
                  require(len(fields) >= 6 and len(backing) == 3, 'RP09 mountinfo framing')
                  require(re.fullmatch(r'[1-9][0-9]{0,9}', fields[0])
                          and re.fullmatch(r'[0-9]{1,10}', fields[1])
                          and re.fullmatch(r'[0-9]{1,10}:[0-9]{1,10}', fields[2])
                          and path(fields[4]).startswith('/') and 0 < len(path(fields[4])) <= 4096
                          and '\x00' not in path(fields[4]) and len(fields[6:]) <= 32
                          and all(0 < len(value) <= 256 for value in fields[5].split(','))
                          and all(super_option(value, path(fields[4]), backing[0])
                                  for value in backing[2].split(',')),
                          'RP09 typed complete mountinfo fields')
