          def refusal_controls(observation):
              cases = []
              def case(name, mutate):
                  cases.append((name, mutate))
              case('RP01_stale_run', lambda f: f['context'].update(run_id='0'))
              case('RP01_changed_source', lambda f: f['source_after'][SOURCES[1]].update(sha256='0' * 64))
              case('RP02_existing_container', lambda f: f.update(containers_before_empty=False))
              case('RP02_cached_image', lambda f: f.update(cached_image_present=True))
              case('RP03_missing_actual_mirror', lambda f: f.update(configured_mirrors=[]))
              case('RP03_changed_preserved_setting', lambda f: f['daemon_temporary']['data'].update(TEST_unapproved=True))
