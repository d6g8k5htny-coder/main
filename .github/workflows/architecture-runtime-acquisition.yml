                      'path': path(fields[4]), 'options': fields[5].split(','), 'optional': fields[6:],
                      'filesystem': backing[0], 'source': path(backing[1]), 'super_options': backing[2].split(',')})
              require(records == probe['mounts'] and 0 < len(records) <= 128
                      and len({item['id'] for item in records}) == len(records)
                      and len({item['path'] for item in records}) == len(records), 'RP09 exact complete parsed mounts')
              mounted = {item['path']: item for item in records}
              facts = probe['filesystem_facts']
              required = {'/', '/control/probe.py', '/tmp', '/dev', '/dev/pts', '/dev/shm', '/dev/mqueue',
                          '/proc', '/sys', '/sys/fs/cgroup', '/etc/hosts', '/etc/hostname', '/etc/resolv.conf'}
              require(required <= set(mounted) and set(facts) == set(mounted), 'RP09 all mountpoint facts')
              require('ro' in mounted['/']['options'] and mounted['/']['filesystem'] == 'overlay'
                      and 'ro' in mounted['/control/probe.py']['options']
                      and 'ro' in mounted['/sys']['options'] and mounted['/sys']['filesystem'] == 'sysfs'
                      and 'ro' in mounted['/sys/fs/cgroup']['options']
                      and mounted['/sys/fs/cgroup']['filesystem'] == 'cgroup2', 'RP09 read-only root/probe/sys/cgroup')
              null_paths = {'/proc/kcore', '/proc/keys', '/proc/timer_list', '/proc/interrupts',
                            '/proc/latency_stats', '/proc/sched_debug'}
              special = {'/tmp': ('tmpfs', {'rw', 'nosuid', 'nodev', 'noexec'}),
                         '/dev': ('tmpfs', {'rw', 'nosuid'}),
                         '/dev/pts': ('devpts', {'rw', 'nosuid', 'noexec'}),
                         '/dev/shm': ('tmpfs', {'rw', 'nosuid', 'nodev', 'noexec'}),
                         '/dev/mqueue': ('mqueue', {'rw', 'nosuid', 'nodev', 'noexec'}),
                         '/proc': ('proc', {'rw', 'nosuid', 'nodev', 'noexec'})}
              network_files = {'/etc/hosts', '/etc/hostname', '/etc/resolv.conf'}
              require(type(host['MaskedPaths']) is list and len(host['MaskedPaths']) <= 64,
                      'RP09 native masked-path inventory')
              for name, mount in mounted.items():
                  info = facts[name]
                  require(all(type(info[key]) is int and info[key] >= 0 for key in
                              ('uid', 'gid', 'mode', 'bytes', 'device', 'inode', 'rdev_major', 'rdev_minor', 'capacity_bytes'))
                          and all(type(info[key]) is bool for key in
