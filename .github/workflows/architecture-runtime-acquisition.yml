              ('run_id', 'GITHUB_RUN_ID'), ('run_attempt', 'GITHUB_RUN_ATTEMPT'))}
          core_commands = {
              'git-head', 'git-tree', 'git-contract', 'git-workflow', 'docker-version', 'docker-info-before',
              'containers-before', 'images-before', 'service-before', 'daemon-file-before', 'daemon-file-temporary',
              'restart-configured', 'docker-info-configured', 'service-configured', 'http-manifest', 'http-configuration',
              'pull', 'image-inspect', 'containers-recovery', 'daemon-file-after', 'restart-restored',
              'docker-info-restored', 'service-restored', 'containers-restored'}
          core_commands |= {prefix + '-' + str(mode) for mode in range(3)
                            for prefix in ('create', 'before', 'start', 'after', 'dispose-before', 'rm', 'absent')}
          optional_commands = {'daemon-file-failure-observation'} | {
              prefix + '-' + str(mode) for mode in range(3) for prefix in ('stop', 'discover', 'adopt')}
          fixed = {'context.json', 'daemon-admission-controls.json', 'contract.md', 'checked-workflow.yml', 'controller.py', 'probe.py',
                   'source-before.json', 'source-after.json', 'daemon-original.bytes', 'daemon-restored.bytes',
                   'manifest.headers', 'manifest.json', 'configuration.headers', 'configuration.json',
                   'set-request.json', 'restore-request.json'}
