name: Public runtime acquisition preparation
# Standalone preparation only. Existing producers, receipts and tests unchanged.
'on':
  pull_request:
    paths:
      - docs/plans/2026-10-09-public-runtime-acquisition.md
      - .github/workflows/architecture-runtime-acquisition.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-runtime-acquisition-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Write fixed trusted preparation sources
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/public-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 0700 "$base"
          mkdir -m 0700 "$base/control" "$base/originals" "$base/client"
          cat > "$base/control/probe.py" <<'PY'
          import _sqlite3, hashlib, json, os, pathlib, platform, re, resource, sqlite3, stat, sys
          def require(value, message):
              if not value:
                  raise ValueError(message)
          mode = int(sys.argv[1])
          require(mode in (0, 1, 2) and sys.flags.optimize == mode, 'actual optimization mismatch')
          os.umask(0o077)
          def binary(path):
              target = pathlib.Path(path).resolve(strict=True)
              fd = os.open(target, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  before = os.fstat(fd)
                  require(stat.S_ISREG(before.st_mode) and 0 < before.st_size <= 256 * 2**20,
                          'bundled binary size/type mismatch')
                  digest, count = hashlib.sha256(), 0
                  while True:
                      part = os.read(fd, 65536)
                      if not part:
                          break
                      count += len(part)
                      require(count <= 256 * 2**20, 'bundled binary growth')
                      digest.update(part)
                  after = os.fstat(fd)
                  require((before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns)
                          == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns)
                          and count == before.st_size, 'bundled binary changed')
                  return {'requested_path': str(path), 'path': str(target), 'bytes': count,
                          'sha256': digest.hexdigest()}
              finally:
                  os.close(fd)
          libraries = {'sqlite': set(), 'python': set()}
          for line in pathlib.Path('/proc/self/maps').read_text().splitlines():
              fields = line.split(None, 5)
              if len(fields) == 6 and fields[5].startswith('/'):
                  if '/libsqlite3.so' in fields[5]:
                      libraries['sqlite'].add(fields[5])
                  if '/libpython3.11.so' in fields[5]:
                      libraries['python'].add(fields[5])
          require(all(len(paths) == 1 for paths in libraries.values()), 'loaded library inventory')
          settings = {'journal_mode': 'delete', 'synchronous': 3, 'foreign_keys': 1,
                      'trusted_schema': 0, 'read_uncommitted': 0, 'busy_timeout': 1000}
          database = pathlib.Path('/tmp/preparation.sqlite3')
          require(not database.exists(), 'probe database was not fresh')
          connection = sqlite3.connect(database, timeout=1, isolation_level=None)
          try:
              for statement in ('PRAGMA journal_mode=DELETE', 'PRAGMA synchronous=EXTRA',
                                'PRAGMA foreign_keys=ON', 'PRAGMA trusted_schema=OFF',
                                'PRAGMA read_uncommitted=OFF', 'PRAGMA busy_timeout=1000'):
                  connection.execute(statement).fetchone()
              observed = {key: connection.execute('PRAGMA ' + key).fetchone()[0] for key in settings}
              connection.execute('CREATE TABLE preparation (id INTEGER PRIMARY KEY) STRICT')
              connection.execute('BEGIN IMMEDIATE')
              connection.execute('INSERT INTO preparation VALUES (1)')
              connection.rollback()
              rollback = connection.execute('SELECT count(*) FROM preparation').fetchone() == (0,)
              library_version = connection.execute('SELECT sqlite_version()').fetchone()[0]
              options = sorted(row[0] for row in connection.execute('PRAGMA compile_options'))
          finally:
              connection.close()
              database.unlink()
          mountinfo = pathlib.Path('/proc/self/mountinfo').read_text()
          require(len(mountinfo.encode()) <= 65536, 'full mountinfo bound')
          def mount_path(value):
              return re.sub(r'\\([0-7]{3})', lambda match: chr(int(match.group(1), 8)), value)
          mounts = []
          for line in mountinfo.splitlines():
              left, right = line.split(' - ', 1)
              fields, backing = left.split(), right.split()
              mounts.append({'id': fields[0], 'parent': fields[1], 'device': fields[2], 'root': mount_path(fields[3]),
                             'path': mount_path(fields[4]), 'options': fields[5].split(','), 'optional': fields[6:],
                             'filesystem': backing[0], 'source': mount_path(backing[1]), 'super_options': backing[2].split(',')})
          require(0 < len(mounts) <= 128, 'complete mount inventory bound')
          require(len({item['id'] for item in mounts}) == len(mounts)
                  and len({item['path'] for item in mounts}) == len(mounts), 'duplicate mount identity/path')
          filesystem_facts = {}
          for path in (item['path'] for item in mounts):
              info, capacity = os.lstat(path), os.statvfs(path)
              filesystem_facts[path] = {'uid': info.st_uid, 'gid': info.st_gid,
                  'mode': stat.S_IMODE(info.st_mode), 'regular': stat.S_ISREG(info.st_mode),
                  'directory': stat.S_ISDIR(info.st_mode), 'bytes': info.st_size,
                  'character': stat.S_ISCHR(info.st_mode), 'device': info.st_dev, 'inode': info.st_ino,
                  'symlink': stat.S_ISLNK(info.st_mode),
                  'effective_writable': os.access(path, os.W_OK, effective_ids=True, follow_symlinks=False),
                  'rdev_major': os.major(info.st_rdev), 'rdev_minor': os.minor(info.st_rdev),
                  'capacity_bytes': capacity.f_frsize * capacity.f_blocks}
          status = dict(line.split(':', 1) for line in pathlib.Path('/proc/self/status').read_text().splitlines()
                        if line.startswith(('CapEff:', 'NoNewPrivs:')))
          cgroup = {name: pathlib.Path('/sys/fs/cgroup', name).read_text().strip()
                    for name in ('memory.max', 'pids.max', 'cpu.max')}
          report = {
              'mode': mode, 'python_version': list(sys.version_info[:3]), 'python': sys.version,
              'sqlite_version': library_version, 'sqlite_version_info': list(sqlite3.sqlite_version_info),
              'sqlite_module_version': sqlite3.version, 'sql_settings': observed,
              'strict_table_created': True, 'rollback': rollback, 'compile_options': options,
              'flags': {'isolated': sys.flags.isolated, 'no_site': sys.flags.no_site,
                        'dont_write_bytecode': sys.dont_write_bytecode, 'optimize': sys.flags.optimize},
              'platform': sys.platform, 'machine': platform.machine(), 'uid': os.getuid(), 'gid': os.getgid(),
              'supplementary_groups': os.getgroups(),
              'executable': sys.executable, 'binaries': {
                  'python_executable': binary(sys.executable), 'sqlite_module': binary(sqlite3.__file__),
                  'sqlite_extension': binary(_sqlite3.__file__),
                  'loaded_sqlite_library': binary(next(iter(libraries['sqlite']))),
                  'loaded_python_library': binary(next(iter(libraries['python'])))},
              'proc_status': {key: value.strip() for key, value in status.items()}, 'cgroup': cgroup,
              'mountinfo': mountinfo, 'mounts': mounts, 'filesystem_facts': filesystem_facts,
              'tmpfs_bytes': os.statvfs('/tmp').f_frsize * os.statvfs('/tmp').f_blocks,
              'network_interfaces': sorted(os.listdir('/sys/class/net')),
              'network_route_lines': pathlib.Path('/proc/net/route').read_text().splitlines(),
              'fsize': list(resource.getrlimit(resource.RLIMIT_FSIZE)),
              'nofile': list(resource.getrlimit(resource.RLIMIT_NOFILE)),
              'msgqueue': list(resource.getrlimit(resource.RLIMIT_MSGQUEUE)),
              'publishing_environment_absent': not any(
                  name.startswith(('GITHUB_', 'GH_', 'AWS_', 'AZURE_', 'OPENAI_', 'ANTHROPIC_', 'GOOGLE_'))
                  for name in os.environ),
          }
          print(json.dumps(report, sort_keys=True, allow_nan=False))
          PY
          cat > "$base/control/controller.py" <<'PY'
          import base64, copy, datetime, hashlib, json, math, os, pathlib, re
          import selectors, signal, stat, subprocess, sys, tempfile, time
          MIB = 2**20
          IMAGE = 'python:3.11.14-slim-bookworm@sha256:83f339c1be6340ae1096010fdccf6552ac932d8f410d45d206014916bdf37e48'
          MANIFEST = '83f339c1be6340ae1096010fdccf6552ac932d8f410d45d206014916bdf37e48'
          CONFIG = '44d8f4434bcb025b8cb5c3151be689a906223e47cc3146971feccda936d2e82b'
          DIGEST = 'python@sha256:' + MANIFEST
          MIRROR = 'https://mirror.gcr.io'
          SOURCES = ['docs/plans/2026-10-09-public-runtime-acquisition.md',
                     '.github/workflows/architecture-runtime-acquisition.yml']
          CONTRACT_PIN = (22516, '72bdcf2b2374216f415fb6d86b84c2db25e7855caf0699bdfe2473336fb64bb7')
          SETTINGS = {'journal_mode': 'delete', 'synchronous': 3, 'foreign_keys': 1,
                      'trusted_schema': 0, 'read_uncommitted': 0, 'busy_timeout': 1000}
          BINARY_KEYS = {'python_executable', 'sqlite_module', 'sqlite_extension',
                         'loaded_sqlite_library', 'loaded_python_library'}
          SERVICE_ARGS = ['systemctl', 'show', 'docker', '--property=MainPID,ActiveState,SubState,Result,ExecMainCode,ExecMainStatus']
          LAYERS = [
              ('84a2afebaf4de2e8eb885634a69abd0087b79c947c53fa4f0481235d6dfadc6c', 28236279),
              ('0ca4ca8e967fc50bfed3e6bc1475579b5b3d1b72b17330364f0b8bb59ee23653', 3517381),
              ('4afda7e4a7673cf65d863abdb88d853796bf7fac06fabcd56f37de493f6b65e6', 15931402),
              ('bb97a7af197171e22da5f49bb0438bcf85be410ef8d48d967d1adf18cb633e5c', 249)]
          def require(value, message):
              if not value:
                  raise ValueError(message)
          def sha(raw):
              return hashlib.sha256(raw).hexdigest()
          def strict(raw):
              def pairs(items):
                  result = {}
                  for key, value in items:
                      require(key not in result, 'duplicate JSON key')
                      result[key] = value
                  return result
              def reject(value):
                  raise ValueError('non-finite JSON value')
              def finite(value):
                  number = float(value)
                  require(math.isfinite(number), 'non-finite JSON number')
                  return number
              return json.loads(raw.decode('utf-8'), object_pairs_hook=pairs,
                                parse_constant=reject, parse_float=finite)
          def encoded(value):
              return (json.dumps(value, sort_keys=True, indent=2, allow_nan=False) + '\n').encode('utf-8')
          def regular(path, limit=MIB):
              path = pathlib.Path(path)
              require(path.is_absolute(), 'absolute original path required')
              current = os.open(path.anchor, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              leaf = None
              try:
                  for part in path.parts[1:-1]:
                      nxt = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=current)
                      os.close(current)
                      current = nxt
                  leaf = os.open(path.name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=current)
                  before = os.fstat(leaf)
                  require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_size <= limit,
                          'original regular byte admission')
                  chunks, count = [], 0
                  while True:
                      part = os.read(leaf, min(65536, limit + 1 - count))
                      if not part:
                          break
                      chunks.append(part)
                      count += len(part)
                      require(count <= limit, 'original growth admission')
                  after = os.fstat(leaf)
                  require((before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns)
                          == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns)
                          and after.st_nlink == 1 and count == before.st_size, 'original changed while read')
                  return b''.join(chunks), {
                      'device': before.st_dev, 'inode': before.st_ino, 'bytes': count,
                      'uid': before.st_uid, 'gid': before.st_gid, 'mode': stat.S_IMODE(before.st_mode),
                      'sha256': sha(b''.join(chunks))}
              finally:
                  if leaf is not None:
                      os.close(leaf)
                  os.close(current)
          def public(value):
              forbidden = {'auth', 'auths', 'authorization', 'identitytoken', 'registrytoken', 'password',
                           'secret', 'token', 'credential', 'credentials', 'proxies', 'httpproxy',
                           'httpsproxy', 'http-proxy', 'https-proxy', 'proxy'}
              if type(value) is dict:
                  for key, item in value.items():
                      require(str(key).lower() not in forbidden or item in (None, '', [], {}, False),
                              'private credential/proxy setting is not admitted')
                      public(item)
              elif type(value) is list:
                  for item in value:
                      public(item)
              elif type(value) is str:
                  require(re.search(r'https?://[^/\s]*@', value, re.I) is None,
                          'credential-bearing URL is not admitted')
          def public_daemon(data):
              require(type(data) is dict, 'daemon object required')
              boolean = {'debug', 'live-restore', 'icc', 'iptables', 'ip6tables', 'ip-forward', 'ip-masq', 'userland-proxy'}
              allowed = boolean | {'mtu', 'log-level', 'default-runtime', 'storage-driver', 'data-root',
                                   'registry-mirrors', 'exec-opts', 'features', 'log-driver', 'log-opts'}
              require(set(data) <= allowed, 'unsupported daemon key: metadata-only refusal')
              public(data)
              for key, value in data.items():
                  if key in boolean:
                      require(type(value) is bool, 'daemon boolean type')
                  elif key == 'mtu':
                      require(type(value) is int and 68 <= value <= 65535, 'daemon mtu type/bound')
                  elif key == 'log-level':
                      require(value in ('debug', 'info', 'warn', 'error', 'fatal'), 'daemon log-level')
                  elif key == 'default-runtime':
                      require(value == 'runc', 'daemon default-runtime')
                  elif key == 'storage-driver':
                      require(value in ('overlay2', 'overlayfs', 'vfs', 'btrfs', 'zfs'), 'daemon storage-driver')
                  elif key == 'data-root':
                      require(type(value) is str and re.fullmatch(r'/[A-Za-z0-9_./-]{1,255}', value), 'daemon public data-root')
                  elif key == 'registry-mirrors':
                      require(type(value) is list and len(value) <= 16 and all(type(item) is str and
                              re.fullmatch(r'https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?/?', item) for item in value),
                              'daemon public mirror list')
                  elif key == 'exec-opts':
                      require(type(value) is list and len(value) <= 2 and all(
                              item in ('native.cgroupdriver=systemd', 'native.cgroupdriver=cgroupfs') for item in value),
                              'daemon closed exec options')
                  elif key == 'features':
                      require(type(value) is dict and set(value) <= {'buildkit', 'containerd-snapshotter'}
                              and all(type(item) is bool for item in value.values()), 'daemon closed feature options')
                  elif key == 'log-driver':
                      require(value in ('local', 'json-file', 'none'), 'daemon public log driver')
                  elif key == 'log-opts':
                      require(type(value) is dict and set(value) <= {'max-size', 'max-file', 'compress', 'mode', 'max-buffer-size'},
                              'unsupported nested daemon log option: metadata-only refusal')
                      for option, item in value.items():
                          require(type(item) is str, 'daemon log option string')
                          if option in ('max-size', 'max-buffer-size'):
                              require(re.fullmatch(r'[1-9][0-9]{0,8}[kKmMgG]?', item), 'daemon bounded log size')
                          elif option == 'max-file':
                              require(re.fullmatch(r'[1-9][0-9]{0,2}', item), 'daemon bounded log count')
                          elif option == 'compress':
                              require(item in ('true', 'false'), 'daemon log compression')
                          else:
                              require(item in ('blocking', 'non-blocking'), 'daemon log mode')
              return data
          def daemon_admission_controls():
              positive = {'log-driver': 'local', 'log-opts': {'max-size': '10m', 'max-file': '3'}}
              require(public_daemon(copy.deepcopy(positive)) == positive, 'synthetic public daemon positive')
              try:
                  public_daemon({'log-driver': 'local', 'log-opts': {'splunk-token': 'TEST_NOT_A_CREDENTIAL'}})
              except ValueError:
                  return {'origin': 'TEST_SYNTHETIC_DAEMON_ADMISSION', 'positive': 'PASS', 'nested_token': 'REFUSED'}
              raise ValueError('nested synthetic daemon credential accepted')
          def daemon():
              path = pathlib.Path('/etc/docker/daemon.json')
              try:
                  raw, metadata = regular(path, 65536)
              except FileNotFoundError:
                  return {'presence': False, 'metadata': None, 'raw_b64': '', 'data': {}, 'private': False}
              require(metadata['uid'] == 0 and metadata['mode'] & 0o022 == 0,
                      'daemon file ownership/mode refusal')
              try:
                  data = strict(raw)
                  require(type(data) is dict, 'daemon JSON must be an object')
                  public_daemon(data)
              except ValueError:
                  return {'presence': True, 'metadata': metadata, 'raw_b64': None, 'data': None, 'private': True}
              return {'presence': True, 'metadata': metadata, 'raw_b64': base64.b64encode(raw).decode('ascii'),
                      'data': data, 'private': False}
          def root_operation():
              require(os.geteuid() == 0, 'privileged daemon operation requires root')
              action = sys.argv[1]
              if action == '--daemon-observe':
                  require(len(sys.argv) == 2, 'unexpected daemon observation argument')
                  print(json.dumps(daemon(), sort_keys=True, allow_nan=False))
                  return
              require(action in ('--daemon-set', '--daemon-restore') and len(sys.argv) == 3,
                      'closed daemon operation refused')
              target = pathlib.Path(sys.argv[2])
              require(target == pathlib.Path(__file__).resolve().parent /
                      ('set.json' if action == '--daemon-set' else 'restore.json'), 'daemon control path refusal')
              request = strict(regular(target, MIB)[0])
              current = daemon()
              require(not current['private'] and current == request['expected'], 'daemon file changed before mutation')
              desired = request['desired']
              require(not desired['private'], 'private daemon content cannot be installed')
              directory = os.open('/etc/docker', os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              temporary = None
              try:
                  if desired['presence']:
                      raw = base64.b64decode(desired['raw_b64'], validate=True)
                      public_daemon(strict(raw))
                      require(len(raw) <= 65536 and sha(raw) == desired['metadata']['sha256'],
                              'daemon payload byte identity mismatch')
                      descriptor, temporary = tempfile.mkstemp(prefix='.public-runtime-', dir='/etc/docker')
                      with os.fdopen(descriptor, 'wb') as stream:
                          stream.write(raw)
                          stream.flush()
                          os.fsync(stream.fileno())
                          os.fchown(stream.fileno(), desired['metadata']['uid'], desired['metadata']['gid'])
                          os.fchmod(stream.fileno(), desired['metadata']['mode'])
                      os.replace(temporary, '/etc/docker/daemon.json')
                      temporary = None
                  else:
                      require(action == '--daemon-restore' and current['presence'], 'absence restoration refusal')
                      os.unlink('daemon.json', dir_fd=directory)
                  os.fsync(directory)
              finally:
                  if temporary is not None:
                      os.unlink(temporary)
                  os.close(directory)
              print(json.dumps(daemon(), sort_keys=True, allow_nan=False))
          if len(sys.argv) > 1:
              root_operation()
              raise SystemExit(0)
          ROOT = pathlib.Path(__file__).resolve().parents[1]
          OUT, CONTROL, CLIENT = ROOT / 'originals', ROOT / 'control', ROOT / 'client'
          context = {key: os.environ[name] for key, name in (
              ('repository', 'GITHUB_REPOSITORY'), ('checked_commit', 'GITHUB_SHA'),
              ('run_id', 'GITHUB_RUN_ID'), ('run_attempt', 'GITHUB_RUN_ATTEMPT'))}
          command_records, saved, refused, owned, disposed, disposal_attempted = {}, {}, [], {}, {}, set()
          total = 0
          facts, changed, temporary_daemon, baseline = {}, False, None, None
          mutation_attempted, desired, attempted_containers = False, None, {}
          phase_deadline = time.monotonic() + 720
          physical_recovery = False
          def save(name, raw, limit=MIB):
              global total
              require(re.fullmatch(r'[A-Za-z0-9_.-]+', name) and type(raw) is bytes, 'closed original name/type')
              require(name not in saved and len(raw) <= limit and len(saved) < 256
                      and total + len(raw) <= 30 * MIB, 'retained original inventory bound with seal reserve')
              path = OUT / name
              descriptor = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(descriptor, 'wb') as stream:
                  stream.write(raw)
              saved[name] = {'bytes': len(raw), 'sha256': sha(raw)}
              total += len(raw)
          def public_stream(raw):
              require(re.search(rb'https?://[^/\s]*@', raw, re.I) is None,
                      'credential-bearing command output not admitted')
              stripped = raw.strip()
              if stripped.startswith((b'{', b'[')):
                  try:
                      document = strict(stripped)
                  except ValueError:
                      documents = [strict(line) for line in stripped.splitlines()]
                      require(documents, 'empty JSON-lines observation')
                      for document in documents:
                          public(document)
                  else:
                      public(document)
              if stripped.startswith(b'HTTP/'):
                  header = stripped.partition(b'\r\n\r\n')[0]
                  for line in header.split(b'\r\n')[1:]:
                      key = line.partition(b':')[0].lower()
                      require(key not in (b'location', b'set-cookie', b'authorization',
                                          b'proxy-authorization', b'www-authenticate'),
                              'private/redirect HTTP header is not admitted')
          def command(name, argv, timeout=30, limit=MIB):
              require(name not in command_records, 'command may be attempted only once')
              requested_timeout = timeout
              timeout = min(timeout, max(0, phase_deadline - time.monotonic()))
              require(timeout > 0, 'reserved preparation/recovery time budget exhausted')
              started = time.monotonic_ns()
              buffers = {'stdout': bytearray(), 'stderr': bytearray()}
              process, selector, error, complete, timed_out, code = None, selectors.DefaultSelector(), None, True, False, None
              termination = {'term_attempted': False, 'kill_attempted': False, 'reaped': None, 'errors': []}
              try:
                  process = subprocess.Popen(argv, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE, start_new_session=True,
                      env={'PATH': '/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin',
                           'LANG': 'C.UTF-8', 'TZ': 'UTC', 'DOCKER_CONFIG': str(CLIENT)})
                  for stream, label in ((process.stdout, 'stdout'), (process.stderr, 'stderr')):
                      os.set_blocking(stream.fileno(), False)
                      selector.register(stream, selectors.EVENT_READ, label)
                  deadline = time.monotonic() + timeout
                  while selector.get_map():
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          timed_out = True
                          raise TimeoutError('bounded native command timed out')
                      for key, _ in selector.select(min(remaining, 0.2)):
                          part = os.read(key.fileobj.fileno(), 65536)
                          if not part:
                              selector.unregister(key.fileobj)
                              key.fileobj.close()
                              continue
                          room = limit - len(buffers[key.data])
                          buffers[key.data].extend(part[:room])
                          require(len(part) <= room, 'native original stream exceeded bound')
                  code = process.wait(timeout=max(0.01, deadline - time.monotonic()))
              except BaseException as exc:
                  complete, error = False, type(exc).__name__
                  timed_out = timed_out or isinstance(exc, (TimeoutError, subprocess.TimeoutExpired))
              finally:
                  try:
                      if process is not None and process.poll() is None:
                          termination['term_attempted'] = True
                          try:
                              os.killpg(process.pid, signal.SIGTERM)
                          except ProcessLookupError:
                              pass
                          except BaseException as exc:
                              termination['errors'].append('TERM:' + type(exc).__name__)
                          try:
                              process.wait(timeout=4)
                          except subprocess.TimeoutExpired:
                              termination['kill_attempted'] = True
                              try:
                                  os.killpg(process.pid, signal.SIGKILL)
                              except ProcessLookupError:
                                  pass
                              except BaseException as exc:
                                  termination['errors'].append('KILL:' + type(exc).__name__)
                              try:
                                  process.wait(timeout=1)
                              except BaseException as exc:
                                  termination['errors'].append('REAP:' + type(exc).__name__)
                          except BaseException as exc:
                              termination['errors'].append('WAIT:' + type(exc).__name__)
                      termination['reaped'] = None if process is None else process.poll() is not None
                  except BaseException as exc:
                      termination['errors'].append('CLEANUP:' + type(exc).__name__)
                      termination['reaped'] = False
                  if process is not None:
                      code = process.returncode
                      for stream in (process.stdout, process.stderr):
                          try:
                              if stream is not None and not stream.closed:
                                  stream.close()
                          except BaseException as exc:
                              termination['errors'].append('PIPE_CLOSE:' + type(exc).__name__)
                  try:
                      selector.close()
                  except BaseException as exc:
                      termination['errors'].append('SELECTOR_CLOSE:' + type(exc).__name__)
                  if termination['reaped'] is not True or termination['errors']:
                      complete = False
                      error = error or 'TerminationOrCleanupUncertainty'
              record = {'argv': argv, 'attempts': 1, 'code': code, 'complete': complete,
                        'timed_out': timed_out, 'error_type': error, 'timeout_seconds': timeout,
                        'declared_timeout_seconds': requested_timeout,
                        'termination': termination, 'process_created': process is not None,
                        'process_unreaped': process is not None and termination['reaped'] is not True,
                        'stream_limit_bytes': limit, 'duration_ns': str(time.monotonic_ns() - started)}
              command_records[name] = record
              process_complete = complete and code == 0
              for label, value in buffers.items():
                  raw = bytes(value)
                  try:
                      public_stream(raw)
                      save(name + '.' + label, raw, limit)
                      record[label] = saved[name + '.' + label]
                  except (OSError, ValueError) as exc:
                      record[label] = None
                      record[label + '_capture_error_type'] = type(exc).__name__
