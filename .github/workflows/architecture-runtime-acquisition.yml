              for path in root.iterdir():
                  if path.name not in allowed:
                      refused.append({'path': path.name[:128], 'reason': 'UNDECLARED_ORIGINAL_NAME'})
          for name in sorted(allowed):
              try:
                  limit = 4 * MIB if name in ('pull.stdout', 'pull.stderr') else MIB
                  if name in ('daemon-original.bytes', 'daemon-restored.bytes', 'manifest.headers',
                              'manifest.json', 'configuration.headers', 'configuration.json'):
                      limit = 65536
                  retain(name, read(root / name, limit))
              except FileNotFoundError:
                  if name in required or name in ('preparation-observations.json', 'semantic-controls.json', 'preparation-result.json'):
                      missing.append(name)
              except (OSError, ValueError) as exc:
                  refused.append({'path': name, 'reason': type(exc).__name__})
          # Exact source/context fallbacks retain useful originals even when the
          # hosted parser or controller never started. They cannot grant ACCEPT.
          collector_sources = {}
          for source, name in (
              (pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'docs/plans/2026-10-09-public-runtime-acquisition.md', 'contract.md'),
              (pathlib.Path(os.environ['GITHUB_WORKSPACE']) / '.github/workflows/architecture-runtime-acquisition.yml', 'checked-workflow.yml'),
              (base / 'control/controller.py', 'controller.py'), (base / 'control/probe.py', 'probe.py')):
              try:
                  raw = read(source, MIB)
                  collector_sources[name] = {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
                  if name in bytes_by_name and bytes_by_name[name] != raw:
                      raise ValueError('source original changed before seal')
                  if name not in bytes_by_name:
                      retain(name, raw)
              except (OSError, ValueError) as exc:
                  refused.append({'path': name, 'reason': type(exc).__name__})
          if 'context.json' not in bytes_by_name:
              retain('context.json', (json.dumps(native, sort_keys=True, indent=2) + '\n').encode())
          result = json.loads(bytes_by_name.get('preparation-result.json', b'{"status":"SETUP_BLOCKED"}'))
          bound = result.get('available_originals', {})
          original_members = {item['path']: {'bytes': item['bytes'], 'sha256': item['sha256']} for item in members}
          status = result['status']
          if (status != 'ACCEPTED_PREPARATION' or result.get('context') != native or missing or refused
                  or set(original_members) != set(bound) | {'preparation-result.json'}
                  or any(original_members.get(name) != record for name, record in bound.items())):
              status = 'SETUP_BLOCKED'
          collection = {
              'schema_version': 1, 'native_context': native, 'status': status,
              'required_originals': sorted(required | {'preparation-observations.json', 'semantic-controls.json', 'preparation-result.json'}),
              'missing': sorted(missing), 'refused': refused, 'copied': members,
              'source_observations_at_seal': collector_sources, 'admitted_original_bytes': total,
              'closed_original_inventory': True, 'source_fallbacks_cannot_grant_preparation_acceptance': True}
          collection_raw = (json.dumps(collection, sort_keys=True, indent=2) + '\n').encode()
          if len(collection_raw) > MIB or total + len(collection_raw) > 32 * MIB:
              raise ValueError('collection metadata/original total capacity')
          with (destination / 'collection.json').open('xb') as stream:
              stream.write(collection_raw)
          members.append({'path': 'collection.json', 'bytes': len(collection_raw), 'sha256': hashlib.sha256(collection_raw).hexdigest()})
          total += len(collection_raw)
          receipt = {'schema_version': 1, 'status': status, 'native_context': native, 'originals': members,
                     'original_bytes': total, 'original_count': len(members),
                     'receipt_is_preparation_only': True, 'acquisition_origin': 'USED_UNKNOWN',
                     'docker_hub_fallback': 'USED_UNKNOWN', 'scientific_effect': 'NONE',
                     'scientific_status_authority': False, 'organizational_independence': 0,
                     'custody_authentication': 'UNKNOWN',
                     'native_job_archive_hash_and_original_copy_readback': 'REQUIRED_AFTER_JOB'}
          raw = (json.dumps(receipt, sort_keys=True, indent=2) + '\n').encode()
          if len(raw) > MIB:
              raise ValueError('preparation receipt size')
          with (destination / 'receipt.json').open('xb') as stream:
              stream.write(raw)
          rows = [item['sha256'] + '  ' + item['path'] + '\n' for item in sorted(members, key=lambda item: item['path'])]
          rows.append(hashlib.sha256(raw).hexdigest() + '  receipt.json\n')
          manifest = ''.join(rows).encode()
          if len(manifest) > MIB or total + len(raw) + len(manifest) > 36 * MIB:
              raise ValueError('whole upload capacity')
          with (destination / 'ARTIFACT_SHA256SUMS').open('xb') as stream:
              stream.write(manifest)
          if status != 'ACCEPTED_PREPARATION':
              raise SystemExit(1)
          PY
      - name: Retain bounded originals even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-runtime-originals-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-runtime-${{ github.run_id }}-${{ github.run_attempt }}/publish/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Remove only owned preparation client and control files
        if: always()
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/public-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -I -B -S - "$base" <<'PY'
          import os, pathlib, stat, sys
          root = pathlib.Path(sys.argv[1])
          count = 0
          def remove(directory, depth=0):
              global count
              info = directory.lstat()
              if depth > 8 or not stat.S_ISDIR(info.st_mode) or info.st_uid != os.getuid():
                  raise ValueError('owned cleanup directory admission')
              for path in directory.iterdir():
                  count += 1
                  if count > 256:
                      raise ValueError('owned cleanup inventory bound')
                  info = path.lstat()
                  if info.st_uid != os.getuid():
                      raise ValueError('owned cleanup identity')
                  if stat.S_ISDIR(info.st_mode):
                      remove(path, depth + 1)
                  elif stat.S_ISREG(info.st_mode) and info.st_nlink == 1:
                      path.unlink()
                  else:
                      raise ValueError('owned cleanup file admission')
              directory.rmdir()
          for name in ('client', 'control'):
              directory = root / name
              if not directory.exists():
                  continue
              remove(directory)
          PY
