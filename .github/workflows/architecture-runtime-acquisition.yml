              case('RP06_mirror_prefixed_digest', lambda f: f['image'].update(RepoDigests=['mirror.gcr.io/library/python@sha256:' + MANIFEST]))
              case('RP06_extra_digest', lambda f: f['image'].update(RepoDigests=[DIGEST, 'mirror.gcr.io/library/python@sha256:' + MANIFEST]))
              case('RP06_wrong_image_platform', lambda f: f['image'].update(Id='sha256:' + '0' * 64, Architecture='arm64'))
