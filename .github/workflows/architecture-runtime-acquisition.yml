              return value
          def service(name):
              raw = command(name, SERVICE_ARGS)
              fields = dict(line.split('=', 1) for line in raw.decode('utf-8').splitlines())
              require(set(fields) == {'MainPID', 'ActiveState', 'SubState', 'Result', 'ExecMainCode', 'ExecMainStatus'}
                      and fields['ActiveState'] == 'active' and fields['SubState'] == 'running'
                      and fields['MainPID'].isdigit() and int(fields['MainPID']) > 0, 'actual Docker service state')
              return fields
