              records = {}
              for source, name in zip(SOURCES, ('contract.md', 'checked-workflow.yml')):
                  raw, metadata = regular(pathlib.Path(os.environ['GITHUB_WORKSPACE']) / source)
                  records[source] = {'bytes': len(raw), 'sha256': sha(raw)}
              for name in ('controller.py', 'probe.py'):
                  raw, metadata = regular(CONTROL / name)
                  records[name] = {'bytes': len(raw), 'sha256': sha(raw)}
              return records
          def metadata(label, url, media, size, digest):
              output = command('http-' + label, ['curl', '--disable', '--silent', '--show-error', '--fail',
                  '--proto', '=https', '--connect-timeout', '10', '--max-time', '20', '--max-filesize', '65536',
                  '--max-redirs', '0', '--dump-header', '-', '--header', 'Accept: ' + media, url], timeout=30)
              header, separator, raw = output.partition(b'\r\n\r\n')
              require(separator and re.fullmatch(rb'HTTP/[0-9.]+ 200[^\r\n]*', header.split(b'\r\n')[0]),
                      'public metadata HTTP status/redirect refusal')
              pairs = [line.split(b':', 1) for line in header.split(b'\r\n')[1:]]
              require(all(len(pair) == 2 for pair in pairs), 'public metadata header framing')
              headers = {}
              for key, value in pairs:
                  key, value = key.decode('ascii').lower(), value.strip().decode('ascii')
                  require(key not in headers and key not in ('set-cookie', 'authorization', 'proxy-authorization'),
                          'public metadata header admission')
                  headers[key] = value
              require(len(raw) == size and sha(raw) == digest and len(raw) <= 65536,
                      'public metadata original bytes differ from immutable pin')
              require(headers.get('content-length') == str(size), 'public metadata content length')
              if label == 'manifest':
                  require(headers.get('content-type', '').split(';')[0] == media
                          and headers.get('docker-content-digest') == 'sha256:' + digest,
                          'public manifest transport identity')
              else:
                  require(type(headers.get('content-type')) is str and headers['content-type'],
                          'public config transport media type must be observed')
              save(label + '.headers', header + separator, 65536)
              save(label + '.json', raw, 65536)
              return {'url': url, 'headers': headers, 'bytes': len(raw), 'sha256': sha(raw), 'data': strict(raw)}
          def labels(mode):
              return {'org.public-runtime.checked-commit': context['checked_commit'],
