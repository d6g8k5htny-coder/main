              if len(members) >= 250 or total + len(raw) > 31 * MIB:
                  raise ValueError('seal original reserve')
              with (destination / name).open('xb') as stream:
                  stream.write(raw)
              total += len(raw)
              members.append({'path': name, 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
              bytes_by_name[name] = raw
