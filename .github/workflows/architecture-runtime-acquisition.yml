              'recovery-not-needed.json', 'preparation-observations.json', 'semantic-controls.json', 'preparation-result.json'}
          members, missing, refused, bytes_by_name, total = [], [], [], {}, 0
          def read(path, limit):
              current = os.open(path.anchor, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              leaf = None
              try:
                  for part in path.parts[1:-1]:
                      nxt = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=current)
                      os.close(current)
                      current = nxt
                  leaf = os.open(path.name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=current)
                  before = os.fstat(leaf)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_size > limit:
                      raise ValueError('original artifact type/size')
                  raw = b''
                  while True:
                      part = os.read(leaf, min(65536, limit + 1 - len(raw)))
                      if not part:
                          break
                      raw += part
                      if len(raw) > limit:
                          raise ValueError('original artifact growth')
                  after = os.fstat(leaf)
                  if (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns) != (
                      after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns
                  ) or after.st_nlink != 1 or len(raw) != before.st_size:
                      raise ValueError('original artifact changed')
