name: Formal trace parser contract tests

'on':
  push:
    branches: [codex/g5-formal-r1-evidence-readback-20261110]

permissions:
  contents: read

jobs:
  targeted:
    name: Formal trace parser contracts (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Observe only the new behavioral contracts from this checked source
        timeout-minutes: 10
        env:
          FORMAL_TRACE_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          python3 -I -B -S - "$RUNNER_TEMP" "$GITHUB_WORKSPACE" <<'PY'
          import hashlib, json, os, pathlib, re, signal, stat, subprocess, sys
          root = pathlib.Path(sys.argv[2]).resolve()
          mode = os.environ["FORMAL_TRACE_MODE"]
          if mode not in ("normal", "optimized"):
              raise ValueError("unknown formal trace mode")
          run_id, attempt = os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]
          if not all(re.fullmatch(r"[1-9][0-9]*", value) for value in (run_id, attempt)):
              raise ValueError("invalid native run identity")
          temporary = pathlib.Path(sys.argv[1])
          if (not temporary.is_absolute() or temporary != temporary.resolve(strict=True)
                  or temporary.is_symlink() or temporary.is_relative_to(root)):
              raise ValueError("output is not genuine external RUNNER_TEMP")
          out = pathlib.Path(sys.argv[1]) / ("formal-trace-parser-contract-" + mode + "-" + run_id + "-" + attempt)
          out.mkdir(mode=0o700, exist_ok=False)
          protected = {
              ".github/workflows/research-architecture.yml": "69ad3b47537ab8e4f8936affa3e09fccbdcfd1e5",
              "tools/unittest_timing_probe.py": "05fb481b5538c3f517174b00948de45d2849387a",
              "tools/architecture_run_receipt.py": "a6062afa9261958b8d8b85853a9c43031385b2c1",
              "architecture/graph_artifact_readback.py": "c39ffd0fdcde1fd5f895c57df5f770a582918a8a",
              "tools/architecture_check_binding.py": "53ea34e4fffc1087770584744939904844a41cff",
              "tools/unittest_full_qualification.py": "02dc2f3222aaf3e3d4d024659fffff22d6fb5e66",
              "tests/test_unittest_full_qualification.py": "2fe09abce9a8ef9356fd0af85780dcde75179386",
              ".github/workflows/full-unittest-qualification.yml": "ff8226cdeea57ee2ddb41c58c8c93e644343557d",
          }
          def write(name, value):
              with (out / name).open("x", encoding="ascii", newline="\n") as stream:
                  json.dump(value, stream, sort_keys=True, ensure_ascii=True, allow_nan=False)
                  stream.write("\n")
          def git(*args):
              environment = {key: value for key, value in os.environ.items() if not key.startswith("GIT_")}
              environment.update(GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL=os.devnull,
                                 GIT_OPTIONAL_LOCKS="0")
              return subprocess.check_output(
                  ["git", "--no-replace-objects", "-c", "core.fsmonitor=false",
                   "-c", "core.hooksPath=/dev/null", "-C", str(root), *args], env=environment)
          def source():
              head = git("rev-parse", "--verify", "HEAD").decode("ascii").strip()
              tree = git("rev-parse", "--verify", "HEAD^{tree}").decode("ascii").strip()
              if head != os.environ["GITHUB_SHA"]:
                  raise ValueError("checked HEAD differs from native GITHUB_SHA")
              if pathlib.Path(git("rev-parse", "--show-toplevel").decode().strip()).resolve() != root:
                  raise ValueError("source is not the actual Git top-level")
              rows = []
              for item in git("ls-tree", "-r", "--full-tree", "-z", head).split(b"\0"):
                  if not item:
                      continue
                  metadata, raw_path = item.split(b"\t", 1)
                  mode_bits, kind, blob = metadata.decode("ascii").split()
                  relative = raw_path.decode("utf-8")
                  path = root / relative
                  info = path.lstat()
                  if kind != "blob" or mode_bits not in ("100644", "100755") or not stat.S_ISREG(info.st_mode):
                      raise ValueError("non-regular tracked source: " + relative)
                  if bool(info.st_mode & stat.S_IXUSR) != (mode_bits == "100755"):
                      raise ValueError("changed source executable mode: " + relative)
                  raw = path.read_bytes()
                  actual_blob = hashlib.sha1(b"blob " + str(len(raw)).encode("ascii") + b"\0" + raw).hexdigest()
                  if actual_blob != blob or (relative in protected and blob != protected[relative]):
                      raise ValueError("changed tracked/protected source: " + relative)
                  rows.append(dict(path=relative, mode=mode_bits, git_blob=blob,
                                   bytes=len(raw), sha256=hashlib.sha256(raw).hexdigest()))
              if set(protected) - {row["path"] for row in rows}:
                  raise ValueError("missing protected source")
              untracked = git("ls-files", "--others", "--exclude-standard", "-z")
              ignored = git("ls-files", "--others", "--ignored", "--exclude-standard", "-z")
              if untracked or ignored:
                  raise ValueError("unexpected untracked or ignored checkout input")
              return dict(repository=os.environ["GITHUB_REPOSITORY"], checked_commit=head,
                          checked_tree=tree, run_id=run_id, run_attempt=attempt, files=rows)
          record = dict(scope="FORMAL_TRACE_PARSER_CONTRACTS_ONLY", mode=mode,
                        full_discovery_run=False, architecture_run=False, g5_claim=False, cbz_claim=False)
          before = None
          process = None
          try:
              before = source()
              write("source-before.json", before)
              command = [sys.executable, "-B"] + (["-O"] if mode == "optimized" else [])
              command += ["-S", "-m", "unittest", "discover", "-s", "tests",
                          "-p", "test_formal_trace_reanalysis.py", "-v"]
              environment = dict(os.environ)
              for name in ("PYTHONHOME", "PYTHONOPTIMIZE"):
                  environment.pop(name, None)
              environment.update(PYTHONDONTWRITEBYTECODE="1", PYTHONNOUSERSITE="1")
              record["command"] = command
              record["cwd"] = str(root)
              with (out / "stdout.bin").open("xb") as stdout, (out / "stderr.bin").open("xb") as stderr:
                  process = subprocess.Popen(command, cwd=root, env=environment, stdout=stdout,
                                             stderr=stderr, start_new_session=True)
                  try:
                      code = process.wait(timeout=480)
                      record["timed_out"] = False
                  except subprocess.TimeoutExpired:
                      record["timed_out"] = True
                      os.killpg(process.pid, signal.SIGTERM)
                      try:
                          process.wait(timeout=10)
                      except subprocess.TimeoutExpired:
                          os.killpg(process.pid, signal.SIGKILL)
                          process.wait(timeout=10)
                      code = process.returncode
              record["native_exit_code"] = code
              after = source()
              write("source-after.json", after)
              record["source_unchanged"] = before == after
              text = (out / "stderr.bin").read_bytes().decode("utf-8", errors="replace")
              methods = (
                  "test_01_frozen_genuine_whole_line_identity",
                  "test_02_all_six_genuine_open_roles_and_read_neighbors",
                  "test_03_genuine_interleaving_pair_provenance_and_excerpt_gaps",
                  "test_04_synthetic_flags_are_read_only_from_the_flags_operand",
                  "test_05_synthetic_dual_path_and_symlink_content_roles",
                  "test_06_synthetic_relative_fd_and_cwd_context_is_explicit",
                  "test_07_synthetic_pairs_never_borrow_or_reuse_a_half",
                  "test_08_synthetic_escaping_brackets_and_malformed_syntax",
                  "test_09_synthetic_native_failed_mutations_never_disappear",
                  "test_10_synthetic_local_provenance_and_input_refusals",
                  "test_11_synthetic_source_and_record_ceilings_are_honest",
                  "test_12_synthetic_serialized_and_pending_growth_ceiling",
              )
              owner = "test_formal_trace_reanalysis.FormalTraceReanalysisContract."
              expected_ids = [owner + method for method in sorted(methods)]
              observed_ids, bad_results, malformed_results = [], [], []
              for line in text.splitlines():
                  if " ... " not in line and not line.startswith("test"):
                      continue
                  result = re.fullmatch(r"(\S+) \(([^()]*)\) \.\.\. (.+)", line)
                  if result is None:
                      malformed_results.append(line)
                      continue
                  short, identity, disposition = result.groups()
                  observed_ids.append(identity)
                  if short != identity.rsplit(".", 1)[-1] or disposition != "ok":
                      bad_results.append(line)
              summaries = re.findall(
                  r"^Ran ([1-9][0-9]*) tests? in [0-9]+(?:\.[0-9]+)?s$", text, re.M)
              nonempty = [line for line in text.splitlines() if line.strip()]
              record["expected_parent_ids"] = expected_ids
              record["observed_parent_ids"] = observed_ids
              record["bad_result_lines"] = bad_results
              record["malformed_result_lines"] = malformed_results
              record["reported_test_count"] = int(summaries[0]) if len(summaries) == 1 else None
              record["exact_parent_results"] = (
                  observed_ids == expected_ids and not bad_results and not malformed_results
                  and len(summaries) == 1 and int(summaries[0]) == len(expected_ids))
              record["terminal_ok"] = bool(nonempty and nonempty[-1] == "OK")
              accepted = (code == 0 and before == after and not record["timed_out"]
                          and record["exact_parent_results"] and record["terminal_ok"])
              record["outcome"] = "PASS" if accepted else "FAIL"
          except Exception as error:
              record["outcome"] = "FAIL"
              record["controller_error"] = type(error).__name__ + ": " + str(error)
          finally:
              if process is not None and process.poll() is None:
                  os.killpg(process.pid, signal.SIGKILL)
                  process.wait(timeout=10)
              for name in ("stdout.bin", "stderr.bin"):
                  path = out / name
                  if path.is_file():
                      raw = path.read_bytes()
                      record[name] = dict(bytes=len(raw), sha256=hashlib.sha256(raw).hexdigest())
              streams = [(name, (out / name).read_bytes()) for name in ("stdout.bin", "stderr.bin")
                         if (out / name).is_file()]
              marker = os.urandom(32).hex()
              while any(marker.encode("ascii") in raw for _, raw in streams):
                  marker = os.urandom(32).hex()
              visible, frames = 0, []
              for name in ("stdout.bin", "stderr.bin"):
                  path = out / name
                  if not path.is_file():
                      frames.append(("TRACE_CONTRACT_STREAM_NOT_PRODUCED " + name + "\n").encode("ascii"))
                      continue
                  raw = path.read_bytes()
                  full = visible + len(raw) <= 3 * 1024 * 1024 // 2
                  try:
                      raw.decode("utf-8", errors="strict")
                  except UnicodeError:
                      full = False
                  frame = dict(mode=mode, name=name, original_bytes=len(raw),
                               sha256=hashlib.sha256(raw).hexdigest(),
                               full_original_printed=full, printed_original_bytes=len(raw) if full else 0,
                               framing_newline_after=bool(full and raw and not raw.endswith(b"\n")))
                  frames.append(b"TRACE_CONTRACT_ORIGINAL_STREAM "
                                + (json.dumps(frame, sort_keys=True) + "\n").encode("ascii"))
                  if full:
                      frames.append(raw)
                      if raw and not raw.endswith(b"\n"):
                          frames.append(b"\n")
                      visible += len(raw)
                  else:
                      record["outcome"] = "FAIL"
                      record["visibility_hold"] = "NOT_FULL_ORIGINAL_CEILING_OR_UTF8"
                      frames.append(b"TRACE_CONTRACT_NOT_FULL; original retained in artifact\n")
              observation = (json.dumps(record, sort_keys=True, ensure_ascii=True,
                                        allow_nan=False) + "\n").encode("ascii")
              summary = observation
              if len(summary) > 128 * 1024:
                  record["outcome"] = "FAIL"
                  record["visibility_hold"] = "OBSERVATION_NOT_FULL_CEILING"
                  observation = (json.dumps(record, sort_keys=True, ensure_ascii=True,
                                            allow_nan=False) + "\n").encode("ascii")
                  summary = (json.dumps({
                      "scope": "OBSERVATION_PROJECTION_ONLY", "outcome": "FAIL",
                      "visibility_hold": "OBSERVATION_NOT_FULL_CEILING",
                      "original_observation_bytes": len(observation),
                      "original_observation_sha256": hashlib.sha256(observation).hexdigest(),
                      "native_exit_code": record.get("native_exit_code"),
                  }, sort_keys=True) + "\n").encode("ascii")
              write("observation.json", record)
              output = (("::stop-commands::" + marker + "\n").encode("ascii")
                        + b"TRACE_CONTRACT_OBSERVATION " + summary + b"".join(frames)
                        + ("::" + marker + "::\n").encode("ascii"))
              if len(output) > 2 * 1024 * 1024:
                  raise ValueError("fixed complete controller output exceeds 2MiB")
              if sys.stdout.buffer.write(output) != len(output):
                  raise ValueError("short native controller stdout write")
              sys.stdout.buffer.flush()
          raise SystemExit(0 if record["outcome"] == "PASS" else 1)
          PY
      - name: Retain original targeted observation including honest absence RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formal-trace-parser-contract-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/formal-trace-parser-contract-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
