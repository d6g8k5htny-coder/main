          except BaseException as exc:errors.append({'type':type(exc).__name__,'reason':'OWNED_STORAGE_RELEASE_UNCONFIRMED'});preserve()
          summary={'schema_version':1,'native_context':native,'records':records,'errors':errors,'captured_originals_complete':capture_complete,
              'native_job_log_original_readback':'REQUIRED; NO EARLIER_ARTIFACT_REBINDING','runtime_custody':'UNKNOWN','scientific_effect':'NONE'}
          print(json.dumps(summary,sort_keys=True))
          raise SystemExit(0 if not errors and capture_complete else 1)
          PY
      - name: Record native upload identity without claiming original readback
        if: always()
        timeout-minutes: 1
        env:
          ARTIFACT_ID: ${{ steps.retained.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.retained.outputs.artifact-digest }}
        run: |
          python3 -I -B -S - <<'PY'
          import json,os,re
          identity=os.environ.get('ARTIFACT_ID','');digest=os.environ.get('ARTIFACT_DIGEST','')
          if not re.fullmatch('[1-9][0-9]*',identity) or not re.fullmatch('(?:sha256:)?[0-9a-f]{64}',digest):
              raise ValueError('native control artifact identity unavailable')
          print(json.dumps({'artifact_id':identity,'artifact_digest':digest,'run_id':os.environ['GITHUB_RUN_ID'],
              'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'raw_archive_and_member_readback':'REQUIRED_AFTER_JOB',
              'custody_authentication':'UNKNOWN','scientific_effect':'NONE'}))
          PY
