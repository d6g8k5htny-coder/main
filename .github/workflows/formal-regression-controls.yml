      - name: Retain bounded control originals on every conclusion
        id: retained
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: formal-regression-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.final_seal.outputs.upload_path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Release only owned evidence storage after upload and terminal proof
        if: always()
        timeout-minutes: 2
        env:
          FORMAL_EVIDENCE_TEMP: ${{ runner.temp }}/formal-retained-volume-${{ github.run_id }}-${{ github.run_attempt }}/mount
        run: |
          set -euo pipefail
          python3 -I -B -S - <<'PY'
          import base64,json,os,pathlib,selectors,signal,stat,subprocess,time
          MIB=2**20;temporary=pathlib.Path(os.environ['FORMAL_EVIDENCE_TEMP']);volume=temporary.parent
          native={key:os.environ[name] for key,name in (('repository','GITHUB_REPOSITORY'),('checked_commit','GITHUB_SHA'),('run_id','GITHUB_RUN_ID'),('run_attempt','GITHUB_RUN_ATTEMPT'))}
          base=temporary/('formal-regression-'+native['run_id']+'-'+native['run_attempt']);records=[];errors=[];capture_complete=True
          record_path=volume/'storage-cleanup.json'
          def require(v,m):
              if not v:raise ValueError(m)
          def read(path,limit=MIB):
              path=pathlib.Path(path);parent=os.open(path.anchor,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW);leaf=None
              try:
                  for part in path.parts[1:-1]:
                      child=os.open(part,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW,dir_fd=parent);os.close(parent);parent=child
                  leaf=os.open(path.name,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK,dir_fd=parent);before=os.fstat(leaf)
                  require(stat.S_ISREG(before.st_mode) and before.st_nlink==1 and before.st_uid==os.getuid() and before.st_size<=limit,'owned cleanup original')
                  raw=b''
                  while len(raw)<=limit:
                      part=os.read(leaf,min(65536,limit+1-len(raw)))
                      if not part:break
                      raw+=part
                  after=os.fstat(leaf);require((before.st_dev,before.st_ino,before.st_size,before.st_mtime_ns,before.st_ctime_ns)==(after.st_dev,after.st_ino,after.st_size,after.st_mtime_ns,after.st_ctime_ns) and len(raw)==before.st_size,'cleanup original changed')
                  return raw
              finally:
                  if leaf is not None:os.close(leaf)
                  os.close(parent)
          def preserve():
              global capture_complete
              raw=(json.dumps({'schema_version':1,'native_context':native,'records':records,'errors':errors,'captured_originals_complete':capture_complete,
                  'original_channel':'ACTUAL_NATIVE_JOB_LOG_READBACK_REQUIRED_AFTER_JOB; THIS_POSTUPLOAD_RECORD_IS_NOT_IN_THE_EARLIER_ARTIFACT',
                  'qualification':'OBSERVATION_ONLY; CUSTODY_UNKNOWN','scientific_effect':'NONE'},sort_keys=True)+'\n').encode()
              used=len(read(volume/'storage-bootstrap.json',900000)) if (volume/'storage-bootstrap.json').exists() else 0
              if (volume/'storage-native-context.json').exists():used+=len(read(volume/'storage-native-context.json',65536))
              fallback=volume/'fallback'
              if fallback.exists():
                  for path in fallback.iterdir():used+=len(read(path,65536))
              if len(raw)>256000 or used+len(raw)>MIB:
                  capture_complete=False;return
              flags=os.O_WRONLY|os.O_CREAT|os.O_NOFOLLOW
              fd=os.open(record_path,flags,0o600)
              info=os.fstat(fd);require(stat.S_ISREG(info.st_mode) and info.st_nlink==1 and info.st_uid==os.getuid(),'owned cleanup metadata writer')
              os.ftruncate(fd,0)
              with os.fdopen(fd,'wb') as stream:stream.write(raw);stream.flush();os.fsync(stream.fileno())
          def command(argv,allow_absent=False):
              proc=None;sel=selectors.DefaultSelector();buffers={'stdout':bytearray(),'stderr':bytearray()};r={'argv':argv,'complete':False,'exit_code':None,'process_unreaped':False,'error':None};end=time.monotonic()+20
              try:
                  proc=subprocess.Popen(argv,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True,
                      env={'PATH':'/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin','LANG':'C.UTF-8','TZ':'UTC','DOCKER_CONFIG':str(base/'client')})
                  for stream,name in ((proc.stdout,'stdout'),(proc.stderr,'stderr')):os.set_blocking(stream.fileno(),False);sel.register(stream,selectors.EVENT_READ,name)
                  while sel.get_map():
