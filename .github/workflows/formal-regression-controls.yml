                          'owned_writers_absent':writers_absent,'originals_complete':False,'raw_native_archive_fit':'UNKNOWN','scientific_effect':'NONE'})
                      if len(payload)<=65536 and prep_bytes+total+len(payload)+8*MIB<=64*MIB and prep_count+len(rows)+1+8<=1024:
