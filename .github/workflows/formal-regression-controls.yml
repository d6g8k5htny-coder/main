                      'qualification':'UNKNOWN_HOLD_UNTIL_ACTUAL_NATIVE_ORIGINAL_READBACK'},'actual_positive_fit':'UNKNOWN','custody_authentication':'UNKNOWN','full8':'ACTIVE_UNMET','scientific_effect':'NONE','organizational_independence':0}
              write('final-terminal.json',encoded(terminal),'HONEST_BOUNDED_TERMINAL_WITH_EXPLICIT_UNRESOLVED_GATES',MIB)
              ledger={'schema_version':1,'native_context':native,'total_limit_bytes':64*MIB,'member_limit':1024,'metadata_response_limit_bytes':4*MIB,
                  'preparation_artifact_members':account['members'],'preparation_bytes':prep_bytes,'preparation_members':prep_count,'control_bytes_before_ledger_manifest':total,
                  'control_members_before_ledger_manifest':len(rows),'reserved_raw_native_zip_bytes':4*MIB,'reserved_native_job_log_bytes':4*MIB,'reserved_native_transport_members':8,'raw_zip_actual_bytes':None,'native_job_log_actual_bytes':None,
                  'logical_accounting':'Every distinct archive/member occurrence counts, even equal bytes; conserved aliases for one eventual member join exactly',
                  'physical_storage_domains':{'retained_loop_limit_bytes':63*MIB,'outside_bootstrap_fallback_limit_bytes':MIB,'combined_limit_bytes':64*MIB,'worker_output_loop_separate_bytes':64*MIB,
                      'observed_retained_filesystem_capacity_bytes':physical,'peak_fit':'UNKNOWN; hard capacity and capture refusal are not a successful capacity probe'},
                  'source_native_controller_driver_logs_metadata_all_included':True,'remaining_bytes_before_ledger_manifest_and_ZIP_readback':64*MIB-prep_bytes-total,
