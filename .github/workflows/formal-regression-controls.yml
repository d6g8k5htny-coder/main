name: Formal regression frozen controls
# R01 private source candidate; hosted behavior and admission remain NOT_RUN.
# V1 is preserved. Shared retained-evidence limits and unresolved event custody are explicit.
# Dedicated observation lane. Existing generic graph/export/required checks remain unchanged.
'on':
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: formal-regression-controls-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  controls:
    name: formal-regression-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 49
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Parse dedicated and canonical workflows without executing source
        timeout-minutes: 1
        run: |
          set -euo pipefail
          ruby -rpsych -e 'ARGV.each { |p| Psych.safe_load(File.read(p), aliases: false) }' .github/workflows/formal-regression-controls.yml .github/workflows/architecture-runtime-acquisition.yml
      - name: Create only the owned bounded retained-evidence filesystem
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python3 -I -B -S - <<'PY'
          import hashlib,json,os,pathlib,re,selectors,signal,stat,subprocess,time
          native={key:os.environ[name] for key,name in (('repository','GITHUB_REPOSITORY'),('checked_commit','GITHUB_SHA'),('run_id','GITHUB_RUN_ID'),('run_attempt','GITHUB_RUN_ATTEMPT'))}
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/('formal-retained-volume-'+native['run_id']+'-'+native['run_attempt']);root.mkdir(mode=0o700,exist_ok=False)
          with (root/'storage-native-context.json').open('xb') as stream:stream.write((json.dumps({'schema_version':1,'native_context':native},sort_keys=True)+'\n').encode())
          mount=root/'mount';mount.mkdir(mode=0o700,exist_ok=False)
          records=[]
          def command(argv):
              proc=None;sel=selectors.DefaultSelector();buffers={'stdout':bytearray(),'stderr':bytearray()};record={'argv':argv,'complete':False,'exit_code':None,'process_unreaped':False,'error':None};end=time.monotonic()+30
              try:
                  proc=subprocess.Popen(argv,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,start_new_session=True,
                      env={'PATH':'/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin','LANG':'C.UTF-8','TZ':'UTC'})
                  for stream,name in ((proc.stdout,'stdout'),(proc.stderr,'stderr')):os.set_blocking(stream.fileno(),False);sel.register(stream,selectors.EVENT_READ,name)
                  while sel.get_map():
                      if time.monotonic()>=end:raise TimeoutError('bounded owned storage operation')
                      for key,_ in sel.select(min(0.2,max(0,end-time.monotonic()))):
                          part=os.read(key.fileobj.fileno(),65536)
                          if not part:sel.unregister(key.fileobj);key.fileobj.close();continue
                          room=65536-len(buffers[key.data]);buffers[key.data].extend(part[:room])
                          if len(part)>room:raise ValueError('owned storage original stream limit')
                  record['exit_code']=proc.wait(timeout=max(0.01,end-time.monotonic()));record['complete']=True
              except BaseException as exc:record['error']=type(exc).__name__
              finally:
                  if proc is not None and proc.poll() is None:
                      for sig,grace in ((signal.SIGTERM,4),(signal.SIGKILL,1)):
                          if proc.poll() is not None:break
                          try:os.killpg(proc.pid,sig);proc.wait(timeout=grace)
                          except (ProcessLookupError,subprocess.TimeoutExpired):pass
                      record['process_unreaped']=proc.poll() is None
                  if proc is not None:
                      record['exit_code']=proc.returncode
                      for stream in (proc.stdout,proc.stderr):
                          if stream is not None and not stream.closed:stream.close()
                  sel.close();record.update({k:bytes(v).decode('utf-8','backslashreplace') for k,v in buffers.items()});records.append(record)
                  metadata=(json.dumps({'schema_version':1,'native_context':native,'records':records,'qualification':'HOST_OBSERVATIONS_ONLY; RETAIN_AND_REVIEW'},sort_keys=True)+'\n').encode()
                  if len(metadata)>900000:raise ValueError('bootstrap metadata reserve exhausted')
                  with (root/'storage-bootstrap.json').open('wb') as stream:stream.write(metadata)
              if not record['complete'] or record['process_unreaped'] or record['exit_code']!=0:raise ValueError('owned bounded storage setup incomplete')
              return bytes(buffers['stdout'])
          image=root/'retained.img'
          command(['truncate','-s','63M',str(image)]);command(['mkfs.ext4','-F',str(image)])
          command(['sudo','-n','mount','-o','loop,nodev,nosuid,noexec',str(image),str(mount)])
          command(['sudo','-n','chown',str(os.getuid())+':'+str(os.getgid()),str(mount)]);mount.chmod(0o700)
          capacity=os.statvfs(mount);total=capacity.f_frsize*capacity.f_blocks
          if not 0<total<=63*2**20:raise ValueError('actual bounded retained-evidence filesystem capacity')
          # Allocated emergency space is storage, not an evidence member. Release only in the final sealer.
          fd=os.open(mount/'final-seal-storage.reserve',os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
          try:os.posix_fallocate(fd,0,7*2**20);os.fsync(fd)
          finally:os.close(fd)
          raw=(root/'storage-bootstrap.json').read_bytes()
          if len(raw)>2**20:raise ValueError('owned storage bootstrap metadata bound')
          with (mount/'storage-bootstrap.json').open('xb') as stream:stream.write(raw)
          with (mount/'storage-capacity.json').open('xb') as stream:stream.write((json.dumps({'schema_version':1,'native_context':native,'physical_capacity_bytes':total,'device_limit_bytes':63*2**20,'outside_bootstrap_fallback_limit_bytes':2**20,'combined_owned_transient_storage_limit_bytes':64*2**20,'emergency_reserved_bytes':7*2**20,'worker_output_device_separate':True,'actual_fit':'UNKNOWN'},sort_keys=True)+'\n').encode())
          PY
      - name: Reserve the single bounded retained-evidence budget before preparation
        timeout-minutes: 1
        env:
          FORMAL_EVIDENCE_TEMP: ${{ runner.temp }}/formal-retained-volume-${{ github.run_id }}-${{ github.run_attempt }}/mount
        run: |
          set -euo pipefail
          python3 -I -B -S - <<'PY'
          import json,os,pathlib,re
          native={key:os.environ[name] for key,name in (('repository','GITHUB_REPOSITORY'),('checked_commit','GITHUB_SHA'),('run_id','GITHUB_RUN_ID'),('run_attempt','GITHUB_RUN_ATTEMPT'))}
          if not re.fullmatch('[0-9a-f]{40}',native['checked_commit']) or not all(re.fullmatch('[1-9][0-9]*',native[k]) for k in ('run_id','run_attempt')):
              raise ValueError('native global-budget context unavailable')
          root=pathlib.Path(os.environ['FORMAL_EVIDENCE_TEMP'])/('formal-regression-budget-'+native['run_id']+'-'+native['run_attempt'])
          root.mkdir(mode=0o700,exist_ok=False)
          policy={'schema_version':1,'native_context':native,'total_retained_decompressed_bytes':64*2**20,'total_members':1024,
              'metadata_response_bytes':4*2**20,'transient_evidence_physical_bytes':64*2**20,'owned_retained_device_bytes':63*2**20,'outside_bootstrap_fallback_bytes':2**20,'raw_native_archives_reserved_bytes':4*2**20,'native_job_log_reserved_bytes':4*2**20,'native_transport_reserved_members':8,'preparation_reserved_bytes':36*2**20,'preparation_reserved_members':256,
              'ordinary_control_ceiling_bytes':32*2**20,'recovery_reserved_bytes':2*2**20,'recovery_reserved_members':32,
              'final_seal_reserved_bytes':7*2**20,'final_seal_reserved_members':32,'native_archive_overhead_reserved_bytes':2**20,'worker_output_device_bytes':64*2**20,
              'unit':'SUM_OF_EACH_RETAINED_NATIVE_ARCHIVE_MEMBER_BYTES; EACH_DISTINCT_ARCHIVE_MEMBER_COPY_COUNTS; NO_CONTENT_DEDUPLICATION',
              'same_member_staging_replicas':'One eventual member represented in OUT and publish is joined byte-exactly, not counted as two native-archive members; distinct names/copies always count',
              'archive_raw_byte_fit':'UNKNOWN_REQUIRES_NATIVE_ARCHIVE_READBACK; NO_COMPLETENESS_OR_POSITIVE_FIT_CLAIM'}
          raw=(json.dumps(policy,sort_keys=True)+'\n').encode()
          fd=os.open(root/'policy.json',os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o400)
          with os.fdopen(fd,'wb') as stream:stream.write(raw);stream.flush();os.fsync(stream.fileno())
          PY
      - name: Extract whole-pinned qualified preparation sources
        timeout-minutes: 1
        env:
          FORMAL_EVIDENCE_TEMP: ${{ runner.temp }}/formal-retained-volume-${{ github.run_id }}-${{ github.run_attempt }}/mount
        run: |
          set -euo pipefail
          python3 -I -B -S - "$FORMAL_EVIDENCE_TEMP" "$GITHUB_WORKSPACE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'PY'
          import hashlib, json, os, pathlib, stat, sys
          def require(value, message):
              if not value:
                  raise ValueError(message)
          def original(path, size, digest):
              path = pathlib.Path(path)
              require(path.is_absolute(), 'absolute admitted path required')
              parent = os.open(path.anchor, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  for part in path.parts[1:-1]:
                      child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=parent)
                      os.close(parent)
                      parent = child
                  descriptor = os.open(path.name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=parent)
              finally:
                  os.close(parent)
              try:
                  before = os.fstat(descriptor)
                  require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_size == size,
                          'qualified whole-source size/type mismatch')
                  raw = b''
                  while len(raw) <= size:
                      part = os.read(descriptor, min(65536, size + 1 - len(raw)))
                      if not part:
                          break
                      raw += part
                  after = os.fstat(descriptor)
                  require((before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns)
                          == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns)
                          and len(raw) == size and hashlib.sha256(raw).hexdigest() == digest,
                          'qualified whole-source changed or pin mismatch')
                  return raw
              finally:
                  os.close(descriptor)
          temporary, workspace = map(pathlib.Path, sys.argv[1:3])
          run_id, attempt = sys.argv[3:5]
          require(run_id.isdecimal() and attempt.isdecimal(), 'native preparation path context')
          workflow = original(workspace / '.github/workflows/architecture-runtime-acquisition.yml', 95714,
              '9b33eee757bae53966a151150bc62bc6aec13f9aa8226b4398dfa3362597de65')
          original(workspace / 'docs/plans/2026-10-09-public-runtime-acquisition.md', 22516,
              '72bdcf2b2374216f415fb6d86b84c2db25e7855caf0699bdfe2473336fb64bb7')
          destination = temporary / ('formal-regression-preparation-source-' + run_id + '-' + attempt)
          destination.mkdir(mode=0o700, exist_ok=False)
          lines = workflow.decode('ascii').splitlines()
          selection = (
              ('write-sources.sh', 'Write fixed trusted preparation sources'),
              ('run-preparation.sh', 'Parse the standalone source and run the preparation once'),
              ('seal.sh', 'Seal available originals on every conclusion'),
              ('cleanup.sh', 'Remove only owned preparation client and control files'))
          for filename, name in selection:
              starts = [index for index, line in enumerate(lines) if line == '      - name: ' + name]
              require(len(starts) == 1, 'ambiguous qualified step marker')
              start = starts[0]
              end = next((index for index in range(start + 1, len(lines))
                          if lines[index].startswith('      - ')), len(lines))
              block = lines[start:end]
              markers = [index for index, line in enumerate(block) if line == '        run: |']
              require(len(markers) == 1, 'ambiguous qualified literal run source')
              body = block[markers[0] + 1:]
              require(body and all(line.startswith('          ') for line in body),
                      'qualified literal script indentation')
              raw = ('\n'.join(line[10:] for line in body) + '\n').encode('ascii')
              descriptor = os.open(destination / filename, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o444)
              with os.fdopen(descriptor, 'wb') as stream:
                  stream.write(raw)
          print(json.dumps({'qualified_sources': 'PIN_MATCH', 'literal_scripts': len(selection)}))
          PY
          RUNNER_TEMP="$FORMAL_EVIDENCE_TEMP" bash "$FORMAL_EVIDENCE_TEMP/formal-regression-preparation-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/write-sources.sh"
      - name: Qualify canonical acquisition and restore daemon before tests
        id: preparation
        timeout-minutes: 19
        env:
          FORMAL_EVIDENCE_TEMP: ${{ runner.temp }}/formal-retained-volume-${{ github.run_id }}-${{ github.run_attempt }}/mount
        run: |
          set -euo pipefail
          RUNNER_TEMP="$FORMAL_EVIDENCE_TEMP" bash "$FORMAL_EVIDENCE_TEMP/formal-regression-preparation-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/run-preparation.sh"
      - name: Seal separate preparation originals on every conclusion
        id: preparation_seal
        if: always()
        timeout-minutes: 1
        env:
          FORMAL_EVIDENCE_TEMP: ${{ runner.temp }}/formal-retained-volume-${{ github.run_id }}-${{ github.run_attempt }}/mount
        run: |
          set -euo pipefail
          RUNNER_TEMP="$FORMAL_EVIDENCE_TEMP" bash "$FORMAL_EVIDENCE_TEMP/formal-regression-preparation-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/seal.sh"
      - name: Account every preparation member before its native upload
        id: preparation_budget
        if: always()
        timeout-minutes: 1
        env:
          FORMAL_EVIDENCE_TEMP: ${{ runner.temp }}/formal-retained-volume-${{ github.run_id }}-${{ github.run_attempt }}/mount
        run: |
          set -euo pipefail
          python3 -I -B -S - <<'PY'
          import hashlib,json,os,pathlib,re,stat
          MIB=2**20
          def require(value,message):
              if not value:raise ValueError(message)
          def read(path,limit):
              path=pathlib.Path(path);parent=os.open(path.anchor,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW);leaf=None
              try:
                  for part in path.parts[1:-1]:
                      child=os.open(part,os.O_RDONLY|os.O_DIRECTORY|os.O_NOFOLLOW,dir_fd=parent);os.close(parent);parent=child
                  leaf=os.open(path.name,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK,dir_fd=parent);before=os.fstat(leaf)
                  require(stat.S_ISREG(before.st_mode) and before.st_nlink==1 and before.st_size<=limit,'bounded preparation member')
                  raw=b''
                  while len(raw)<=limit:
                      part=os.read(leaf,min(65536,limit+1-len(raw)))
                      if not part:break
                      raw+=part
                  after=os.fstat(leaf);require((before.st_dev,before.st_ino,before.st_size,before.st_mtime_ns,before.st_ctime_ns)==(after.st_dev,after.st_ino,after.st_size,after.st_mtime_ns,after.st_ctime_ns) and len(raw)==before.st_size,'preparation member changed')
                  return raw
              finally:
                  if leaf is not None:os.close(leaf)
                  os.close(parent)
          native={key:os.environ[name] for key,name in (('repository','GITHUB_REPOSITORY'),('checked_commit','GITHUB_SHA'),('run_id','GITHUB_RUN_ID'),('run_attempt','GITHUB_RUN_ATTEMPT'))}
          temporary=pathlib.Path(os.environ['FORMAL_EVIDENCE_TEMP']);budget=temporary/('formal-regression-budget-'+native['run_id']+'-'+native['run_attempt'])
          policy_raw=read(budget/'policy.json',65536);policy=json.loads(policy_raw)
          require(policy['native_context']==native and policy['total_retained_decompressed_bytes']==64*MIB and policy['total_members']==1024,'one current-run global policy')
          source=temporary/('public-runtime-'+native['run_id']+'-'+native['run_attempt'])/'publish'
          fallback=budget/'preparation-fallback';fallback.mkdir(mode=0o700,exist_ok=False)
          members=[];errors=[];total=0
          try:
              info=source.lstat();require(stat.S_ISDIR(info.st_mode) and info.st_uid==os.getuid() and stat.S_IMODE(info.st_mode)==0o700,'owned preparation directory')
              entries=sorted(source.iterdir(),key=lambda p:p.name);require(len(entries)<=256,'preparation member reservation')
              for path in entries:
                  require(re.fullmatch(r'[A-Za-z0-9_.-]+',path.name),'closed preparation member name')
                  # Each stream/source/receipt/manifest copy is counted, including equal bytes under different names.
                  raw=read(path,4*MIB);total+=len(raw);require(total<=36*MIB,'preparation bytes exceed shared reservation')
                  members.append({'path':path.name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
              require(members,'preparation originals absent')
          except BaseException as exc:errors.append({'type':type(exc).__name__,'reason':'PREPARATION_SHARED_BUDGET_OR_MEMBER_ADMISSION_FAILED'})
          record={'schema_version':1,'native_context':native,'policy_sha256':hashlib.sha256(policy_raw).hexdigest(),'status':'BOUNDED_PREPARATION_MEMBERS' if not errors else 'HOLD','members':members,'original_bytes':total,'original_count':len(members),'errors':errors,
              'preparation_complete_or_qualified':False,'raw_archive_fit':'UNKNOWN','actual_private_custody':'UNKNOWN'}
          if errors:
              raw=(json.dumps({'schema_version':1,'native_context':native,'status':'HOLD','reason':'PREPARATION_ORIGINALS_UNAVAILABLE_OR_OUTSIDE_SHARED_BOUNDS','originals_complete':False,'errors':errors},sort_keys=True)+'\n').encode()
              with (fallback/'preparation-hold.json').open('xb') as stream:stream.write(raw)
              record.update(members=[{'path':'preparation-hold.json','bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}],original_bytes=len(raw),original_count=1,artifact_path_kind='BOUNDED_HOLD_ONLY')
              upload=fallback
          else:upload=source;record['artifact_path_kind']='ORIGINAL_CANONICAL_PREPARATION'
          raw=(json.dumps(record,sort_keys=True)+'\n').encode();require(len(raw)<=MIB,'preparation budget record bound')
          fd=os.open(budget/'preparation-account.json',os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o400)
          with os.fdopen(fd,'wb') as stream:stream.write(raw);stream.flush();os.fsync(stream.fileno())
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('upload_path='+str(upload)+'\n')
          PY
      - name: Retain separate bounded preparation originals
        id: preparation_retained
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: formal-regression-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.preparation_budget.outputs.upload_path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Remove only owned preparation and extraction files
        id: preparation_cleanup
        if: always()
        timeout-minutes: 1
        env:
          FORMAL_EVIDENCE_TEMP: ${{ runner.temp }}/formal-retained-volume-${{ github.run_id }}-${{ github.run_attempt }}/mount
        run: |
          set -euo pipefail
          directory="$FORMAL_EVIDENCE_TEMP/formal-regression-preparation-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          RUNNER_TEMP="$FORMAL_EVIDENCE_TEMP" bash "$directory/cleanup.sh"
          python3 -I -B -S - "$directory" <<'PY'
          import os, pathlib, stat, sys
          directory = pathlib.Path(sys.argv[1])
          info = directory.lstat()
          if not stat.S_ISDIR(info.st_mode) or info.st_uid != os.getuid() or stat.S_IMODE(info.st_mode) != 0o700:
              raise ValueError('owned extraction directory identity')
          names = {'write-sources.sh', 'run-preparation.sh', 'seal.sh', 'cleanup.sh'}
          if {path.name for path in directory.iterdir()} != names:
              raise ValueError('closed owned extraction inventory')
          for name in sorted(names):
              path = directory / name
              info = path.lstat()
              if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_uid != os.getuid() or info.st_size > 1024 * 1024:
                  raise ValueError('owned extraction file identity/bound')
              path.unlink()
          directory.rmdir()
          PY
      - name: Require complete current-run preparation before formal controls
        timeout-minutes: 1
        env:
          FORMAL_EVIDENCE_TEMP: ${{ runner.temp }}/formal-retained-volume-${{ github.run_id }}-${{ github.run_attempt }}/mount
          PREPARATION_ARTIFACT_ID: ${{ steps.preparation_retained.outputs.artifact-id }}
          PREPARATION_ARTIFACT_DIGEST: ${{ steps.preparation_retained.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python3 -I -B -S - "$FORMAL_EVIDENCE_TEMP/public-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/publish" <<'PY'
          import hashlib, json, math, os, pathlib, re, stat, sys
          MIB = 2**20
          def require(value, message):
              if not value:
                  raise ValueError(message)
          def read(path, limit):
              path = pathlib.Path(path)
              require(path.is_absolute(), 'absolute admitted path required')
              parent = os.open(path.anchor, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  for part in path.parts[1:-1]:
                      child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=parent)
                      os.close(parent)
                      parent = child
                  descriptor = os.open(path.name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=parent)
              finally:
                  os.close(parent)
              try:
                  before = os.fstat(descriptor)
                  require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_size <= limit,
                          'sealed preparation regular-file admission')
                  raw = b''
                  while len(raw) <= limit:
                      part = os.read(descriptor, min(65536, limit + 1 - len(raw)))
                      if not part:
                          break
                      raw += part
                  after = os.fstat(descriptor)
                  require((before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns)
                          == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns)
                          and len(raw) == before.st_size <= limit, 'sealed preparation changed during read')
                  return raw
              finally:
                  os.close(descriptor)
          def strict(raw):
              def pairs(items):
                  value = {}
                  for key, item in items:
                      require(key not in value, 'duplicate original JSON key')
                      value[key] = item
                  return value
              def reject(value):
                  raise ValueError('nonfinite original JSON value')
              def finite(value):
                  number=float(value)
                  require(math.isfinite(number), 'nonfinite JSON number')
                  return number
              return json.loads(raw, object_pairs_hook=pairs, parse_constant=reject, parse_float=finite)
          root = pathlib.Path(sys.argv[1])
          info = root.lstat()
          require(stat.S_ISDIR(info.st_mode) and info.st_uid == os.getuid()
                  and stat.S_IMODE(info.st_mode) == 0o700, 'owned sealed preparation directory')
          native = {key: os.environ[name] for key, name in (
              ('repository', 'GITHUB_REPOSITORY'), ('checked_commit', 'GITHUB_SHA'),
              ('run_id', 'GITHUB_RUN_ID'), ('run_attempt', 'GITHUB_RUN_ATTEMPT'))}
          require(re.fullmatch(r'[1-9][0-9]*', os.environ['PREPARATION_ARTIFACT_ID'])
                  and re.fullmatch(r'(?:sha256:)?[0-9a-f]{64}', os.environ['PREPARATION_ARTIFACT_DIGEST']),
                  'native preparation upload identity unavailable')
          manifest = {}
          manifest_raw = read(root / 'ARTIFACT_SHA256SUMS', MIB)
          for line in manifest_raw.decode('ascii').splitlines():
              match = re.fullmatch(r'([0-9a-f]{64})  ([A-Za-z0-9_.-]+)', line)
              require(match is not None and match[2] not in manifest, 'closed preparation hash manifest')
