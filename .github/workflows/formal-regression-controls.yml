                          part=os.read(key.fileobj.fileno(),32768)
                          if not part:sel.unregister(key.fileobj);key.fileobj.close();continue
                          room=32768-len(buffers[key.data]);buffers[key.data].extend(part[:room]);require(len(part)<=room,'bounded storage cleanup raw stream')
                  r['exit_code']=proc.wait(timeout=max(0.01,end-time.monotonic()));r['complete']=True
              except BaseException as exc:r['error']=type(exc).__name__
              finally:
                  if proc is not None and proc.poll() is None:
                      for sig,grace in ((signal.SIGTERM,4),(signal.SIGKILL,1)):
                          if proc.poll() is not None:break
                          try:os.killpg(proc.pid,sig);proc.wait(timeout=grace)
                          except (ProcessLookupError,subprocess.TimeoutExpired):pass
                      r['process_unreaped']=proc.poll() is None
                  if proc is not None:
                      r['exit_code']=proc.returncode
                      for stream in (proc.stdout,proc.stderr):
                          if stream is not None and not stream.closed:stream.close()
                  sel.close();r['streams']={k:{'raw_base64':base64.b64encode(v).decode(),'bytes':len(v),'partial':not r['complete']} for k,v in buffers.items()};records.append(r);preserve()
              require(r['complete'] and not r['process_unreaped'] and r['exit_code'] in ((0,1) if allow_absent else (0,)),'owned cleanup native result unavailable')
              return bytes(buffers['stdout'])
          try:
              require(not any((base/n).exists() for n in ('active-command.json','launcher-main.active.json','launcher-recovery.active.json')),'unresolved owned writer prevents storage release')
              for role,prefix in (('main','control-process'),('recovery','recovery-process')):
                  choices=[base/'final-publish'/(prefix+'.status.json'),base/(prefix+'.status.json')];path=next((p for p in choices if p.exists()),None)
                  require(path is not None,'actual launcher terminal required for storage release');status=json.loads(read(path,65536))
                  require(status['native_context']==native and status['role']==role and status['process_created'] is True and status['process_unreaped'] is False and not status['termination_errors'],'actual launcher child reaped before storage release')
              raw=command(['docker','ps','--all','--no-trunc','--filter','label=org.formal-controls.run-id='+native['run_id'],'--filter','label=org.formal-controls.attempt='+native['run_attempt'],'--format','{{json .}}'])
              require(raw==b'','owned worker remains before storage release')
              for target,backing,size in ((base/'output',volume/'worker-output.img',64*MIB),(temporary,volume/'retained.img',63*MIB)):
                  raw=command(['findmnt','--json','--mountpoint',str(target)],allow_absent=True);data=json.loads(raw) if raw.strip() else {'filesystems':[]};mounts=data.get('filesystems',[])
                  require(len(mounts)<=1,'ambiguous owned mount')
                  if mounts:
                      require(mounts[0]['target']==str(target) and mounts[0].get('fstype')=='ext4','owned mount native identity')
                      loop=str(mounts[0]['source']).split('[')[0];actual=command(['losetup','--noheadings','--output','BACK-FILE',loop]).decode().strip()
                      info=backing.lstat();require(actual==str(backing) and stat.S_ISREG(info.st_mode) and info.st_nlink==1 and info.st_uid==os.getuid() and info.st_size==size,'owned loop backing/type/size')
                      command(['sudo','-n','umount',str(target)])
