name: universality-controls
on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/universality/**'
      - 'experiments/periodic_h0/exact_h0.py'
      - '.github/workflows/universality-controls.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/universality/**'
      - 'experiments/periodic_h0/exact_h0.py'
      - '.github/workflows/universality-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  controls:
    name: universality-controls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Exact mechanism and fifty-law software controls in both modes
        run: |
          python3 -B -E -S -m unittest discover -s experiments/universality -p 'test_*.py' -v
          python3 -B -E -O -S -m unittest discover -s experiments/universality -p 'test_*.py' -v
      - name: Execute and audit all fifty exploratory law candidates
        run: |
          set -euo pipefail
          python3 -B -E -S experiments/universality/run_pilot.py --output "$RUNNER_TEMP/universality-exploration" 2>&1 | tee "$RUNNER_TEMP/universality-exploration-run.log"
          python3 -B -E -S experiments/universality/run_pilot.py --verify "$RUNNER_TEMP/universality-exploration/observations.json" 2>&1 | tee "$RUNNER_TEMP/universality-exploration-verify.log"
      - name: Retain exploratory rows and execution errors even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: universality-exploration-${{ github.sha }}
          path: |
            ${{ runner.temp }}/universality-exploration/observations.json
            ${{ runner.temp }}/universality-exploration-run.log
            ${{ runner.temp }}/universality-exploration-verify.log
          if-no-files-found: error
          retention-days: 90
      - name: State the evidence boundary
        if: ${{ always() }}
        run: |
          echo 'This job concerns exact toy pushforward controls and exploratory quantized-grid H0 for fifty finite Fourier laws only; inspect job outcome and retained rows for actual success or failure. No blind experiment, continuum confirmation, formal theorem or scientific acceptance.' >> "$GITHUB_STEP_SUMMARY"
