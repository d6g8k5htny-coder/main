name: Math hypergraph (organization only)
'on':
  pull_request:
    paths:
      - 'tools/hypergraph/**'
      - 'data/hypergraph/**'
      - 'docs/site/dependency-source/GRAPH.json'
      - 'data/hypergraph/math_coverage_ledger_20261023.md'
      - '.github/workflows/math-hypergraph.yml'
  push:
    branches: [main]
    paths:
      - 'tools/hypergraph/**'
      - 'data/hypergraph/**'
      - 'docs/site/dependency-source/GRAPH.json'
      - 'data/hypergraph/math_coverage_ledger_20261023.md'
      - '.github/workflows/math-hypergraph.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hypergraph:
    name: math-hypergraph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Read-only checkouts of the other public repos (no secrets). If one is private
      # or unavailable the step is skipped and the builder prints "skip <repo>".
      - name: Checkout Math- (public, read-only)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: d6g8k5htny-coder/Math-
          path: external/Math-
          persist-credentials: false
      - name: Checkout query- (public, read-only)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: d6g8k5htny-coder/query-
          path: external/query-
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/hypergraph/requirements.txt
      - name: Install pinned requirements
        run: python -m pip install -r tools/hypergraph/requirements.txt
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider tools/hypergraph
      - name: build --check (committed outputs match a fresh rebuild)
        run: python -m tools.hypergraph.math_hypergraph build --check
      - name: validate
        run: python -m tools.hypergraph.math_hypergraph validate
      - name: gaps
        run: python -m tools.hypergraph.math_hypergraph gaps
      - name: Build all-repo bundle with PNG
        run: |
          set -euo pipefail
          python -m tools.hypergraph.math_hypergraph repos
          python -m tools.hypergraph.math_hypergraph export "$RUNNER_TEMP/hypergraph" --repos all --png
          ls -l "$RUNNER_TEMP/hypergraph"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: math-hypergraph
          path: ${{ runner.temp }}/hypergraph/
          if-no-files-found: error
          retention-days: 14
