name: Routing SQLite runtime preparation
'on':
  pull_request:
    paths:
      - .github/workflows/routing-sqlite-runtime-preparation.yml
      - docs/plans/2026-10-08-routing-sqlite-runtime-preparation.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: routing-sqlite-preparation-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  preparation:
    name: routing-sqlite-runtime-preparation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE: python:3.11.14-slim-bookworm@sha256:83f339c1be6340ae1096010fdccf6552ac932d8f410d45d206014916bdf37e48
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Parse this workflow with the hosted YAML parser
        run: |
          set -euo pipefail
          ruby -rpsych -e 'Psych.safe_load(File.read(ARGV.fetch(0)), aliases: false); puts "Parsed routing SQLite preparation workflow"' .github/workflows/routing-sqlite-runtime-preparation.yml
      - name: Capture checked source and prepare the bounded fixture namespace
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/routing-sqlite-runtime/fs" "$RUNNER_TEMP/routing-sqlite-publish/source"
          chmod 0700 "$RUNNER_TEMP/routing-sqlite-runtime" "$RUNNER_TEMP/routing-sqlite-publish"
          git rev-parse HEAD > "$RUNNER_TEMP/routing-sqlite-publish/checked-commit.txt"
          printf '%s\n' "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/routing-sqlite-publish/repository.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/routing-sqlite-publish/run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/routing-sqlite-publish/run-attempt.txt"
          docker pull --platform linux/amd64 "$IMAGE"
          docker image inspect "$IMAGE" > "$RUNNER_TEMP/routing-sqlite-publish/runtime-image.json"
          truncate -s 64M "$RUNNER_TEMP/routing-sqlite-runtime/fixture.img"
          mkfs.ext4 -F "$RUNNER_TEMP/routing-sqlite-runtime/fixture.img"
          sudo mount -o loop,nodev,nosuid,noexec "$RUNNER_TEMP/routing-sqlite-runtime/fixture.img" "$RUNNER_TEMP/routing-sqlite-runtime/fs"
          sudo mkdir "$RUNNER_TEMP/routing-sqlite-runtime/fs/control" "$RUNNER_TEMP/routing-sqlite-runtime/fs/work"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/routing-sqlite-runtime/fs/control"
          chmod 0755 "$RUNNER_TEMP/routing-sqlite-runtime/fs/control"
          sudo chmod 0700 "$RUNNER_TEMP/routing-sqlite-runtime/fs/work"
          sudo chown 65532:65532 "$RUNNER_TEMP/routing-sqlite-runtime/fs/work"
          findmnt -J -T "$RUNNER_TEMP/routing-sqlite-runtime/fs/work" > "$RUNNER_TEMP/routing-sqlite-publish/fixture-mount.json"
          python3 -I -B -S - "$GITHUB_WORKSPACE" "$RUNNER_TEMP/routing-sqlite-publish" "$RUNNER_TEMP/routing-sqlite-runtime/fs/control" <<'PY'
          import hashlib, json, os, re, stat, sys
          source, destination, control = sys.argv[1:]
          def require(value, reason):
              if not value:
                  raise ValueError(reason)
          def regular(root, relative, limit):
              fd = os.open(root, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              try:
                  parts = relative.split("/")
                  require(all(part not in ("", ".", "..") for part in parts), "invalid source path")
                  for part in parts[:-1]:
                      child = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=fd)
                      os.close(fd)
                      fd = child
                  leaf = os.open(parts[-1], os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=fd)
                  try:
                      before = os.fstat(leaf)
                      require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_size <= limit, "source is not bounded single-link regular bytes")
                      raw = b""
                      while True:
                          chunk = os.read(leaf, min(65536, limit + 1 - len(raw)))
                          if not chunk:
                              break
                          raw += chunk
                          require(len(raw) <= limit, "source exceeds its bound")
                      after = os.fstat(leaf)
                      require(stat.S_ISREG(after.st_mode) and after.st_nlink == 1, "source is no longer single-link regular bytes")
                      require((before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns) ==
                              (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns), "source changed during capture")
                      return raw
                  finally:
                      os.close(leaf)
              finally:
                  os.close(fd)
          def write(path, value):
              raw = json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=True).encode() + b"\n"
              with open(path, "xb") as output:
                  output.write(raw)
          native = {}
          for key, name in (("checked_commit", "checked-commit.txt"), ("repository", "repository.txt"),
                            ("run_id", "run-id.txt"), ("run_attempt", "run-attempt.txt")):
              raw = regular(destination, name, 512)
              require(raw.endswith(b"\n") and raw.count(b"\n") == 1, "invalid native context line")
              native[key] = raw[:-1].decode("ascii")
          require(re.fullmatch("[0-9a-f]{40}", native["checked_commit"]) is not None, "invalid checked commit")
          require(re.fullmatch("[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", native["repository"]) is not None, "invalid repository")
          require(all(re.fullmatch("[1-9][0-9]*", native[key]) for key in ("run_id", "run_attempt")), "invalid native run")
          sources = []
          for path, name, limit in (
              (".github/workflows/routing-sqlite-runtime-preparation.yml", "workflow.yml", 131072),
              ("docs/plans/2026-10-08-routing-sqlite-runtime-preparation.md", "plan.md", 65536),
          ):
              raw = regular(source, path, limit)
              with open(os.path.join(destination, "source", name), "xb") as output:
                  output.write(raw)
              sources.append({"path": path, "retained_path": "source/" + name, "bytes": len(raw),
                              "sha256": hashlib.sha256(raw).hexdigest()})
          write(os.path.join(control, "native-context.json"), native)
          write(os.path.join(control, "source-snapshot.json"), {"schema_version": 1, "native_context": native, "sources": sources})
          PY
          control="$RUNNER_TEMP/routing-sqlite-runtime/fs/control"
          cat > "$control/sqlite_preparation.py" <<'PY'
          import _sqlite3
          import hashlib
          import json
          import multiprocessing
          import os
          import platform
          import sqlite3
          import stat
          import sys
          import time

          SETTINGS = {"journal_mode": "delete", "synchronous": 3, "foreign_keys": 1,
                      "trusted_schema": 0, "read_uncommitted": 0, "busy_timeout": 1000}
          CAS_SQL = "UPDATE synthetic_cas SET state = 'claimed', winner = ? WHERE id = 1 AND state = 'reserved'"
          EXPECTED_SCHEMA = [
              ("table", "synthetic_cas", "synthetic_cas",
               "CREATE TABLE synthetic_cas (id INTEGER PRIMARY KEY CHECK (id = 1), state TEXT NOT NULL CHECK (state IN ('reserved', 'claimed')), winner TEXT)"),
          ]

          def require(value, reason):
              if not value:
                  raise ValueError(reason)

          def dump(path, value):
              raw = json.dumps(value, sort_keys=True, separators=(",", ":"), ensure_ascii=True, allow_nan=False).encode() + b"\n"
              require(len(raw) <= 1048576, "result byte bound")
              with open(path, "xb") as output:
                  output.write(raw)
                  output.flush()
                  os.fsync(output.fileno())

          def connect(path):
              connection = sqlite3.connect(path, timeout=1.0, isolation_level=None)
              try:
                  connection.execute("PRAGMA busy_timeout = 1000")
                  connection.execute("PRAGMA journal_mode = DELETE").fetchone()
                  connection.execute("PRAGMA synchronous = EXTRA")
                  connection.execute("PRAGMA foreign_keys = ON")
                  connection.execute("PRAGMA trusted_schema = OFF")
                  connection.execute("PRAGMA read_uncommitted = OFF")
                  observed = {}
                  for key in SETTINGS:
                      row = connection.execute("PRAGMA " + key).fetchone()
                      require(row is not None and len(row) == 1, "unavailable SQLite feature")
                      observed[key] = row[0]
                  require(observed == SETTINGS, "connection settings differ")
                  return connection, observed
              except BaseException:
                  connection.close()
                  raise

          def schema(connection):
              observed = list(connection.execute("SELECT type, name, tbl_name, sql FROM sqlite_master ORDER BY type, name"))
              require(observed == EXPECTED_SCHEMA, "synthetic schema changed")

          def create(path):
              require(not os.path.lexists(path), "fixture already exists")
              connection, settings = connect(path)
              try:
                  connection.execute(EXPECTED_SCHEMA[0][3])
                  connection.execute("BEGIN IMMEDIATE")
                  connection.execute("INSERT INTO synthetic_cas (id, state, winner) VALUES (1, 'reserved', NULL)")
                  connection.commit()
                  require(not connection.in_transaction, "initial commit incomplete")
                  schema(connection)
              finally:
                  connection.close()
              return settings

          def error_value(error):
              return {"type": type(error).__name__, "sqlite_errorcode": getattr(error, "sqlite_errorcode", None)}

          def contender(path, token, start, pipe):
              connection = None
              try:
                  connection, settings = connect(path)
                  schema(connection)
                  pipe.send({"phase": "ready", "settings": settings, "uid": os.getuid(), "pid": os.getpid()})
                  require(start.wait(20), "CAS start deadline")
                  connection.execute("BEGIN IMMEDIATE")
                  changed = connection.execute(CAS_SQL, (token,)).rowcount
                  require(changed in (0, 1), "invalid conditional update count")
                  connection.commit()
                  require(not connection.in_transaction, "CAS commit incomplete")
                  pipe.send({"phase": "result", "outcome": "winner" if changed == 1 else "loser",
                             "changed_rows": changed, "token": token, "settings": settings,
                             "begin_immediate_calls": 1, "conditional_update_calls": 1, "pid": os.getpid()})
              except BaseException as error:
                  value = error_value(error)
                  if connection is not None and connection.in_transaction:
                      try:
                          connection.rollback()
                      except BaseException as rollback_error:
                          value["rollback_error"] = error_value(rollback_error)
                  pipe.send({"phase": "failure", "error": value})
              finally:
                  if connection is not None:
                      connection.close()
                  pipe.close()

          def busy_contender(path, start, pipe):
              connection = None
              try:
                  connection, settings = connect(path)
                  schema(connection)
                  pipe.send({"phase": "ready", "settings": settings, "uid": os.getuid(), "pid": os.getpid()})
                  require(start.wait(20), "busy start deadline")
                  begin = time.monotonic()
                  try:
                      connection.execute("BEGIN IMMEDIATE")
                  except sqlite3.OperationalError as error:
                      elapsed = time.monotonic() - begin
                      code = getattr(error, "sqlite_errorcode", None)
                      require(type(code) is int and (code & 255) == sqlite3.SQLITE_BUSY, "non-busy refusal")
                      require(not connection.in_transaction, "busy refusal entered a transaction")
                      require(0.8 <= elapsed <= 2.0, "busy wait observation outside scheduling allowance")
                      pipe.send({"phase": "result", "outcome": "SQLITE_BUSY", "sqlite_errorcode": code,
                                 "elapsed_seconds": elapsed, "settings": settings, "begin_immediate_calls": 1,
                                 "configured_busy_timeout_ms": 1000, "retries": 0, "in_transaction": False, "pid": os.getpid()})
                  else:
                      raise ValueError("held write lock unexpectedly admitted a transaction")
              except BaseException as error:
                  pipe.send({"phase": "failure", "error": error_value(error)})
              finally:
                  if connection is not None:
                      if connection.in_transaction:
                          connection.rollback()
                      connection.close()
                  pipe.close()

          def receive(pipe, deadline):
              remaining = deadline - time.monotonic()
              require(remaining > 0 and pipe.poll(remaining), "child result deadline")
              return pipe.recv()

          def finish(processes, pipes):
              for process in processes:
                  if process.is_alive():
                      process.terminate()
                  process.join(2)
                  if process.is_alive():
                      process.kill()
                      process.join(2)
                  require(not process.is_alive(), "synthetic child disposal failed")
              for pipe in pipes:
                  pipe.close()

          def race(context, directory, round_number, records):
              record = {"round": round_number, "contenders": 16, "success": False, "readiness": [], "operations": []}
              records.append(record)
              path = os.path.join(directory, "cas-%02d.sqlite3" % round_number)
              create(path)
              start = context.Event()
              processes, pipes, results = [], [], []
              try:
                  for index in range(16):
                      read_pipe, write_pipe = context.Pipe(duplex=False)
                      process = context.Process(target=contender, args=(path, "TEST-%02d-%02d" % (round_number, index), start, write_pipe))
                      process.start()
                      write_pipe.close()
                      processes.append(process)
                      pipes.append(read_pipe)
                  deadline = time.monotonic() + 20
                  ready = record["readiness"]
                  for pipe in pipes:
                      ready.append(receive(pipe, deadline))
                  require(all(value.get("phase") == "ready" and value.get("settings") == SETTINGS and value.get("uid") == 65532 and
                              type(value.get("pid")) is int and value["pid"] > 0 and value["pid"] != os.getpid() for value in ready) and
                          len({value["pid"] for value in ready}) == 16, "CAS readiness refused")
                  start.set()
                  deadline = time.monotonic() + 20
                  results = record["operations"]
                  for pipe in pipes:
                      results.append(receive(pipe, deadline))
                  for process in processes:
                      process.join(max(0, deadline - time.monotonic()))
                  require(all(process.exitcode == 0 for process in processes), "CAS child failure")
                  require(all(value.get("phase") == "result" and value.get("settings") == SETTINGS and
                              value.get("begin_immediate_calls") == 1 and value.get("conditional_update_calls") == 1
                              for value in results), "one-shot CAS operation refused")
                  require(all(value.get("pid") == ready[index]["pid"] and value.get("token") == "TEST-%02d-%02d" % (round_number, index)
                              for index, value in enumerate(results)), "CAS process/token identity")
                  winners = [value for value in results if value["outcome"] == "winner" and value["changed_rows"] == 1]
                  losers = [value for value in results if value["outcome"] == "loser" and value["changed_rows"] == 0]
                  require(len(winners) == 1 and len(losers) == 15, "single winner invariant failed")
                  connection, settings = connect(path)
                  try:
                      schema(connection)
                      row = connection.execute("SELECT id, state, winner FROM synthetic_cas").fetchall()
                      require(row == [(1, "claimed", winners[0]["token"])], "committed winner did not survive reopen")
                      require(connection.execute("PRAGMA integrity_check").fetchall() == [("ok",)], "fixture integrity failure")
                  finally:
                      connection.close()
                  require(not os.path.lexists(path + "-journal"), "DELETE journal survived successful commit")
                  record.update({"success": True, "winners": 1, "losers": 15, "reopened_row": list(row[0]),
                                 "settings_on_reopen": settings, "integrity_check": "ok", "journal_after_commit": False})
              finally:
                  finish(processes, pipes)

          def busy(context, directory, result):
              result["busy_refusal"] = {"phase": "starting"}
              path = os.path.join(directory, "busy.sqlite3")
              create(path)
              start = context.Event()
              read_pipe, write_pipe = context.Pipe(duplex=False)
              process = context.Process(target=busy_contender, args=(path, start, write_pipe))
              connection = None
              try:
                  process.start()
                  write_pipe.close()
                  ready = receive(read_pipe, time.monotonic() + 20)
                  result["busy_refusal"] = {"phase": "ready", "readiness": ready}
                  require(ready.get("phase") == "ready" and ready.get("settings") == SETTINGS and ready.get("uid") == 65532 and
                          type(ready.get("pid")) is int and ready["pid"] > 0 and ready["pid"] != os.getpid(), "busy readiness refused")
                  connection, settings = connect(path)
                  connection.execute("BEGIN IMMEDIATE")
                  start.set()
                  value = receive(read_pipe, time.monotonic() + 5)
                  result["busy_refusal"] = value
                  process.join(2)
                  require(process.exitcode == 0 and value.get("phase") == "result" and
                          value.get("outcome") == "SQLITE_BUSY" and value.get("settings") == SETTINGS and
                          value.get("pid") == ready["pid"], "busy control failed")
                  connection.rollback()
                  require(not connection.in_transaction, "fixture holder rollback incomplete")
                  connection.close()
                  connection = None
                  reopened, observed = connect(path)
                  try:
                      schema(reopened)
                      require(reopened.execute("SELECT id, state, winner FROM synthetic_cas").fetchall() == [(1, "reserved", None)],
                              "busy refusal changed fixture")
                  finally:
                      reopened.close()
                  require(not os.path.lexists(path + "-journal"), "busy fixture retained a journal after disposal")
                  value.update({"settings_on_reopen": observed, "row_after_reopen": [1, "reserved", None], "holder_pid": os.getpid()})
                  return value
              finally:
                  try:
                      if connection is not None:
                          try:
                              if connection.in_transaction:
                                  connection.rollback()
                          finally:
                              connection.close()
                  finally:
                      finish([process] if process.pid is not None else [], [read_pipe])
                      write_pipe.close()

          def identity(path):
              actual = os.path.realpath(path)
              fd = os.open(actual, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  info = os.fstat(fd)
                  require(stat.S_ISREG(info.st_mode) and 0 < info.st_size <= 33554432, "runtime library byte bound")
                  digest, count = hashlib.sha256(), 0
                  while True:
                      chunk = os.read(fd, 65536)
                      if not chunk:
                          break
                      count += len(chunk)
                      require(count <= 33554432, "runtime library grew")
                      digest.update(chunk)
                  after = os.fstat(fd)
                  require((info.st_dev, info.st_ino, info.st_size, info.st_mtime_ns, info.st_ctime_ns) ==
                          (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns), "runtime library changed")
                  return {"path": actual, "bytes": count, "sha256": digest.hexdigest()}
              finally:
                  os.close(fd)

          def environment():
              require(os.getuid() == 65532 and os.getgid() == 65532, "nonroot runtime identity")
              require(sys.platform == "linux" and platform.machine() == "x86_64", "runtime platform")
              status = {}
              with open("/proc/self/status", encoding="ascii") as source:
                  for line in source:
                      if line.startswith(("CapEff:", "NoNewPrivs:")):
                          key, value = line.split(":", 1)
                          status[key] = value.strip()
              require(status == {"CapEff": "0000000000000000", "NoNewPrivs": "1"}, "runtime privilege restriction")
              cgroup = {}
              for name in ("memory.max", "pids.max", "cpu.max"):
                  with open("/sys/fs/cgroup/" + name, encoding="ascii") as source:
                      cgroup[name] = source.read(256).strip()
              quota, period = map(int, cgroup["cpu.max"].split())
              require(cgroup["memory.max"] == "1073741824" and cgroup["pids.max"] == "128" and
                      quota == 2 * period and period > 0, "runtime cgroup restriction")
              mounts = {}
              with open("/proc/self/mountinfo", encoding="ascii") as source:
                  for line in source:
                      left, right = line.rstrip("\n").split(" - ", 1)
                      fields, backing = left.split(), right.split()
                      if fields[4] in ("/", "/source", "/control", "/work", "/tmp"):
                          mounts[fields[4]] = {"options": fields[5].split(","), "filesystem": backing[0],
                                               "source": backing[1], "super_options": backing[2].split(",")}
              require(all(path in mounts for path in ("/", "/source", "/control", "/work", "/tmp")), "runtime mount inventory")
              require(all("ro" in mounts[path]["options"] for path in ("/", "/source", "/control")), "read-only mounts")
              require("rw" in mounts["/work"]["options"] and
                      all(flag in mounts["/work"]["options"] for flag in ("nodev", "nosuid", "noexec")), "fixture mount restriction")
              require(mounts["/tmp"]["filesystem"] == "tmpfs" and
                      all(flag in mounts["/tmp"]["options"] for flag in ("rw", "nodev", "nosuid", "noexec")), "temporary mount restriction")
              sizes = {}
              for path in ("/work", "/tmp"):
                  value = os.statvfs(path)
                  sizes[path] = value.f_blocks * value.f_frsize
                  require(0 < sizes[path] <= 67108864, "fixture filesystem exceeds 64 MiB")
              require(sorted(os.listdir("/sys/class/net")) == ["lo"], "runtime network interfaces")
              with open("/proc/net/route", encoding="ascii") as source:
                  require(len(source.read(65536).splitlines()) == 1, "runtime network routes")
              require(not any(key.startswith(("GITHUB_", "GH_", "AWS_", "AZURE_", "OPENAI_", "ANTHROPIC_")) for key in os.environ),
                      "unexpected service environment")
              return {"uid": os.getuid(), "gid": os.getgid(), "platform": sys.platform, "machine": platform.machine(),
                      "proc_status": status, "cgroup": cgroup, "mounts": mounts, "filesystem_bytes": sizes,
                      "network_interfaces": ["lo"], "network_routes": 0}

          def runtime(path):
              require(tuple(sys.version_info[:3]) == (3, 11, 14), "Python image version differs")
              libraries = set()
              with open("/proc/self/maps", encoding="utf-8") as source:
                  for line in source:
                      fields = line.rstrip("\n").split(None, 5)
                      if len(fields) == 6 and fields[5].startswith("/") and "/libsqlite3.so" in fields[5]:
                          libraries.add(fields[5])
              require(len(libraries) == 1, "actual loaded SQLite library identity unavailable")
              require(not os.path.lexists(path), "runtime probe already exists")
              connection, settings = connect(path)
              try:
                  options = sorted(row[0] for row in connection.execute("PRAGMA compile_options"))
                  require(0 < len(options) <= 512 and len(options) == len(set(options)) and
                          all(type(value) is str and len(value) <= 512 for value in options), "compile options inventory")
                  require(connection.execute("SELECT sqlite_version()").fetchone() == (sqlite3.sqlite_version,), "SQLite library version mismatch")
              finally:
                  connection.close()
              return {"python": sys.version, "python_version": list(sys.version_info[:3]),
                      "sqlite_module_version": sqlite3.version, "sqlite_library_version": sqlite3.sqlite_version,
                      "sqlite_library_version_info": list(sqlite3.sqlite_version_info), "compile_options": options,
                      "python_executable": identity(sys.executable), "sqlite_python_module": identity(sqlite3.__file__),
                      "sqlite_extension": identity(_sqlite3.__file__), "loaded_sqlite_library": identity(next(iter(libraries))),
                      "connection_settings": settings}

          def main():
              require(len(sys.argv) == 2 and sys.argv[1] in ("normal", "optimized"), "mode argument")
              mode = sys.argv[1]
              require(sys.flags.optimize == (0 if mode == "normal" else 1), "caller optimization mode")
              require(sys.dont_write_bytecode and sys.flags.isolated and sys.flags.no_site, "isolated caller flags")
              result = {"schema_version": 1, "scientific_effect": "NONE", "scientific_status_authority": False,
                        "custody": "unknown", "scope": "PUBLIC_SYNTHETIC_SQLITE_RUNTIME_PREPARATION",
                        "broker_implementation": "NOT_RUN", "provider_calls": 0, "mode": mode,
                        "caller": {"optimize": sys.flags.optimize, "isolated": sys.flags.isolated,
                                   "no_site": sys.flags.no_site, "dont_write_bytecode": sys.dont_write_bytecode},
                        "success": False, "rounds": []}
              os.mkdir("/work/evidence", 0o700) if not os.path.exists("/work/evidence") else None
              try:
                  result["environment"] = environment()
                  with open("/control/native-context.json", encoding="ascii") as source:
                      result["native_context"] = json.load(source)
                  with open("/control/source-snapshot.json", encoding="ascii") as source:
                      result["source_snapshot"] = json.load(source)
                  result["executed_script"] = identity(__file__)
                  os.mkdir("/work/fixtures", 0o700) if not os.path.exists("/work/fixtures") else None
                  directory = "/work/fixtures/" + mode
                  os.mkdir(directory, 0o700)
                  info = os.lstat(directory)
                  require(stat.S_ISDIR(info.st_mode) and info.st_uid == 65532 and stat.S_IMODE(info.st_mode) == 0o700,
                          "private synthetic fixture directory")
                  result["runtime"] = runtime(os.path.join(directory, "runtime.sqlite3"))
                  context = multiprocessing.get_context("spawn")
                  for number in range(1, 9):
