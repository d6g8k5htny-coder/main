                  if stat.S_ISDIR(info.st_mode):
                      require(path.count("/") <= 5, "archive path depth")
                      child = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=descriptor)
                      try:
                          walk(child, path + "/")
                      finally:
                          os.close(child)
                  else:
                      require(stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and info.st_size <= 16777216, "archive contains unbounded, special or multiply linked file")
                      leaf = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=descriptor)
                      try:
                          before = os.fstat(leaf)
                          require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1 and before.st_size <= 16777216,
                                  "archive member is not bounded single-link regular bytes")
                          digest, count = hashlib.sha256(), 0
                          while True:
                              chunk = os.read(leaf, 65536)
                              if not chunk:
                                  break
                              digest.update(chunk)
                              count += len(chunk)
                              require(count <= 16777216, "archive member grew")
                          after = os.fstat(leaf)
                          require(stat.S_ISREG(after.st_mode) and after.st_nlink == 1, "archive member is no longer single-link regular bytes")
                          require((before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns) ==
                                  (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns), "archive member changed")
                          total += count
                          require(total <= 50331648 and len(entries) < 127, "archive aggregate/member bound")
                          entries.append((path, digest.hexdigest()))
                      finally:
                          os.close(leaf)
          descriptor = os.open(root, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          try:
              walk(descriptor, "")
              require(not any(path == "ARTIFACT_SHA256SUMS" for path, digest in entries), "existing archive manifest")
              raw = "".join(digest + "  " + path + "\n" for path, digest in sorted(entries)).encode("ascii")
              require(len(raw) <= 65536 and total + len(raw) <= 50331648, "archive manifest exceeds retained byte bound")
              leaf = os.open("ARTIFACT_SHA256SUMS", os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600, dir_fd=descriptor)
              try:
                  with os.fdopen(leaf, "wb", closefd=False) as output:
                      output.write(raw)
                      output.flush()
                      os.fsync(output.fileno())
              finally:
                  os.close(leaf)
          finally:
              os.close(descriptor)
          PY
      - name: Retain the original narrow preparation evidence
        if: always() && steps.retained.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: routing-sqlite-runtime-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/routing-sqlite-publish/
          if-no-files-found: error
          retention-days: 90
