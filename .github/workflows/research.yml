# Scheduled research run — IT REPORTS, IT DOES NOT WRITE.
#
# WHY THIS WORKFLOW HAS NO WRITE ACCESS, AND MUST NEVER BE GIVEN ANY.
#
# This job runs the repository's lanes on a schedule and uploads the receipts.
# It does not commit, does not push, does not open or update a pull request,
# does not create or move a tag, and does not touch `claims/graph.json`,
# `engine/lanes/`, `registers/` or `drive/`. `permissions: contents: read` at
# the top of the job makes that a property of the token this job is handed,
# not a promise about its steps.
#
# The reason is the whole reason this repository exists. Every status label in
# it is transcribed from the source registers, and the only thing that can move
# one is an operator decision under `governance/` — OP-PROT-019/R17 for entry,
# claims and review, OP-GDN-002 for the coupled-advancement invariant and its
# required transition record. A scheduled job that could write to the claim
# graph would be an unattended, unreviewed, unattributable promoter of
# mathematical claims: aging into a status, which the protocols forbid outright
# (`reviews_check.py` enforces the same rule for review records — aging never
# approves anything). A cron entry is not an operator. Neither is a green run.
#
# So: a receipt is a record that a computation ran. It is not evidence, not a
# proof, not a certificate and not a status. `OBL-H5-JETMOD`, `OBL-H5-ZBAND`
# (hi side), `OBL-H5-REMOTE-THRESHOLD`, `OBL-D1-PROMOTE` and both Pieces of
# `D3-LEMMA-RN-UNIF` are OPEN, and stay OPEN however many times this job runs
# green. If you find yourself wanting this workflow to write something back,
# what you actually want is an operator decision, and the way to get one is to
# read the receipts this job uploads and take them to the owner.
#
# The receipts produced here are uploaded as a build artifact and are NOT added
# to the repository. Receipts that belong in the repository are written by a
# human-run `python3 engine/run.py` and committed by that human, which keeps
# every committed receipt attributable to someone. `tools/receipts_check.py`
# enforces that the committed ones are append-only in either case.

name: research

on:
  schedule:
    # 04:17 UTC every Monday. Off the hour on purpose, so this job does not
    # queue behind everyone else's midnight cron.
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Read-only. See the comment block above before changing this.
permissions:
  contents: read

concurrency:
  group: research-run
  cancel-in-progress: false

jobs:
  run-lanes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Record the commit these receipts describe
        run: git rev-parse HEAD

      - name: List the lanes and which have a runnable entry point
        run: python engine/run.py --list

      - name: Run every registered lane and write receipts
        run: python engine/run.py --all

      - name: Validate every receipt (schema, append-only, no status claims)
        run: python tools/receipts_check.py

      - name: Prove the run wrote to no governed path
        # A run records; it does not decide. If this fails, something in
        # engine/run.py gained a write path it must not have.
        run: |
          git diff --quiet HEAD -- claims engine/lanes registers drive \
            || { echo "FAIL: the run modified a governed path"; \
                 git --no-pager diff --stat HEAD -- claims engine/lanes registers drive; \
                 exit 1; }
          echo "ok: claims/, engine/lanes/, registers/ and drive/ are untouched"

      - name: Lane invariants, if the checker has landed
        run: test -f tools/lanes_check.py && python tools/lanes_check.py || echo "skipped"

      - name: Claim-graph firewalls
        run: python tools/claims_check.py

      - name: Negative controls
        run: python -m pytest -q

      - name: Upload the receipts (not committed to the repository)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipts-${{ github.run_id }}
          path: engine/receipts/
          if-no-files-found: warn
          retention-days: 90

      - name: Say what a green run does not mean
        if: always()
        run: |
          echo "A green run is a run, not a proof."
          echo "A receipt is a record that a computation ran. It is not evidence,"
          echo "not a certificate, not a review verdict and not a status."
          echo "This workflow promotes, closes, discharges and reclassifies nothing."
          echo "OBL-H5-JETMOD, OBL-H5-ZBAND (hi side), OBL-H5-REMOTE-THRESHOLD,"
          echo "OBL-D1-PROMOTE and both Pieces of D3-LEMMA-RN-UNIF are OPEN."
          echo "Only an operator decision under governance/ changes a status."
