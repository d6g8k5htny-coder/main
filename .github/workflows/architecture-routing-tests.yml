name: Architecture routing TEST ledger controls
# Source-prepared dedicated hosted control. Runtime NOT_RUN at source freeze.
# The frozen tests' single transient ENOSPC padding file needs a 64 MiB FSIZE
# allowance. Original stream admissions remain 4 MiB; retained-output and
# collector budgets are separate from each physical filesystem's capacity.
# Retained source-only REQUEST_CHANGES: lease_abi_review reviewed 1269L/85120B
# SHA256 16970fb34599d4bb49087791f9ede9a68478c3b122826de4053cd65f4f48abbc.
# Its P2 finding was that a missing/unreadable captured test source could abort
# collection before available native originals were copied. Runtime NOT_RUN.
'on':
  pull_request:
    paths:
      - .github/workflows/architecture-routing-tests.yml
      - docs/plans/2026-10-08-tiered-routing-broker-contract.md
      - tests/test_architecture_routing_broker.py
      - architecture/routing_broker.py
      - tools/architecture_routing_broker.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: architecture-routing-tests-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  routing:
    name: architecture-routing-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      IMAGE: python:3.11.14-slim-bookworm@sha256:83f339c1be6340ae1096010fdccf6552ac932d8f410d45d206014916bdf37e48
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Establish native identity and bounded fixture filesystems
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/routing-tests"
          mkdir -m 0700 "$base"
          printf '%s\n' "$GITHUB_REPOSITORY" > "$base/repository.txt"
          printf '%s\n' "$GITHUB_SHA" > "$base/checked-commit.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$base/run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$base/run-attempt.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git show -s --format='%T%n%P' HEAD > "$base/checked-tree-and-parents.txt"
          ruby -rpsych -e 'Psych.safe_load(File.read(ARGV.fetch(0)), aliases: false)' .github/workflows/architecture-routing-tests.yml
          for label in inputs fixtures work publish; do
            mkdir "$base/$label"
            truncate -s 64M "$base/$label.img"
            mkfs.ext4 -F "$base/$label.img" > "$base/$label-filesystem.log" 2>&1
            sudo mount -o loop,nodev,nosuid,noexec "$base/$label.img" "$base/$label"
            sudo mkdir "$base/$label/payload"
            sudo chown "$(id -u):$(id -g)" "$base/$label/payload"
            chmod 0700 "$base/$label/payload"
          done
          mkdir "$base/inputs/payload/source" "$base/inputs/payload/control"
          sudo chown 65532:65532 "$base/work/payload"
          sudo chmod 0700 "$base/work/payload"
          sudo chown 65532:65532 "$base/fixtures/payload"
          sudo chmod 0700 "$base/fixtures/payload"
          python3 -I -B -S - <<'PY'
          import hashlib, json, os, pathlib, stat
          base = pathlib.Path(os.environ['RUNNER_TEMP']) / 'routing-tests'
          source = base / 'inputs/payload/source'
          def require(value, message):
              if not value:
                  raise ValueError(message)
          def original(root, relative, limit, optional=False):
              parts = relative.split('/')
              root_fd = os.open(root, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              descriptor = None
              try:
                  for part in parts[:-1]:
                      try:
                          next_fd = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=root_fd)
                      except FileNotFoundError:
                          if optional:
                              return None
                          raise
                      os.close(root_fd)
                      root_fd = next_fd
                  try:
                      descriptor = os.open(parts[-1], os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=root_fd)
                  except FileNotFoundError:
                      if optional:
                          return None
                      raise
                  before = os.fstat(descriptor)
                  require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1
                          and (0 if optional else 1) <= before.st_size <= limit,
                          'checked source regular-file or size refusal')
                  pieces, count = [], 0
                  while True:
                      chunk = os.read(descriptor, min(65536, limit + 1 - count))
                      if not chunk:
                          break
                      pieces.append(chunk)
                      count += len(chunk)
                      require(count <= limit, 'checked source growth limit')
                  after = os.fstat(descriptor)
                  require(stat.S_ISREG(after.st_mode) and after.st_nlink == 1
                          and (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns)
                          == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns)
                          and count == before.st_size, 'checked source changed while read')
                  return b''.join(pieces)
              finally:
                  if descriptor is not None:
                      os.close(descriptor)
                  os.close(root_fd)
          pins = {
              'docs/plans/2026-10-08-tiered-routing-broker-contract.md': (83085, 'a6b78b009b5361e90cd6735d5daa3dc5adf5a840ae66637db25750ab07df5835'),
              'tests/test_architecture_routing_broker.py': (112531, '6b227d665c2d733470237bcae55a6638cd5dd6d25a0d8c36b08fd4af00654c7d'),
          }
          bindings = []
          for path in [*pins, 'architecture/routing_broker.py', 'tools/architecture_routing_broker.py']:
              raw = original(os.environ['GITHUB_WORKSPACE'], path, 2**20, optional=path not in pins)
              record = {'path': path, 'presence': 'ABSENT' if raw is None else 'PRESENT',
                        'bytes': None if raw is None else len(raw),
                        'sha256': None if raw is None else hashlib.sha256(raw).hexdigest()}
              if path in pins:
                  require((record['bytes'], record['sha256']) == pins[path], 'external routing freeze mismatch')
              if raw is not None:
                  output = source / path
                  output.parent.mkdir(parents=True, exist_ok=True)
                  with output.open('xb') as stream:
                      stream.write(raw)
                  output.chmod(0o444)
              bindings.append(record)
          workflow = original(os.environ['GITHUB_WORKSPACE'], '.github/workflows/architecture-routing-tests.yml', 262144)
          with (base / 'publish/payload/checked-workflow.yml').open('xb') as stream:
              stream.write(workflow)
          context = {key: os.environ[variable] for key, variable in (
              ('repository', 'GITHUB_REPOSITORY'), ('checked_commit', 'GITHUB_SHA'),
              ('run_id', 'GITHUB_RUN_ID'), ('run_attempt', 'GITHUB_RUN_ATTEMPT'))}
          context['workflow_sha256'] = hashlib.sha256(workflow).hexdigest()
          context['sources'] = bindings
          with (base / 'inputs/payload/control/source-bindings.json').open('x') as stream:
              stream.write(json.dumps(context, sort_keys=True, indent=2) + '\n')
          filesystems = {}
          for label in ('inputs', 'fixtures', 'work', 'publish'):
              mount = base / label
              require(os.path.ismount(mount), 'fixture filesystem mount not observed')
              info, capacity = os.stat(mount, follow_symlinks=False), os.statvfs(mount)
              size = capacity.f_frsize * capacity.f_blocks
              require(stat.S_ISDIR(info.st_mode) and 0 < size <= 64 * 2**20, 'actual fixture filesystem capacity refusal')
              filesystems[label] = {'host_device': info.st_dev, 'reported_total_bytes': size,
                                    'configured_capacity_bytes': 64 * 2**20, 'mount_observed': True}
          require(len({item['host_device'] for item in filesystems.values()}) == 4,
                  'source, routing fixtures, output and publication must have distinct devices')
          with (base / 'fixture-filesystems.json').open('x') as stream:
              stream.write(json.dumps(filesystems, sort_keys=True, indent=2) + '\n')
          PY
      - name: Prepare fixed Python controllers with passive child-log retention
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/routing-tests/inputs/payload/control"
          cat > "$control/run.py" <<'PY'
          import _sqlite3, hashlib, json, os, pathlib, platform, re, resource
          import selectors, signal, sqlite3, stat, subprocess, sys, time

          OUTPUT = pathlib.Path('/output')
          PYTHON = '/usr/local/bin/python'
          MIB = 2**20
          STREAM_LIMIT = 4 * MIB
          OUTPUT_LIMIT = 32 * MIB
          METHOD_TIMEOUT = 75
          INVENTORY_TIMEOUT = 3300
          METHODS = sorted([
              'test_reserve_claim_complete', 'test_integer_cost_ceiling', 'test_concurrent_budget_boundary',
              'test_concurrent_duplicate_reservation', 'test_single_dispatch_winner', 'test_identical_replay',
              'test_input_hash_collision', 'test_changed_controls_same_input', 'test_restart_accounting',
              'test_crash_before_claim', 'test_crash_after_claim', 'test_crash_after_fake_acceptance',
              'test_confirmed_nondispatch_release', 'test_release_after_attempt_refused',
              'test_unknown_delivery_after_expiry', 'test_completed_unknown_billing', 'test_known_zero_charge',
              'test_over_reservation_charge', 'test_invalid_usage_types', 'test_unknown_admission_records',
              'test_route_model_substitution', 'test_disclosure_without_hash_admission',
              'test_expired_revoked_admission', 'test_unbounded_billable_components',
              'test_invalid_integer_budget', 'test_unavailable_database', 'test_storage_commit_failure',
              'test_unsafe_ledger_namespace', 'test_strict_input_and_cli', 'test_private_result_retention',
              'test_zero_external_activity', 'test_replay_context_and_optimization',
              'test_trusted_input_token_counts', 'test_untrusted_or_mismatched_token_admission',
              'test_cache_write_rate_upper_bound', 'test_completion_replay_and_conflict',
              'test_concurrent_settlement_once', 'test_settlement_restart_replay_and_conflict',
              'test_completed_unknown_to_known_billing', 'test_unknown_delivery_billing_hold',
              'test_settlement_evidence_binding', 'test_settlement_integer_and_charge_bounds',
          ])
          MODES = [('normal', 0), ('optimized', 1)]
          def require(value, reason):
              if not value:
                  raise ValueError(reason)
          def regular(path, limit, empty=True):
              fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  before = os.fstat(fd)
                  require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1
                          and (0 if empty else 1) <= before.st_size <= limit, 'original regular byte admission')
                  pieces, count = [], 0
                  while True:
                      piece = os.read(fd, min(65536, limit + 1 - count))
                      if not piece:
                          break
                      pieces.append(piece)
                      count += len(piece)
                      require(count <= limit, 'original growth admission')
                  after = os.fstat(fd)
                  require(stat.S_ISREG(after.st_mode) and after.st_nlink == 1
                          and (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns)
                          == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns)
                          and count == before.st_size, 'original changed while observed')
                  return b''.join(pieces)
              finally:
                  os.close(fd)
          def retained_total(directory=OUTPUT):
              total = 0
              for entry in os.scandir(directory):
                  info = entry.stat(follow_symlinks=False)
                  if stat.S_ISDIR(info.st_mode):
                      total += retained_total(pathlib.Path(entry.path))
                  else:
                      require(stat.S_ISREG(info.st_mode) and info.st_nlink == 1,
                              'retained-output type refusal')
                      total += info.st_size
                  require(total <= OUTPUT_LIMIT, 'whole retained-output capacity admission')
              return total
          def write(name, value):
              raw = value if type(value) is bytes else (
                  json.dumps(value, sort_keys=True, indent=2, allow_nan=False) + '\n').encode('ascii')
              require(len(raw) <= STREAM_LIMIT and retained_total() + len(raw) <= OUTPUT_LIMIT,
                      'retained-output byte admission')
              target = OUTPUT / name
              target.parent.mkdir(parents=True, exist_ok=True)
              fd = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o644)
              with os.fdopen(fd, 'wb') as stream:
                  stream.write(raw)
          def identity(path):
              actual = pathlib.Path(path).resolve(strict=True)
              raw = regular(actual, 256 * MIB, False)
              return {'requested_path': str(path), 'path': str(actual), 'bytes': len(raw),
                      'sha256': hashlib.sha256(raw).hexdigest()}
          bindings = json.loads(regular('/control/source-bindings.json', 65536, False))
          def sources():
              for record in bindings['sources']:
                  path = pathlib.Path('/source') / record['path']
                  if record['presence'] == 'ABSENT':
                      require(not os.path.lexists(path), 'absent candidate introduced')
                  else:
                      raw = regular(path, MIB)
                      require(len(raw) == record['bytes'] and hashlib.sha256(raw).hexdigest() == record['sha256'],
                              'read-only checked source changed')
              return bindings['sources']
          def runtime():
              require(tuple(sys.version_info[:3]) == (3, 11, 14) and sys.platform == 'linux'
                      and platform.machine() == 'x86_64' and sys.executable == PYTHON
                      and pathlib.Path(PYTHON).resolve(strict=True) == pathlib.Path('/usr/local/bin/python3.11')
                      and os.getuid() == os.getgid() == 65532
                      and sys.flags.isolated == 1 and sys.flags.no_site == 1 and sys.dont_write_bytecode
                      and sys.flags.optimize == 0, 'actual bundled runtime admission')
              libraries = {'sqlite': set(), 'python': set()}
              for line in pathlib.Path('/proc/self/maps').read_text().splitlines():
                  fields = line.split(None, 5)
                  if len(fields) != 6 or not fields[5].startswith('/'):
                      continue
                  if '/libsqlite3.so' in fields[5]:
                      libraries['sqlite'].add(fields[5])
                  if '/libpython3.11.so' in fields[5]:
                      libraries['python'].add(fields[5])
              require(all(len(value) == 1 for value in libraries.values()), 'actual loaded library identity absent')
              probe = pathlib.Path('/routing-fixtures/runtime-preflight.sqlite3')
              require(not os.path.lexists(probe), 'runtime probe already exists')
              connection = sqlite3.connect(probe, timeout=1, isolation_level=None)
              try:
                  settings = {'journal_mode': 'delete', 'synchronous': 3, 'foreign_keys': 1,
                              'trusted_schema': 0, 'read_uncommitted': 0, 'busy_timeout': 1000}
                  for sql in ('PRAGMA journal_mode=DELETE', 'PRAGMA synchronous=EXTRA',
                              'PRAGMA foreign_keys=ON', 'PRAGMA trusted_schema=OFF',
                              'PRAGMA read_uncommitted=OFF', 'PRAGMA busy_timeout=1000'):
                      connection.execute(sql).fetchone()
                  observed = {key: connection.execute('PRAGMA ' + key).fetchone()[0] for key in settings}
                  require(observed == settings, 'actual required SQLite PRAGMA mismatch')
                  connection.execute('CREATE TABLE runtime_check (id INTEGER PRIMARY KEY) STRICT')
                  connection.execute('BEGIN IMMEDIATE')
                  connection.execute('INSERT INTO runtime_check VALUES (1)')
                  connection.rollback()
                  require(connection.execute('SELECT count(*) FROM runtime_check').fetchone() == (0,)
                          and connection.execute('SELECT sqlite_version()').fetchone() == (sqlite3.sqlite_version,),
                          'actual SQLite feature or rollback mismatch')
                  options = sorted(row[0] for row in connection.execute('PRAGMA compile_options'))
                  require(0 < len(options) <= 512 and len(set(options)) == len(options), 'SQLite compile-option inventory')
              finally:
                  connection.close()
                  probe.unlink()
              return {'python': sys.version, 'python_version': list(sys.version_info[:3]),
                      'sqlite_module_version': sqlite3.version, 'sqlite_library_version': sqlite3.sqlite_version,
                      'sqlite_library_version_info': list(sqlite3.sqlite_version_info), 'compile_options': options,
                      'python_executable': identity(sys.executable), 'sqlite_python_module': identity(sqlite3.__file__),
                      'sqlite_extension': identity(_sqlite3.__file__),
                      'loaded_sqlite_library': identity(next(iter(libraries['sqlite']))),
                      'loaded_python_library': identity(next(iter(libraries['python']))),
                      'connection_settings': observed, 'uid': os.getuid(), 'gid': os.getgid(),
                      'platform': sys.platform, 'machine': platform.machine(),
                      'runtime_origin': 'PINNED_IMAGE_BUNDLED_BINARY'}
          def environment():
              status = dict(line.split(':', 1) for line in pathlib.Path('/proc/self/status').read_text().splitlines()
                            if line.startswith(('CapEff:', 'NoNewPrivs:')))
              status = {key: value.strip() for key, value in status.items()}
              require(status == {'CapEff': '0000000000000000', 'NoNewPrivs': '1'}, 'runtime privilege mismatch')
              cgroup = {name: pathlib.Path('/sys/fs/cgroup', name).read_text().strip()
                        for name in ('memory.max', 'pids.max', 'cpu.max')}
              quota, period = map(int, cgroup['cpu.max'].split())
              require(cgroup['memory.max'] == '1073741824' and cgroup['pids.max'] == '128'
                      and quota == 2 * period and period > 0, 'runtime cgroup mismatch')
              mounts = {}
              for line in pathlib.Path('/proc/self/mountinfo').read_text().splitlines():
                  left, right = line.split(' - ', 1)
                  fields, backing = left.split(), right.split()
                  if fields[4] in ('/', '/source', '/control', '/output', '/routing-fixtures', '/tmp'):
                      require(fields[4] not in mounts, 'duplicate runtime mount')
                      mounts[fields[4]] = {'options': fields[5].split(','), 'filesystem': backing[0],
                                          'source': backing[1], 'super_options': backing[2].split(',')}
              require(set(mounts) == {'/', '/source', '/control', '/output', '/routing-fixtures', '/tmp'}
                      and all('ro' in mounts[path]['options'] for path in ('/', '/source', '/control')),
                      'runtime read-only mount inventory mismatch')
              for path in ('/output', '/routing-fixtures', '/tmp'):
                  require({'rw', 'nodev', 'nosuid', 'noexec'}.issubset(mounts[path]['options']),
                          'runtime writable mount restriction mismatch')
              sizes = {path: os.statvfs(path).f_blocks * os.statvfs(path).f_frsize
                       for path in ('/source', '/output', '/routing-fixtures', '/tmp')}
              require(all(0 < value <= 64 * MIB for value in sizes.values())
                      and sizes['/routing-fixtures'] >= 32 * MIB
                      and len({os.stat(path).st_dev for path in ('/source', '/output', '/routing-fixtures')}) == 3,
                      'runtime physical fixture/output/source capacity mismatch')
              require(mounts['/tmp']['filesystem'] == 'tmpfs'
                      and sorted(os.listdir('/sys/class/net')) == ['lo']
                      and len(pathlib.Path('/proc/net/route').read_text().splitlines()) == 1
                      and not any(key.startswith(('GITHUB_', 'GH_', 'AWS_', 'AZURE_', 'OPENAI_', 'ANTHROPIC_'))
                                  for key in os.environ), 'runtime network or service environment mismatch')
              require(resource.getrlimit(resource.RLIMIT_FSIZE) == (64 * MIB, 64 * MIB)
                      and resource.getrlimit(resource.RLIMIT_NOFILE) == (256, 256), 'runtime process limit mismatch')
              return {'proc_status': status, 'cgroup': cgroup, 'mounts': mounts, 'filesystem_bytes': sizes,
                      'network_interfaces': ['lo'], 'network_routes': 0,
                      'rlimit_fsize': list(resource.getrlimit(resource.RLIMIT_FSIZE)),
                      'rlimit_nofile': list(resource.getrlimit(resource.RLIMIT_NOFILE))}
          def execute(mode, optimize, method):
              name = mode + '/' + method
              command = [PYTHON, '-I', '-B', '-S', *(['-O'] if optimize else []),
                         '/control/method.py', mode, method]
              started = time.monotonic_ns()
              buffers = {'stdout': bytearray(), 'stderr': bytearray()}
              error, timed_out, complete = None, False, True
              process, selected = None, selectors.DefaultSelector()
              code = None
              try:
                  process = subprocess.Popen(command, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE, start_new_session=True, cwd='/source',
                      env={'PATH': '/usr/local/bin:/usr/bin:/bin', 'LANG': 'C.UTF-8', 'TZ': 'UTC',
                           'PYTHONDONTWRITEBYTECODE': '1'})
                  for stream, label in ((process.stdout, 'stdout'), (process.stderr, 'stderr')):
                      os.set_blocking(stream.fileno(), False)
                      selected.register(stream, selectors.EVENT_READ, label)
                  deadline = time.monotonic() + METHOD_TIMEOUT
                  while selected.get_map():
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                          timed_out = True
                          raise TimeoutError('outer method exceeded declared 75-second cap')
                      for key, _ in selected.select(min(remaining, 0.2)):
                          part = os.read(key.fileobj.fileno(), 65536)
                          if not part:
                              selected.unregister(key.fileobj)
                              key.fileobj.close()
                              continue
                          room = STREAM_LIMIT - len(buffers[key.data])
                          buffers[key.data].extend(part[:room])
                          if len(part) > room:
                              raise ValueError('outer original stream exceeded its 4 MiB admission')
                  code = process.wait(timeout=max(0.01, deadline - time.monotonic()))
              except BaseException as failure:
                  error, complete = type(failure).__name__ + ': ' + str(failure)[:2048], False
              finally:
                  if process is not None and process.poll() is None:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait(timeout=2)
                  if process is not None:
                      code = process.returncode
                      for stream in (process.stdout, process.stderr):
                          if stream is not None and not stream.closed:
                              stream.close()
                  selected.close()
              for label in buffers:
                  write(name + '/outer.' + label, bytes(buffers[label]))
              record = {'mode': mode, 'optimize': optimize, 'method': method,
                        'id': 'test_architecture_routing_broker.ArchitectureRoutingBrokerContract.' + method,
                        'argv': command, 'attempts': 1, 'code': code, 'timed_out': timed_out, 'error': error,
                        'streams_complete': complete, 'duration_ns': str(time.monotonic_ns() - started),
                        'stdout': name + '/outer.stdout', 'stderr': name + '/outer.stderr',
                        'method_record': name + '/method.json'}
              for label in buffers:
                  record[label + '_bytes'] = len(buffers[label])
                  record[label + '_sha256'] = hashlib.sha256(buffers[label]).hexdigest()
              return record
          report = {'schema_version': 1, 'context': bindings, 'declared_methods': METHODS,
                    'declared_outer_modes': MODES, 'source_declared_outer_controls': 84,
                    'source_declared_active_child_attempts': 252, 'status': 'RUNTIME_SETUP_BLOCKED',
                    'actual_outer_attempts': [], 'scientific_effect': 'NONE',
                    'scientific_status_authority': False, 'organizational_independence': 0,
                    'custody_authentication': 'UNKNOWN', 'provider_calls': 'NOT_ADMITTED',
                    'genuine_behavioral_red': 'NOT_DECLARED_BY_WORKFLOW'}
          exit_code = 1
          try:
              require(len(METHODS) == len(set(METHODS)) == 42, 'closed method declaration mismatch')
              write('runtime-before.json', runtime())
              write('environment-before.json', environment())
              write('source-before.json', sources())
              write('control-source.json', {name: hashlib.sha256(regular('/control/' + name, 262144, False)).hexdigest()
                    for name in ('run.py', 'method.py')})
              all_pass = True
              for mode, optimize in MODES:
                  deadline = time.monotonic() + INVENTORY_TIMEOUT
                  for method in METHODS:
                      require(time.monotonic() < deadline, 'whole inventory exceeded declared 3300-second cap')
                      attempt = execute(mode, optimize, method)
                      report['actual_outer_attempts'].append(attempt)
                      try:
                          result = json.loads(regular(OUTPUT / attempt['method_record'], STREAM_LIMIT, False))
                          require(result['context'] == bindings and result['id'] == attempt['id']
                                  and result['mode'] == mode and result['optimize'] == optimize
                                  and result['actual_method_inventory'] == METHODS,
                                  'method terminal/source identity mismatch')
                          all_pass = all_pass and result['status'] == 'PASS'
                      except (OSError, ValueError, KeyError, TypeError):
                          all_pass = False
                      all_pass = all_pass and attempt['code'] == 0 and attempt['streams_complete']
                      require(time.monotonic() <= deadline, 'whole inventory exceeded declared 3300-second cap')
              write('attempts.json', report['actual_outer_attempts'])
              write('source-after.json', sources())
              write('runtime-after.json', runtime())
              write('environment-after.json', environment())
              require(json.loads(regular(OUTPUT / 'runtime-before.json', MIB))
                      == json.loads(regular(OUTPUT / 'runtime-after.json', MIB)),
                      'actual bundled runtime changed')
