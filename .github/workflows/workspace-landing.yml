# Batch 248: landing checks live here so Actions UI no longer folds
# hardening-branch 12–22m verifies (same former path .github/workflows/ci.yml)
# into the workflow named "workspace-landing".
name: workspace-landing
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  architecture:
    uses: ./.github/workflows/research-architecture.yml
  checks:
    needs: [architecture]
    outputs:
      checked_commit: ${{ steps.checks-identity.outputs.checked_commit }}
    name: landing-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4, resolved 2026-09-23
        with:
          persist-credentials: false
      - name: Require current-run architecture success before existing checks
        env:
          ARCHITECTURE_NEEDS: ${{ toJSON(needs.architecture) }}
        run: |
          set -euo pipefail
          printf '%s' "$ARCHITECTURE_NEEDS" | python3 -B -S tools/architecture_check_binding.py --expected-commit "$GITHUB_SHA" --expected-repository "$GITHUB_REPOSITORY" --expected-run-id "$GITHUB_RUN_ID" --expected-run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Required-check integration controls in both Python modes
        run: |
          python3 -B -S -m unittest discover -s tests -p test_required_formal_check.py -v
          python3 -B -O -S -m unittest discover -s tests -p test_required_formal_check.py -v
      - name: Runtime
        run: python3 --version
      - name: Delivery archive controls in both Python modes
        run: |
          python3 -B -S tests/test_research_delivery.py
          python3 -B -O -S tests/test_research_delivery.py
      - name: Landing checker tests
        run: python3 -m unittest discover -s tests -p test_workspace_landing.py -v
      - name: Local links and relocated history
        run: python3 tools/workspace_landing_check.py
      - name: Describe coverage
        run: echo 'Verified landing links, historical byte identities and delivery archive controls only. Research branches and mathematical claims were not verified by this job.' >> "$GITHUB_STEP_SUMMARY"
      - name: W8b formal and intake controls in both Python modes
        run: |
          set -e
          python3 -B -E -S tests/test_required_formal_binding_control.py -v
          python3 -B -E -O -S tests/test_required_formal_binding_control.py -v
          python3 -B -E -S tests/test_public_intake_artifact_identity_control.py -v
          python3 -B -E -O -S tests/test_public_intake_artifact_identity_control.py -v
      - name: Bind existing checks to tested commit
        id: checks-identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "checked_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  formal:
    uses: ./.github/workflows/formal-verification.yml
  required:
    name: verify
    if: ${{ always() }}
    needs: [checks, formal]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require both checks and source-bound current-run formal success
        env:
          REQUIRED_FORMAL_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B -S tools/required_formal_check.py aggregate
