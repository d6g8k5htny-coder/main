name: Same admitted graph projection

on:
  pull_request:
    branches: [main]
    paths:
      - architecture/site_graph_projection.py
      - architecture/graph_artifact_readback.py
      - docs/site/dependency-source/GRAPH.json
      - tests/test_site_graph_projection.py
      - tools/site_graph_capture.py
      - tests/test_site_graph_capture.py
      - .github/workflows/site-graph-projection.yml
  push:
    branches: [main]
    paths:
      - architecture/site_graph_projection.py
      - architecture/graph_artifact_readback.py
      - docs/site/dependency-source/GRAPH.json
      - tests/test_site_graph_projection.py
      - tools/site_graph_capture.py
      - tests/test_site_graph_capture.py
      - .github/workflows/site-graph-projection.yml

permissions:
  contents: read

jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    env:
      CONTROL_MODE: ${{ matrix.mode }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 1
        with:
          persist-credentials: false
      - name: Bounded controls and original output collection
        timeout-minutes: 2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B -S tools/site_graph_capture.py --mode "$CONTROL_MODE" --output "$RUNNER_TEMP/site-graph-projection"
      - name: Retain bounded originals and actual outcomes
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: site-graph-projection-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site-graph-projection/
          if-no-files-found: error
          retention-days: 14
