name: Node-status current-input v2 offline contracts

'on':
  pull_request:
    paths:
      - tests/test_node_status_live_v2.py
      - tests/node_status_legacy_v1_runner.py
      - tests/node_status_v2_controller.py
      - tests/test_node_status_live_check.py
      - tests/test_node_status_live_cli.py
      - tests/fixtures/node_status_live_v1/**
      - tools/node_status_live_check.py
      - tools/node_status_refresh.py
      - tools/node_status_v1.py
      - tools/validate_node_status.py
      - architecture/node-status.schema.json
      - architecture/node-status-v1.schema.json
      - architecture/node-status-inputs.json
      - docs/site/current.json
      - docs/site/dependency-source/GRAPH.json
      - records/node_status/**
      - cbz/evidence/hard-gate-source-refresh-20261110/**
      - .github/workflows/node-status-v2-contract.yml
  push:
    branches: [main]
    paths:
      - tests/test_node_status_live_v2.py
      - tests/node_status_legacy_v1_runner.py
      - tests/node_status_v2_controller.py
      - tests/test_node_status_live_check.py
      - tests/test_node_status_live_cli.py
      - tests/fixtures/node_status_live_v1/**
      - tools/node_status_live_check.py
      - tools/node_status_refresh.py
      - tools/node_status_v1.py
      - tools/validate_node_status.py
      - architecture/node-status.schema.json
      - architecture/node-status-v1.schema.json
      - architecture/node-status-inputs.json
      - docs/site/current.json
      - docs/site/dependency-source/GRAPH.json
      - records/node_status/**
      - cbz/evidence/hard-gate-source-refresh-20261110/**
      - .github/workflows/node-status-v2-contract.yml

permissions:
  contents: read

jobs:
  targeted:
    name: Node-status v2 offline contracts (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NODE_STATUS_V2_MODE: ${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Prepare fixed offline evidence supervisor outside checkout
        run: |
          python3 -I -B -S - <<'PREPARE_PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          temporary = Path(os.environ["RUNNER_TEMP"])
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
          if (not temporary.is_absolute() or temporary.is_symlink()
                  or temporary.resolve(strict=True) != temporary or temporary.is_relative_to(root)):
              raise ValueError("fixed supervisor root is not external RUNNER_TEMP")
          if os.environ["GITHUB_REPOSITORY"] != "d6g8k5htny-coder/main":
              raise ValueError("wrong native repository")
          relative = "tests/node_status_v2_controller.py"
          expected_blob = "937e8921b5fd9045d00d7470177f010c9651f7aa"
          expected_sha256 = "210f91b68af38d11c993227c56cc1f61fcac1a02b912cceee21b9a6e2f723d6b"
          expected_bytes = 27043
          def git(*arguments):
              environment = {key: value for key, value in os.environ.items()
                  if not key.startswith("GIT_")}
              environment.update(GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL=os.devnull,
                  GIT_OPTIONAL_LOCKS="0", GIT_TERMINAL_PROMPT="0",
                  GIT_NO_REPLACE_OBJECTS="1", GIT_NO_LAZY_FETCH="1")
              return subprocess.check_output(
                  ["git", "--no-replace-objects", "--literal-pathspecs", "-c",
                   "core.fsmonitor=false", "-c", "core.hooksPath=/dev/null",
                   "-C", str(root), *arguments], env=environment, timeout=30)
          head = git("rev-parse", "--verify", "HEAD").decode("ascii").strip()
          if not re.fullmatch(r"[0-9a-f]{40}", head) or head != os.environ["GITHUB_SHA"]:
              raise ValueError("controller checked HEAD differs from native context")
          if Path(git("rev-parse", "--show-toplevel").decode().strip()).resolve() != root:
              raise ValueError("wrong native Git top-level")
          expected_row = ("100644 blob " + expected_blob + "\t" + relative + "\0").encode("ascii")
          if git("ls-tree", "--full-tree", "-z", head, "--", relative) != expected_row:
              raise ValueError("controller native path/mode/blob differs")
          source_path = root
          for part in relative.split("/"):
              source_path = source_path / part
              if source_path.is_symlink():
                  raise ValueError("controller source symlink refused")
          before = source_path.stat()
          if not stat.S_ISREG(before.st_mode) or before.st_mode & 0o111:
              raise ValueError("controller source must be regular non-executable")
          raw = source_path.read_bytes()
          after = source_path.stat()
          fields = ("st_dev", "st_ino", "st_mode", "st_size", "st_mtime_ns", "st_ctime_ns")
          if any(getattr(before, field) != getattr(after, field) for field in fields):
              raise ValueError("controller source changed during capture")
          if (len(raw) != expected_bytes or hashlib.sha256(raw).hexdigest() != expected_sha256
                  or git("cat-file", "blob", expected_blob) != raw):
              raise ValueError("controller working/native bytes differ from fixed source")
          path = temporary / "node-status-v2-controller.py"
          with path.open("xb") as stream:
              if stream.write(raw) != len(raw):
                  raise OSError("short fixed controller copy")
          with (temporary / "node-status-v2-controller.sha256").open("x", encoding="ascii") as stream:
              stream.write(expected_sha256 + "  " + str(path) + "\n")
          PREPARE_PY
      - name: Observe original twenty-three legacy helper cases
        if: ${{ !cancelled() }}
        env:
          NODE_STATUS_LEGACY_V1_EVIDENCE: ${{ runner.temp }}/node-status-legacy-v1-${{ matrix.mode }}
          NODE_STATUS_V2_TEST_EVIDENCE: ${{ runner.temp }}/node-status-v2-test-invocations-${{ matrix.mode }}
        run: |
          sha256sum -c "$RUNNER_TEMP/node-status-v2-controller.sha256"
          python3 -I -B -S "$RUNNER_TEMP/node-status-v2-controller.py" helper23
      - name: Observe original twenty legacy CLI cases
        if: ${{ !cancelled() }}
        env:
          NODE_STATUS_LEGACY_V1_EVIDENCE: ${{ runner.temp }}/node-status-legacy-v1-${{ matrix.mode }}
          NODE_STATUS_V2_TEST_EVIDENCE: ${{ runner.temp }}/node-status-v2-test-invocations-${{ matrix.mode }}
        run: |
          sha256sum -c "$RUNNER_TEMP/node-status-v2-controller.sha256"
          python3 -I -B -S "$RUNNER_TEMP/node-status-v2-controller.py" cli20
      - name: Observe twelve new v2 contracts including honest missing-name RED
        if: ${{ !cancelled() }}
        env:
          NODE_STATUS_LEGACY_V1_EVIDENCE: ${{ runner.temp }}/node-status-legacy-v1-${{ matrix.mode }}
          NODE_STATUS_V2_TEST_EVIDENCE: ${{ runner.temp }}/node-status-v2-test-invocations-${{ matrix.mode }}
        run: |
          sha256sum -c "$RUNNER_TEMP/node-status-v2-controller.sha256"
          python3 -I -B -S "$RUNNER_TEMP/node-status-v2-controller.py" current12
      - name: Print bounded whole originals after outer parent parsing
        if: ${{ !cancelled() }}
        env:
          NODE_STATUS_LEGACY_V1_EVIDENCE: ${{ runner.temp }}/node-status-legacy-v1-${{ matrix.mode }}
          NODE_STATUS_V2_TEST_EVIDENCE: ${{ runner.temp }}/node-status-v2-test-invocations-${{ matrix.mode }}
        run: |
          sha256sum -c "$RUNNER_TEMP/node-status-v2-controller.sha256"
          python3 -I -B -S "$RUNNER_TEMP/node-status-v2-controller.py" readback
      - name: Retain original outer and inner observations on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node-status-v2-offline-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/node-status-v2-offline-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/node-status-legacy-v1-${{ matrix.mode }}/
            ${{ runner.temp }}/node-status-v2-test-invocations-${{ matrix.mode }}/
            ${{ runner.temp }}/node-status-v2-controller.py
            ${{ runner.temp }}/node-status-v2-controller.sha256
          if-no-files-found: error
          retention-days: 30
