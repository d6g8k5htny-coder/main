# Node-status acceptance. This job is not a required check and is not part of
# workspace-landing. It does not edit any existing workflow step.
name: Node status

on:
  pull_request:
    paths:
      - 'architecture/node-status.schema.json'
      - 'records/node_status/**'
      - 'docs/site/**'
      - 'tools/validate_node_status.py'
      - 'tools/current_site_history.py'
      - 'tests/test_node_status_atlas.mjs'
      - 'tests/fixtures/node_status/**'
      - '.github/workflows/node-status.yml'
  push:
    branches: [main]
    paths:
      - 'architecture/node-status.schema.json'
      - 'records/node_status/**'
      - 'docs/site/**'
      - 'tools/validate_node_status.py'
      - 'tools/current_site_history.py'
      - 'tests/test_node_status_atlas.mjs'
      - 'tests/fixtures/node_status/**'
      - '.github/workflows/node-status.yml'

permissions:
  contents: read

jobs:
  node-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node-status atlas test and validator
        run: |
          node --test tests/test_node_status_atlas.mjs
          python3 -B -S tools/validate_node_status.py records/node_status
      - name: Require five real-record methods in normal Python
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/node-status-real-record-normal.log"
          {
            printf 'mode=normal\n'
            python3 -B -S -c 'import sys; print("executable=" + sys.executable); print("python=" + sys.version.replace("\n", " ")); print("optimize=" + str(sys.flags.optimize))'
            printf 'checked_commit='
            git rev-parse HEAD
            printf 'checked_tree='
            git rev-parse 'HEAD^{tree}'
            python3 -B -S -m unittest -v \
              tests.test_living_project_validation.RealRecordTests.test_adoption_on_merged_records \
              tests.test_living_project_validation.RealRecordTests.test_real_records_required_fields \
              tests.test_living_project_validation.RealRecordTests.test_real_records_source_rev_equals_first_source \
              tests.test_living_project_validation.RealRecordTests.test_real_records_evidence_id_pattern \
              tests.test_living_project_validation.RealRecordTests.test_real_records_match_published_projection
          } 2>&1 | tee "$log"
          grep -Ec '^Ran 5 tests in [0-9.]+s$' "$log" | grep -Fxq '1' || { echo '::error::Expected exactly one five-method unittest summary'; exit 1; }
          tail -n 1 "$log" | grep -Fxq 'OK' || { echo '::error::Required real-record methods did not finish without failures, errors or skips'; exit 1; }
          if grep -Fq ' ... skipped ' "$log"; then echo '::error::Required real-record method skipped'; exit 1; fi
          test "$(grep -Ec '^[^[:space:]]+ \(.*\) \.\.\. ' "$log")" -eq 5 || { echo '::error::Expected exactly five unittest method outcomes'; exit 1; }
          for method in \
            test_adoption_on_merged_records \
            test_real_records_required_fields \
            test_real_records_source_rev_equals_first_source \
            test_real_records_evidence_id_pattern \
            test_real_records_match_published_projection
          do
            expected="$method (tests.test_living_project_validation.RealRecordTests.$method) ... ok"
            test "$(grep -Fxc "$expected" "$log")" -eq 1 || { echo "::error::Required method did not pass exactly once: $method"; exit 1; }
          done
      - name: Require five real-record methods in optimized Python
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/node-status-real-record-optimized.log"
          {
            printf 'mode=optimized\n'
            python3 -B -O -S -c 'import sys; print("executable=" + sys.executable); print("python=" + sys.version.replace("\n", " ")); print("optimize=" + str(sys.flags.optimize))'
            printf 'checked_commit='
            git rev-parse HEAD
            printf 'checked_tree='
            git rev-parse 'HEAD^{tree}'
            python3 -B -O -S -m unittest -v \
              tests.test_living_project_validation.RealRecordTests.test_adoption_on_merged_records \
              tests.test_living_project_validation.RealRecordTests.test_real_records_required_fields \
              tests.test_living_project_validation.RealRecordTests.test_real_records_source_rev_equals_first_source \
              tests.test_living_project_validation.RealRecordTests.test_real_records_evidence_id_pattern \
              tests.test_living_project_validation.RealRecordTests.test_real_records_match_published_projection
          } 2>&1 | tee "$log"
          grep -Ec '^Ran 5 tests in [0-9.]+s$' "$log" | grep -Fxq '1' || { echo '::error::Expected exactly one five-method unittest summary'; exit 1; }
          tail -n 1 "$log" | grep -Fxq 'OK' || { echo '::error::Required real-record methods did not finish without failures, errors or skips'; exit 1; }
          if grep -Fq ' ... skipped ' "$log"; then echo '::error::Required real-record method skipped'; exit 1; fi
          test "$(grep -Ec '^[^[:space:]]+ \(.*\) \.\.\. ' "$log")" -eq 5 || { echo '::error::Expected exactly five unittest method outcomes'; exit 1; }
          for method in \
            test_adoption_on_merged_records \
            test_real_records_required_fields \
            test_real_records_source_rev_equals_first_source \
            test_real_records_evidence_id_pattern \
            test_real_records_match_published_projection
          do
            expected="$method (tests.test_living_project_validation.RealRecordTests.$method) ... ok"
            test "$(grep -Fxc "$expected" "$log")" -eq 1 || { echo "::error::Required method did not pass exactly once: $method"; exit 1; }
          done
