name: Public record lexical vector index
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-vector-index
  cancel-in-progress: false
jobs:
  rebuild:
    if: github.repository == 'd6g8k5htny-coder/main' && toJSON(github.event.repository.private) == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Test the index controls in both Python modes
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -S -m unittest discover -s tests -p test_public_vector_index.py -v 2>&1 | tee "$RUNNER_TEMP/index-normal.log"
          grep -Eq '^Ran [1-9][0-9]* tests? in ' "$RUNNER_TEMP/index-normal.log"
          python3 -B -O -S -m unittest discover -s tests -p test_public_vector_index.py -v 2>&1 | tee "$RUNNER_TEMP/index-optimized.log"
          grep -Eq '^Ran [1-9][0-9]* tests? in ' "$RUNNER_TEMP/index-optimized.log"
      - name: Rebuild pinned public blobs and emit complete bounded log delivery
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 -B -S tools/public_vector_index.py build --commit "$SOURCE_COMMIT" --output "$RUNNER_TEMP/public-vector-index.json"
          python3 -B -S tools/public_vector_index.py check --index "$RUNNER_TEMP/public-vector-index.json" --commit "$SOURCE_COMMIT"
          python3 -B -S tools/public_vector_index.py log --index "$RUNNER_TEMP/public-vector-index.json"
          printf 'Rebuilt lexical vectors at `%s`. Complete bounded payload is in the job log; no artifact or cache was uploaded. Retrieval does not confer scientific acceptance.\n' "$SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
