name: Register preflight candidate build
on:
  push:
    branches: [transport/register-integration-20260923]
permissions:
  contents: write
jobs:
  build-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6628463c1341d3c23d14913af9dad9af24822eb1
          path: research
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.16'
      - name: Install repository-pinned test dependencies
        working-directory: research
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock
      - name: Validate candidate and store only verified blobs and tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python transport/build_preflight.py --root "$GITHUB_WORKSPACE/research" --out "$GITHUB_WORKSPACE/build-report"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: register-preflight-candidate-20260923
          path: build-report/
          if-no-files-found: error
          retention-days: 2
