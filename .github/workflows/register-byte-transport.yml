name: Register byte transport (isolated; no scientific authority)
on:
  push:
    branches:
      - transport/register-r1-20260923
    paths:
      - .github/workflows/register-byte-transport.yml
permissions:
  contents: read
jobs:
  reconstruct-verified-export:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: transfer
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b02efe21d8d7475ac9b4aa25b3dcc26a5b6f4bf4
          path: research
          persist-credentials: false
          sparse-checkout: |
            registers/source/GP-REG-032_v1.2_export_2026-09-18.xlsx
            tools/registers_import.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Reconstruct exact R1, replay importer, reject mutations, store only blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python transfer/publish_rebuilt_blob.py --research "$GITHUB_WORKSPACE/research" --output "$GITHUB_WORKSPACE/transport_output" --publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: register-r1-rebuilt-20260923
          path: transport_output/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
