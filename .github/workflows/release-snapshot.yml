name: Release source custody and pinned toolchain replay
on:
  pull_request:
    paths:
      - tools/release_snapshot.py
      - tools/formal_execution_context.py
      - tests/test_release_snapshot.py
      - tests/test_formal_execution_context.py
      - .github/workflows/release-snapshot.yml
      - docs/RELEASE_OPERATIONS.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  source-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read-only collector controls in both Python modes
        run: |
          python3 -B -S -m unittest discover -s tests -p test_release_snapshot.py -v
          python3 -B -O -S -m unittest discover -s tests -p test_release_snapshot.py -v
          python3 -B -S -m unittest discover -s tests -p test_formal_execution_context.py -v
          python3 -B -O -S -m unittest discover -s tests -p test_formal_execution_context.py -v
      - name: Capture all allowlisted defaults and open PR source heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B -S tools/release_snapshot.py --output "$RUNNER_TEMP/release-snapshot"
      - name: Preserve source and review snapshots, including partial failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-source-custody-${{ github.run_id }}
          path: ${{ runner.temp }}/release-snapshot/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
  primary-toolchain-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: primary
    env:
      LEAN_NUM_THREADS: '2'
    steps:
      - name: Read source-execution binding tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: operations
          persist-credentials: false
      - name: Read the exact merged primary formal project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: d6g8k5htny-coder/Math-
          path: primary
          ref: 867d9e34b60186ff46ab5b3ecf8ad5ba6a5cc8b4
          persist-credentials: false
      - name: Check source and regression controls before installing tools
        run: |
          python3 -B -S -m unittest discover -s formal/tests -v
          python3 -B -O -S -m unittest discover -s formal/tests -v
          python3 -B -S formal/gate.py
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: primary/formal
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Rebuild, replay kernel, audit axioms and run false-proof controls
        run: python3 -B -S formal/gate.py --execute
      - name: Bind source and execution identities without rewriting the raw receipt
        run: |
          python3 -B -S ../operations/tools/formal_execution_context.py --source . --operations ../operations --expected-commit 867d9e34b60186ff46ab5b3ecf8ad5ba6a5cc8b4 --run-id "$GITHUB_RUN_ID"
      - name: Record installed runtime versions and executable hashes
        if: always()
        shell: bash
        run: |
          mkdir -p formal/.lake/formal-evidence
          {
            echo 'Execution location: disposable GitHub-hosted runner, not the owner laptop'
            git rev-parse HEAD
            python3 --version
            git --version
            elan --version
            cd formal
            lake env lean --version
            lake --version
            for name in lean lake leanchecker; do
              resolved="$(lake env which "$name")" || continue
              printf '%s: %s\n' "$name" "$resolved"
              sha256sum "$resolved"
            done
          } > formal/.lake/formal-evidence/runner-tools.txt 2>&1
      - name: Preserve fresh primary evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: primary-toolchain-evidence-${{ github.run_id }}
          path: primary/formal/.lake/formal-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
