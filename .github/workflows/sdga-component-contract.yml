name: sdga-component-task-a-contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: main
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install only the pinned core Lean toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: main/tests/fixtures/sdga_component
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Observe original D and E API contracts normally
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 -B -S tests/sdga_component_controller_contract.py \
            --output "$RUNNER_TEMP/sdga-task-a-normal" -v \
            2>&1 | tee "$RUNNER_TEMP/sdga-task-a-normal.log"
      - name: Observe original D and E API contracts with optimized Python
        timeout-minutes: 10
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 -B -O -S tests/sdga_component_controller_contract.py \
            --output "$RUNNER_TEMP/sdga-task-a-optimized" -v \
            2>&1 | tee "$RUNNER_TEMP/sdga-task-a-optimized.log"
      - name: Observe pure dependency contracts normally
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 -B -S tests/test_sdga_component_protocol.py -v \
            2>&1 | tee "$RUNNER_TEMP/sdga-pure-dependency-normal.log"
          grep -Eq '^Ran 12 tests in ' "$RUNNER_TEMP/sdga-pure-dependency-normal.log"
          grep -Eq '^OK$' "$RUNNER_TEMP/sdga-pure-dependency-normal.log"
      - name: Observe pure dependency contracts with optimized Python
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 -B -O -S tests/test_sdga_component_protocol.py -v \
            2>&1 | tee "$RUNNER_TEMP/sdga-pure-dependency-optimized.log"
          grep -Eq '^Ran 12 tests in ' "$RUNNER_TEMP/sdga-pure-dependency-optimized.log"
          grep -Eq '^OK$' "$RUNNER_TEMP/sdga-pure-dependency-optimized.log"
      - name: Observe Python-only object custody normally
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 -B -S tests/sdga_object_custody_contract.py \
            --output "$RUNNER_TEMP/sdga-object-custody-normal" -v \
            2>&1 | tee "$RUNNER_TEMP/sdga-object-custody-normal.log"
      - name: Observe Python-only object custody with optimized Python
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 -B -O -S tests/sdga_object_custody_contract.py \
            --output "$RUNNER_TEMP/sdga-object-custody-optimized" -v \
            2>&1 | tee "$RUNNER_TEMP/sdga-object-custody-optimized.log"
      - name: Observe Task D output admission normally
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 -B -S tests/sdga_ir_evidence_contract.py \
            --output "$RUNNER_TEMP/sdga-ir-admission-normal" -v \
            2>&1 | tee "$RUNNER_TEMP/sdga-ir-admission-normal.log"
      - name: Observe Task D output admission with optimized Python
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 -B -O -S tests/sdga_ir_evidence_contract.py \
            --output "$RUNNER_TEMP/sdga-ir-admission-optimized" -v \
            2>&1 | tee "$RUNNER_TEMP/sdga-ir-admission-optimized.log"
      - name: Observe all eight fixed source mutations normally
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 -B -S tests/sdga_component_mutations.py \
            --output "$RUNNER_TEMP/sdga-e-mutations-normal" \
            2>&1 | tee "$RUNNER_TEMP/sdga-e-mutations-normal.log"
      - name: Observe all eight fixed source mutations with optimized Python
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          set -euo pipefail
          python3 -B -O -S tests/sdga_component_mutations.py \
            --output "$RUNNER_TEMP/sdga-e-mutations-optimized" \
            2>&1 | tee "$RUNNER_TEMP/sdga-e-mutations-optimized.log"
      - name: Print original Python-only object-custody records
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import sys
          for mode in ("normal", "optimized"):
              root = Path(os.environ["RUNNER_TEMP"]) / ("sdga-object-custody-" + mode)
              paths = [root / name for name in
                       ("source-identities.json", "result.json", "cases.jsonl")]
              records = root / "records"
              if records.is_dir():
                  paths.extend(sorted(path for path in records.iterdir() if path.is_file()))
              for path in paths:
                  if not path.is_file():
                      print("CUSTODY_NOT_PRODUCED", mode, path.name, flush=True)
                      continue
                  raw = path.read_bytes()
                  print("ORIGINAL_CUSTODY_RECORD", mode, str(path.relative_to(root)),
                        "bytes=" + str(len(raw)),
                        "sha256=" + hashlib.sha256(raw).hexdigest(), flush=True)
                  sys.stdout.write(raw.decode("utf-8"))
                  if not raw.endswith(b"\n"):
                      sys.stdout.write("\n")
                  sys.stdout.flush()
          PY
      - name: Print original critical records and native stream identities
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import sys
          critical = (
              "source-identities.json", "result.json", "census.json",
              "subcases.jsonl", "inventory.jsonl",
              "fixture-classification.json", "commands.json",
              "task-d-sidecar-observation.json",
          )
          for mode in ("normal", "optimized"):
              root = Path(os.environ["RUNNER_TEMP"]) / ("sdga-task-a-" + mode)
              print("TASK_A_EVIDENCE_DIRECTORY", mode, root, flush=True)
              for name in critical:
                  path = root / name
                  if not path.is_file():
                      print("NOT_PRODUCED", mode, name, flush=True)
                      continue
                  raw = path.read_bytes()
                  print("ORIGINAL_RECORD", mode, name, "bytes=" + str(len(raw)),
                        "sha256=" + hashlib.sha256(raw).hexdigest(), flush=True)
                  sys.stdout.write(raw.decode("utf-8"))
                  if not raw.endswith(b"\n"):
                      sys.stdout.write("\n")
                  sys.stdout.flush()
              native = root / "native"
              if native.is_dir():
                  for path in sorted(native.iterdir()):
                      if path.suffix not in (".stdout", ".stderr") or not path.is_file():
                          continue
                      raw = path.read_bytes()
                      print("ORIGINAL_NATIVE_STREAM", mode, path.name,
                            "bytes=" + str(len(raw)),
                            "sha256=" + hashlib.sha256(raw).hexdigest(), flush=True)
                      sys.stdout.write(raw.decode("utf-8"))
                      if not raw.endswith(b"\n"):
                          sys.stdout.write("\n")
                      sys.stdout.flush()
              for name in ("bootstrap-error.txt", "controller-import.txt"):
                  path = root / name
                  if path.is_file():
                      raw = path.read_bytes()
                      print("ORIGINAL_SETUP_DIAGNOSTIC", mode, name,
                            "bytes=" + str(len(raw)),
                            "sha256=" + hashlib.sha256(raw).hexdigest(), flush=True)
                      sys.stdout.write(raw.decode("utf-8"))
                      if not raw.endswith(b"\n"):
                          sys.stdout.write("\n")
                      sys.stdout.flush()
              generated = sorted(root.glob("*.ir-manifest.json"))
              envelope_root = root / "ir-evidence"
              if envelope_root.is_dir():
                  generated.extend(sorted(envelope_root.glob("*.json")))
              for path in generated:
                  raw = path.read_bytes()
                  print("ORIGINAL_IR_ARTIFACT", mode, str(path.relative_to(root)),
                        "bytes=" + str(len(raw)),
                        "sha256=" + hashlib.sha256(raw).hexdigest(), flush=True)
                  sys.stdout.write(raw.decode("utf-8"))
                  if not raw.endswith(b"\n"):
                      sys.stdout.write("\n")
                  sys.stdout.flush()
          for mode in ("normal", "optimized"):
              root = Path(os.environ["RUNNER_TEMP"]) / ("sdga-ir-admission-" + mode)
              for name in ("source-identities.json", "result.json", "routes.jsonl"):
                  path = root / name
                  if not path.is_file():
                      print("IR_ADMISSION_NOT_PRODUCED", mode, name, flush=True)
                      continue
                  raw = path.read_bytes()
                  print("ORIGINAL_IR_ADMISSION_RECORD", mode, name,
                        "bytes=" + str(len(raw)),
                        "sha256=" + hashlib.sha256(raw).hexdigest(), flush=True)
                  sys.stdout.write(raw.decode("utf-8"))
                  if not raw.endswith(b"\n"):
                      sys.stdout.write("\n")
                  sys.stdout.flush()
          print("Evidence printed from runner files before upload; no ZIP read is claimed.",
                flush=True)
          PY
      - name: Print original E contracts and mutation evidence
        if: always()
        run: |
          python3 -B -S - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          context = {
              "candidate_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "github_job": os.environ["GITHUB_JOB"],
          }
          def original(path, root, mode, group):
              if not path.is_file():
                  print("SDGA_E_NOT_PRODUCED", mode, group, str(path), flush=True)
                  return
              raw = path.read_bytes()
              try:
                  body = raw.decode("utf-8")
                  encoding = "utf-8"
              except UnicodeDecodeError:
                  body = raw.hex()
                  encoding = "hex"
              value = {
                  **context, "mode": mode, "group": group,
                  "path": str(path.relative_to(root)), "bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(), "encoding": encoding,
              }
              print("SDGA_E_ORIGINAL_BYTES_BEGIN " + json.dumps(value, sort_keys=True), flush=True)
              sys.stdout.write(body)
              if not body.endswith("\n"):
                  sys.stdout.write("\n")
              sys.stdout.flush()
              print("SDGA_E_ORIGINAL_BYTES_END " + json.dumps(value, sort_keys=True), flush=True)
          def text_tree(root, mode, group, skip):
              if not root.is_dir():
                  print("SDGA_E_NOT_PRODUCED", mode, group, str(root), flush=True)
                  return
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(root)
                  if any(part in skip for part in relative.parts):
                      continue
                  if path.suffix in (".json", ".jsonl", ".stdout", ".stderr",
                                     ".log", ".diff", ".lean", ".py", ".yml", ".toml"):
                      original(path, root, mode, group)
          for mode in ("normal", "optimized"):
              temp = Path(os.environ["RUNNER_TEMP"])
              controller = temp / ("sdga-task-a-" + mode + "-controller")
              text_tree(controller, mode, "controller", {"owned", "compile-owned", ".lake"})
              mutation = temp / ("sdga-e-mutations-" + mode)
              # Worktree source copies are tracked by candidate+source maps. Print only
              # their explicitly captured failure/command/source records below.
              text_tree(mutation, mode, "mutations",
                        {"M2-baseline-tree", "M2-mutant-tree", "owned", ".lake", ".git"})
              if mutation.is_dir():
                  for tree in ("M2-baseline-tree", "M2-mutant-tree"):
                      path = mutation.parent / (mutation.name + "-" + tree) / "tools/sdga/Component.lean"
                      if path.is_file():
                          original(path, mutation.parent, mode, "M2-actual-worktree-source")
          print("Original runner bytes printed before upload; no ZIP-member read claimed.",
                flush=True)
          PY
      - name: Retain original source, cases, objects and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdga-task-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sdga-task-a-normal/
            ${{ runner.temp }}/sdga-task-a-optimized/
            ${{ runner.temp }}/sdga-task-a-normal.log
            ${{ runner.temp }}/sdga-task-a-optimized.log
            ${{ runner.temp }}/sdga-task-a-normal-controller/
            ${{ runner.temp }}/sdga-task-a-optimized-controller/
            ${{ runner.temp }}/sdga-e-mutations-normal/
            ${{ runner.temp }}/sdga-e-mutations-optimized/
            ${{ runner.temp }}/sdga-e-mutations-normal.log
            ${{ runner.temp }}/sdga-e-mutations-optimized.log
            ${{ runner.temp }}/sdga-pure-dependency-normal.log
            ${{ runner.temp }}/sdga-pure-dependency-optimized.log
            ${{ runner.temp }}/sdga-object-custody-normal/
            ${{ runner.temp }}/sdga-object-custody-optimized/
            ${{ runner.temp }}/sdga-object-custody-normal.log
            ${{ runner.temp }}/sdga-object-custody-optimized.log
            ${{ runner.temp }}/sdga-ir-admission-normal/
            ${{ runner.temp }}/sdga-ir-admission-optimized/
            ${{ runner.temp }}/sdga-ir-admission-normal.log
            ${{ runner.temp }}/sdga-ir-admission-optimized.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
