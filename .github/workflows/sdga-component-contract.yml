name: sdga-component-task-a-contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-a:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: main
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install only the pinned core Lean toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: main/tests/fixtures/sdga_component
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Observe Task A contracts normally
        run: |
          set -euo pipefail
          python3 -B -S tests/sdga_component_contract.py \
            --output "$RUNNER_TEMP/sdga-task-a-normal" -v \
            2>&1 | tee "$RUNNER_TEMP/sdga-task-a-normal.log"
      - name: Observe Task A contracts with optimized Python
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 -B -O -S tests/sdga_component_contract.py \
            --output "$RUNNER_TEMP/sdga-task-a-optimized" -v \
            2>&1 | tee "$RUNNER_TEMP/sdga-task-a-optimized.log"
      - name: Observe pure dependency contracts normally
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 -B -S tests/test_sdga_component_protocol.py -v \
            2>&1 | tee "$RUNNER_TEMP/sdga-pure-dependency-normal.log"
          grep -Eq '^Ran 12 tests in ' "$RUNNER_TEMP/sdga-pure-dependency-normal.log"
          grep -Eq '^OK$' "$RUNNER_TEMP/sdga-pure-dependency-normal.log"
      - name: Observe pure dependency contracts with optimized Python
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 -B -O -S tests/test_sdga_component_protocol.py -v \
            2>&1 | tee "$RUNNER_TEMP/sdga-pure-dependency-optimized.log"
          grep -Eq '^Ran 12 tests in ' "$RUNNER_TEMP/sdga-pure-dependency-optimized.log"
          grep -Eq '^OK$' "$RUNNER_TEMP/sdga-pure-dependency-optimized.log"
      - name: Observe Python-only object custody normally
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 -B -S tests/sdga_object_custody_contract.py \
            --output "$RUNNER_TEMP/sdga-object-custody-normal" -v \
            2>&1 | tee "$RUNNER_TEMP/sdga-object-custody-normal.log"
      - name: Observe Python-only object custody with optimized Python
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 -B -O -S tests/sdga_object_custody_contract.py \
            --output "$RUNNER_TEMP/sdga-object-custody-optimized" -v \
            2>&1 | tee "$RUNNER_TEMP/sdga-object-custody-optimized.log"
      - name: Print original Python-only object-custody records
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import sys
          for mode in ("normal", "optimized"):
              root = Path(os.environ["RUNNER_TEMP"]) / ("sdga-object-custody-" + mode)
              paths = [root / name for name in
                       ("source-identities.json", "result.json", "cases.jsonl")]
              records = root / "records"
              if records.is_dir():
                  paths.extend(sorted(path for path in records.iterdir() if path.is_file()))
              for path in paths:
                  if not path.is_file():
                      print("CUSTODY_NOT_PRODUCED", mode, path.name, flush=True)
                      continue
                  raw = path.read_bytes()
                  print("ORIGINAL_CUSTODY_RECORD", mode, str(path.relative_to(root)),
                        "bytes=" + str(len(raw)),
                        "sha256=" + hashlib.sha256(raw).hexdigest(), flush=True)
                  sys.stdout.write(raw.decode("utf-8"))
                  if not raw.endswith(b"\n"):
                      sys.stdout.write("\n")
                  sys.stdout.flush()
          PY
      - name: Print original critical records and native stream identities
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import sys
          critical = (
              "source-identities.json", "result.json", "census.json",
              "subcases.jsonl", "inventory.jsonl",
              "fixture-classification.json", "commands.json",
          )
          for mode in ("normal", "optimized"):
              root = Path(os.environ["RUNNER_TEMP"]) / ("sdga-task-a-" + mode)
              print("TASK_A_EVIDENCE_DIRECTORY", mode, root, flush=True)
              for name in critical:
                  path = root / name
                  if not path.is_file():
                      print("NOT_PRODUCED", mode, name, flush=True)
                      continue
                  raw = path.read_bytes()
                  print("ORIGINAL_RECORD", mode, name, "bytes=" + str(len(raw)),
                        "sha256=" + hashlib.sha256(raw).hexdigest(), flush=True)
                  sys.stdout.write(raw.decode("utf-8"))
                  if not raw.endswith(b"\n"):
                      sys.stdout.write("\n")
                  sys.stdout.flush()
              native = root / "native"
              if native.is_dir():
                  for path in sorted(native.iterdir()):
                      if path.suffix not in (".stdout", ".stderr") or not path.is_file():
                          continue
                      raw = path.read_bytes()
                      print("ORIGINAL_NATIVE_STREAM", mode, path.name,
                            "bytes=" + str(len(raw)),
                            "sha256=" + hashlib.sha256(raw).hexdigest(), flush=True)
                      sys.stdout.write(raw.decode("utf-8"))
                      if not raw.endswith(b"\n"):
                          sys.stdout.write("\n")
                      sys.stdout.flush()
              for name in ("bootstrap-error.txt", "controller-import.txt"):
                  path = root / name
                  if path.is_file():
                      raw = path.read_bytes()
                      print("ORIGINAL_SETUP_DIAGNOSTIC", mode, name,
                            "bytes=" + str(len(raw)),
                            "sha256=" + hashlib.sha256(raw).hexdigest(), flush=True)
                      sys.stdout.write(raw.decode("utf-8"))
                      if not raw.endswith(b"\n"):
                          sys.stdout.write("\n")
                      sys.stdout.flush()
          print("Evidence printed from runner files before upload; no ZIP read is claimed.",
                flush=True)
          PY
      - name: Retain original source, cases, objects and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdga-task-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sdga-task-a-normal/
            ${{ runner.temp }}/sdga-task-a-optimized/
            ${{ runner.temp }}/sdga-task-a-normal.log
            ${{ runner.temp }}/sdga-task-a-optimized.log
            ${{ runner.temp }}/sdga-pure-dependency-normal.log
            ${{ runner.temp }}/sdga-pure-dependency-optimized.log
            ${{ runner.temp }}/sdga-object-custody-normal/
            ${{ runner.temp }}/sdga-object-custody-optimized/
            ${{ runner.temp }}/sdga-object-custody-normal.log
            ${{ runner.temp }}/sdga-object-custody-optimized.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
