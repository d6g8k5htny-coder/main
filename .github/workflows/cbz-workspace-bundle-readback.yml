name: CBZ Workspace native evidence readback
on:
  push:
    branches: [codex/cbz-architecture-observation-20261110]
    paths: [.github/workflows/cbz-workspace-bundle-readback.yml]
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: d6g8k5htny-coder/Universal-Law-Workspace
          ref: abe9604f8fe7cebc72fb4673c9c47fa645e7d362
          path: workspace-candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify original committed bundle
        run: python3 -B -S cbz/evidence/workspace-bundle-readback-20261110/bundle_readback.py workspace-candidate "$RUNNER_TEMP/workspace-bundle-readback"
      - name: Retain original bytes and observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cbz-workspace-bundle-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workspace-bundle-readback
          include-hidden-files: true
          if-no-files-found: error
