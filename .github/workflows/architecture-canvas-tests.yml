name: Architecture native reader fixed twelve controls
# SOURCE-ONLY successor of historical77d35fef; no runtime authority from this file.
# Called only by Root's separately reviewed literal immutable M/P/C/A composition.
# P=C is the closed initial profile; roles remain separately observed.
# Historical mountpoint correction is preserved. All new runtime evidence NOT_RUN.
'on':
  workflow_call:
    inputs:
      candidate_commit:
        required: true
        type: string
      runner_commit:
        required: true
        type: string
      admission_commit:
        required: true
        type: string
      admission_sha256:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: architecture-canvas-tests-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  canvas:
    name: architecture-canvas-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: node:24.21.0-bookworm-slim@sha256:51b1100cc2a83d370c6a60952e3f2989c8a43159d0e38586e090f3b3326efefd
      CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
      RUNNER_COMMIT: ${{ inputs.runner_commit }}
      ADMISSION_COMMIT: ${{ inputs.admission_commit }}
      ADMISSION_SHA256: ${{ inputs.admission_sha256 }}
      CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
      CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Capture caller M without executing checkout content
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: caller
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 1
      - name: Capture candidate C and runner P initial P equals C profile
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.candidate_commit }}
          path: candidate
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 1
      - name: Capture separate external admission A as data
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.admission_commit }}
          path: admission
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 1
      - name: Establish native identity and bounded fixture filesystems
        timeout-minutes: 1
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/canvas-tests"
          mkdir -m 0700 "$base"
          printf '%s\n' "$GITHUB_REPOSITORY" > "$base/repository.txt"
          printf '%s\n' "$CANDIDATE_COMMIT" > "$base/checked-commit.txt"
          printf '%s\n' "$GITHUB_SHA" > "$base/caller-commit.txt"
          printf '%s\n' "$RUNNER_COMMIT" > "$base/runner-commit.txt"
          printf '%s\n' "$ADMISSION_COMMIT" > "$base/admission-commit.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$base/run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$base/run-attempt.txt"
          # No project source execution before closed external admission below.
          for label in inputs work publish; do
            mkdir "$base/$label"
            truncate -s 64M "$base/$label.img"
            mkfs.ext4 -F "$base/$label.img" > "$base/$label-filesystem.log" 2>&1
            sudo mount -o loop,nodev,nosuid,noexec "$base/$label.img" "$base/$label"
            sudo mkdir "$base/$label/payload"
            sudo chown "$(id -u):$(id -g)" "$base/$label/payload"
            chmod 0700 "$base/$label/payload"
          done
          mkdir "$base/inputs/payload/source" "$base/inputs/payload/control"
          sudo chown 65532:65532 "$base/work/payload"
          sudo chmod 0755 "$base/work/payload"
          python3 -I -B -S - <<'PY'
          """Fixed host verifier embedded verbatim in the immutable workflow; stdlib only.

          This is authored source. It has not been executed against a project checkout.
          The separately reviewed caller M supplies authority through literal P/C/A pins.
          An observed current source hash or this data record alone supplies no authority.
          """
          import hashlib
          import json
          import os
          import pathlib
          import re
          import signal
          import stat
          import subprocess

          REPOSITORY = 'd6g8k5htny-coder/main'
          WORKFLOW = '.github/workflows/architecture-canvas-tests.yml'
          CALLER = '.github/workflows/canvas-reader-native-admission.yml'
          ADMISSION = '.github/admissions/canvas-reader-native-v1.json'
          IMAGE = 'node:24.21.0-bookworm-slim@sha256:51b1100cc2a83d370c6a60952e3f2989c8a43159d0e38586e090f3b3326efefd'
          NAMES = [
              'D00 setup source pins and exports',
              'O01 independent partial-edge oracle literal calibration',
              'D01 signed zero and complete cubic outputs',
              'D02 unbounded native BigInt exact intervals',
              'D03 owned immutable input result and selection',
              'D04 native admission without coercion or replacement',
              'D05 insertion prefixes and complete tied level',
              'D06 independent periodic BFS selected state',
              'D07 strict navigation and whole-sweep preservation',
              'D08 staged atomic commit and stale tickets',
              'D09 complete escaped static HTML text',
              'D10 declared native provenance without false joins',
          ]
          PINS = [
              ('docs/plans/2026-10-09-canvas-model-contract.md', 13354, 'ab5315ab47014bc5ce2f89f432239ebff30998d5', '3473a664be9126b67006527f5257a7eeb4c2082c836d7ff1b38e21f0d40eecbc'),
              ('interface/src/scripts/cubic-model.mjs', 1897, '0cfd5acf6c031cfaf54320d292c4f2a8a07eca08', 'fbff097a93429652ce5077056c400343b1472375a9cb1cbc388894c7e7bf2051'),
              ('interface/src/scripts/elder-model.mjs', 5335, 'aab4a06a5ef0fdde609192d37169b578fcbcef19', 'd92b8f6139d42360a35e933b40a287414b95811f14f0dc19c520d1d2558ec767'),
              ('interface/src/scripts/canvas-reader-state.mjs', 13360, '666917f42be515cf23aa26f00490db7a4fd642b7', 'f001e8aa7ec8073d3a8293196de2adb71eb6c617cfa4b662868278a03ee6fd6d'),
              ('interface/src/scripts/canvas-reader-view.mjs', 30228, '3b4becd4c4b25619258fc4758f8ad85f046e663c', '1e8cdcb69cff40dd7539abbf53e8f32ba6c0f6e9bfec9956ce685a555cc518a7'),
              ('interface/tests/canvas-reader.test.mjs', 36177, '6c8c481ff8e8248667223330166fc5479cfb1d68', 'f614ba8abf7a59a3ab5090b60b9e6e08f0a9d674e35e6849362ea02a5553c031'),
          ]
          PAYLOAD = [dict(path=p, mode='100644', bytes=n, git_blob=b, sha256=s) for p, n, b, s in PINS]
          CONTROLS = [dict(name=n, classification='SETUP' if i == 0 else 'CHECKER' if i == 1 else 'BEHAVIOR') for i, n in enumerate(NAMES)]
          RUNTIME = {
              'image': IMAGE, 'platform': 'linux/amd64', 'node': '/usr/local/bin/node',
              'version': '24.21.0', 'user': '65532:65532', 'cwd': '/source',
              'argv': ['--test', '--test-reporter=tap', '--test-concurrency=1', '/source/interface/tests/canvas-reader.test.mjs'],
              'environment': {'PATH': '/usr/local/bin:/usr/bin:/bin', 'LANG': 'C.UTF-8', 'TZ': 'UTC', 'NODE_DISABLE_COLORS': '1', 'NODE_OPTIONS': ''},
              'child_count': 1, 'child_seconds': 60, 'child_grace_seconds': 5,
              'pull_seconds': 180, 'pull_grace_seconds': 10, 'container_seconds': 180, 'container_grace_seconds': 10,
              'network': 'none', 'read_only_root': True, 'cap_drop': ['ALL'], 'security_opt': ['no-new-privileges'],
              'ipc': 'private', 'cgroupns': 'private', 'cpu_nano': 2000000000, 'memory_bytes': 1073741824,
              'memory_swap_bytes': 1073741824, 'pids': 128, 'fsize_bytes': 4194304, 'nofile': 256,
              'tmpfs': '/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777', 'log_driver': 'none',
              'fixture_filesystems': {'inputs': 67108864, 'work': 67108864, 'publish': 67108864},
              'fixture_mount_flags': ['loop', 'nodev', 'nosuid', 'noexec'], 'stream_bytes': 4194304,
              'collector_attempted_bytes': 33554432, 'job_minutes': 20,
          }
          CLOSURE = {
              'method': 'EXACT_SIX_REVIEWED_SOURCE_BYTES_NO_DISCOVERY',
              'review_sha256': '729b7112d21d2e5fcdc4d06fbd6d79b0309fa8aefdd302d7700ccca866a20fde',
              'state_imports': ['./cubic-model.mjs', './elder-model.mjs'], 'view_imports': [], 'model_imports': [],
              'test_builtin_imports': ['node:test', 'node:assert/strict', 'node:fs/promises', 'node:crypto'],
              'test_dynamic_targets': ['../src/scripts/cubic-model.mjs', '../src/scripts/elder-model.mjs', '../src/scripts/canvas-reader-state.mjs', '../src/scripts/canvas-reader-view.mjs'],
              'test_dynamic_module_source_reads': ['../src/scripts/cubic-model.mjs', '../src/scripts/elder-model.mjs', '../src/scripts/canvas-reader-state.mjs', '../src/scripts/canvas-reader-view.mjs'],
              'test_source_reads': ['interface/src/scripts/cubic-model.mjs', 'interface/src/scripts/elder-model.mjs', 'docs/plans/2026-10-09-canvas-model-contract.md'],
              'additional_project_helpers': False, 'eval_function_child_worker_bootstrap_in_payload': False,
              'runtime_builtins_remain_available': True, 'node_permission_sandbox_claimed': False,
          }

          def require(condition, message):
              if not condition:
                  raise ValueError(message)

          def sha(raw):
              return hashlib.sha256(raw).hexdigest()

          def git_identity(kind, raw):
              return hashlib.sha1(kind.encode() + b' ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()

          def hex_value(value, length):
              return type(value) is str and re.fullmatch('[0-9a-f]{' + str(length) + '}', value) is not None

          def keys(value, expected):
              require(type(value) is dict and set(value) == set(expected), 'unknown or missing admission keys')

          def same(actual, expected):
              # Python equality alone treats JSON true as equal to 1. Preserve JSON types.
              return json.dumps(actual, sort_keys=True, separators=(',', ':')) == json.dumps(expected, sort_keys=True, separators=(',', ':'))

          def unique(pairs):
              value = {}
              for key, item in pairs:
                  require(key not in value, 'duplicate JSON key')
                  value[key] = item
              return value

          def json_data(raw):
              return json.loads(raw.decode('utf-8'), object_pairs_hook=unique,
                                parse_constant=lambda unused: (_ for _ in ()).throw(ValueError('nonfinite JSON')))

          def original(root, relative, limit, allow_empty=False):
              parts = relative.split('/')
              require(parts and all(part not in ('', '.', '..') for part in parts), 'unsafe original path')
              current = os.open(root, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              descriptor = None
              try:
                  for part in parts[:-1]:
                      nxt = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=current)
                      os.close(current)
                      current = nxt
                  descriptor = os.open(parts[-1], os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=current)
                  before = os.fstat(descriptor)
                  require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1
                          and (0 if allow_empty else 1) <= before.st_size <= limit, 'original regular byte refusal')
                  chunks, count = [], 0
                  while True:
                      chunk = os.read(descriptor, min(65536, limit + 1 - count))
                      if not chunk:
                          break
                      count += len(chunk)
                      require(count <= limit, 'original growth refusal')
                      chunks.append(chunk)
                  after = os.fstat(descriptor)
                  require(stat.S_ISREG(after.st_mode) and after.st_nlink == 1 and count == before.st_size
                          and tuple(getattr(before, k) for k in ('st_dev', 'st_ino', 'st_size', 'st_mtime_ns', 'st_ctime_ns'))
                          == tuple(getattr(after, k) for k in ('st_dev', 'st_ino', 'st_size', 'st_mtime_ns', 'st_ctime_ns')),
                          'original changed during read')
                  return b''.join(chunks)
              finally:
                  if descriptor is not None:
                      os.close(descriptor)
                  os.close(current)

          def git(root, *args, limit=2**20):
              # Only fixed read-only Git plumbing; no candidate script/import is executed.
              def expired(unused_signal, unused_frame):
                  raise TimeoutError('Git read timeout')
              previous = signal.signal(signal.SIGALRM, expired)
              process = subprocess.Popen(['git', '-C', str(root), *args], stdin=subprocess.DEVNULL,
                                         stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              try:
                  signal.alarm(10)
                  raw = process.stdout.read(limit + 1)
                  require(len(raw) <= limit, 'Git output bound')
                  require(process.wait(timeout=2) == 0, 'Git read failed')
                  return raw
              finally:
                  signal.alarm(0)
                  signal.signal(signal.SIGALRM, previous)
                  if process.poll() is None:
                      process.kill()
                      process.wait(timeout=2)
                  process.stdout.close()

          def commit(root, expected):
              require(git(root, 'rev-parse', 'HEAD').decode().strip() == expected, 'checkout commit mismatch')
              raw = git(root, 'cat-file', 'commit', expected)
              require(git_identity('commit', raw) == expected, 'raw commit identity mismatch')
              header = raw.split(b'\n\n', 1)[0].split(b'\n')
              trees = [line[5:].decode('ascii') for line in header if line.startswith(b'tree ')]
              parents = [line[7:].decode('ascii') for line in header if line.startswith(b'parent ')]
              require(len(trees) == 1 and hex_value(trees[0], 40) and len(parents) <= 16
                      and all(hex_value(p, 40) for p in parents), 'commit tree/parents refusal')
              return raw, dict(commit=expected, tree=trees[0], ordered_parents=parents)

          def tree_entry(root, revision, path, raw):
              line = git(root, 'ls-tree', '-z', revision, '--', path, limit=1024)
              expected = ('100644 blob ' + git_identity('blob', raw) + '\t' + path + '\0').encode()
              require(line == expected, 'Git tree mode/blob/path mismatch')

          def controller(workflow):
              start = b'          cat > "$control/run.mjs" <<\'JS\'\n'
              end = b'          JS\n'
              require(workflow.count(start) == 1, 'controller start cardinality')
              tail = workflow.split(start, 1)[1]
              require(tail.count(end) == 1, 'controller end cardinality')
              lines = tail.split(end, 1)[0].splitlines(keepends=True)
              require(lines and all(line.startswith(b'          ') for line in lines), 'controller literal indentation')
              return b''.join(line[10:] for line in lines)

          def caller_bytes(candidate, runner, admission_commit, admission_sha256):
              return ("name: Admit fixed native reader controls\n'on':\n  workflow_dispatch:\npermissions:\n  contents: read\njobs:\n  reader:\n    uses: " + REPOSITORY + '/' + WORKFLOW + '@' + runner + '\n    with:\n'
                      + '      candidate_commit: ' + candidate + '\n      runner_commit: ' + runner
                      + '\n      admission_commit: ' + admission_commit + '\n      admission_sha256: ' + admission_sha256 + '\n').encode()

          def main():
              workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
              base = pathlib.Path(os.environ['RUNNER_TEMP']) / 'canvas-tests'
              source = base / 'inputs/payload/source'
              retained = base / 'identity-originals'
              retained.mkdir()
              candidate, runner, external = (os.environ[k] for k in ('CANDIDATE_COMMIT', 'RUNNER_COMMIT', 'ADMISSION_COMMIT'))
              admission_sha256, caller = os.environ['ADMISSION_SHA256'], os.environ['GITHUB_SHA']
              require(all(hex_value(v, 40) for v in (candidate, runner, external, caller))
                      and hex_value(admission_sha256, 64), 'immutable input identity refusal')
              # Deliberately closed initial profile. P and C remain distinct identity roles.
              require(runner == candidate, 'initial fixed profile requires P=C')
              require(os.environ['GITHUB_REPOSITORY'] == REPOSITORY
                      and os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
                      and os.environ['GITHUB_REF'] == 'refs/heads/main'
                      and os.environ['CALLER_WORKFLOW_REF'] == REPOSITORY + '/' + CALLER + '@refs/heads/main'
                      and os.environ['CALLER_WORKFLOW_SHA'] == caller, 'native caller context refusal')
              roots = {name: workspace / name for name in ('caller', 'candidate', 'admission')}
              commits = {}
              for role, revision in (('caller', caller), ('candidate', candidate), ('admission', external)):
                  raw, identity = commit(roots[role], revision)
                  commits[role] = identity
                  (retained / (role + '-commit.raw')).write_bytes(raw)
              commits['runner'] = dict(commits['candidate'])
              # R01: derive the witness from the already rehashed raw C identity, not
              # shallow pretty-format history. Retain true ordered parents and the join.
              candidate_identity = commits['candidate']
              candidate_witness = (candidate_identity['tree'] + '\n'
                                   + ' '.join(candidate_identity['ordered_parents']) + '\n').encode('ascii')
              require(42 <= len(candidate_witness) <= 1024, 'candidate tree/parents witness byte refusal')
              with (base / 'checked-tree-and-parents.txt').open('xb') as stream:
                  stream.write(candidate_witness)
              (retained / 'runner-commit.raw').write_bytes((retained / 'candidate-commit.raw').read_bytes())
              admission_raw = original(roots['admission'], ADMISSION, 262144)
              require(sha(admission_raw) == admission_sha256, 'external admission raw SHA mismatch')
              tree_entry(roots['admission'], external, ADMISSION, admission_raw)
              admission = json_data(admission_raw)
              keys(admission, ['schema_version', 'profile', 'repository', 'candidate', 'runner', 'payload', 'controls',
                               'runtime', 'closure', 'caller', 'root_admission'])
              require(type(admission['schema_version']) is int and admission['schema_version'] == 1
                      and admission['profile'] == 'READER_NATIVE_FIXED12_V1' and admission['repository'] == REPOSITORY,
                      'admission version/profile/repository refusal')
              require(same(admission['candidate'], commits['candidate']), 'admitted candidate tree/ordered parents mismatch')
              keys(admission['runner'], ['commit', 'workflow_path', 'workflow_bytes', 'workflow_sha256', 'controller_bytes', 'controller_sha256'])
              runner_data = admission['runner']
              require(runner_data['commit'] == runner and runner_data['workflow_path'] == WORKFLOW
                      and type(runner_data['workflow_bytes']) is int and 0 < runner_data['workflow_bytes'] <= 262144
                      and type(runner_data['controller_bytes']) is int and 0 < runner_data['controller_bytes'] <= 262144
                      and hex_value(runner_data['workflow_sha256'], 64) and hex_value(runner_data['controller_sha256'], 64),
                      'runner source data refusal')
              require(same(admission['payload'], PAYLOAD) and same(admission['controls'], CONTROLS)
                      and same(admission['runtime'], RUNTIME) and same(admission['closure'], CLOSURE),
                      'closed payload/control/runtime/closure admission mismatch')
              require(admission['caller'] == dict(path=CALLER, event='workflow_dispatch', ref='refs/heads/main'),
                      'admitted caller route mismatch')
              keys(admission['root_admission'], ['url', 'purpose', 'scope'])
              authority = admission['root_admission']
              require(type(authority['url']) is str and len(authority['url']) <= 256
                      and re.fullmatch(r'https://github\.com/d6g8k5htny-coder/main/pull/345#issuecomment-[1-9][0-9]*', authority['url'])
                      and authority['purpose'] == 'EXECUTE_READER_NATIVE_FIXED12'
                      and authority['scope'] == 'EXACT_C_P_A_AND_LITERAL_CALLER_REVIEW_REQUIRED', 'Root admission data refusal')
              workflow = original(roots['candidate'], WORKFLOW, 262144)
              tree_entry(roots['candidate'], runner, WORKFLOW, workflow)
              control = controller(workflow)
              require((len(workflow), sha(workflow)) == (runner_data['workflow_bytes'], runner_data['workflow_sha256'])
                      and (len(control), sha(control)) == (runner_data['controller_bytes'], runner_data['controller_sha256']),
                      'external runner/controller pin mismatch')
              caller_raw = original(roots['caller'], CALLER, 16384)
              require(caller_raw == caller_bytes(candidate, runner, external, admission_sha256),
                      'caller is not exact closed literal reusable-workflow source')
              tree_entry(roots['caller'], caller, CALLER, caller_raw)
              event_path = pathlib.Path(os.environ['GITHUB_EVENT_PATH'])
              event = original(event_path.parent, event_path.name, 2**20)
              event_data = json_data(event)
              require(type(event_data) is dict and event_data.get('ref') == 'refs/heads/main'
                      and event_data.get('inputs') in (None, {})
                      and type(event_data.get('repository')) is dict
                      and event_data['repository'].get('full_name') == REPOSITORY, 'native dispatch event refusal')
              bindings = []
              for expected in PAYLOAD:
                  path = expected['path']
                  raw = original(roots['candidate'], path, 2**20)
                  tree_entry(roots['candidate'], candidate, path, raw)
                  require((len(raw), git_identity('blob', raw), sha(raw))
                          == (expected['bytes'], expected['git_blob'], expected['sha256']), 'closed source admission refusal')
                  output = source / path
                  output.parent.mkdir(parents=True, exist_ok=True)
                  with output.open('xb') as stream:
                      stream.write(raw)
                  output.chmod(0o444)
                  bindings.append(dict(expected, presence='PRESENT'))
              expected_leaves = {record['path'] for record in PAYLOAD}
              expected_directories = {str(pathlib.PurePosixPath(p).parent) for p in expected_leaves}
              expected_directories |= {'docs', 'interface', 'interface/src'}
              observed_leaves, observed_directories = set(), set()
              for directory, subdirectories, files in os.walk(source, followlinks=False):
                  for name in subdirectories + files:
                      path = pathlib.Path(directory) / name
                      info = os.lstat(path)
                      relative = path.relative_to(source).as_posix()
                      if stat.S_ISDIR(info.st_mode):
                          observed_directories.add(relative)
                      else:
                          require(stat.S_ISREG(info.st_mode) and info.st_nlink == 1 and stat.S_IMODE(info.st_mode) == 0o444,
                                  'capture leaf type/link/mode refusal')
                          observed_leaves.add(relative)
              require(observed_leaves == expected_leaves and observed_directories == expected_directories,
                      'capture inventory is not exact closed six-file source')
              for name, raw in [('caller-workflow.yml', caller_raw), ('runner-workflow.yml', workflow),
                                ('external-admission.json', admission_raw), ('native-event.json', event)]:
                  with (retained / name).open('xb') as stream:
                      stream.write(raw)
              identities = dict(commits=commits, caller_workflow_ref=os.environ['CALLER_WORKFLOW_REF'],
                                caller_workflow_sha=os.environ['CALLER_WORKFLOW_SHA'], runner_reference=REPOSITORY + '/' + WORKFLOW + '@' + runner,
                                runner_execution_reference='LITERAL_CALLER_REFERENCE_NATIVE_RUN_READBACK_REQUIRED',
                                admission_path=ADMISSION, admission_sha256=admission_sha256,
                                admission_git_blob=git_identity('blob', admission_raw), caller_workflow_sha256=sha(caller_raw),
                                native_event_sha256=sha(event), root_admission=authority,
                                authority='ROOT_REVIEWED_LITERAL_CALLER_EXTERNAL_RECORD_NOT_SELF_AUTHENTICATING')
              with (retained / 'identity-observations.json').open('x') as stream:
                  stream.write(json.dumps(identities, sort_keys=True, indent=2) + '\n')
              with (base / 'publish/payload/checked-workflow.yml').open('xb') as stream:
                  stream.write(workflow)
              context = dict(repository=REPOSITORY, caller_commit=caller, checked_commit=candidate, runner_commit=runner,
                             admission_commit=external, run_id=os.environ['GITHUB_RUN_ID'], run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                             workflow_sha256=sha(workflow), controller_sha256=sha(control), identities=identities, sources=bindings)
              with (base / 'inputs/payload/control/source-bindings.json').open('x') as stream:
                  stream.write(json.dumps(context, sort_keys=True, indent=2) + '\n')
              filesystems = {}
              for label in ('inputs', 'work', 'publish'):
                  mount = base / label
                  require(os.path.ismount(mount), 'fixture filesystem mount not observed')
                  info, capacity = os.stat(mount, follow_symlinks=False), os.statvfs(mount)
                  size = capacity.f_frsize * capacity.f_blocks
