      - name: Hash the bounded original artifact inventory
        timeout-minutes: 1
        if: always()
        run: |
          set -euo pipefail
          python3 -I -B -S - <<'PY'
          import hashlib, os, pathlib, stat
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'canvas-tests/publish/payload'
          root.mkdir(parents=True, exist_ok=True)
          root_fd = os.open(root, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
          rows, count, total = [], 0, 0
          def visit(directory, prefix=''):
              global count, total
              for name in sorted(os.listdir(directory)):
                  info = os.stat(name, dir_fd=directory, follow_symlinks=False)
                  relative = prefix + name
                  if stat.S_ISDIR(info.st_mode):
                      child = os.open(name, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=directory)
                      try:
                          visit(child, relative + '/')
                      finally:
                          os.close(child)
                      continue
                  if relative == 'ARTIFACT_SHA256SUMS':
                      raise ValueError('pre-existing artifact manifest')
                  if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1 or info.st_size > 4 * 2**20:
                      raise ValueError('artifact member admission refusal')
                  descriptor = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=directory)
                  try:
                      before = os.fstat(descriptor)
                      if (before.st_dev, before.st_ino) != (info.st_dev, info.st_ino) or before.st_nlink != 1:
                          raise ValueError('artifact member identity changed')
                      digest, read_count = hashlib.sha256(), 0
                      while True:
                          chunk = os.read(descriptor, 65536)
                          if not chunk:
                              break
                          read_count += len(chunk)
                          if read_count > 4 * 2**20:
                              raise ValueError('artifact growth limit')
                          digest.update(chunk)
                      after = os.fstat(descriptor)
                      if not stat.S_ISREG(after.st_mode) or after.st_nlink != 1 or read_count != before.st_size or (
                          before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns) != (
                          after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns):
                          raise ValueError('artifact member changed during hashing')
                  finally:
                      os.close(descriptor)
                  count += 1
                  total += read_count
                  if count > 64 or total > 64 * 2**20:
                      raise ValueError('artifact inventory bound')
                  rows.append(digest.hexdigest() + '  ' + relative + '\n')
          try:
              visit(root_fd)
              fd = os.open('ARTIFACT_SHA256SUMS', os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600, dir_fd=root_fd)
              with os.fdopen(fd, 'wb') as stream:
                  stream.write(''.join(rows).encode())
          finally:
              os.close(root_fd)
          PY
      - name: Retain originals on every conclusion
        timeout-minutes: 1
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: canvas-originals-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/canvas-tests/publish/payload/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Strictly unmount every disposable fixture filesystem
        timeout-minutes: 1
        if: always()
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/canvas-tests"
          failed=0
          for label in publish work inputs; do
            mount="$base/$label"
            set +e
            python3 -I -B -S - "$mount" <<'PY'
          import os, stat, sys
          try:
              info = os.lstat(sys.argv[1])
          except FileNotFoundError:
              sys.exit(32)
          if not stat.S_ISDIR(info.st_mode):
              raise ValueError('fixture mount path is not an original directory')
          PY
            presence=$?
            set -e
            if test "$presence" = 32; then
              continue
            elif test "$presence" != 0; then
              failed=1
              continue
            fi
            # util-linux mountpoint: 0 is mounted; 32 is an ordinary nonmount;
            # invocation, permission and other probe errors must fail cleanup.
            set +e
            mountpoint -q "$mount"
            probe=$?
            set -e
            if test "$probe" = 0; then
              if ! sudo umount "$mount"; then
                failed=1
                continue
              fi
              set +e
              mountpoint -q "$mount"
              after=$?
              set -e
              if test "$after" != 32; then
                failed=1
              fi
            elif test "$probe" != 32; then
              failed=1
            fi
          done
          test "$failed" = 0

