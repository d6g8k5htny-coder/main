name: Architecture Canvas model tests
# Retained source-only review: graph_reader_design_review REQUEST_CHANGES on draft
# 245d7feddba7a0ba58a900ab461f2526f4405bfdcd7341e94fca1b951be49826 (865L/55552B):
# mountpoint probe errors could be consumed as ordinary absence. Corrected below;
# no hosted cleanup failure was observed. Runtime NOT_RUN, organizational independence 0.
'on':
  pull_request:
    paths:
      - .github/workflows/architecture-canvas-tests.yml
      - docs/plans/2026-10-09-canvas-model-contract.md
      - interface/tests/cubic.test.mjs
      - interface/tests/elder.test.mjs
      - interface/src/scripts/cubic-model.mjs
      - interface/src/scripts/elder-model.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: architecture-canvas-tests-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false
jobs:
  canvas:
    name: architecture-canvas-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: node:24.21.0-bookworm-slim@sha256:51b1100cc2a83d370c6a60952e3f2989c8a43159d0e38586e090f3b3326efefd
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Establish native identity and bounded fixture filesystems
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/canvas-tests"
          mkdir -m 0700 "$base"
          printf '%s\n' "$GITHUB_REPOSITORY" > "$base/repository.txt"
          printf '%s\n' "$GITHUB_SHA" > "$base/checked-commit.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$base/run-id.txt"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$base/run-attempt.txt"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git show -s --format='%T%n%P' HEAD > "$base/checked-tree-and-parents.txt"
          ruby -rpsych -e 'Psych.safe_load(File.read(ARGV.fetch(0)), aliases: false)' .github/workflows/architecture-canvas-tests.yml
          for label in inputs work publish; do
            mkdir "$base/$label"
            truncate -s 64M "$base/$label.img"
            mkfs.ext4 -F "$base/$label.img" > "$base/$label-filesystem.log" 2>&1
            sudo mount -o loop,nodev,nosuid,noexec "$base/$label.img" "$base/$label"
            sudo mkdir "$base/$label/payload"
            sudo chown "$(id -u):$(id -g)" "$base/$label/payload"
            chmod 0700 "$base/$label/payload"
          done
          mkdir "$base/inputs/payload/source" "$base/inputs/payload/control"
          sudo chown 65532:65532 "$base/work/payload"
          sudo chmod 0755 "$base/work/payload"
          python3 -I -B -S - <<'PY'
          import hashlib, json, os, pathlib, stat
          base = pathlib.Path(os.environ['RUNNER_TEMP']) / 'canvas-tests'
          source = base / 'inputs/payload/source'
          def require(value, message):
              if not value:
                  raise ValueError(message)
          def original(root, relative, limit, optional=False):
              parts = relative.split('/')
              root_fd = os.open(root, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              descriptor = None
              try:
                  for part in parts[:-1]:
                      try:
                          next_fd = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=root_fd)
                      except FileNotFoundError:
                          if optional:
                              return None
                          raise
                      os.close(root_fd)
                      root_fd = next_fd
                  try:
                      descriptor = os.open(parts[-1], os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=root_fd)
                  except FileNotFoundError:
                      if optional:
                          return None
                      raise
                  before = os.fstat(descriptor)
                  require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1
                          and (0 if optional else 1) <= before.st_size <= limit,
                          'checked source regular-file or size refusal')
                  pieces, count = [], 0
                  while True:
                      chunk = os.read(descriptor, min(65536, limit + 1 - count))
                      if not chunk:
                          break
                      pieces.append(chunk)
                      count += len(chunk)
                      require(count <= limit, 'checked source growth limit')
                  after = os.fstat(descriptor)
                  require(stat.S_ISREG(after.st_mode) and after.st_nlink == 1
                          and (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns)
                          == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns)
                          and count == before.st_size, 'checked source changed while read')
                  return b''.join(pieces)
              finally:
                  if descriptor is not None:
                      os.close(descriptor)
                  os.close(root_fd)
          pins = {
              'docs/plans/2026-10-09-canvas-model-contract.md': (13354, '3473a664be9126b67006527f5257a7eeb4c2082c836d7ff1b38e21f0d40eecbc'),
              'interface/tests/cubic.test.mjs': (5697, '7205e700bd4028aacb953663526c3563f835cbfea4e68566ce25f6cdf6ee3ac0'),
              'interface/tests/elder.test.mjs': (18595, '7db412a9b64d8ffbea8d9364eef5206e36acd06e5e36040ddb792420fd81e854'),
          }
          bindings = []
          for path in [*pins, 'interface/src/scripts/cubic-model.mjs', 'interface/src/scripts/elder-model.mjs']:
              raw = original(os.environ['GITHUB_WORKSPACE'], path, 2**20, optional=path not in pins)
              record = {'path': path, 'presence': 'ABSENT' if raw is None else 'PRESENT',
                        'bytes': None if raw is None else len(raw),
                        'sha256': None if raw is None else hashlib.sha256(raw).hexdigest()}
              if path in pins:
                  require((record['bytes'], record['sha256']) == pins[path], 'external Canvas freeze mismatch')
              if raw is not None:
                  output = source / path
                  output.parent.mkdir(parents=True, exist_ok=True)
                  with output.open('xb') as stream:
                      stream.write(raw)
                  output.chmod(0o444)
              bindings.append(record)
          workflow = original(os.environ['GITHUB_WORKSPACE'], '.github/workflows/architecture-canvas-tests.yml', 262144)
          with (base / 'publish/payload/checked-workflow.yml').open('xb') as stream:
              stream.write(workflow)
          context = {key: os.environ[variable] for key, variable in (
              ('repository', 'GITHUB_REPOSITORY'), ('checked_commit', 'GITHUB_SHA'),
              ('run_id', 'GITHUB_RUN_ID'), ('run_attempt', 'GITHUB_RUN_ATTEMPT'))}
          context['workflow_sha256'] = hashlib.sha256(workflow).hexdigest()
          context['sources'] = bindings
          with (base / 'inputs/payload/control/source-bindings.json').open('x') as stream:
              stream.write(json.dumps(context, sort_keys=True, indent=2) + '\n')
          filesystems = {}
          for label in ('inputs', 'work', 'publish'):
              mount = base / label
              require(os.path.ismount(mount), 'fixture filesystem mount not observed')
              info, capacity = os.stat(mount, follow_symlinks=False), os.statvfs(mount)
              size = capacity.f_frsize * capacity.f_blocks
              require(stat.S_ISDIR(info.st_mode) and 0 < size <= 64 * 2**20, 'actual fixture filesystem capacity refusal')
              filesystems[label] = {'host_device': info.st_dev, 'reported_total_bytes': size,
                                    'configured_capacity_bytes': 64 * 2**20, 'mount_observed': True}
          with (base / 'fixture-filesystems.json').open('x') as stream:
              stream.write(json.dumps(filesystems, sort_keys=True, indent=2) + '\n')
          PY
      - name: Prepare the fixed bundled-Node execution control
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/canvas-tests/inputs/payload/control"
          cat > "$control/run.mjs" <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import { spawn } from 'node:child_process';
          const node = '/usr/local/bin/node';
          const output = '/output/';
          const digest = raw => crypto.createHash('sha256').update(raw).digest('hex');
          const write = (name, value) => fs.writeFileSync(output + name,
            typeof value === 'string' ? value : JSON.stringify(value, null, 2) + '\n',
            { flag: 'wx', mode: 0o644 });
          const regular = (path, limit, allowEmpty = false, hashOnly = false) => {
            const fd = fs.openSync(path, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW | fs.constants.O_NONBLOCK);
            try {
              const before = fs.fstatSync(fd);
              assert.ok(before.isFile() && before.nlink === 1 && before.size >= (allowEmpty ? 0 : 1)
                && before.size <= limit, 'regular byte admission');
              const pieces = [];
              const hasher = hashOnly ? crypto.createHash('sha256') : null;
              let count = 0;
              for (;;) {
                const part = Buffer.allocUnsafe(Math.min(65536, limit + 1 - count));
                const got = fs.readSync(fd, part, 0, part.length, null);
                if (got === 0) break;
                if (hashOnly) hasher.update(part.subarray(0, got));
                else pieces.push(part.subarray(0, got));
                count += got;
                assert.ok(count <= limit, 'regular file growth admission');
              }
              const after = fs.fstatSync(fd);
              assert.ok(after.isFile() && after.nlink === 1);
              for (const key of ['dev', 'ino', 'size', 'mtimeMs', 'ctimeMs']) assert.equal(after[key], before[key]);
              assert.equal(count, before.size);
              return hashOnly ? { bytes: count, sha256: hasher.digest('hex') } : Buffer.concat(pieces);
            } finally { fs.closeSync(fd); }
          };
          const bindings = JSON.parse(regular('/control/source-bindings.json', 65536));
          const sourceObservation = () => bindings.sources.map(record => {
            const path = '/source/' + record.path;
            if (record.presence === 'ABSENT') {
              assert.ok(!fs.existsSync(path), 'absent candidate was introduced');
              return record;
            }
            const raw = regular(path, 2**20, true);
            assert.equal(raw.length, record.bytes);
            assert.equal(digest(raw), record.sha256);
            return { ...record };
          });
          const runtime = () => {
            assert.equal(process.version, 'v24.21.0');
            assert.equal(process.versions.node, '24.21.0');
            assert.equal(process.platform, 'linux');
            assert.equal(process.arch, 'x64');
            assert.equal(process.execPath, node);
            assert.equal(fs.realpathSync(node), node);
            assert.equal(process.getuid(), 65532);
            assert.equal(process.getgid(), 65532);
            const binary = regular(node, 256 * 2**20, false, true);
            return { version: process.version, versions: process.versions, platform: process.platform,
              arch: process.arch, uid: process.getuid(), gid: process.getgid(),
              executable: process.execPath, executable_bytes: binary.bytes,
              executable_sha256: binary.sha256, runtime_origin: 'PINNED_IMAGE_BUNDLED_BINARY',
              earlier_extracted_binary_credit: 'NOT_REUSED' };
          };
          const inventory = [
            ['cubic', [
              'PREFLIGHT cubic candidate imports and exports cubicModel',
              'BEHAVIOR cubic literal binary fixture retains all scales and affine teaching coordinates',
              'BEHAVIOR cubic halving radius divides the height gap by eight without rescaling k',
              'BEHAVIOR cubic nonbinary arithmetic and negative origin preserve nominal normalization',
              'BEHAVIOR cubic rejects malformed records and coercible or missing numeric fields',
              'BEHAVIOR cubic rejects invalid ranges overflow underflow and collapsed height windows',
              'BEHAVIOR cubic does not mutate inputs or share mutable results across calls',
            ]],
            ['elder', [
              'PREFLIGHT elder candidate imports and exports finiteElderTrace',
              'BEHAVIOR elder unequal peaks retain the elder and longest finite bar',
              'BEHAVIOR elder full tie blocks and neutral edges have distinct meanings',
              'BEHAVIOR elder periodic seams join peaks before a spurious death',
              'BEHAVIOR elder axis graph does not connect diagonal square corners',
              'BEHAVIOR elder equal peaks prefer the smaller plateau ID',
              'BEHAVIOR elder negative constant plateau has one essential class and eight zero merges',
              'BEHAVIOR elder large integer translation and positive scaling preserve exact endpoints',
              'BEHAVIOR elder all 512 binary grids satisfy every threshold rank and exact trace',
              'BEHAVIOR elder deterministic tied multilevel fields satisfy complete birth and rank oracles',
              'BEHAVIOR elder rejects malformed record dimension scale shape and sparse integer samples',
              'BEHAVIOR elder accepts the teaching cap with linear event storage',
              'BEHAVIOR elder does not mutate input or share returned state across deterministic calls',
              'ORACLE sensitivity rejects omitted shifted mislabelled and malformed literal barcodes',
            ]],
          ];
          const execute = (name) => new Promise(resolve => {
            const argv = ['--test', '--test-reporter=tap', '--test-concurrency=1',
              '/source/interface/tests/' + name + '.test.mjs'];
            const stdout = fs.openSync(output + name + '.tap', 'wx', 0o644);
            const stderr = fs.openSync(output + name + '.stderr', 'wx', 0o644);
            const started = process.hrtime.bigint();
            let timedOut = false, error = null, killer = null;
            const child = spawn(node, argv, { cwd: '/source', stdio: ['ignore', stdout, stderr],
              env: { PATH: '/usr/local/bin:/usr/bin:/bin', LANG: 'C.UTF-8', TZ: 'UTC',
                NODE_DISABLE_COLORS: '1', NODE_OPTIONS: '' } });
            const timer = setTimeout(() => {
              timedOut = true;
              child.kill('SIGTERM');
              killer = setTimeout(() => child.kill('SIGKILL'), 5000);
            }, 60000);
            child.on('error', value => { error = String(value.message).slice(0, 2048); });
            child.on('close', (code, signal) => {
              clearTimeout(timer);
              if (killer !== null) clearTimeout(killer);
              fs.closeSync(stdout);
              fs.closeSync(stderr);
              resolve({ file: name, executable: node, argv, attempts: 1, code, signal, error,
                timed_out: timedOut, duration_ns: String(process.hrtime.bigint() - started),
                stdout: name + '.tap', stderr: name + '.stderr' });
            });
          });
          const parse = (attempt, names) => {
            const raw = regular(output + attempt.stdout, 4 * 2**20);
            const text = raw.toString('utf8');
            assert.equal(Buffer.from(text).compare(raw), 0, 'TAP UTF-8 refusal');
            const lines = text.split('\n');
            const records = [];
            const starts = [];
            for (let index = 0; index < lines.length; index++) {
              const match = /^(not ok|ok) ([1-9][0-9]*) - (.*?)(?: # (SKIP|TODO)(?: (.*))?)?$/.exec(lines[index]);
              if (!match) {
                assert.ok(!/^(?:not ok|ok)(?:\s|$)|^Bail out!/.test(lines[index]), 'malformed result or TAP bailout');
                continue;
              }
              assert.ok(starts.length < names.length, 'extra TAP result');
              starts.push({ line: index, match });
            }
            for (let index = 0; index < starts.length; index++) {
              const { line, match } = starts[index];
              const end = index + 1 < starts.length ? starts[index + 1].line : lines.length;
              const diagnostic = lines.slice(line + 1, end).join('\n');
              const cancelled = /failureType: ['"]cancelledByParent['"]/.test(diagnostic);
              records.push({ local_id: Number(match[2]), id: match[3], status: cancelled ? 'CANCELLED' :
                match[4] || (match[1] === 'ok' ? 'PASS' : 'FAIL'), reason: match[5] || null,
                assertion_diagnostic: match[1] === 'not ok' && /code: ['"]ERR_ASSERTION['"]/.test(diagnostic),
                diagnostic_sha256: digest(Buffer.from(diagnostic)) });
            }
            const one = pattern => {
              const matches = lines.map(line => pattern.exec(line)).filter(Boolean);
              assert.equal(matches.length, 1, 'missing or duplicate TAP summary');
              return Number(matches[0][1]);
            };
            const summary = Object.fromEntries(['tests', 'suites', 'pass', 'fail', 'cancelled', 'skipped', 'todo']
              .map(key => [key, one(new RegExp('^# ' + key + ' ([0-9]+)$'))]));
            assert.equal(lines.filter(line => line === 'TAP version 13').length, 1);
            assert.equal(one(/^1\.\.([0-9]+)$/), names.length);
            assert.equal(records.length, names.length);
            assert.equal(summary.tests, names.length);
            assert.equal(summary.suites, 0);
            for (let index = 0; index < names.length; index++) {
              assert.equal(records[index].local_id, index + 1);
              assert.equal(records[index].id, names[index], 'unexpected or duplicate TAP identity');
            }
            const counts = { PASS: 0, FAIL: 0, CANCELLED: 0, SKIP: 0, TODO: 0 };
            for (const record of records) counts[record.status]++;
            assert.equal(summary.pass, counts.PASS);
            assert.equal(summary.fail, counts.FAIL);
            assert.equal(summary.cancelled, counts.CANCELLED);
            assert.equal(summary.skipped, counts.SKIP);
            assert.equal(summary.todo, counts.TODO);
            assert.ok(attempt.code === 0 || attempt.code === 1, 'test runner terminal refusal');
            assert.equal(attempt.signal, null);
            assert.equal(attempt.error, null);
            assert.equal(attempt.timed_out, false);
            const preflight = records[0];
            const behavior = records.filter(record => record.id.startsWith('BEHAVIOR '));
            const oracle = records.filter(record => record.id.startsWith('ORACLE '));
            const setupBlocked = preflight.status === 'FAIL';
            if (setupBlocked) assert.ok(behavior.every(record => record.status === 'SKIP'), 'blocked candidate executed behavior');
            else assert.equal(preflight.status, 'PASS', 'preflight skip or cancellation refusal');
            return { attempt, raw_sha256: digest(raw), raw_bytes: raw.length, summary, counts, records,
              preflight: setupBlocked ? 'SETUP_BLOCKED' : 'IMPORTED_EXPECTED_FUNCTION',
              behavior_result: setupBlocked ? 'NOT_RUN' :
                behavior.every(record => record.status === 'PASS') ? 'PASS' : 'FAIL_OR_INCOMPLETE',
              oracle_result: oracle.length === 0 ? 'NOT_APPLICABLE' :
                oracle.every(record => record.status === 'PASS') ? 'PASS' : 'CHECKER_FAILURE' };
          };
          const report = { schema_version: 1, context: bindings, source_declared_controls: 21,
            source_declared_preflight: 2, source_declared_behavior: 18, source_declared_oracle: 1,
            status: 'RUNTIME_SETUP_BLOCKED', behavior_result: 'NOT_RUN', actual_controls: [], files: [],
            scientific_effect: 'NONE', scientific_status_authority: false, organizational_independence: 0,
            custody_authentication: 'UNKNOWN', genuine_behavioral_red: 'NOT_DECLARED_BY_WORKFLOW',
            declared_control_inventory: inventory.flatMap(([file, names], fileIndex) => names.map((id, index) => ({ file,
              local_id: index + 1, global_id: index + 1 + (fileIndex === 0 ? 0 : inventory[0][1].length),
              id, declaration_status: 'SOURCE_DECLARED_RUNTIME_NOT_PREDICTED' }))) };
          let finalExit = 1;
          try {
            write('runtime-before.json', runtime());
            write('source-before.json', sourceObservation());
            write('control-source.json', { path: '/control/run.mjs',
              sha256: digest(regular('/control/run.mjs', 262144)) });
            const attempts = [];
            for (const [name] of inventory) attempts.push(await execute(name));
            write('attempts.json', attempts);
            report.status = 'DISCOVERY_FAILED';
            for (let index = 0; index < inventory.length; index++) {
              const [name, names] = inventory[index];
              try { report.files.push(parse(attempts[index], names)); }
              catch (error) { report.files.push({ file: name, status: 'DISCOVERY_FAILED',
                error: String(error.message).slice(0, 2048), attempt: attempts[index] }); }
            }
            report.actual_controls = report.files.flatMap((file, index) => (file.records || []).map(record => ({ ...record,
              file: inventory[index][0], global_id: record.local_id + (index === 0 ? 0 : inventory[0][1].length) })));
            const complete = report.files.every(file => file.records !== undefined);
            if (complete) {
              const blocked = report.files.some(file => file.preflight === 'SETUP_BLOCKED');
              const checkerFailed = report.files.some(file => file.oracle_result === 'CHECKER_FAILURE');
              const allPass = report.actual_controls.every(record => record.status === 'PASS')
                && report.files.every(file => file.attempt.code === 0);
              report.status = blocked ? 'SETUP_BLOCKED' : checkerFailed ? 'CHECKER_FAILURE' :
                allPass ? 'SCOPED_GREEN' : 'BEHAVIOR_FAILURE_OR_INCOMPLETE';
              report.behavior_result = blocked ? 'PER_FILE_NOT_RUN_WHERE_SETUP_BLOCKED' :
                allPass ? 'PASS' : 'SEE_ACTUAL_CONTROL_STATUS';
              report.behavior_assertion_failures = report.actual_controls.filter(record =>
                record.id.startsWith('BEHAVIOR ') && record.status === 'FAIL' && record.assertion_diagnostic).map(record => record.id);
              report.red_candidate_requires_source_and_native_custody_review = !blocked && !checkerFailed
                && report.behavior_assertion_failures.length > 0;
              if (allPass && !blocked && !checkerFailed) finalExit = 0;
            }
            write('source-after.json', sourceObservation());
            const after = runtime();
            const before = JSON.parse(regular(output + 'runtime-before.json', 65536));
            assert.equal(after.executable_sha256, before.executable_sha256);
            assert.equal(after.executable_bytes, before.executable_bytes);
            write('runtime-after.json', after);
          } catch (error) {
            report.status = 'RUNTIME_OR_SOURCE_CONTROL_FAILED';
            report.control_error = String(error.message).slice(0, 2048);
            finalExit = 1;
          }
          report.control_exit_code = finalExit;
          write('results.json', report);
          write('control-exit-status.txt', String(finalExit) + '\n');
          console.log(JSON.stringify({ status: report.status, actual_discovered: report.actual_controls.length,
            counts: report.actual_controls.reduce((counts, item) => ({ ...counts,
              [item.status]: (counts[item.status] || 0) + 1 }), {}), control_exit_code: finalExit }));
          process.exitCode = finalExit;
          JS
          chmod -R a-w "$RUNNER_TEMP/canvas-tests/inputs/payload"
          find "$RUNNER_TEMP/canvas-tests/inputs/payload" -type d -exec chmod 0555 {} +
          chmod 0444 "$control/run.mjs" "$control/source-bindings.json"
      - name: Pull the immutable bundled runtime
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/canvas-tests"
          (ulimit -f 4096; timeout --signal=TERM --kill-after=10s 180s docker pull --platform linux/amd64 "$IMAGE") > "$base/image-pull.log" 2>&1
          docker image inspect "$IMAGE" > "$base/runtime-image.json"
      - name: Run the two external test files once in the isolated container
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/canvas-tests"
          container="canvas-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s\n' "$container" > "$base/container-name.txt"
          docker create --name "$container" --platform linux/amd64 --network none --user 65532:65532 \
            --ipc private --cgroupns private \
            --read-only --cap-drop ALL --security-opt no-new-privileges --log-driver none \
            --cpus 2 --memory 1g --memory-swap 1g --pids-limit 128 \
            --ulimit fsize=4194304:4194304 --ulimit nofile=256:256 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777 \
            --mount type=bind,src="$base/inputs/payload/source",dst=/source,readonly \
            --mount type=bind,src="$base/inputs/payload/control",dst=/control,readonly \
            --mount type=bind,src="$base/work/payload",dst=/output \
            --workdir /source --env LANG=C.UTF-8 --env TZ=UTC --env NODE_DISABLE_COLORS=1 --env NODE_OPTIONS= \
            --entrypoint /usr/local/bin/node "$IMAGE" /control/run.mjs > "$base/container-id.txt"
          docker inspect "$container" > "$base/container-before.json"
          set +e
          (ulimit -f 4096; timeout --signal=TERM --kill-after=10s 180s docker start --attach "$container") > "$base/container-console.log" 2>&1
          attach=$?
          set -e
          printf '%s\n' "$attach" > "$base/attach-exit-status.txt"
          docker inspect "$container" > "$base/container-after.json"
          test "$attach" = 0 || test "$attach" = 1
      - name: Confirm strict container disposal
        if: always()
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/canvas-tests"
          mkdir -p "$base"
          container="canvas-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          present="$(docker ps -a --filter "name=^/$container$" --format '{{.Names}}')"
          if test -n "$present"; then
            test "$present" = "$container"
            docker rm -f "$container" > "$base/disposal.log" 2>&1
          else
            printf '%s\n' 'No named container remained to remove.' > "$base/disposal.log"
          fi
          remaining="$(docker ps -a --filter "name=^/$container$" --format '{{.Names}}')"
          test -z "$remaining"
          printf '%s\n' 'CONFIRMED_ABSENT' > "$base/disposal-status.txt"
