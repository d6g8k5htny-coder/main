# Declared navigation pages only. Not research CI. A green run is not discharge.
name: navigation
on:
  pull_request:
    branches: [chatgpt/drive-github-hardening-20260919]
  push:
    branches: [chatgpt/drive-github-hardening-20260919]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed 2026-09-22
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, reviewed 2026-09-22
        with:
          python-version: "3.11.16"
      - name: Declared links, anchors, and synthetic controls
        run: |
          python3 tools/navigation_check.py
          python3 -m unittest tests.test_navigation -v
          python3 -O -m unittest tests.test_navigation -v
