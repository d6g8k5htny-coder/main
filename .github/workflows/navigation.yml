name: Research navigation and public source checks
'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Current landing and navigation controls
        run: |
          set -euo pipefail
          mkdir -p navigation-evidence
          python --version > navigation-evidence/python.txt
          git rev-parse HEAD > navigation-evidence/commit.txt
          python -B -S tools/workspace_landing_check.py > navigation-evidence/landing.txt
          python -B -S -m unittest discover -s tests -p 'test_*.py' -v > navigation-evidence/tests-normal.log 2>&1
          grep -Eq '^Ran [1-9][0-9]* tests? in ' navigation-evidence/tests-normal.log || { echo "::error::navigation normal discovery collected 0 tests or returned no count"; exit 1; }
          python -B -S tools/navigation_check.py --verify-public > navigation-evidence/navigation.json
      - name: Verify history-backed reader controls
        run: |
          set -euo pipefail
          python -B -S -m unittest -v tests.test_reader_links.FiniteH0LifetimeReading tests.test_reader_links.UniversalitySourcesReading > navigation-evidence/history-reader.log 2>&1
          tail -n 3 navigation-evidence/history-reader.log | head -n 1 | grep -Eq '^Ran [1-9][0-9]* tests? in ' || { echo "::error::history reader suite collected no tests"; exit 1; }
          tail -n 1 navigation-evidence/history-reader.log | grep -Fxq 'OK' || { echo "::error::history reader suite did not finish without skips"; exit 1; }
          if grep -Fq ' ... skipped ' navigation-evidence/history-reader.log; then echo "::error::history reader test or subtest skipped"; exit 1; fi
          for name in \
            tests.test_reader_links.FiniteH0LifetimeReading.test_pinned_items_carry_only_their_digest_and_the_digests_match_the_pinned_bytes \
            tests.test_reader_links.FiniteH0LifetimeReading.test_quoted_phrases_are_verbatim_in_their_pinned_sources \
            tests.test_reader_links.UniversalitySourcesReading.test_pinned_items_carry_only_their_digest_and_the_digests_match_the_pinned_bytes \
            tests.test_reader_links.UniversalitySourcesReading.test_process_marks_and_open_gaps_follow_the_records \
            tests.test_reader_links.UniversalitySourcesReading.test_quoted_phrases_are_verbatim_in_their_pinned_sources
          do
            method="${name##*.}"
            grep -Fxq "$method ($name) ... ok" navigation-evidence/history-reader.log || { echo "::error::required history reader test missing or incomplete: $name"; exit 1; }
          done
      - name: Preserve actual results including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: research-navigation-${{ github.run_id }}
          path: navigation-evidence
          if-no-files-found: error
          retention-days: 30
