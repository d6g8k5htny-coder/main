name: Research architecture sandbox and generated graph
'on':
  pull_request:
  push:
    branches: [main, codex/architecture-enhancements-20261008]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-architecture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  graph:
    name: research-architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare fixed runtime and separate output
        env:
          IMAGE: python:3.11.14-slim-bookworm@sha256:83f339c1be6340ae1096010fdccf6552ac932d8f410d45d206014916bdf37e48
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          mkdir -p "$RUNNER_TEMP/architecture-evidence" "$RUNNER_TEMP/architecture-publish"
          chmod 0700 "$RUNNER_TEMP/architecture-publish"
          truncate -s 64M "$RUNNER_TEMP/architecture-output.img"
          mkfs.ext4 -F "$RUNNER_TEMP/architecture-output.img"
          sudo mount -o loop,nodev,nosuid,noexec "$RUNNER_TEMP/architecture-output.img" "$RUNNER_TEMP/architecture-evidence"
          chmod 0777 "$RUNNER_TEMP/architecture-evidence"
          docker image inspect "$IMAGE" > "$RUNNER_TEMP/architecture-publish/runtime-image.json"
          git rev-parse HEAD > "$RUNNER_TEMP/architecture-publish/checked-commit.txt"
      - name: Run controls and export in ephemeral restricted container
        env:
          IMAGE: python:3.11.14-slim-bookworm@sha256:83f339c1be6340ae1096010fdccf6552ac932d8f410d45d206014916bdf37e48
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 300s docker run --rm --name architecture-controls \
            --network none --read-only --user 65532:65532 --cpus 2 --memory 1g --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges \
            --env ARCHITECTURE_SANDBOX=1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/source,readonly \
            --mount type=bind,source="$RUNNER_TEMP/architecture-evidence",target=/output \
            --workdir /source "$IMAGE" sh -c '
              python -B -S -m unittest discover -s tests -p "test_architecture_*.py" -v > /output/tests-normal.log 2>&1
              normal=$?
              python -B -O -S -m unittest discover -s tests -p "test_architecture_*.py" -v > /output/tests-optimized.log 2>&1
              optimized=$?
              if [ "$normal" -ne 0 ] || [ "$optimized" -ne 0 ]; then
                cat /output/tests-normal.log /output/tests-optimized.log
                exit 1
              fi
              python -B -S tools/proof_graph_export.py --source-dir docs/site/dependency-source --output /output/generated
            '
      - name: Dispose container even after timeout
        if: always()
        run: docker rm --force architecture-controls 2>/dev/null || true
      - name: Stage only bounded regular outputs after container disposal
        if: always()
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/architecture-evidence"
          destination="$RUNNER_TEMP/architecture-publish"
          if [ -n "$(find "$source" -mindepth 1 \( ! -type f -a ! -type d \) -print -quit)" ]; then
            echo 'Refusing symlink or special-file container output'
            exit 1
          fi
          for name in tests-normal.log tests-optimized.log; do
            if [ -f "$source/$name" ]; then
              cp -- "$source/$name" "$destination/$name"
            fi
          done
          if [ -f "$source/generated/graph.json" ]; then
            mkdir -p "$destination/generated"
            cp -- "$source/generated/graph.json" "$destination/generated/graph.json"
          fi
      - name: Retain original controls, identities and generated graph
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: research-architecture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/architecture-publish/
          if-no-files-found: error
          retention-days: 90
      - name: Release bounded output filesystem
        if: always()
        run: sudo umount "$RUNNER_TEMP/architecture-evidence" 2>/dev/null || true
