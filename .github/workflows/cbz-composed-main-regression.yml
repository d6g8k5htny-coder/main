name: CBZ composed main regression
on:
  push:
    branches: ["cbz/composed-main-regression-20261029"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-unittest:
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, optimized]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.16'
      - name: Run complete discovered Python suite
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
          LEAN_NUM_THREADS: '2'
        run: |
          set -u
          log="$RUNNER_TEMP/main-full-$MODE.log"
          git rev-parse HEAD
          python3 --version
          args=(-B -S)
          if [ "$MODE" = optimized ]; then args+=(-O); fi
          set +e
          python3 "${args[@]}" -m unittest discover -s tests -p 'test_*.py' -v >"$log" 2>&1
          result=$?
          set -e
          tail -n 100 "$log"
          sha256sum "$log"
          printf 'Observed unittest exit: %s\n' "$result"
          exit "$result"
      - name: Preserve original test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cbz-main-full-${{ matrix.mode }}
          path: ${{ runner.temp }}/main-full-${{ matrix.mode }}.log
          if-no-files-found: error
