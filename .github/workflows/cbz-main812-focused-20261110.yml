name: Main 812 focused custody diagnostic
'on':
  push:
    branches: [codex/cbz-architecture-observation-20261110]
    paths: [.github/workflows/cbz-main812-focused-20261110.yml]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: probe
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1d7dab56310c8912ade8e94275f1e6ac0c4158b7
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Exercise candidate and child-flag mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = 1d7dab56310c8912ade8e94275f1e6ac0c4158b7
          mkdir -p "$RUNNER_TEMP/cbz-main812-focused"
          python -B -S "$GITHUB_WORKSPACE/probe/cbz/evidence/main809-navigation-20261110/observer/hosted_custody_probe.py.txt" \
            "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/cbz-main812-focused" \
            > "$RUNNER_TEMP/cbz-main812-focused/console.txt" 2>&1
      - name: Retain focused evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cbz-main812-focused-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cbz-main812-focused/
          if-no-files-found: error
          retention-days: 30
