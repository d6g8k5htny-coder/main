name: Bounded coordination audit gate
'on':
  workflow_dispatch:
    inputs:
      node_id:
        description: Existing node ID to inspect; this audit grants no ownership
        required: true
        type: string
      claimant_id:
        description: Actual agent ID to compare with the recorded owner (optional)
        required: false
        default: ''
        type: string
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'd6g8k5htny-coder/main' && toJSON(github.event.repository.private) == 'false' && github.ref == 'refs/heads/main'
    # Serializes only this participating audit job. Pending replacement, timeout,
    # or cancellation never releases an existing task-local PICKUP.
    concurrency:
      group: ul-coordination-node-${{ inputs.node_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Test the report-only guard in both Python modes
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -S -m unittest discover -s tests -p test_coordination_lock_check.py -v 2>&1 | tee "$RUNNER_TEMP/coordination-normal.log"
          grep -Eq '^Ran [1-9][0-9]* tests? in ' "$RUNNER_TEMP/coordination-normal.log"
          python3 -B -O -S -m unittest discover -s tests -p test_coordination_lock_check.py -v 2>&1 | tee "$RUNNER_TEMP/coordination-optimized.log"
          grep -Eq '^Ran [1-9][0-9]* tests? in ' "$RUNNER_TEMP/coordination-optimized.log"
      - name: Inspect the pinned public owner view without granting a lease
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          NODE_ID: ${{ inputs.node_id }}
          CLAIMANT_ID: ${{ inputs.claimant_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 -B -S tools/coordination_lock_check.py report --commit "$SOURCE_COMMIT" --node "$NODE_ID" --claimant "$CLAIMANT_ID"
