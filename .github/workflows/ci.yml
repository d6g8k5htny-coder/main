# Batch 248: path holder for hardening-branch research CI.
# Same path (.github/workflows/ci.yml) must remain on default main so GitHub
# keeps the workflow registered; hardening tips ship the full verify suite
# under this path with name: ci. Default-main landing checks moved to
# workspace-landing.yml so 12–22m hardening runs no longer appear under
# the Actions filter/name "workspace-landing".
# Scientific effect: NONE. No research status / lemma_closed changes.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  path-holder:
    name: path-holder
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain path holder
        run: |
          echo 'Default-main .github/workflows/ci.yml is a path holder only.'
          echo 'Landing checks: .github/workflows/workspace-landing.yml'
          echo 'Hardening research CI uses this same path on non-default tips.'
          echo 'path-holder note' >> "$GITHUB_STEP_SUMMARY"
