name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, reviewed 2026-09-22
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, reviewed 2026-09-22
        with:
          python-version: "3.11.16"
      - name: Install test dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.lock"
      - name: Registers round-trip from the source export
        run: python tools/registers_import.py --check
      - name: Register structural invariants (modulo documented findings)
        run: python tools/registers_check.py
      - name: Ported-artifact identity (no reading copy presented as the object)
        run: python tools/provenance_check.py
      - name: Claim-graph firewalls
        run: python tools/claims_check.py
      - name: Synthetic loss-only withdrawal (pilot, no scientific migration)
        run: python tools/withdrawal_check.py check --before governance/withdrawal/examples/before.json --after governance/withdrawal/examples/after.json --ticket governance/withdrawal/examples/ticket.json
      - name: Governance rollout shadow controls (no live admission)
        run: python tools/rollout_guard.py governance/rollout/SYNTHETIC_metadata_plan.json
      - name: Logical quarantine is enforced
        run: python tools/quarantine_check.py
      - name: Vault listing matches inventory; vault ids stay unstored
        run: python tools/vault_hygiene_check.py
      - name: Content manifests (SHA-256 and byte counts)
        run: python tools/verify_manifests.py
      - name: Strict manifest integrity (pinned coverage, explicit exclusions)
        run: python tools/manifest_integrity_check.py --coverage .github/manifest-coverage.json
      - name: Review records (zero independence credit, no gate moved)
        run: python tools/reviews_check.py
      - name: Architectural admission attestations (fail-closed, no grade changed)
        run: python tools/attestations_check.py
      - name: Coordination board (no two agents over the same paths, no status moved)
        run: python tools/coordination_check.py
      - name: Recovered exceptions (candidates never stored as recoveries)
        run: python tools/recovery_check.py
      - name: Collision proposal (additive only, exported registers untouched)
        run: python tools/collision_proposal_check.py
      - name: Collision proposal 2026-09-19 successor (seven xlsx-only findings, rows quoted cell for cell)
        run: python tools/collision_proposal_check.py --proposal registers/collision_proposal_2026-09-19.json
      - name: Third collision proposal (fourteen first-keyed findings; frozen predecessor chain)
        run: python tools/collision_proposal_check.py --proposal registers/collision_proposal_2026-09-19b.json
      - name: Register consumers (derived map matches the eligible source tree)
        run: python tools/consumers_check.py
      - name: Bound carriers (content-addressed, digests match)
        run: python tools/carriers_verify.py
      - name: Lane invariants (no lane reads stronger than the claim graph)
        run: python tools/lanes_check.py
      - name: Bound-slack registry (bookkeeping; utility never correctness)
        run: python tools/slack_check.py
      - name: Receipts (schema, append-only, no receipt claims a status change)
        run: python tools/receipts_check.py
      - name: Imported custody publications (retained byte for byte; supplements generated, never typed)
        run: python tools/custody_import.py --check
      - name: Frozen objects (register vs source-map digests, offline; body classes not comparable)
        run: python tools/frozen_check.py
      - name: Execution bridge records (orders, receipts, examples; schema and freeze only, no enforcement)
        run: python tools/bridge_check.py
      - name: Reusable operations (registry is the register's words; trials are records, append-only, no status claimed)
        run: python tools/operations_check.py
      - name: Eligible mirror README quotations match eligible retained text
        run: python tools/mirror_quotes_check.py
      - name: Mirror lane index is generated from the manifests, not typed
        run: python tools/mirrors_index_check.py
      - name: Certificate source bindings still match the tree, and the index names them
        run: python tools/pinned_sources_check.py
      - name: Drive source map is queryable
        run: python tools/drive_index.py stats
      - name: Scoped Drive coverage and exact packed-byte reconstruction
        run: python tools/drive_coverage.py --json
      - name: Reproduce the unreviewed Hermite Gaussian candidate table
        run: python tools/hermite_envelope_report.py --check research/bands/candidates/hermite_gaussian_20260919.json
      - name: Reconcile dated Drive membership and refreshed payloads
        run: python tools/drive_reconcile.py
      - name: Check native tab and formula coverage against export containers
        run: python tools/native_export_check.py --verify-containers
      - name: Reproduce the affine Gaussian moment candidate and finite reuse comparison
        run: python tools/rn_moment_report.py --check research/rn/candidates/affine_moments_20260920.json
      - name: Replay exact RN numerical certificates and source applicability
        run: python tools/rn_certificate.py check-candidates
      - name: Reconstruct the SIDE24 nine-pin point law and corrected determinant moments
        run: python tools/rn_side24_check.py
      - name: Verify the source-bound SIDE24 density-window point candidate
        run: python tools/rn_side24_density_check.py
      - name: Replay the complete local RN spatial rectangle
        run: python tools/rn_side24_spatial_check.py
      - name: Replay H3 floor, LPW quadratic modulus and one H5 jet band
        run: python tools/parallel_math_check.py
      - name: Replay twelve scoped mathematical candidates from the frozen archive
        run: python tools/twelve_project_check.py
      - name: Replay whole-band fixed-axis H3 and degree-six RN local bounds
        run: python tools/h3_rn_n6_check.py
      - name: Verify the density-weighted RN inner-axis wedge and exact area budget
        run: python tools/rn_inner_wedge_check.py
      - name: Replay the same-wedge RN Bernstein and sharp-variance successor
        run: python tools/rn_bernstein_sharp_check.py
      - name: Validate the derived research frontier and recorded diagnostics
        run: python tools/research_frontier.py self-check
      - name: Verify source-bound LPW amplitude and radius arithmetic
        run: python tools/lpw_amplitude_check.py
      - name: Validate the scoped automated closure plan
        run: python tools/closure_pipeline.py check-plan
      - name: Math status packet (OPEN/HOLD only; flags stay false)
        run: python tools/math_status_check.py
      - name: Declared navigation links and anchors
        run: python tools/navigation_check.py
      - name: Navigation synthetic controls
        run: python -m unittest tests.test_navigation -v
      - name: Unit tests and negative controls
        run: python -m pytest -q
