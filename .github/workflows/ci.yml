name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Registers round-trip from the source export
        run: python tools/registers_import.py --check
      - name: Register structural invariants (modulo documented findings)
        run: python tools/registers_check.py
      - name: Ported-artifact identity (no reading copy presented as the object)
        run: python tools/provenance_check.py
      - name: Claim-graph firewalls
        run: python tools/claims_check.py
      - name: Logical quarantine is enforced
        run: python tools/quarantine_check.py
      - name: Content manifests (SHA-256 and byte counts)
        run: python tools/verify_manifests.py
      - name: Review records (zero independence credit, no gate moved)
        run: test -f tools/reviews_check.py && python tools/reviews_check.py || echo "skipped"
      - name: Recovered exceptions (candidates never stored as recoveries)
        run: test -f tools/recovery_check.py && python tools/recovery_check.py || echo "skipped"
      - name: Collision proposal (additive only, exported registers untouched)
        run: test -f tools/collision_proposal_check.py && python tools/collision_proposal_check.py || echo "skipped"
      - name: Bound carriers (content-addressed, digests match)
        run: test -f tools/carriers_verify.py && python tools/carriers_verify.py || echo "skipped"
      - name: Lane invariants (no lane reads stronger than the claim graph)
        run: test -f tools/lanes_check.py && python tools/lanes_check.py || echo "skipped"
      - name: Receipts (schema, append-only, no receipt claims a status change)
        run: test -f tools/receipts_check.py && python tools/receipts_check.py || echo "skipped"
      - name: Drive source map is queryable
        run: python tools/drive_index.py stats
      - name: Unit tests and negative controls
        run: python -m pytest -q
