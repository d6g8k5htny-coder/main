# Layer 1 formal lane. Builds the dependency-free Lean 4 library, audits axioms,
# and runs the fail-closed formalization gate. A green run establishes that the
# registered declarations are kernel-checked with allowed axioms only and that
# the registry, hashes and informal anchors are consistent. It is NOT
# mathematical acceptance of any Layer 0 claim; see formal/README.md.
name: formal-verification
on:
  pull_request:
    paths:
      - 'formal/**'
      - 'tools/formal_gate_check.py'
      - 'tests/test_formal_gate.py'
      - '.github/workflows/formal-verification.yml'
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - 'tools/formal_gate_check.py'
      - 'tests/test_formal_gate.py'
      - '.github/workflows/formal-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-check:
    name: kernel-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install elan (pinned release script, digest checked) and the pinned toolchain
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o /tmp/elan-init.sh
          echo 'a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  /tmp/elan-init.sh' | sha256sum -c -
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat formal/lean-toolchain)"
      - name: Record toolchain
        run: |
          mkdir -p formal-evidence
          git rev-parse HEAD > formal-evidence/commit.txt
          (cd formal && lean --version && lake --version) | tee formal-evidence/toolchain.txt
      - name: Build the Lean library (kernel check)
        run: cd formal && lake build 2>&1 | tee ../formal-evidence/lake-build.log
      - name: Axiom audit
        run: cd formal && lake env lean UniversalLaw/Audit.lean | tee ../formal-evidence/axioms.txt
      - name: Fail-closed formalization gate
        run: python -B -S tools/formal_gate_check.py --axioms-output formal-evidence/axioms.txt | tee formal-evidence/gate.json
      - name: Gate controls, including Lean mutants, in both interpreter modes
        run: |
          python -B -S -m unittest tests.test_formal_gate -v 2>&1 | tee formal-evidence/tests-normal.log
          python -B -O -S -m unittest tests.test_formal_gate -v 2>&1 | tee formal-evidence/tests-optimized.log
      - name: Describe coverage
        if: always()
        run: |
          echo 'Kernel-checked the registered Lean declarations, audited their axioms, and verified registry hashes and informal anchors. This is formalization status only: no Layer 0 review outcome, STATUS row, or theorem acceptance was established or changed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve actual results including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formal-verification-${{ github.run_id }}
          path: formal-evidence
          if-no-files-found: error
          retention-days: 30
