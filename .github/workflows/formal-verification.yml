# Formal lane, main-side package. Runs the source-bound gate with the kernel
# lane: fresh build of the dependency-free Lean 4 package, leanchecker,
# transitive #print axioms audit, executable negative controls, receipt. A green
# run is kernel evidence for exactly the manifest's targets at the checked
# commit. It is NOT mathematical acceptance of any Layer 0 claim and does not
# flip any manifest status; see docs/FORMAL_VERIFICATION.md and formal/README.md.
name: formal-verification
on:
  workflow_call:
    outputs:
      checked_commit:
        description: Exact tested commit
        value: ${{ jobs.formal-evidence.outputs.checked_commit }}
      repository:
        description: Checked source repository
        value: ${{ jobs.formal-evidence.outputs.repository }}
      run_id:
        description: Producing workflow run
        value: ${{ jobs.formal-evidence.outputs.run_id }}
      run_attempt:
        description: Producing workflow attempt
        value: ${{ jobs.formal-evidence.outputs.run_attempt }}
      receipt_sha256:
        description: Original executed receipt SHA256
        value: ${{ jobs.formal-evidence.outputs.receipt_sha256 }}
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  formal-evidence:
    outputs:
      checked_commit: ${{ steps.required-binding.outputs.checked_commit }}
      repository: ${{ steps.required-binding.outputs.repository }}
      run_id: ${{ steps.required-binding.outputs.run_id }}
      run_attempt: ${{ steps.required-binding.outputs.run_attempt }}
      receipt_sha256: ${{ steps.required-binding.outputs.receipt_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Verify actual shell rejects a failing producer
        run: |
          set +e
          python -c 'raise SystemExit(17)' | tee "$RUNNER_TEMP/formal-shell-negative.log"
          status=$?
          set -e
          if [ "$status" -ne 17 ]; then
            echo "PIPELINE_FAILURE_PROPAGATION_FAIL: expected 17, got $status"
            exit 1
          fi
          echo 'PIPELINE_FAILURE_PROPAGATION_PASS'
      - name: Shell regression controls
        run: python -B -S -m unittest discover -s tests -p test_formal_workflow_shell.py -v
      - name: Source-only identity gate (no Lean yet; fails closed before any download)
        run: python -B -S tools/formal_gate_check.py
      - name: Install elan (pinned release script, digest checked) and the pinned toolchain
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o /tmp/elan-init.sh
          echo 'a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  /tmp/elan-init.sh' | sha256sum -c -
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat formal/lean-toolchain)"
      - name: Kernel lane — build, leanchecker, axiom audit, negative controls, receipt
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python -B -S tools/formal_gate_check.py --run-lean | tee /tmp/run-lean.log
      - name: Gate controls in both interpreter modes
        run: |
          python -B -S -m unittest tests.test_formal_gate -v 2>&1 | tee /tmp/tests-normal.log
          python -B -O -S -m unittest tests.test_formal_gate -v 2>&1 | tee /tmp/tests-optimized.log
      - name: Bind current-run receipt to required check
        id: required-binding
        run: python3 -B -S tools/required_formal_check.py receipt
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p formal-evidence
          git rev-parse HEAD > formal-evidence/commit.txt
          cp /tmp/run-lean.log /tmp/tests-normal.log /tmp/tests-optimized.log formal-evidence/ 2>/dev/null || true
          if [ -d formal/.lake/formal-evidence ]; then cp -r formal/.lake/formal-evidence formal-evidence/receipt; fi
          ls -R formal-evidence
      - name: Describe coverage
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ] && [ -s formal/.lake/formal-evidence/receipt.json ]; then
            echo 'Kernel evidence for exactly the targets in formal/manifest.json at the checked commit: build, leanchecker, transitive axiom audit, executable negative controls, receipt. Formal evidence only: no Layer 0 status or scientific acceptance changed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No successful kernel-verification claim is made for this run. Inspect preserved failures and the actual receipt/logs; neither an artifact nor this summary establishes acceptance.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve actual results including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: formal-verification-${{ github.run_id }}
          path: formal-evidence
          if-no-files-found: error
          retention-days: 30
