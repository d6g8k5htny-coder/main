  original-e-part-01:
    name: Read original E fixed part 01 of 21
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify fixed API ZIP and inventory then print exact bounded original fragments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I -B -S tools/cbz/sdga_task_e_fresh_original_readback_20261110.py
      - name: Retain unchanged ZIP full APIs inventory fragments and actual readback stream
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdga-e-fresh-original-readback-42827932735-1-original-e-part-01
          path: ${{ runner.temp }}/sdga-e-fresh-original-readback-42827932735-1-original-e-part-01/
