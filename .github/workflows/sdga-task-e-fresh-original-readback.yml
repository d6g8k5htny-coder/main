# Print exact fragments of one retained original artifact; never replay original tests.
name: Read retained fresh SDGA E original evidence

'on':
  push:
    branches: [codex/cbz-sdga-e-fresh-original-readback-20261110]

permissions:
  contents: read
  actions: read

