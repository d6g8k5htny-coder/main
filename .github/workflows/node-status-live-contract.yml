name: node-status-live-contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Record tested source
        shell: bash
        run: |
          git rev-parse --verify 'HEAD^{commit}'
          git rev-parse --verify 'HEAD^{tree}'
      - name: Run offline contracts normally
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -S -m unittest tests.test_node_status_live_check -v 2>&1 | tee "$RUNNER_TEMP/node-status-live-contract-normal.log"
          grep -Eq '^Ran 23 tests in ' "$RUNNER_TEMP/node-status-live-contract-normal.log"
      - name: Run offline contracts optimized
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -O -S -m unittest tests.test_node_status_live_check -v 2>&1 | tee "$RUNNER_TEMP/node-status-live-contract-optimized.log"
          grep -Eq '^Ran 23 tests in ' "$RUNNER_TEMP/node-status-live-contract-optimized.log"
      - name: Retain original contract logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-status-live-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/node-status-live-contract-normal.log
            ${{ runner.temp }}/node-status-live-contract-optimized.log
          if-no-files-found: warn
