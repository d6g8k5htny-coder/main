              raw = log_path.read_bytes()
              text = raw.decode("utf-8")
              print("Q9006_ORIGINAL_UNITTEST_LOG " + json.dumps(text), flush=True)
              nonempty = [line for line in text.splitlines() if line.strip()]
              expected = TEST_ID.rsplit(".", 1)[1] + " (" + TEST_ID + ") ... ok"
              if (len(nonempty) != 4 or nonempty[0] != expected
                      or nonempty[1] != "-" * 70
                      or re.fullmatch(r"Ran 1 test in [0-9]+(?:\.[0-9]+)?s", nonempty[2]) is None
                      or nonempty[3] != "OK"):
                  failures.append("EXACT_ONE_ID_PLAIN_OK_CONTRACT_REFUSED")
          except Exception as error:
              failures.append("ORIGINAL_LOG_" + type(error).__name__)
          guard = {"schema": "cbz.q9006.original-method-shard.v1", "mode": MODE,
                   "expected_test_id": TEST_ID, "expected_test_count": 1,
                   "parent_exit": parent["returncode"],
                   "source_bindings_equal": before is not None and before == after,
                   "status": "PASS" if not failures else "FAIL", "failures": failures}
          write(prefix + "-strict-guard.json", guard)
          print("Q9006_STRICT_GUARD " + json.dumps(guard, sort_keys=True), flush=True)
          raise SystemExit(0 if not failures else 1)
          PY
