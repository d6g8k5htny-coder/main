              # Bind all reviewed bootstrap originals BEFORE executing the test helper.
              bootstrap, originals = capture_paths((*BOOTSTRAP, TEST_SOURCE))
              namespace = {"__name__": "_q9006_bound_expectations",
                           "__file__": str(root / TEST_SOURCE), "__package__": ""}
              exec(compile(originals[TEST_SOURCE], str(root / TEST_SOURCE), "exec",
                           dont_inherit=True), namespace)
              require(tuple(namespace["_Q9006_BOOTSTRAP"]) == BOOTSTRAP,
                      "bound helper cannot extend bootstrap/import policy")
              expected = namespace["_q9006_capture_current"](root, bootstrap["identity"])
              complete, final_originals = capture_paths((*sorted(expected["files"]), TEST_SOURCE))
              require(complete["identity"] == bootstrap["identity"]
                      and complete["checked_tree"] == bootstrap["checked_tree"]
                      and all(final_originals[path] == originals[path]
                              for path in (*BOOTSTRAP, TEST_SOURCE)),
                      "bootstrap/test originals changed before complete capture")
              compact = {path: {key: complete["source_bindings"][path][key]
                                 for key in ("git_blob", "git_mode", "sha256")}
                         for path in complete["source_bindings"] if path != TEST_SOURCE}
              require(namespace["_q9006_same"](compact, expected["files"]),
                      "complete independently derived CLI source set/values differ")
              complete["profile"] = expected["manifest"]["profile"]
              complete["record_versions"] = {node: row["schema_version"]
                                              for node, row in expected["records"].items()}
              complete["declared_statuses"] = {node: row["status"]
                                                for node, row in expected["records"].items()}
              return complete
          
          before = after = None
          failures = []
          parent = {"mode": MODE, "command": command, "executed": False,
                    "returncode": None, "timed_out": False}
          log_path = temporary / (prefix + "-unittest.log")
          try:
              before = capture()
              write(prefix + "-source-before.json", before)
              print("Q9006_SOURCE_BEFORE " + json.dumps(before, sort_keys=True), flush=True)
              expected_output = temporary / ("q9006-real-record-" + MODE + ".json")
              require(os.environ.get("NODE_STATUS_LIVE_REQUIRED") == "1"
                      and os.environ.get("NODE_STATUS_LIVE_OUTPUT") == str(expected_output),
                      "mandatory fixed shard activation/output required")
              require(bool(os.environ.get("GITHUB_TOKEN", "").strip()),
                      "actual inherited authentication prerequisite missing")
              require(not os.path.lexists(expected_output), "new original-method CLI output required")
              descriptor = os.open(log_path,
                                   os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(descriptor, "wb") as stream:
                  parent["executed"] = True
                  try:
                      completed = subprocess.run(command, cwd=root, stdout=stream,
                                                 stderr=subprocess.STDOUT, timeout=450, check=False)
                      parent["returncode"] = completed.returncode
                  except subprocess.TimeoutExpired:
                      parent["timed_out"] = True
                      failures.append("PARENT_TIMEOUT")
          except Exception as error:
              failures.append("PREPARED_EXECUTION_" + type(error).__name__)
          finally:
              try:
                  after = capture()
                  write(prefix + "-source-after.json", after)
                  print("Q9006_SOURCE_AFTER " + json.dumps(after, sort_keys=True), flush=True)
              except Exception as error:
                  failures.append("SOURCE_RECHECK_" + type(error).__name__)
              write(prefix + "-parent-exit.json", parent)
              print("Q9006_PARENT_OUTCOME " + json.dumps(parent, sort_keys=True), flush=True)
          
          if parent["returncode"] != 0:
              failures.append("PARENT_EXIT_NOT_ZERO")
          if before is None or after is None or before != after:
              failures.append("SOURCE_ENDPOINTS_DIFFER")
          try:
              require(log_path.stat().st_size <= 4 * 1024 * 1024, "bounded original unittest log required")
              raw = log_path.read_bytes()
              text = raw.decode("utf-8")
              # Full original bytes are emitted once, after aggregate readback preflight.
              nonempty = [line for line in text.splitlines() if line.strip()]
              expected = TEST_ID.rsplit(".", 1)[1] + " (" + TEST_ID + ") ... ok"
              if (len(nonempty) != 4 or nonempty[0] != expected
                      or nonempty[1] != "-" * 70
                      or re.fullmatch(r"Ran 1 test in [0-9]+(?:\.[0-9]+)?s", nonempty[2]) is None
                      or nonempty[3] != "OK"):
                  failures.append("EXACT_ONE_ID_PLAIN_OK_CONTRACT_REFUSED")
          except Exception as error:
              failures.append("ORIGINAL_LOG_" + type(error).__name__)
          guard = {"schema": "cbz.q9006.original-method-shard.v1", "mode": MODE,
                   "expected_test_id": TEST_ID, "expected_test_count": 1,
                   "parent_exit": parent["returncode"],
                   "source_bindings_equal": before is not None and before == after,
                   "status": "PASS" if not failures else "FAIL", "failures": failures}
          write(prefix + "-strict-guard.json", guard)
          print("Q9006_STRICT_GUARD " + json.dumps(guard, sort_keys=True), flush=True)
          raise SystemExit(0 if not failures else 1)
          PY
      - name: Print original method receipt bytes with source-bound extents
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B -S - <<'PY'
          import hashlib, json, os, pathlib, re, secrets, stat, subprocess, sys
          LIMIT = 2 * 1024 * 1024
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          errors = []
          context = None
          directory = None
          helpers = None
          bound = None

          def require(value, message):
              if not value:
                  raise ValueError(message)

          def source_git(*arguments):
              environment = {key: value for key, value in os.environ.items()
                             if not key.startswith("GIT_")}
              environment.update(GIT_CONFIG_NOSYSTEM="1", GIT_CONFIG_GLOBAL=os.devnull,
                                 GIT_NO_REPLACE_OBJECTS="1", GIT_OPTIONAL_LOCKS="0",
                                 GIT_NO_LAZY_FETCH="1", GIT_TERMINAL_PROMPT="0")
              result = subprocess.run(
                  ["git", "--no-replace-objects", "--literal-pathspecs",
                   "-c", "core.fsmonitor=false", "-c", "core.hooksPath=/dev/null",
                   "-C", str(workspace), *arguments],
                  env=environment, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                  timeout=30, check=False)
              require(result.returncode == 0, "native Git read failed")
              return result.stdout

          def source_context():
              require(os.environ.get("GITHUB_ACTIONS") == "true"
                      and os.environ.get("GITHUB_REPOSITORY") == "d6g8k5htny-coder/main",
                      "native source context required")
              native = {"repository": os.environ["GITHUB_REPOSITORY"],
                        "checked_commit": os.environ.get("GITHUB_SHA"),
                        "run_id": os.environ.get("GITHUB_RUN_ID"),
                        "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT")}
              require(isinstance(native["checked_commit"], str)
                      and re.fullmatch(r"[0-9a-f]{40}", native["checked_commit"])
                      and all(isinstance(native[name], str)
                              and re.fullmatch(r"[1-9][0-9]*", native[name])
                              for name in ("run_id", "run_attempt")),
                      "native commit/run identities required")
              require(workspace.is_absolute() and workspace.resolve() == workspace
                      and not temporary.is_relative_to(workspace),
                      "canonical source/external evidence required")
              require(source_git("rev-parse", "--show-toplevel").decode().strip() == str(workspace)
                      and source_git("rev-parse", "--verify", "HEAD^{commit}").decode().strip()
                      == native["checked_commit"], "native source HEAD/top-level differs")
              native["checked_tree"] = source_git(
                  "rev-parse", "--verify", "HEAD^{tree}").decode("ascii").strip()
              require(re.fullmatch(r"[0-9a-f]{40}", native["checked_tree"]),
                      "native checked tree required")
              return native

          def source_original(relative, native):
              row = source_git("ls-tree", "--full-tree", "-z",
                               native["checked_commit"], "--", relative)
              require(row.count(b"\0") == 1 and row.endswith(b"\0"), "one source object required")
              metadata, name = row[:-1].split(b"\t", 1)
              mode, kind, blob = metadata.decode("ascii").split(" ")
              require(name == relative.encode("ascii") and kind == "blob"
                      and mode in ("100644", "100755")
                      and re.fullmatch(r"[0-9a-f]{40}", blob), "source bootstrap path/mode differs")
              size = source_git("cat-file", "-s", blob).decode("ascii").strip()
              require(size.isdecimal() and int(size) <= 2_000_000, "bounded bootstrap object required")
              selected = os.open(workspace, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
              descriptor = None
              try:
                  parts = relative.split("/")
                  for part in parts[:-1]:
                      following = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW,
                                          dir_fd=selected)
                      os.close(selected)
                      selected = following
                  descriptor = os.open(parts[-1], os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK,
                                       dir_fd=selected)
                  with os.fdopen(descriptor, "rb") as stream:
                      descriptor = None
                      before = os.fstat(stream.fileno())
                      require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1
                              and before.st_size <= 2_000_000
                              and bool(before.st_mode & 0o111) == (mode == "100755"),
                              "physical bootstrap original differs")
                      raw = stream.read(2_000_001)
                      after = os.fstat(stream.fileno())
                  current = os.stat(parts[-1], dir_fd=selected, follow_symlinks=False)
                  fields = ("st_dev", "st_ino", "st_mode", "st_nlink",
                            "st_size", "st_mtime_ns", "st_ctime_ns")
                  require(all(getattr(before, field) == getattr(observed, field)
                              for observed in (after, current) for field in fields)
                          and len(raw) == before.st_size <= 2_000_000,
                          "bootstrap original changed during read")
              finally:
                  if descriptor is not None:
                      os.close(descriptor)
                  os.close(selected)
              require(raw == source_git("cat-file", "blob", blob)
                      and hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
                      == blob, "bootstrap native/working bytes differ")
              return raw

          def load_bound_helpers(native):
              # Independent fixed bootstrap; no manifest-selected executable/helper path.
              bootstrap = (
                  "tools/node_status_live_check.py", "tools/node_status_refresh.py",
                  "tools/node_status_v1.py", "tools/validate_node_status.py",
                  "architecture/node-status.schema.json", "architecture/node-status-v1.schema.json",
                  "architecture/node-status-inputs.json", "docs/site/current.json",
                  "docs/site/dependency-source/GRAPH.json",
              )
              test_path = "tests/test_living_project_validation.py"
              originals = {relative: source_original(relative, native)
                           for relative in (*bootstrap, test_path)}
              require(source_context() == native, "source changed before helper execution")
              namespace = {"__name__": "_q9006_bound_readback",
                           "__file__": str(workspace / test_path), "__package__": ""}
              exec(compile(originals[test_path], str(workspace / test_path), "exec",
                           dont_inherit=True), namespace)
              require(tuple(namespace["_Q9006_BOOTSTRAP"]) == bootstrap
                      and namespace["_Q9006_READBACK_LIMIT"] == LIMIT,
                      "bound helper cannot extend bootstrap or evidence budget")
              identity = {key: native[key] for key in
                          ("repository", "checked_commit", "run_id", "run_attempt")}
              identity["python_optimize"] = sys.flags.optimize
              captured = namespace["_q9006_capture_current"](workspace, identity)
              require(all(captured["raw"][path] == originals[path] for path in bootstrap)
                      and source_context() == native, "complete native source capture differs")
              return namespace, captured, identity, originals[test_path]

          def read_original(name, remaining):
              descriptor = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK,
                                   dir_fd=directory)
              try:
                  before = os.fstat(descriptor)
                  require(stat.S_ISREG(before.st_mode) and before.st_nlink == 1
                          and before.st_size <= remaining, "aggregate bounded original required")
                  raw = bytearray()
                  while len(raw) <= remaining:
                      part = os.read(descriptor, min(65536, remaining + 1 - len(raw)))
                      if not part:
                          break
                      raw.extend(part)
                  after = os.fstat(descriptor)
                  current = os.stat(name, dir_fd=directory, follow_symlinks=False)
                  fields = ("st_dev", "st_ino", "st_mode", "st_nlink",
                            "st_size", "st_mtime_ns", "st_ctime_ns")
                  require(all(getattr(before, field) == getattr(observed, field)
                              for observed in (after, current) for field in fields)
                          and len(raw) == before.st_size <= remaining, "original changed during read")
                  raw = bytes(raw)
                  raw.decode("utf-8")
                  return raw
              finally:
                  os.close(descriptor)

          try:
              require(temporary.is_absolute() and temporary.resolve() == temporary,
                      "absolute canonical evidence directory required")
              flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
              selected_directory = os.open(temporary.anchor, flags)
              try:
                  for component in temporary.parts[1:]:
                      following = os.open(component, flags, dir_fd=selected_directory)
                      os.close(selected_directory)
                      selected_directory = following
              except Exception:
                  os.close(selected_directory)
                  raise
              directory = selected_directory
              context = source_context()
              helpers, bound, identity, test_original = load_bound_helpers(context)
              originals, used = {}, 0
              for name, mode in helpers["_q9006_readback_names"]():
                  try:
                      raw = read_original(name, LIMIT - used)
                      used += len(raw)
                      originals[name] = raw
                  except Exception as error:
                      errors.append({"file": name, "exception_type": type(error).__name__})
              require(not errors, "complete original readback preflight refused")
              # All 24 originals AND complete markers/separators share this one budget.
              payload = helpers["_q9006_readback_payload"](originals, context, secrets.token_hex(24))
              require(len(payload) <= LIMIT and source_context() == context,
                      "aggregate readback/source preflight differs")
              again = helpers["_q9006_capture_current"](workspace, identity)
              require(again["files"] == bound["files"]
                      and source_original("tests/test_living_project_validation.py", context) == test_original,
                      "source/test original changed before original visibility")
              sys.stdout.buffer.write(payload)
              sys.stdout.buffer.flush()
              require(source_context() == context, "native source changed during printing")
              final = helpers["_q9006_capture_current"](workspace, identity)
              require(final["files"] == bound["files"]
                      and source_original("tests/test_living_project_validation.py", context) == test_original,
                      "source/test original changed during original visibility")
          except Exception as error:
              errors.append({"file": None, "exception_type": type(error).__name__})
              print("Q9006_ORIGINAL_BYTES_ERROR " + json.dumps(
                  {"context": context, "errors": errors}, sort_keys=True), flush=True)
          finally:
              if directory is not None:
                  try:
                      descriptor = os.open("q9006-original-normal-receipt-visibility-errors.json",
                                           os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                                           0o600, dir_fd=directory)
                      with os.fdopen(descriptor, "w", encoding="utf-8", newline="\n") as stream:
                          stream.write(json.dumps({"context": context, "errors": errors},
                                                  sort_keys=True, indent=2) + "\n")
                  finally:
                      os.close(directory)
          raise SystemExit(1 if errors else 0)
          PY
      - name: Retain original live reports and execution outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-status-live-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/node-status-live-normal.json
            ${{ runner.temp }}/node-status-live-normal.log
            ${{ runner.temp }}/node-status-live-normal-exit.json
            ${{ runner.temp }}/node-status-live-optimized.json
            ${{ runner.temp }}/node-status-live-optimized.log
            ${{ runner.temp }}/node-status-live-optimized-exit.json
            ${{ runner.temp }}/q9006-original-normal-*
            ${{ runner.temp }}/q9006-original-optimized-*
            ${{ runner.temp }}/q9006-real-record-normal*
            ${{ runner.temp }}/q9006-real-record-optimized*
          if-no-files-found: warn
