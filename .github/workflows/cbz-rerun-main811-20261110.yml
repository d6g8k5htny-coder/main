name: CBZ one-shot exact Main 811 rerun
on:
  push:
    branches: [codex/cbz-architecture-observation-20261110]
    paths: [.github/workflows/cbz-rerun-main811-20261110.yml]
permissions:
  contents: read
  actions: write
jobs:
  rerun-exact-observed-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check refusal controls in both modes
        run: |
          python3 -B -S cbz/ops/test_rerun_all_main811.py
          python3 -B -O -S cbz/ops/test_rerun_all_main811.py
      - name: Request one full rerun of the exact failed attempt
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B -S cbz/ops/rerun_all_main811.py
