              for index,start in enumerate(range(0,len(raw),3072)):
                  block=raw[start:start+3072];chunks+=1
                  emit('CS_CAPTURE_REGRESSION_CHUNK '+name+' '+str(index)+' '+str(len(block))+' '+hashlib.sha256(block).hexdigest()+' '+base64.b64encode(block).decode('ascii'))
              emit('CS_CAPTURE_REGRESSION_FILE_END '+name+' '+str(row['chunks'])+' '+row['sha256'])
          emit('CS_CAPTURE_REGRESSION_END 15 '+str(chunks)+' '+str(sum(map(len,files.values())))+' '+hashlib.sha256(manifest).hexdigest())
          sys.stdout.buffer.flush()
          if not passed:raise SystemExit(1)
          PYREG_EVIDENCE
